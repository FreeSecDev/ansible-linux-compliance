---
ansible:
  cfg:
    defaults:
      host_key_checking: true
      remote_tmp: /tmp/.ansible-molecule
      stdout_callback: ansible.builtin.default
      result_format: yaml
      fact_caching: memory
    ssh_connection:
      pipelining: true
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --extra-vars=ansible_become=false
  playbooks:
    create: ../shared/create_libvirt.yml
    prepare: ../shared/prepare.yml
    converge: ../shared/converge_libvirt.yml
    verify: ../shared/verify_libvirt.yml
    destroy: ../shared/destroy_libvirt.yml

driver:
  name: default
  options:
    managed: true
  ssh_connection_options:
    - -F /dev/null
    - -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/libvirt/known_hosts
    - -o StrictHostKeyChecking=yes
    - -o IdentitiesOnly=yes
    - -o ControlMaster=auto
    - -o ControlPersist=60s
    - -o ForwardAgent=no
    - -o ForwardX11=no
    - -o LogLevel=ERROR

platforms:
  - name: ubuntu-2404
    image: ubuntu
    memory_mib: 4096
    vcpus: 2
    disk_gib: 12

scenario:
  name: libvirt-ubuntu
  test_sequence:
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
