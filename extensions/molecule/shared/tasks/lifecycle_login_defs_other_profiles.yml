---
- name: Login defaults other profiles | Refuse to run unless the login_defs topic has just run its cycles
  ansible.builtin.assert:
    that:
      - lifecycle_topic.family == 'login_defs'
      - lifecycle_rule_ids | length > 0
      - lifecycle_allow_disruptive == ['login_defs']
    fail_msg: >-
      The login_defs rules of the other profiles reuse the facts of the login_defs lifecycle, which must have just
      run; the topic was {{ lifecycle_topic.family | default('none') }}.
    quiet: true

- name: Login defaults other profiles | Name the profiles of this platform and the rules and lines they apply
  ansible.builtin.set_fact:
    ldo_label: login_defs rules of the other profiles
    ldo_profile: "{{ linux_compliance_discovered }}"
    ldo_remediate_profile: "{{ linux_compliance_remediate_profile }}"
    ldo_prefix: xccdf_org.ssgproject.content_rule_
    ldo_cases: >-
      {{ {'ubuntu': [
            {'profile': 'stig',
             'rules': ['accounts_maximum_age_login_defs', 'accounts_minimum_age_login_defs',
                       'accounts_umask_etc_login_defs'],
             'lines': ['PASS_MAX_DAYS 60', 'PASS_MIN_DAYS 1', 'UMASK 077']}],
          'rhel_compatible': [
            {'profile': 'stig',
             'rules': ['accounts_have_homedir_login_defs', 'accounts_logon_fail_delay',
                       'accounts_maximum_age_login_defs', 'accounts_minimum_age_login_defs',
                       'accounts_umask_etc_login_defs'],
             'home': 'CREATE_HOME no',
             'lines': ['CREATE_HOME yes', 'FAIL_DELAY 4', 'PASS_MAX_DAYS 60', 'PASS_MIN_DAYS 1', 'UMASK 077']},
            {'profile': 'anssi_bp28_enhanced',
             'rules': ['accounts_password_minlen_login_defs', 'accounts_umask_etc_login_defs'],
             'lines': ['PASS_MIN_LEN 15', 'UMASK 077']}]}[lifecycle_platform] }}

- name: Login defaults other profiles | Check that with the lifecycle the cases apply every rule this platform selects
  ansible.builtin.assert:
    that:
      - >-
        ldo_cases | map(attribute='rules') | flatten | map('regex_replace', '^', ldo_prefix) | list
        | union(lifecycle_rule_ids) | unique | list | length == {'ubuntu': 4, 'rhel_compatible': 7}[lifecycle_platform]
    fail_msg: "{{ ldo_label }}: {{ ldo_cases }} and {{ lifecycle_rule_ids }}"
    quiet: true

- name: Login defaults other profiles | Take the state of the whole instance before these rules run
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Login defaults other profiles | Remember the state of the whole instance before these rules run
  ansible.builtin.set_fact:
    ldo_broad_before: "{{ lifecycle_broad_lines }}"

- name: Login defaults other profiles | Read login.defs as built
  ansible.builtin.slurp:
    src: /etc/login.defs
  register: ldo_original

- name: Login defaults other profiles | Inspect login.defs as built
  ansible.builtin.stat:
    path: /etc/login.defs
    follow: false
  register: ldo_original_stat

- name: Login defaults other profiles | Apply, repeat and clean up every profile of this platform
  ansible.builtin.include_tasks:
    file: lifecycle_login_defs_profile.yml
  loop: "{{ ldo_cases }}"
  loop_control:
    loop_var: ldo_case
    label: "{{ ldo_case.profile }}"

- name: Login defaults other profiles | Give the profile of this platform back
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ ldo_profile }}"
    linux_compliance_remediate_profile: "{{ ldo_remediate_profile }}"

- name: Login defaults other profiles | Give login.defs its content as built back
  ansible.builtin.copy:
    content: "{{ ldo_original.content | b64decode }}"
    dest: /etc/login.defs
    follow: false
    mode: "{{ ldo_original_stat.stat.mode }}"
    owner: root
    group: root

- name: Login defaults other profiles | Read the ledger after these rules
  freesecdev.linux_compliance.control_state:
    action: list
  register: ldo_ledger_after

- name: Login defaults other profiles | Check that the ledger records no rule of the topic any more
  ansible.builtin.assert:
    that:
      - ldo_ledger_after.entries | selectattr('family', 'equalto', 'login_defs') | list == []
    fail_msg: "{{ ldo_label }}: the ledger still holds {{ ldo_ledger_after.entries }}"
    quiet: true

- name: Login defaults other profiles | Assert that the whole instance is back to its state before these rules ran
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: login_defs rules of the other profiles
    lifecycle_broad_step: the rules of the other profiles
    lifecycle_broad_reference: "{{ ldo_broad_before }}"

- name: Login defaults other profiles | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: "{{ lifecycle_regression_files_run + ['lifecycle_login_defs_other_profiles.yml'] }}"
