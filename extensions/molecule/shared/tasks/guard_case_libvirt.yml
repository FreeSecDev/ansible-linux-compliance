---
- name: Guard case libvirt | Run the guard against a simulated virtual machine
  block:
    - name: Guard case libvirt | Include the connection guard
      ansible.builtin.include_tasks:
        file: guard.yml
      vars:
        guard_scenario: "{{ guard_libvirt_simulation.scenario }}"
        guard_driver: libvirt
        guard_instances: "{{ guard_libvirt_simulation.instances }}"
        guard_hostname: "{{ guard_case.hostname | default('probe') }}"
        guard_connection_vars: >-
          {{ guard_libvirt_simulation.good_connection_vars | combine(guard_case.connection_vars | default({})) }}
        guard_allowed_connections:
          - ansible.builtin.ssh
          - ssh
        guard_environment: "{{ guard_case.environment | default({}) }}"

    - name: Guard case libvirt | Include the isolation guard
      ansible.builtin.include_tasks:
        file: guard_libvirt_isolation.yml
      vars:
        guard_instance: "{{ guard_libvirt_simulation.instances | first }}"
        guard_domain_xml: >-
          {%- set edited = namespace(xml=guard_libvirt_simulation.good_domain_xml) -%}
          {%- for edit in guard_case.domain_edits | default([]) -%}
          {%- set edited.xml = edited.xml | replace(edit[0], edit[1]) -%}
          {%- endfor -%}
          {{ edited.xml }}
        guard_network_xml: >-
          {%- set edited = namespace(xml=guard_libvirt_simulation.good_network_xml) -%}
          {%- for edit in guard_case.network_edits | default([]) -%}
          {%- set edited.xml = edited.xml | replace(edit[0], edit[1]) -%}
          {%- endfor -%}
          {{ edited.xml }}
        guard_pool_xml: >-
          {%- set edited = namespace(xml=guard_libvirt_simulation.good_pool_xml) -%}
          {%- for edit in guard_case.pool_edits | default([]) -%}
          {%- set edited.xml = edited.xml | replace(edit[0], edit[1]) -%}
          {%- endfor -%}
          {{ edited.xml }}
        guard_metadata_namespace: "{{ molecule_libvirt_metadata_namespace }}"
        guard_pool_parent: "{{ molecule_libvirt_pool_parent }}"
        guard_host_apparmor: "{{ guard_case.apparmor | default(false) }}"
        guard_pool_owner: "{{ guard_case.pool_owner | default(guard_libvirt_simulation.pool_owner) }}"
        guard_ssh_settings: >-
          {{ guard_libvirt_simulation.good_ssh_settings | combine(guard_case.ssh_settings | default({})) }}

    - name: Guard case libvirt | Include the guard of the real connection
      ansible.builtin.include_tasks:
        file: guard_libvirt_connection.yml
      vars:
        guard_instance: "{{ guard_libvirt_simulation.instances | first }}"
        guard_identity: "{{ guard_libvirt_simulation.good_identity | combine(guard_case.identity | default({})) }}"
        guard_serial: "{{ guard_identity.serial }}"
        guard_product_uuid: "{{ guard_identity.product_uuid }}"
        guard_boot_id: "{{ guard_identity.boot_id }}"
        guard_machine_id: "{{ guard_identity.machine_id }}"
        guard_controller_boot_id: "{{ guard_identity.controller_boot_id }}"
        guard_controller_machine_id: "{{ guard_identity.controller_machine_id }}"

    - name: Guard case libvirt | Record acceptance
      ansible.builtin.set_fact:
        guard_case_outcome:
          failed: false
          msg: ""
  rescue:
    - name: Guard case libvirt | Record refusal
      ansible.builtin.set_fact:
        guard_case_outcome:
          failed: true
          msg: "{{ ansible_failed_result.msg | default('') }}"

- name: Guard case libvirt | Check the guard decision
  ansible.builtin.assert:
    that:
      - guard_case_outcome.failed == guard_case.refused
      - not guard_case.refused or guard_case_outcome.msg is match('^Refusing to run')
    fail_msg: "{{ guard_case.name }}: expected refused={{ guard_case.refused }}, got {{ guard_case_outcome }}"
    quiet: true
