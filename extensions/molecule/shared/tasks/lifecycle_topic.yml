---
- name: Lifecycle topic | Load the declaration of the topic
  ansible.builtin.set_fact:
    lifecycle_topic: >-
      {{ lookup('ansible.builtin.file', lifecycle_topics_directory ~ '/' ~ lifecycle_family ~ '.yml') | from_yaml }}
    lifecycle_registry_entry: >-
      {{ lifecycle_catalogue.__linux_compliance_remediate_families | selectattr('name', 'equalto', lifecycle_family)
      | first }}

- name: Lifecycle topic | Select the rules of the topic that the profile of this platform selects
  ansible.builtin.set_fact:
    lifecycle_rules: >-
      {{ lifecycle_native_rules | selectattr('family', 'equalto', lifecycle_family)
      | selectattr('rule_id', 'in', linux_compliance_discovered.rule_ids) | sort(attribute='rule_id') }}
    lifecycle_family_toggle: "linux_compliance_{{ lifecycle_family }}_enabled"
    lifecycle_allow_disruptive: "{{ [lifecycle_family] if lifecycle_registry_entry.disruptive else [] }}"
    lifecycle_drivers: "{{ lifecycle_topic.requires | default(lifecycle_known_drivers, true) }}"
    lifecycle_declared_pre_states: >-
      {{ lifecycle_topic.pre_states | default([{'name': 'as built', 'audit': true}], true) }}
    lifecycle_pre_states: >-
      {{ (lifecycle_topic.pre_states | default([{'name': 'as built', 'audit': true}], true)
      | rejectattr('requires', 'defined') | list)
      + (lifecycle_topic.pre_states | default([], true) | selectattr('requires', 'defined')
      | selectattr('requires', 'contains', molecule_target.driver) | list) }}
    lifecycle_items: {}
    lifecycle_applied: {}

- name: Lifecycle topic | Keep the declared items and expectations for every platform and for this one
  ansible.builtin.set_fact:
    lifecycle_items: >-
      {{ lifecycle_items | combine({item: (lifecycle_declared_items | rejectattr('platforms', 'defined') | list)
      + (lifecycle_declared_items | selectattr('platforms', 'defined')
      | selectattr('platforms', 'contains', lifecycle_platform) | list)}) }}
    lifecycle_applied: >-
      {{ lifecycle_applied | combine({item: (lifecycle_declared_applied | rejectattr('platforms', 'defined') | list)
      + (lifecycle_declared_applied | selectattr('platforms', 'defined')
      | selectattr('platforms', 'contains', lifecycle_platform) | list)}) }}
  vars:
    lifecycle_declared_items: "{{ (lifecycle_topic.state | default({}, true))[item] | default([], true) }}"
    lifecycle_declared_applied: "{{ (lifecycle_topic.applied | default({}, true))[item] | default([], true) }}"
  loop: "{{ lifecycle_state_keys.keys() | list }}"

- name: Lifecycle topic | Name the rules of the topic and those whose prior state the ledger records
  ansible.builtin.set_fact:
    lifecycle_rule_ids: "{{ lifecycle_rules | map(attribute='rule_id') | list }}"
    lifecycle_recorded_rule_ids: >-
      {{ lifecycle_rules | selectattr('revert_strategy', 'in', lifecycle_recorded_strategies)
      | map(attribute='rule_id') | list }}

- name: Lifecycle topic | Check the declaration against the catalogue and the registry
  ansible.builtin.assert:
    that:
      - lifecycle_topic is mapping
      - lifecycle_topic.family == lifecycle_family
      - lifecycle_topic.disruptive is boolean
      - lifecycle_topic.disruptive == lifecycle_registry_entry.disruptive
      - not lifecycle_topic.disruptive or (lifecycle_topic.containment | default('') | length > 0)
      - lifecycle_items.values() | map('length') | sum > 0
      - lifecycle_applied.values() | map('length') | sum > 0
      - lifecycle_declared_pre_states | map(attribute='name') | unique | list | length
        == lifecycle_declared_pre_states | length
      - lifecycle_drivers | difference(lifecycle_known_drivers) | length == 0
      - molecule_target.driver not in lifecycle_drivers or lifecycle_pre_states | length > 0
    fail_msg: >-
      The lifecycle declaration of {{ lifecycle_family }} does not match the catalogue: its family must be
      {{ lifecycle_family }}, disruptive must be {{ lifecycle_registry_entry.disruptive }} as in the registry, a
      disruptive topic must describe its containment, at least one item and one applied expectation must be declared
      for this platform, every pre-state needs a distinct name, requires may name only {{ lifecycle_known_drivers }},
      and a driver that the topic requires must keep at least one pre-state. tools/roles/check_lifecycle_topics.py
      checks the full format.
    quiet: true

- name: Lifecycle topic | Refuse a topic that this platform skips without the declaration saying so, and the reverse
  ansible.builtin.assert:
    that:
      - (lifecycle_rules | length == 0) is sameas (lifecycle_platform in lifecycle_unselected_platforms)
    fail_msg: >-
      {{ lifecycle_family }} has {{ lifecycle_rules | length }} native rules in {{ molecule_profile_id }} on
      {{ molecule_target.instance }}, but its declaration lists {{ lifecycle_unselected_platforms }} under
      unselected_platforms. A platform whose profile selects no native rule of the topic must be listed there with a
      reason, and a platform that runs the topic must not be; tools/roles/check_lifecycle_topics.py refuses a
      declaration that lists every platform, so no topic can be skipped everywhere.
    quiet: true
  vars:
    lifecycle_unselected_platforms: >-
      {{ lifecycle_topic.unselected_platforms | default([], true) | map(attribute='platform') | list }}

- name: Lifecycle topic | Report a topic that the profile of this platform does not select, as declared
  ansible.builtin.debug:
    msg: >-
      {{ lifecycle_family }} has no native rule in {{ molecule_profile_id }} on {{ molecule_target.instance }}, as its
      declaration states; its lifecycle runs on the other platforms.
  when: lifecycle_rules | length == 0

- name: Lifecycle topic | Report a topic that needs another driver, as declared
  ansible.builtin.debug:
    msg: >-
      {{ lifecycle_family }} requires {{ lifecycle_drivers | join(', ') }}, so its lifecycle does not run in this
      {{ molecule_target.driver }} scenario; tools/roles/check_lifecycle_topics.py checks that a scenario of each
      required driver runs it.
  when: molecule_target.driver not in lifecycle_drivers

- name: Lifecycle topic | Report the pre-states that only another driver can set
  ansible.builtin.debug:
    msg: >-
      {{ lifecycle_family }}: the pre-states {{ lifecycle_declared_pre_states | map(attribute='name')
      | difference(lifecycle_pre_states | map(attribute='name')) | list }} require another driver than
      {{ molecule_target.driver }} and run in its scenarios.
  when: lifecycle_declared_pre_states | length != lifecycle_pre_states | length

- name: Lifecycle topic | Take the state of the topic before any cycle
  ansible.builtin.include_tasks:
    file: lifecycle_state.yml

- name: Lifecycle topic | Remember the state before any cycle
  ansible.builtin.set_fact:
    lifecycle_pristine: "{{ lifecycle_state }}"

- name: Lifecycle topic | Refuse a topic that the ledger already records
  ansible.builtin.assert:
    that:
      - lifecycle_pristine.ledger | selectattr('rule_id', 'in', lifecycle_rule_ids) | list | length == 0
    fail_msg: >-
      The state ledger already records rules of {{ lifecycle_family }}, so the state before the collection is not
      known: {{ lifecycle_pristine.ledger | selectattr('rule_id', 'in', lifecycle_rule_ids) | list }}.
    quiet: true

- name: Lifecycle topic | Take the state of the whole instance before any cycle
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Lifecycle topic | Remember the state of the whole instance before any cycle
  ansible.builtin.set_fact:
    lifecycle_broad_pristine: "{{ lifecycle_broad_lines }}"

- name: Lifecycle topic | Run every cycle, topic toggle before rule toggle, for every declared pre-state
  ansible.builtin.include_tasks:
    file: lifecycle_cycle.yml
  loop: "{{ lifecycle_toggle_modes | product(lifecycle_pre_states) | list }}"
  loop_control:
    loop_var: lifecycle_cycle
    label: "{{ lifecycle_cycle.0 }} toggle from the {{ lifecycle_cycle.1.name }} state"
  when:
    - lifecycle_rules | length > 0
    - molecule_target.driver in lifecycle_drivers

- name: Lifecycle topic | Take the state of the topic after every cycle
  ansible.builtin.include_tasks:
    file: lifecycle_state.yml

- name: Lifecycle topic | Assert that the topic left exactly the state before any cycle
  ansible.builtin.include_tasks:
    file: lifecycle_compare.yml
  vars:
    lifecycle_label: "{{ lifecycle_family }}"
    lifecycle_compare_step: after every cycle
    lifecycle_compare_before: "{{ lifecycle_pristine }}"
    lifecycle_compare_after: "{{ lifecycle_state }}"
    lifecycle_compare_expected: {}

- name: Lifecycle topic | Assert that the ledger is back to its entries before any cycle
  ansible.builtin.assert:
    that:
      - lifecycle_state.ledger == lifecycle_pristine.ledger
    fail_msg: "{{ lifecycle_family }} left the ledger at {{ lifecycle_state.ledger }}."
    quiet: true

- name: Lifecycle topic | Assert that the whole instance is back to its state before any cycle
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: "{{ lifecycle_family }}"
    lifecycle_broad_step: the topic after every cycle
    lifecycle_broad_reference: "{{ lifecycle_broad_pristine }}"
