---
- name: Pwhistory stack | Refuse to run unless the pwhistory topic has just run its cycles
  ansible.builtin.assert:
    that:
      - lifecycle_topic.family == 'pwhistory'
      - lifecycle_rule_ids | length == 3
      - lifecycle_allow_disruptive == ['pwhistory']
    fail_msg: >-
      The pwhistory stack regressions reuse the facts of the pwhistory lifecycle, which must have just run with its
      three rules; the topic was {{ lifecycle_topic.family | default('none') }} with {{ lifecycle_rule_ids }}.
    quiet: true

- name: Pwhistory stack | Name the rules, the toggles and the lines of the regressions
  ansible.builtin.set_fact:
    pwr_label: pwhistory stack regressions
    pwr_prefix: xccdf_org.ssgproject.content_rule_accounts_password_pam_pwhistory_
    pwr_conf: /etc/security/pwhistory.conf
    pwr_stack: /etc/pam.d/system-auth
    pwr_service: /etc/pam.d/fsd-regression-pwhistory
    pwr_newline: "\n"
    pwr_vt: "\v"
    pwr_cr: "\r"

- name: Pwhistory stack | Name the three rules and their toggles
  ansible.builtin.set_fact:
    pwr_root: "{{ pwr_prefix }}enforce_for_root"
    pwr_password: "{{ pwr_prefix }}remember_password_auth"
    pwr_system: "{{ pwr_prefix }}remember_system_auth"
    pwr_root_toggle: linux_compliance_rule_accounts_password_pam_pwhistory_enforce_for_root_enabled
    pwr_password_toggle: linux_compliance_rule_accounts_password_pam_pwhistory_remember_password_auth_enabled
    pwr_system_toggle: linux_compliance_rule_accounts_password_pam_pwhistory_remember_system_auth_enabled

- name: Pwhistory stack | Check that the lifecycle ran exactly these three rules
  ansible.builtin.assert:
    that:
      - lifecycle_rule_ids | sort == [pwr_root, pwr_password, pwr_system] | sort
      - lifecycle_rules | map(attribute='toggle') | sort == [pwr_root_toggle, pwr_password_toggle, pwr_system_toggle]
    fail_msg: "{{ pwr_label }}: {{ lifecycle_rule_ids }}"
    quiet: true

- name: Pwhistory stack | Read pwhistory.conf and system-auth as built
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ pwr_conf }}"
    - "{{ pwr_stack }}"
  register: pwr_original

- name: Pwhistory stack | Inspect pwhistory.conf and system-auth as built
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ pwr_conf }}"
    - "{{ pwr_stack }}"
  register: pwr_original_stats

- name: Pwhistory stack | Keep the texts as built and after the apply
  ansible.builtin.set_fact:
    pwr_text: "{{ pwr_original.results[0].content | b64decode }}"
    pwr_applied_text: >-
      {{ pwr_original.results[0].content | b64decode ~ 'enforce_for_root' ~ pwr_newline ~ 'remember = 24'
         ~ pwr_newline }}

- name: Pwhistory stack | Take the state of the whole instance before the stack regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Pwhistory stack | Remember the state of the whole instance before the stack regressions
  ansible.builtin.set_fact:
    pwr_broad_before: "{{ lifecycle_broad_record }}"

- name: Pwhistory stack | Run each step of the stack regressions
  ansible.builtin.include_tasks:
    file: lifecycle_pwhistory_step.yml
  loop:
    - name: remember on the pam_pwhistory line of system-auth overrides both remember rules
      toggles: [true, true, true]
      stack: "password    requisite     pam_pwhistory.so remember=24 use_authtok"
      statuses: [applied, overridden, overridden]
      text: "{{ pwr_text }}enforce_for_root{{ pwr_newline }}"
      recorded: [enforce_for_root]
    - name: the cleanup with the stack line restores enforce_for_root alone
      toggles: [false, false, false]
      stack: "password    requisite     pam_pwhistory.so remember=24 use_authtok"
      statuses: [restored, none, none]
      text: "{{ pwr_text }}"
      recorded: []
    - name: every rule on again without the stack line
      toggles: [true, true, true]
      statuses: [applied, applied, applied]
      text: "{{ pwr_applied_text }}"
      recorded: [enforce_for_root, remember_password_auth, remember_system_auth]
    - name: remember changed by hand is kept by both remember rules
      toggles: [false, false, false]
      edit:
        regexp: "^remember = "
        line: remember = 30
      statuses: [restored, cleanup_incomplete, cleanup_incomplete]
      text: "{{ pwr_text }}remember = 30{{ pwr_newline }}"
      recorded: [remember_password_auth, remember_system_auth]
    - name: remember put back as written is restored once, the second rule finds it as before
      toggles: [false, false, false]
      edit:
        regexp: "^remember = "
        line: remember = 24
      statuses: [none, restored, restored]
      text: "{{ pwr_text }}"
      recorded: []
    - name: conf= on the pam_pwhistory line of system-auth overrides every rule, enforce_for_root as well
      toggles: [true, true, true]
      conf: "{{ pwr_text }}"
      stack: "password    requisite     pam_pwhistory.so conf=/etc/security/pwhistory-other.conf use_authtok"
      statuses: [overridden, overridden, overridden]
      text: "{{ pwr_text }}"
      recorded: []
    - name: an upper-case type and REMEMBER= in a service file of its own override both remember rules
      toggles: [true, true, true]
      service: "PASSWORD requisite pam_pwhistory.so REMEMBER=1\n"
      statuses: [applied, overridden, overridden]
      text: "{{ pwr_text }}enforce_for_root{{ pwr_newline }}"
      recorded: [enforce_for_root]
    - name: the cleanup with the service file restores enforce_for_root alone
      toggles: [false, false, false]
      service: "PASSWORD requisite pam_pwhistory.so REMEMBER=1\n"
      statuses: [restored, none, none]
      text: "{{ pwr_text }}"
      recorded: []
  loop_control:
    loop_var: pwr_step
    label: "{{ pwr_step.name }}"

- name: Pwhistory stack | Remove the service file of the stack regressions
  ansible.builtin.file:
    path: "{{ pwr_service }}"
    state: absent

- name: Pwhistory stack | Give pwhistory.conf its content, mode and ownership as built back
  ansible.builtin.copy:
    content: "{{ pwr_text }}"
    dest: "{{ pwr_conf }}"
    follow: false
    mode: "{{ pwr_original_stats.results[0].stat.mode }}"
    owner: root
    group: root

- name: Pwhistory stack | Give system-auth its content, mode and ownership as built back
  ansible.builtin.copy:
    content: "{{ pwr_original.results[1].content | b64decode }}"
    dest: "{{ pwr_stack }}"
    follow: false
    mode: "{{ pwr_original_stats.results[1].stat.mode }}"
    owner: root
    group: root

- name: Pwhistory stack | Read the ledger after the stack regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: pwr_ledger_after

- name: Pwhistory stack | Check that the ledger records no rule of the topic any more
  ansible.builtin.assert:
    that:
      - pwr_ledger_after.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
    fail_msg: "{{ pwr_label }}: the ledger still holds {{ pwr_ledger_after.entries }}"
    quiet: true

- name: Pwhistory stack | Assert that the whole instance is back to its state before the stack regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: pwhistory stack regressions
    lifecycle_broad_step: the stack regressions
    lifecycle_broad_reference: "{{ pwr_broad_before }}"

- name: Pwhistory stack | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: "{{ lifecycle_regression_files_run + ['lifecycle_pwhistory_stack.yml'] }}"
