---
- name: SSH rollback regressions | Load the declaration and select two native ssh rules, which every regression needs
  ansible.builtin.set_fact:
    lifecycle_family: ssh
    lifecycle_topic: "{{ lookup('ansible.builtin.file', lifecycle_topics_directory ~ '/ssh.yml') | from_yaml }}"
    lifecycle_rules: >-
      {{ lifecycle_native_rules | selectattr('family', 'equalto', 'ssh')
      | selectattr('rule_id', 'in', linux_compliance_discovered.rule_ids)
      | selectattr('rule_id', 'in', ['xccdf_org.ssgproject.content_rule_sshd_set_max_auth_tries',
                                     'xccdf_org.ssgproject.content_rule_sshd_set_login_grace_time'])
      | sort(attribute='rule_id') }}
    lifecycle_allow_disruptive:
      - ssh
    lifecycle_items: {}
    rollback_label: ssh rollback regressions
    rollback_dropins:
      - /etc/ssh/sshd_config.d/00-freesecdev-sshd-set-login-grace-time.conf
      - /etc/ssh/sshd_config.d/00-freesecdev-sshd-set-max-auth-tries.conf
    rollback_admin: /etc/ssh/sshd_config.d/50-freesecdev-regression-admin.conf
    rollback_sshd: /usr/sbin/sshd
    rollback_sbin: /usr/sbin
    rollback_saved: /tmp/freesecdev-regression-sshd

- name: SSH rollback regressions | Keep the declared items of every platform and of this one
  ansible.builtin.set_fact:
    lifecycle_items: >-
      {{ lifecycle_items | combine({item: (lifecycle_declared_items | rejectattr('platforms', 'defined') | list)
      + (lifecycle_declared_items | selectattr('platforms', 'defined')
      | selectattr('platforms', 'contains', lifecycle_platform) | list)}) }}
  vars:
    lifecycle_declared_items: "{{ (lifecycle_topic.state | default({}, true))[item] | default([], true) }}"
  loop: "{{ lifecycle_state_keys.keys() | list }}"

- name: SSH rollback regressions | Name the rules, their toggles and the files whose content the topic rewrites
  ansible.builtin.set_fact:
    lifecycle_rule_ids: "{{ lifecycle_rules | map(attribute='rule_id') | list }}"
    rollback_toggles: "{{ lifecycle_rules | map(attribute='toggle') | list }}"
    lifecycle_rewritten: >-
      {{ lifecycle_items.files | selectattr('rewritten', 'defined') | selectattr('rewritten')
      | map(attribute='path') | list + [rollback_sshd] }}

- name: SSH rollback regressions | Declare the sshd binary, which the regression for a missing sshd moves and puts back
  ansible.builtin.set_fact:
    lifecycle_items: "{{ lifecycle_items | combine({'files': lifecycle_items.files + [{'path': rollback_sshd}]}) }}"

- name: SSH rollback regressions | Refuse to run without the two rules that the regressions change
  ansible.builtin.assert:
    that:
      - lifecycle_rule_ids | length == 2
    fail_msg: >-
      {{ rollback_label }} need sshd_set_max_auth_tries and sshd_set_login_grace_time in the profile; the runs are
      narrowed to these two rules so that each regression stays short.
    quiet: true

- name: SSH rollback regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: SSH rollback regressions | Remember the state of the whole instance before the regressions
  ansible.builtin.set_fact:
    rollback_broad_before: "{{ lifecycle_broad_lines }}"

- name: SSH rollback regressions | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ rollback_toggles }}"

- name: SSH rollback regressions | Apply the topic, for the cleanup that sshd refuses afterwards
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH rollback regressions | Check that both rules were applied
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | list == ['applied', 'applied']
    fail_msg: "{{ rollback_label }}, apply before the refused cleanup: {{ lifecycle_results }}"
    quiet: true

- name: SSH rollback regressions | Put an administrator's drop-in in place that sshd refuses
  ansible.builtin.copy:
    content: "NotAnSshdKeyword yes\n"
    dest: "{{ rollback_admin }}"
    mode: "0600"
    owner: root
    group: root

- name: SSH rollback regressions | Switch every rule of the topic off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ rollback_toggles }}"

- name: SSH rollback regressions | Clean up, which validates nothing first, so that the final sshd -t refuses
  block:
    - name: SSH rollback regressions | Run the cleanup that sshd refuses after its changes
      ansible.builtin.include_tasks:
        file: lifecycle_remediate.yml
      vars:
        lifecycle_check_mode: false

    - name: SSH rollback regressions | Remember that the cleanup did not fail
      ansible.builtin.set_fact:
        rollback_cleanup_passed: true
  rescue:
    - name: SSH rollback regressions | Keep the failed task and give the verified profile back
      ansible.builtin.set_fact:
        rollback_failed_task: "{{ ansible_failed_task.name }}"
        rollback_failed_message: "{{ ansible_failed_result.msg | default('') }}"
        linux_compliance_discovered: "{{ lifecycle_discovered_profile }}"

- name: SSH rollback regressions | Inspect the drop-ins after the refused cleanup
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ rollback_dropins + [rollback_admin] }}"
  register: rollback_after_refusal

- name: SSH rollback regressions | Read the ledger after the refused cleanup
  freesecdev.linux_compliance.control_state:
    action: list
  register: rollback_ledger_refused

- name: SSH rollback regressions | Check that the run failed at the final sshd -t, before any reload
  ansible.builtin.assert:
    that:
      - rollback_cleanup_passed is not defined
      - rollback_failed_task is search('Stop because sshd refuses the configuration after this run')
      - rollback_failed_message is search('sshd -t refuses the configuration after this run')
      - rollback_failed_message is search('NotAnSshdKeyword')
      - rollback_after_refusal.results[:2] | map(attribute='stat.exists') | list == [false, false]
      - rollback_after_refusal.results[2].stat.exists
      - rollback_ledger_refused.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
    fail_msg: >-
      {{ rollback_label }}, cleanup that sshd refuses: failed task {{ rollback_failed_task | default('none') }},
      {{ rollback_failed_message | default('') }}
    quiet: true

- name: SSH rollback regressions | Remove the administrator's drop-in that sshd refuses
  ansible.builtin.file:
    path: "{{ rollback_admin }}"
    state: absent

- name: SSH rollback regressions | Switch every rule of the topic on again
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ rollback_toggles }}"

- name: SSH rollback regressions | Apply the topic, for the cleanup on a host whose sshd is gone
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH rollback regressions | Check that both rules were applied again
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | list == ['applied', 'applied']
    fail_msg: "{{ rollback_label }}, apply before the cleanup without sshd: {{ lifecycle_results }}"
    quiet: true

- name: SSH rollback regressions | Clean up on a host whose sshd binary is gone and put it back
  block:
    - name: SSH rollback regressions | Keep a copy of the sshd binary outside the watched paths
      ansible.builtin.copy:
        src: "{{ rollback_sshd }}"
        dest: "{{ rollback_saved }}"
        remote_src: true
        mode: preserve

    - name: SSH rollback regressions | Read the mode of the directory of sshd, which Rocky Linux ships read-only
      ansible.builtin.stat:
        path: "{{ rollback_sbin }}"
        follow: false
      register: rollback_sbin_before

    - name: SSH rollback regressions | Let root write the directory, as the instance drops the capability to override
      ansible.builtin.file:
        path: "{{ rollback_sbin }}"
        state: directory
        mode: u+w

    - name: SSH rollback regressions | Remove the sshd binary, as removing openssh-server would
      ansible.builtin.file:
        path: "{{ rollback_sshd }}"
        state: absent

    - name: SSH rollback regressions | Switch every rule of the topic off for the cleanup without sshd
      ansible.builtin.set_fact:
        "{{ item }}": false
      loop: "{{ rollback_toggles }}"

    - name: SSH rollback regressions | Clean up without sshd
      ansible.builtin.include_tasks:
        file: lifecycle_remediate.yml
      vars:
        lifecycle_check_mode: false

    - name: SSH rollback regressions | Inspect the drop-ins after the cleanup without sshd
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ rollback_dropins }}"
      register: rollback_after_missing

    - name: SSH rollback regressions | Read the ledger after the cleanup without sshd
      freesecdev.linux_compliance.control_state:
        action: list
      register: rollback_ledger_missing

    - name: SSH rollback regressions | Check that the cleanup without sshd succeeded and restored both rules
      ansible.builtin.assert:
        that:
          - lifecycle_results | map(attribute='status') | list == ['restored', 'restored']
          - rollback_after_missing.results | map(attribute='stat.exists') | list == [false, false]
          - rollback_ledger_missing.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
        fail_msg: "{{ rollback_label }}, cleanup without sshd: {{ lifecycle_results }}"
        quiet: true
  always:
    - name: SSH rollback regressions | Put the sshd binary back with its mode
      ansible.builtin.copy:
        src: "{{ rollback_saved }}"
        dest: "{{ rollback_sshd }}"
        remote_src: true
        mode: preserve
        owner: root
        group: root
      when: rollback_sbin_before.stat is defined

    - name: SSH rollback regressions | Give the directory of sshd back its mode
      ansible.builtin.file:
        path: "{{ rollback_sbin }}"
        state: directory
        mode: "{{ rollback_sbin_before.stat.mode }}"
      when: rollback_sbin_before.stat is defined

    - name: SSH rollback regressions | Remove the copy of the sshd binary
      ansible.builtin.file:
        path: "{{ rollback_saved }}"
        state: absent

- name: SSH rollback regressions | Validate the configuration with the sshd binary back in place
  freesecdev.linux_compliance.sshd_validate:
  register: rollback_sshd_back

- name: SSH rollback regressions | Check that sshd is available again and accepts the configuration
  ansible.builtin.assert:
    that:
      - rollback_sshd_back.available
      - rollback_sshd_back.valid
    fail_msg: "{{ rollback_label }}, sshd after it was put back: {{ rollback_sshd_back }}"
    quiet: true

- name: SSH rollback regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: "{{ rollback_label }}"
    lifecycle_broad_step: the rollback regressions
    lifecycle_broad_reference: "{{ rollback_broad_before }}"
