---
- name: Lifecycle broad lines | Normalise the instance state, leaving out only the listed differences
  ansible.builtin.set_fact:
    lifecycle_broad_result: >-
      {{ lifecycle_broad_sources | freesecdev.linux_compliance.lifecycle_record({
           'snapshot': contract_snapshot_options | combine({'paths': contract_snapshot_paths}),
           'instance': {
             'declared': lifecycle_broad_declared | list,
             'rewritten': lifecycle_broad_rewritten | default([]) | list,
             'ignored_paths': lifecycle_broad_ignored_paths,
             'ignored_trees': lifecycle_broad_ignored_trees,
             'volatile_sysctl': lifecycle_broad_volatile_sysctl,
             'volatile_sysctl_trees': lifecycle_broad_volatile_sysctl_trees,
             'volatile_contents': contract_snapshot_volatile_contents,
             'volatile_times': contract_snapshot_volatile_times}}) }}

- name: Lifecycle broad lines | Keep the record of the whole instance and the no-change snapshot of the same moment
  ansible.builtin.set_fact:
    lifecycle_broad_record: "{{ lifecycle_broad_result.instance }}"
    lifecycle_broad_snapshot: "{{ lifecycle_broad_result.snapshot }}"
