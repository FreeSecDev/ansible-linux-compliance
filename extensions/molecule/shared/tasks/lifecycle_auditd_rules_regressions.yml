---
- name: Audit rule regressions | Refuse to run unless the time topic has just run its cycles
  ansible.builtin.assert:
    that:
      - lifecycle_topic.family == 'auditd_rules_time'
      - lifecycle_rule_ids | length > 0
    fail_msg: >-
      The audit rule regressions reuse the facts of the auditd_rules_time lifecycle, which must have just run;
      the topic was {{ lifecycle_topic.family | default('none') }}.
    quiet: true

- name: Audit rule regressions | Name the rules, drop-ins and toggles of the regressions
  ansible.builtin.set_fact:
    regression_label: audit rule regressions
    regression_profile: "{{ linux_compliance_discovered }}"
    regression_toggles: "{{ lifecycle_rules | map(attribute='toggle') | list }}"
    regression_localtime: xccdf_org.ssgproject.content_rule_audit_rules_time_watch_localtime
    regression_adjtimex: xccdf_org.ssgproject.content_rule_audit_rules_time_adjtimex
    regression_localtime_dropin: /etc/audit/rules.d/50-freesecdev-audit-rules-time-watch-localtime.rules
    regression_adjtimex_dropin: /etc/audit/rules.d/50-freesecdev-audit-rules-time-adjtimex.rules
    regression_admin_file: /etc/audit/rules.d/40-site.rules
    regression_newline: "\n"
    regression_dropins: "{{ lifecycle_rules | map(attribute='parameters') | map(attribute='path') | list }}"
    regression_localtime_lines: >-
      {{ (lifecycle_rules
          | selectattr('rule_id', 'equalto', 'xccdf_org.ssgproject.content_rule_audit_rules_time_watch_localtime')
          | first).parameters.lines[linux_compliance_discovered.benchmark_id] }}
    regression_items: "{{ lifecycle_items }}"
    regression_rewritten: "{{ lifecycle_rewritten }}"

- name: Audit rule regressions | Check that the time zone and adjtimex rules are in the profile of the lifecycle
  ansible.builtin.assert:
    that:
      - regression_localtime in lifecycle_rule_ids
      - regression_adjtimex in lifecycle_rule_ids
      - regression_localtime_lines | length > 0
    fail_msg: "{{ regression_label }}: {{ lifecycle_rule_ids }}"
    quiet: true

- name: Audit rule regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml
  vars:
    lifecycle_items: "{{ regression_items }}"
    lifecycle_rewritten: "{{ regression_rewritten }}"

- name: Audit rule regressions | Remember the state of the whole instance before the regressions
  ansible.builtin.set_fact:
    regression_broad_before: "{{ lifecycle_broad_lines }}"

- name: Audit rule regressions | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Audit rule regressions | Apply the topic
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Read the ledger after the apply
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_applied

- name: Audit rule regressions | Name the rules that the apply recorded and their entries
  ansible.builtin.set_fact:
    regression_recorded: >-
      {{ regression_ledger_applied.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
         | sort(attribute='rule_id') }}
    regression_applied_ids: >-
      {{ lifecycle_results | selectattr('status', 'equalto', 'applied') | map(attribute='rule_id') | list }}

- name: Audit rule regressions | Check that every rule was applied and recorded with the drop-in method
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['applied']
      - regression_recorded | map(attribute='rule_id') | list == regression_applied_ids
      - >-
        regression_recorded | map(attribute='prior_values') | map('items2dict', key_name='name', value_name='value')
        | map(attribute='method') | unique | list == ['rules_file']
    fail_msg: "{{ regression_label }}, apply: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Read the drop-ins after the apply
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ regression_dropins }}"
  register: regression_applied_files

- name: Audit rule regressions | Pretend that another method recorded every entry, as after a change of method
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ item.rule_id }}"
    family: auditd_rules_time
    revert_strategy: recorded_value
    prior_values: >-
      {{ item.prior_values | items2dict(key_name='name', value_name='value')
         | combine({'method': 'conf_line'}) | dict2items(key_name='name', value_name='value') }}
    collection_version: "{{ item.collection_version }}"
    replace: true
  loop: "{{ regression_recorded }}"
  loop_control:
    label: "{{ item.rule_id }}"

- name: Audit rule regressions | Apply over ledger entries that another method recorded
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Check that the apply refused every recorded rule and changed nothing
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['method_changed']
      - lifecycle_results | selectattr('reason', 'none') | list == []
      - lifecycle_results | selectattr('changed') | list == []
    fail_msg: "{{ regression_label }}, apply after a change of method: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Switch every rule of the topic off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Audit rule regressions | Clean up ledger entries that another method recorded
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Read the ledger after the refused cleanup
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_refused

- name: Audit rule regressions | Read the drop-ins after the refused runs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ regression_dropins }}"
  register: regression_refused_files

- name: Audit rule regressions | Check that the cleanup refused every rule, kept every entry and touched no drop-in
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['cleanup_incomplete']
      - lifecycle_results | map(attribute='reason') | unique | list == ['method_changed']
      - lifecycle_results | selectattr('changed') | list == []
      - >-
        regression_ledger_refused.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
        | map(attribute='rule_id') | sort == regression_applied_ids | sort
      - >-
        regression_refused_files.results | map(attribute='stat') | map(attribute='checksum', default='') | list
        == regression_applied_files.results | map(attribute='stat') | map(attribute='checksum', default='') | list
    fail_msg: "{{ regression_label }}, cleanup after a change of method: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Give every entry back the method that recorded it
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ item.rule_id }}"
    family: auditd_rules_time
    revert_strategy: recorded_value
    prior_values: "{{ item.prior_values | items2dict(key_name='name', value_name='value')
      | dict2items(key_name='name', value_name='value') }}"
    collection_version: "{{ item.collection_version }}"
    replace: true
  loop: "{{ regression_recorded }}"
  loop_control:
    label: "{{ item.rule_id }}"

- name: Audit rule regressions | Read the time zone drop-in that the collection wrote
  ansible.builtin.slurp:
    src: "{{ regression_localtime_dropin }}"
  register: regression_localtime_written

- name: Audit rule regressions | Add a rule to the time zone drop-in by hand, as an administrator would
  ansible.builtin.lineinfile:
    path: "{{ regression_localtime_dropin }}"
    line: -w /etc/timezone -p wa -k time-change

- name: Audit rule regressions | Remove the adjtimex drop-in by hand, so the state already equals the prior state
  ansible.builtin.file:
    path: "{{ regression_adjtimex_dropin }}"
    state: absent

- name: Audit rule regressions | Clean up the topic after the administrator's changes
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Read the time zone drop-in that the administrator changed
  ansible.builtin.slurp:
    src: "{{ regression_localtime_dropin }}"
  register: regression_localtime_admin

- name: Audit rule regressions | Read the ledger after the cleanup that kept the administrator's change
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_admin

- name: Audit rule regressions | Check that only the time zone rule was kept, and the adjtimex rule restored
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime)
        | map(attribute='reason') | list == ['modified_since_apply']
      - >-
        lifecycle_results | rejectattr('rule_id', 'equalto', regression_localtime)
        | map(attribute='status') | unique | list == ['restored']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_adjtimex) | map(attribute='message') | first
        is search('no longer existed')
      - regression_localtime_admin.content | b64decode is search('(?m)^-w /etc/timezone -p wa -k time-change$')
      - >-
        regression_ledger_admin.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
        | map(attribute='rule_id') | list == [regression_localtime]
    fail_msg: "{{ regression_label }}, cleanup after a change by hand: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Put back the time zone drop-in that the collection wrote
  ansible.builtin.copy:
    content: "{{ regression_localtime_written.content | b64decode }}"
    dest: "{{ regression_localtime_dropin }}"
    mode: "0600"
    owner: root
    group: root

- name: Audit rule regressions | Clean up the time zone rule now that its drop-in is what the collection wrote
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Check that the time zone rule was restored
  ansible.builtin.assert:
    that:
      - lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime) | map(attribute='status') | list
        == ['restored']
      - lifecycle_results | selectattr('changed') | map(attribute='rule_id') | list == [regression_localtime]
    fail_msg: "{{ regression_label }}, cleanup after the drop-in was put back: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Switch every rule of the topic on again
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Audit rule regressions | Apply the topic again
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Add an administrator's rule file that holds the time zone rule as well
  ansible.builtin.copy:
    content: "{{ regression_localtime_lines | join(regression_newline) ~ regression_newline }}"
    dest: "{{ regression_admin_file }}"
    mode: "0600"
    owner: root
    group: root

- name: Audit rule regressions | Apply with the administrator's file next to the drop-in that holds the same rule
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Check that the time zone rule is refused as a rule loaded twice and nothing changed
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime) | map(attribute='status') | list
        == ['duplicate_rule']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime) | map(attribute='reason') | first
        is search(regression_admin_file)
      - lifecycle_results | rejectattr('rule_id', 'equalto', regression_localtime) | map(attribute='status') | unique
        | list == ['compliant']
      - lifecycle_results | selectattr('changed') | list == []
    fail_msg: "{{ regression_label }}, apply next to an administrator's rule: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Switch every rule of the topic off to remove the drop-ins
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Audit rule regressions | Clean up next to the administrator's file
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Check that the cleanup removed every drop-in and left the administrator's file alone
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['restored']
    fail_msg: "{{ regression_label }}, cleanup next to an administrator's rule: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Switch every rule of the topic on with the administrator's file in place
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Audit rule regressions | Apply with the time zone rule already in the administrator's file
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Read the ledger after the apply next to the administrator's file
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_elsewhere

- name: Audit rule regressions | Check that the time zone rule is compliant through the administrator's file alone
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime) | map(attribute='status') | list
        == ['compliant']
      - lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime) | selectattr('changed') | list == []
      - >-
        regression_ledger_elsewhere.entries | selectattr('rule_id', 'equalto', regression_localtime) | list == []
    fail_msg: "{{ regression_label }}, apply with the rule elsewhere: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Keep only part of the time zone rule in the administrator's file
  ansible.builtin.copy:
    content: "{{ regression_localtime_lines[0] ~ regression_newline }}"
    dest: "{{ regression_admin_file }}"
    mode: "0600"
    owner: root
    group: root
  when: regression_localtime_lines | length > 1

- name: Audit rule regressions | Apply with part of the time zone rule in the administrator's file
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time
  when: regression_localtime_lines | length > 1

- name: Audit rule regressions | Check that a drop-in with the rest of the rule is refused, as it would repeat a line
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_localtime) | map(attribute='status') | list
        == ['duplicate_rule']
      - lifecycle_results | selectattr('changed') | list == []
    fail_msg: "{{ regression_label }}, apply with part of the rule elsewhere: {{ lifecycle_results }}"
    quiet: true
  when: regression_localtime_lines | length > 1

- name: Audit rule regressions | Remove the administrator's file
  ansible.builtin.file:
    path: "{{ regression_admin_file }}"
    state: absent

- name: Audit rule regressions | Switch every rule of the topic off after the administrator's file
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Audit rule regressions | Clean up after the administrator's file
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: auditd_rules_time

- name: Audit rule regressions | Check that every rule but the time zone rule had a drop-in left to remove
  ansible.builtin.assert:
    that:
      - regression_localtime not in lifecycle_results | map(attribute='rule_id') | list
      - regression_adjtimex in lifecycle_results | map(attribute='rule_id') | list
      - lifecycle_results | map(attribute='status') | unique | list == ['restored']
    fail_msg: "{{ regression_label }}, cleanup after the administrator's file: {{ lifecycle_results }}"
    quiet: true

- name: Audit rule regressions | Give the profile of this platform back
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile }}"

- name: Audit rule regressions | Read the ledger after the regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_after

- name: Audit rule regressions | Check that the ledger records no rule of the topic any more
  ansible.builtin.assert:
    that:
      - regression_ledger_after.entries | selectattr('family', 'equalto', 'auditd_rules_time') | list == []
    fail_msg: "{{ regression_label }}: the ledger still holds {{ regression_ledger_after.entries }}"
    quiet: true

- name: Audit rule regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: audit rule regressions
    lifecycle_broad_step: the regressions
    lifecycle_broad_reference: "{{ regression_broad_before }}"
    lifecycle_items: "{{ regression_items }}"
    lifecycle_rewritten: "{{ regression_rewritten }}"

- name: Audit rule regressions | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: >-
      {{ lifecycle_regression_files_run + ['lifecycle_auditd_rules_regressions.yml'] }}
