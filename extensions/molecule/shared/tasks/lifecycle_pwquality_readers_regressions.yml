---
- name: Pwquality reader regressions | Name the rules, the files and the method of this platform
  ansible.builtin.set_fact:
    lifecycle_family: pwquality
    lifecycle_topic: "{{ lookup('ansible.builtin.file', lifecycle_topics_directory ~ '/pwquality.yml') | from_yaml }}"
    lifecycle_allow_disruptive:
      - pwquality
    lifecycle_items: {}
    preaders_label: pwquality reader regressions
    preaders_minlen: xccdf_org.ssgproject.content_rule_accounts_password_pam_minlen
    preaders_root: xccdf_org.ssgproject.content_rule_accounts_password_pam_enforce_root
    preaders_ids:
      - xccdf_org.ssgproject.content_rule_accounts_password_pam_enforce_root
      - xccdf_org.ssgproject.content_rule_accounts_password_pam_minlen
    preaders_main: /etc/security/pwquality.conf
    preaders_directory: /etc/security/pwquality.conf.d
    preaders_bad: /etc/security/pwquality.conf.d/00-freesecdev-readers.conf
    preaders_pam: /etc/pam.d/freesecdev-readers
    preaders_cr: "\r"
    preaders_newline: "\n"

- name: Pwquality reader regressions | Keep the declared items of every platform and of this one
  ansible.builtin.set_fact:
    lifecycle_items: >-
      {{ lifecycle_items | combine({item: (lifecycle_declared_items | rejectattr('platforms', 'defined') | list)
      + (lifecycle_declared_items | selectattr('platforms', 'defined')
      | selectattr('platforms', 'contains', lifecycle_platform) | list)}) }}
  vars:
    lifecycle_declared_items: "{{ (lifecycle_topic.state | default({}, true))[item] | default([], true) }}"
  loop: "{{ lifecycle_state_keys.keys() | list }}"

- name: Pwquality reader regressions | Declare the directories whose times the files of the test change
  ansible.builtin.set_fact:
    lifecycle_items: >-
      {{ lifecycle_items | combine({'files': lifecycle_items.files
           + [{'path': '/etc/pam.d', 'rewritten': true}, {'path': '/etc/security', 'rewritten': true}]}) }}

- name: Pwquality reader regressions | Select the rules of the profile, their toggles and the method of this platform
  ansible.builtin.set_fact:
    lifecycle_rules: >-
      {{ lifecycle_native_rules | selectattr('rule_id', 'in', preaders_ids)
         | selectattr('rule_id', 'in', linux_compliance_discovered.rule_ids) | sort(attribute='rule_id') }}
    lifecycle_rule_ids: "{{ preaders_ids | sort }}"
    preaders_toggles: >-
      {{ lifecycle_native_rules | selectattr('rule_id', 'in', preaders_ids) | map(attribute='toggle') | list }}
    preaders_main_file: >-
      {{ linux_compliance_discovered.benchmark_id
         in (lifecycle_native_rules | selectattr('rule_id', 'equalto', preaders_minlen) | first)
            .parameters.main_file_benchmarks }}
    lifecycle_rewritten: >-
      {{ lifecycle_items.files | selectattr('rewritten', 'defined') | selectattr('rewritten')
      | map(attribute='path') | list }}

- name: Pwquality reader regressions | Refuse to run unless the profile selects both rules
  ansible.builtin.assert:
    that:
      - lifecycle_rules | length == preaders_ids | length
    fail_msg: "{{ preaders_label }} need {{ preaders_ids }} native and in the profile."
    quiet: true

- name: Pwquality reader regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Pwquality reader regressions | Remember the state of the whole instance before the regressions
  ansible.builtin.set_fact:
    preaders_broad_before: "{{ lifecycle_broad_record }}"

- name: Pwquality reader regressions | Read the main file as built
  ansible.builtin.slurp:
    src: "{{ preaders_main }}"
  register: preaders_built

- name: Pwquality reader regressions | Compose the main file with CRLF line ends, a lone CR and a looser minlen
  ansible.builtin.set_fact:
    preaders_crlf: >-
      {{ (preaders_built.content | b64decode) | replace(preaders_newline, preaders_cr ~ preaders_newline)
         ~ '# a comment with a lone' ~ preaders_cr ~ 'minlen = 6' ~ preaders_cr ~ preaders_newline
         ~ 'minlen = 8' ~ preaders_cr ~ preaders_newline }}

- name: Pwquality reader regressions | Give the main file CRLF line ends, a lone CR in a comment and minlen 8
  ansible.builtin.copy:
    content: "{{ preaders_crlf }}"
    dest: "{{ preaders_main }}"
    mode: "0644"
    owner: root
    group: root

- name: Pwquality reader regressions | Read the main file with CRLF line ends, which the cleanup must restore exactly
  ansible.builtin.slurp:
    src: "{{ preaders_main }}"
  register: preaders_crlf_read

- name: Pwquality reader regressions | Switch the rules on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ preaders_toggles }}"

- name: Pwquality reader regressions | Apply the rules over the main file with CRLF line ends
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Pwquality reader regressions | Read the main file after the apply
  ansible.builtin.slurp:
    src: "{{ preaders_main }}"
  register: preaders_crlf_applied

- name: Pwquality reader regressions | Check the apply, in the main file on Ubuntu, refused by minlen 8 on Rocky Linux
  vars:
    preaders_applied_text: "{{ preaders_crlf_applied.content | b64decode }}"
    preaders_minlen_line: "{{ 'minlen = 8' ~ preaders_cr ~ preaders_newline }}"
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', preaders_root) | map(attribute='status') | list
        == ['applied']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', preaders_minlen) | map(attribute='status') | list
        == (['applied'] if preaders_main_file else ['overridden'])
      - >-
        not preaders_main_file
        or preaders_applied_text.startswith(preaders_crlf[:preaders_crlf | length - preaders_minlen_line | length]
                                            ~ 'minlen = 14' ~ preaders_newline)
      - preaders_main_file or preaders_crlf_applied.content == preaders_crlf_read.content
      - preaders_applied_text is search('a comment with a lone' ~ preaders_cr ~ 'minlen = 6' ~ preaders_cr)
    fail_msg: "{{ preaders_label }}, CRLF apply: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality reader regressions | Switch the rules off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ preaders_toggles }}"

- name: Pwquality reader regressions | Clean up the rules over the main file with CRLF line ends
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Pwquality reader regressions | Read the main file after the cleanup
  ansible.builtin.slurp:
    src: "{{ preaders_main }}"
  register: preaders_crlf_cleaned

- name: Pwquality reader regressions | Check that the cleanup wrote the main file back byte for byte, every CR included
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['restored']
      - preaders_crlf_cleaned.content == preaders_crlf_read.content
    fail_msg: "{{ preaders_label }}, CRLF cleanup: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality reader regressions | Give the main file its content as built
  ansible.builtin.copy:
    content: "{{ preaders_built.content | b64decode }}"
    dest: "{{ preaders_main }}"
    mode: "0644"
    owner: root
    group: root

- name: Pwquality reader regressions | Inspect the drop-in directory before a drop-in that libpwquality cannot read
  ansible.builtin.stat:
    path: "{{ preaders_directory }}"
  register: preaders_directory_stat

- name: Pwquality reader regressions | Create the drop-in directory that Ubuntu does not ship, for the test only
  ansible.builtin.file:
    path: "{{ preaders_directory }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: not preaders_directory_stat.stat.exists

- name: Pwquality reader regressions | Add a drop-in read first whose line libpwquality cannot read
  ansible.builtin.copy:
    content: "minlen == 14{{ preaders_newline }}"
    dest: "{{ preaders_bad }}"
    mode: "0644"
    owner: root
    group: root

- name: Pwquality reader regressions | Add a PAM file whose pam_pwquality arguments set minlen 8
  ansible.builtin.copy:
    content: "password requisite pam_pwquality.so minlen=8 enforce_for_root{{ preaders_newline }}"
    dest: "{{ preaders_pam }}"
    mode: "0644"
    owner: root
    group: root

- name: Pwquality reader regressions | Switch the rules on for the refusals
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ preaders_toggles }}"

- name: Pwquality reader regressions | Apply the rules with the drop-in that stops libpwquality and the PAM file
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Pwquality reader regressions | Read the main file after the refused apply
  ansible.builtin.slurp:
    src: "{{ preaders_main }}"
  register: preaders_refused

- name: Pwquality reader regressions | Check that a PAM argument refused minlen and the drop-in the root rule
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', preaders_minlen) | map(attribute='status') | list
        == ['overridden']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', preaders_minlen) | map(attribute='reason')
        | select('search', preaders_pam ~ ': minlen=8') | list | length == 1
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', preaders_root) | map(attribute='status') | list
        == ['unreadable_file']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', preaders_root) | map(attribute='reason')
        | select('search', 'stops reading the configuration at line 1 of ' ~ preaders_bad) | list | length == 1
      - lifecycle_results | selectattr('changed') | list == []
      - preaders_refused.content == preaders_built.content
    fail_msg: "{{ preaders_label }}, refused apply: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality reader regressions | Remove the drop-in, the PAM file and the directory created for the test
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ [preaders_bad, preaders_pam] + ([] if preaders_directory_stat.stat.exists else [preaders_directory]) }}

- name: Pwquality reader regressions | Switch the rules off after the regressions
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ preaders_toggles }}"

- name: Pwquality reader regressions | Read the ledger after the regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: preaders_ledger_after

- name: Pwquality reader regressions | Check that the ledger records none of the rules any more
  ansible.builtin.assert:
    that:
      - preaders_ledger_after.entries | selectattr('rule_id', 'in', preaders_ids) | list == []
    fail_msg: "{{ preaders_label }}: the ledger still holds {{ preaders_ledger_after.entries }}"
    quiet: true

- name: Pwquality reader regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: pwquality reader regressions
    lifecycle_broad_step: the reader regressions
    lifecycle_broad_reference: "{{ preaders_broad_before }}"

- name: Pwquality reader regressions | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: >-
      {{ lifecycle_regression_files_run + ['lifecycle_pwquality_readers_regressions.yml'] }}
