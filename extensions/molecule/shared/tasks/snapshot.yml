---
- name: Snapshot | Find every entry below the watched paths, with a checksum of what root can read outside /usr
  ansible.builtin.include_tasks:
    file: find_with_checksums.yml
  vars:
    find_paths: "{{ contract_snapshot_paths | reject('in', contract_snapshot_metadata_paths) | list }}"
    find_metadata_paths: "{{ contract_snapshot_paths | select('in', contract_snapshot_metadata_paths) | list }}"
    find_checksum_algorithm: sha256
    find_watched_directories: "{{ snapshot_watched_directories | default([]) }}"

- name: Snapshot | Record paths, ownership, modes, sizes, times and content of every entry
  ansible.builtin.set_fact:
    snapshot_record: >-
      {{ (contract_find_sources | freesecdev.linux_compliance.lifecycle_record(
           {'snapshot': contract_snapshot_options, 'instance': none})).snapshot }}

- name: Snapshot | Keep the lines, their hash and their number
  ansible.builtin.set_fact:
    snapshot_lines: "{{ snapshot_record.lines }}"
    snapshot_digest: "{{ snapshot_record.digest }}"
    snapshot_count: "{{ snapshot_record.count }}"
