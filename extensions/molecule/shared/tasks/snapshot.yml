---
- name: Snapshot | Find every entry below the watched paths
  ansible.builtin.find:
    paths: "{{ contract_snapshot_paths }}"
    file_type: any
    recurse: true
    hidden: true
    get_checksum: true
  register: snapshot_find

- name: Snapshot | Record paths, ownership, modes, sizes, times and content of every entry
  ansible.builtin.include_tasks:
    file: snapshot_lines.yml

- name: Snapshot | Count the entries
  ansible.builtin.set_fact:
    snapshot_count: "{{ snapshot_find.files | length }}"

- name: Snapshot | Reduce the snapshot to a hash
  ansible.builtin.set_fact:
    snapshot_digest: "{{ snapshot_lines | hash('sha256') }}"
