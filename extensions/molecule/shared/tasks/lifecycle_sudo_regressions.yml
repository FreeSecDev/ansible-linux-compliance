---
- name: Sudo regressions | Refuse to run unless the sudo topic has just run its cycles
  ansible.builtin.assert:
    that:
      - lifecycle_topic.family == 'sudo'
      - lifecycle_rule_ids | length > 0
      - lifecycle_allow_disruptive == ['sudo']
    fail_msg: >-
      The sudo regressions reuse the facts of the sudo lifecycle, which must have just run; the topic was
      {{ lifecycle_topic.family | default('none') }}.
    quiet: true

- name: Sudo regressions | Name the drop-ins and the toggles of the regressions
  ansible.builtin.set_fact:
    regression_label: sudo regressions
    regression_profile: "{{ linux_compliance_discovered }}"
    regression_toggles: "{{ lifecycle_rules | map(attribute='toggle') | list }}"
    regression_timestamp: xccdf_org.ssgproject.content_rule_sudo_require_reauthentication
    regression_logfile: xccdf_org.ssgproject.content_rule_sudo_custom_logfile
    regression_timestamp_dropin: /etc/sudoers.d/50-freesecdev-timestamp_timeout
    regression_logfile_dropin: /etc/sudoers.d/50-freesecdev-logfile
    regression_dropins: "{{ lifecycle_rules | map(attribute='parameters') | map(attribute='path') | list }}"
    regression_items: "{{ lifecycle_items }}"
    regression_rewritten: "{{ lifecycle_rewritten }}"

- name: Sudo regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml
  vars:
    lifecycle_items: "{{ regression_items }}"
    lifecycle_rewritten: "{{ regression_rewritten }}"

- name: Sudo regressions | Remember the state of the whole instance before the regressions
  ansible.builtin.set_fact:
    regression_broad_before: "{{ lifecycle_broad_lines }}"

- name: Sudo regressions | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Sudo regressions | Apply the topic
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: sudo

- name: Sudo regressions | Read the ledger after the apply
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_applied

- name: Sudo regressions | Name the rules that the apply recorded and their entries
  ansible.builtin.set_fact:
    regression_recorded: >-
      {{ regression_ledger_applied.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
         | sort(attribute='rule_id') }}
    regression_applied_ids: >-
      {{ lifecycle_results | selectattr('status', 'equalto', 'applied') | map(attribute='rule_id') | list }}

- name: Sudo regressions | Check that every rule was applied or already compliant and every applied rule recorded
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | difference(['applied', 'compliant']) | list == []
      - regression_applied_ids | length > 0
      - regression_recorded | map(attribute='rule_id') | list == regression_applied_ids
      - regression_timestamp in regression_applied_ids
      - regression_logfile in regression_applied_ids
    fail_msg: "{{ regression_label }}, apply: {{ lifecycle_results }}"
    quiet: true

- name: Sudo regressions | Read the drop-ins after the apply
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ regression_dropins }}"
  register: regression_applied_files

- name: Sudo regressions | Pretend that another method recorded every entry, as after a change of method
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ item.rule_id }}"
    family: sudo
    revert_strategy: recorded_value
    prior_values: >-
      {{ item.prior_values | items2dict(key_name='name', value_name='value')
         | combine({'method': 'main_file'}) | dict2items(key_name='name', value_name='value') }}
    collection_version: "{{ item.collection_version }}"
    replace: true
  loop: "{{ regression_recorded }}"
  loop_control:
    label: "{{ item.rule_id }}"

- name: Sudo regressions | Apply over ledger entries that another method recorded
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: sudo

- name: Sudo regressions | Check that the apply refused every recorded rule and changed nothing
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'in', regression_applied_ids) | map(attribute='status') | unique
        | list == ['method_changed']
      - >-
        lifecycle_results | selectattr('status', 'equalto', 'method_changed') | selectattr('reason', 'none')
        | list == []
      - lifecycle_results | selectattr('changed') | list == []
    fail_msg: "{{ regression_label }}, apply after a change of method: {{ lifecycle_results }}"
    quiet: true

- name: Sudo regressions | Switch every rule of the topic off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Sudo regressions | Clean up ledger entries that another method recorded
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: sudo

- name: Sudo regressions | Read the ledger and the drop-ins after the refused cleanup
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_refused

- name: Sudo regressions | Read the drop-ins after the refused runs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ regression_dropins }}"
  register: regression_refused_files

- name: Sudo regressions | Check that the cleanup refused every rule, kept every entry and touched no drop-in
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='rule_id') | list == regression_applied_ids
      - lifecycle_results | map(attribute='status') | unique | list == ['cleanup_incomplete']
      - lifecycle_results | map(attribute='reason') | unique | list == ['method_changed']
      - lifecycle_results | selectattr('changed') | list == []
      - >-
        regression_ledger_refused.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
        | map(attribute='rule_id') | sort == regression_applied_ids | sort
      - >-
        regression_refused_files.results | map(attribute='stat') | map(attribute='checksum', default='') | list
        == regression_applied_files.results | map(attribute='stat') | map(attribute='checksum', default='') | list
    fail_msg: "{{ regression_label }}, cleanup after a change of method: {{ lifecycle_results }}"
    quiet: true

- name: Sudo regressions | Give every entry back the method that recorded it
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ item.rule_id }}"
    family: sudo
    revert_strategy: recorded_value
    prior_values: "{{ item.prior_values | items2dict(key_name='name', value_name='value')
      | dict2items(key_name='name', value_name='value') }}"
    collection_version: "{{ item.collection_version }}"
    replace: true
  loop: "{{ regression_recorded }}"
  loop_control:
    label: "{{ item.rule_id }}"

- name: Sudo regressions | Read the timestamp_timeout drop-in that the collection wrote
  ansible.builtin.slurp:
    src: "{{ regression_timestamp_dropin }}"
  register: regression_timestamp_written

- name: Sudo regressions | Change timestamp_timeout by hand in the drop-in, as an administrator would
  ansible.builtin.lineinfile:
    path: "{{ regression_timestamp_dropin }}"
    regexp: "^Defaults timestamp_timeout="
    line: Defaults timestamp_timeout=7

- name: Sudo regressions | Remove the logfile drop-in by hand, so the state already equals the recorded prior state
  ansible.builtin.file:
    path: "{{ regression_logfile_dropin }}"
    state: absent

- name: Sudo regressions | Clean up the topic after the administrator's changes
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: sudo

- name: Sudo regressions | Read the drop-in that the administrator changed
  ansible.builtin.slurp:
    src: "{{ regression_timestamp_dropin }}"
  register: regression_admin_file

- name: Sudo regressions | Read the ledger after the cleanup that kept the administrator's change
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_admin

- name: Sudo regressions | Check that only timestamp_timeout was refused, its change kept and the others restored
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_timestamp)
        | map(attribute='reason') | list == ['modified_since_apply']
      - >-
        lifecycle_results | rejectattr('rule_id', 'equalto', regression_timestamp)
        | map(attribute='status') | unique | list == ['restored']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_logfile) | map(attribute='message') | first
        is search('already gone')
      - lifecycle_results | rejectattr('rule_id', 'equalto', regression_timestamp) | rejectattr('changed') | list == []
      - regression_admin_file.content | b64decode is search('(?m)^Defaults timestamp_timeout=7$')
      - >-
        regression_ledger_admin.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
        | map(attribute='rule_id') | list == [regression_timestamp]
    fail_msg: "{{ regression_label }}, cleanup after a change by hand: {{ lifecycle_results }}"
    quiet: true

- name: Sudo regressions | Put back the drop-in that the collection wrote
  ansible.builtin.copy:
    content: "{{ regression_timestamp_written.content | b64decode }}"
    dest: "{{ regression_timestamp_dropin }}"
    mode: "0440"
    owner: root
    group: root

- name: Sudo regressions | Clean up timestamp_timeout now that it is what the collection wrote
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: sudo

- name: Sudo regressions | Check that timestamp_timeout was restored
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='rule_id') | list == [regression_timestamp]
      - lifecycle_results | map(attribute='status') | list == ['restored']
      - lifecycle_results | map(attribute='changed') | list == [true]
    fail_msg: "{{ regression_label }}, cleanup after the drop-in was put back: {{ lifecycle_results }}"
    quiet: true

- name: Sudo regressions | Give the profile of this platform back
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile }}"

- name: Sudo regressions | Read the ledger after the regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_after

- name: Sudo regressions | Check that the ledger records no rule of the topic any more
  ansible.builtin.assert:
    that:
      - regression_ledger_after.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
    fail_msg: "{{ regression_label }}: the ledger still holds {{ regression_ledger_after.entries }}"
    quiet: true

- name: Sudo regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: sudo regressions
    lifecycle_broad_step: the regressions
    lifecycle_broad_reference: "{{ regression_broad_before }}"
    lifecycle_items: "{{ regression_items }}"
    lifecycle_rewritten: "{{ regression_rewritten }}"

- name: Sudo regressions | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: "{{ lifecycle_regression_files_run + ['lifecycle_sudo_regressions.yml'] }}"
