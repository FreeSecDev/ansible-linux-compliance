---
- name: Faillock stack case | Load pam_faillock in the PAM stack, as authselect or a pam-auth-update profile would
  ansible.builtin.copy:
    content: "{{ item.1 | replace('{deny}', stack_case.deny) }}"
    dest: "{{ item.0 }}"
    follow: false
    mode: "{{ item.2.stat.mode }}"
    owner: root
    group: root
  loop: "{{ stack_files | zip(stack_contents, stack_original_stats.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"

- name: Faillock stack case | Write the service file of the case, or the file that its link names
  ansible.builtin.copy:
    content: "{{ stack_case.service }}"
    dest: "{{ stack_case.target | default(stack_service) }}"
    follow: false
    mode: "0644"
    owner: root
    group: root
  when: stack_case.service is defined

- name: Faillock stack case | Make the service file of the case a symbolic link, to its file, to nothing or to itself
  ansible.builtin.file:
    src: "{{ stack_case.target | default(stack_case.source) }}"
    dest: "{{ stack_service }}"
    state: link
    force: true
    follow: false
    owner: root
    group: root
  when: stack_case.target is defined or stack_case.source is defined

- name: Faillock stack case | Inspect the vendor PAM directory before it becomes a link to itself
  ansible.builtin.stat:
    path: "{{ stack_vendor_directory }}"
    follow: false
  register: stack_vendor_stat
  when: stack_case.directory_loop | default(false)

- name: Faillock stack case | List the vendor PAM directory, which must hold nothing to be replaced
  ansible.builtin.find:
    paths: "{{ stack_vendor_directory }}"
    file_type: any
    hidden: true
  register: stack_vendor_held
  when:
    - stack_case.directory_loop | default(false)
    - stack_vendor_stat.stat.exists

- name: Faillock stack case | Check that the vendor PAM directory is an empty directory or absent
  ansible.builtin.assert:
    that:
      - not stack_vendor_stat.stat.exists or stack_vendor_stat.stat.isdir
      - stack_vendor_held.files | default([]) == []
    fail_msg: "{{ stack_label }}: {{ stack_vendor_directory }} is not an empty directory."
    quiet: true
  when: stack_case.directory_loop | default(false)

- name: Faillock stack case | Make the vendor PAM directory a symbolic link to itself, which stat cannot follow
  ansible.builtin.file:
    src: pam.d
    dest: "{{ stack_vendor_directory }}"
    state: link
    force: true
    follow: false
    owner: root
    group: root
  when: stack_case.directory_loop | default(false)

- name: Faillock stack case | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ stack_toggles }}"

- name: Faillock stack case | Apply the topic
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: faillock

- name: Faillock stack case | Check the status of each rule after the apply
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='rule_id') | list == [stack_deny, stack_unlock]
      - lifecycle_results | map(attribute='status') | list == stack_case.statuses
      - >-
        lifecycle_results | selectattr('status', 'equalto', 'overridden') | map(attribute='reason')
        | reject('search', stack_service
                   if stack_case.service is defined else stack_files | first) | list == []
      - lifecycle_results | selectattr('status', 'equalto', 'overridden') | selectattr('changed') | list == []
      - >-
        stack_case.reason is not defined
        or lifecycle_results | map(attribute='reason') | reject('search', stack_case.reason | default('')) | list == []
    fail_msg: "{{ stack_label }}, {{ stack_case.name }}, apply: {{ lifecycle_results }}"
    quiet: true

- name: Faillock stack case | Read faillock.conf after the apply
  ansible.builtin.slurp:
    src: "{{ stack_conf }}"
  register: stack_applied

- name: Faillock stack case | Check that faillock.conf gained only the lines of the applied rules
  vars:
    stack_newline: "\n"
    stack_added: >-
      {{ (stack_applied.content | b64decode)[(stack_original.results[0].content | b64decode) | length:]
         | split(stack_newline) | reject('equalto', '') | map('regex_replace', ' = .*$', '') | list }}
  ansible.builtin.assert:
    that:
      - (stack_applied.content | b64decode).startswith(stack_original.results[0].content | b64decode)
      - >-
        stack_added == (['deny'] if stack_case.statuses[0] == 'applied' else [])
        + (['unlock_time'] if stack_case.statuses[1] == 'applied' else [])
    fail_msg: "{{ stack_label }}, {{ stack_case.name }}: added {{ stack_added }}"
    quiet: true

- name: Faillock stack case | Switch every rule of the topic off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ stack_toggles }}"

- name: Faillock stack case | Clean up the topic
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: faillock

- name: Faillock stack case | Read faillock.conf after the cleanup
  ansible.builtin.slurp:
    src: "{{ stack_conf }}"
  register: stack_cleaned

- name: Faillock stack case | Check that every applied rule was restored and faillock.conf is as built
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list in [['restored'], []]
      - >-
        lifecycle_results | map(attribute='rule_id') | list
        == ([stack_deny] if stack_case.statuses[0] == 'applied' else [])
           + ([stack_unlock] if stack_case.statuses[1] == 'applied' else [])
      - stack_cleaned.content == stack_original.results[0].content
    fail_msg: "{{ stack_label }}, {{ stack_case.name }}, cleanup: {{ lifecycle_results }}"
    quiet: true

- name: Faillock stack case | Remove the vendor PAM directory that loops
  ansible.builtin.file:
    path: "{{ stack_vendor_directory }}"
    state: absent
  when: stack_case.directory_loop | default(false)

- name: Faillock stack case | Give the vendor PAM directory back where the platform ships it
  ansible.builtin.file:
    path: "{{ stack_vendor_directory }}"
    state: directory
    mode: "{{ stack_vendor_stat.stat.mode }}"
    owner: root
    group: root
  when:
    - stack_case.directory_loop | default(false)
    - stack_vendor_stat.stat.exists

- name: Faillock stack case | Remove the service file of the case and the file that its link names
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ [stack_service] + ([stack_case.target] if stack_case.target is defined else []) }}"
