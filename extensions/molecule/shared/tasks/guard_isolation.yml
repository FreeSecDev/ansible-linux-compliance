---
- name: Guard isolation | Refuse containers that are not isolated from the host
  ansible.builtin.assert:
    that:
      - guard_container.Name | default('') == '/' ~ guard_instance.address
      - guard_host_config.Privileged | default(true) is false
      - guard_host_config.Binds | default([], true) | length == 0
      - guard_container.Mounts | default([], true) | length == 0
      - guard_host_config.Devices | default([], true) | length == 0
      - guard_host_config.DeviceRequests | default([], true) | length == 0
      - "'ALL' in (guard_host_config.CapDrop | default([], true) | map('upper') | list)"
      - >-
        guard_host_config.CapAdd | default([], true) | sort
        == guard_instance.capabilities_add | default([]) | sort
      - guard_host_config.NetworkMode | default('host') is not match(guard_shared_namespace_pattern)
      - guard_host_config.PidMode | default('') is not match(guard_shared_namespace_pattern)
      - guard_host_config.IpcMode | default('') is not match(guard_shared_namespace_pattern)
      - guard_host_config.UTSMode | default('') is not match(guard_shared_namespace_pattern)
      - guard_host_config.UsernsMode | default('') is not match(guard_shared_namespace_pattern)
      - guard_host_config.CgroupnsMode | default('private') is not match(guard_shared_namespace_pattern)
      - >-
        guard_host_config.SecurityOpt | default([], true)
        | select('match', '^no-new-privileges(:true)?$') | list | length == 1
      - >-
        guard_host_config.SecurityOpt | default([], true)
        | select('match', '^(seccomp|apparmor|label)[:=]unconfined$') | list | length == 0
      - guard_labels[guard_label_prefix ~ '.scenario'] | default('') == guard_instance.scenario
      - guard_labels[guard_label_prefix ~ '.run'] | default('') == guard_instance.run_id
    fail_msg: >-
      Refusing to run: container {{ guard_instance.address }} is not isolated. It must be unprivileged, drop all
      capabilities, have no bind mounts, mounts or devices, share no host namespace, keep its security profiles and
      carry this run's labels.
    success_msg: Container {{ guard_instance.address }} is isolated from the host.
  vars:
    guard_label_prefix: org.freesecdev.molecule
    guard_shared_namespace_pattern: '^(host|container:.*)$'
    guard_host_config: "{{ guard_container.HostConfig | default({}, true) }}"
    guard_labels: "{{ (guard_container.Config | default({}, true)).Labels | default({}, true) }}"
