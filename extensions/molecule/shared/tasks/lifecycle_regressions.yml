---
- name: Lifecycle regressions | Run the pwquality regressions for a change of method, a change by hand and a link
  ansible.builtin.include_tasks:
    file: lifecycle_pwquality_regressions.yml
  when: "'lifecycle_pwquality_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the sudo regressions for a change of method and changes by hand
  ansible.builtin.include_tasks:
    file: lifecycle_sudo_regressions.yml
  when: "'lifecycle_sudo_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the sudo refusals for a setting elsewhere, a refusing visudo and a symbolic link
  ansible.builtin.include_tasks:
    file: lifecycle_sudo_refusals.yml
  when: "'lifecycle_sudo_refusals.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the sudo refusal states
  ansible.builtin.include_tasks:
    file: lifecycle_sudo_states.yml
  when: "'lifecycle_sudo_states.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the sudo cases of files that sudo skips, continued lines and linked drop-ins
  ansible.builtin.include_tasks:
    file: lifecycle_sudo_effective.yml
  when: "'lifecycle_sudo_effective.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Apply and clean up the sudo rules that only other profiles select
  ansible.builtin.include_tasks:
    file: lifecycle_sudo_other_profiles.yml
  when: "'lifecycle_sudo_other_profiles.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the ssh regressions for an invalid configuration, changes by hand and the directory
  ansible.builtin.include_tasks:
    file: lifecycle_ssh_regressions.yml
  when: "'lifecycle_ssh_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the ssh rollback regressions for a refused cleanup and one without sshd
  ansible.builtin.include_tasks:
    file: lifecycle_ssh_rollback_regressions.yml
  when: "'lifecycle_ssh_rollback_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the ssh vendor regressions for the conflicting lines of the vendor files
  ansible.builtin.include_tasks:
    file: lifecycle_ssh_vendor_regressions.yml
  when: "'lifecycle_ssh_vendor_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the audit rule regressions for a change of method, changes by hand and other files
  ansible.builtin.include_tasks:
    file: lifecycle_auditd_rules_regressions.yml
  when: "'lifecycle_auditd_rules_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the auditd settings regressions for changes by hand, refusals and other profiles
  ansible.builtin.include_tasks:
    file: lifecycle_auditd_conf_regressions.yml
  when: "'lifecycle_auditd_conf_regressions.yml' in lifecycle_regression.files"
- name: Lifecycle regressions | Run the kernel module regressions for a change of method, changes by hand and site files
  ansible.builtin.include_tasks:
    file: lifecycle_kernel_modules_regressions.yml
  when: "'lifecycle_kernel_modules_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the login_defs regressions for a change of method and changes by hand
  ansible.builtin.include_tasks:
    file: lifecycle_login_defs_regressions.yml
  when: "'lifecycle_login_defs_regressions.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the login_defs refusals for duplicate settings, drop-ins and symbolic links
  ansible.builtin.include_tasks:
    file: lifecycle_login_defs_refusals.yml
  when: "'lifecycle_login_defs_refusals.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Run the login_defs value forms, read, rewritten or refused as unreadable
  ansible.builtin.include_tasks:
    file: lifecycle_login_defs_values.yml
  when: "'lifecycle_login_defs_values.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Apply and clean up the login_defs rules that only other profiles select
  ansible.builtin.include_tasks:
    file: lifecycle_login_defs_other_profiles.yml
  when: "'lifecycle_login_defs_other_profiles.yml' in lifecycle_regression.files"

- name: Lifecycle regressions | Remember the regression group that ran
  ansible.builtin.set_fact:
    lifecycle_regressions_run: "{{ lifecycle_regressions_run + [lifecycle_family ~ ':' ~ lifecycle_regression.name] }}"
