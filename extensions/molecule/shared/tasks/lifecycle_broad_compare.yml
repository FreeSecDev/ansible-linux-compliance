---
- name: Lifecycle broad compare | Take the state of the whole instance
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Lifecycle broad compare | Assert that the whole instance is back to the state before
  ansible.builtin.assert:
    that:
      - lifecycle_broad_lines | length > 0
      - lifecycle_broad_lines == lifecycle_broad_reference
    fail_msg: >-
      {{ lifecycle_label }}, {{ lifecycle_broad_step }} did not restore the instance. Only before:
      {{ (lifecycle_broad_reference | difference(lifecycle_broad_lines))[:10] }}. Only after:
      {{ (lifecycle_broad_lines | difference(lifecycle_broad_reference))[:10] }}.
    quiet: true
