---
- name: Lifecycle broad compare | Take the state of the whole instance
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Lifecycle broad compare | Assert that the whole instance is back to the state before
  ansible.builtin.assert:
    that:
      - lifecycle_broad_reference is mapping
      - lifecycle_broad_record.count > 0
      - lifecycle_broad_record.digest == lifecycle_broad_reference.digest
    fail_msg: >-
      {{ lifecycle_label }}, {{ lifecycle_broad_step }} did not restore the instance. Only before:
      {{ (lifecycle_broad_reference.lines.split('\n') | difference(lifecycle_broad_record.lines.split('\n')))[:10]
         if lifecycle_broad_record.digest != lifecycle_broad_reference.digest | default('') else [] }}.
      Only after:
      {{ (lifecycle_broad_record.lines.split('\n') | difference(lifecycle_broad_reference.lines.split('\n')))[:10]
         if lifecycle_broad_record.digest != lifecycle_broad_reference.digest | default('') else [] }}.
    quiet: true
