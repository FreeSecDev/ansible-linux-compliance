---
- name: Sudo refusals | Refuse to run unless the sudo topic has just run its cycles
  ansible.builtin.assert:
    that:
      - lifecycle_topic.family == 'sudo'
      - lifecycle_rule_ids | length > 0
      - lifecycle_allow_disruptive == ['sudo']
    fail_msg: >-
      The sudo refusals reuse the facts of the sudo lifecycle, which must have just run; the topic was
      {{ lifecycle_topic.family | default('none') }}.
    quiet: true

- name: Sudo refusals | Name the drop-ins, the toggles and the files that the refusals replace and put back
  ansible.builtin.set_fact:
    regression_label: sudo refusals
    regression_profile: "{{ linux_compliance_discovered }}"
    regression_toggles: "{{ lifecycle_rules | map(attribute='toggle') | list }}"
    regression_timestamp: xccdf_org.ssgproject.content_rule_sudo_require_reauthentication
    regression_logfile: xccdf_org.ssgproject.content_rule_sudo_custom_logfile
    regression_timestamp_dropin: /etc/sudoers.d/50-freesecdev-timestamp_timeout
    regression_logfile_dropin: /etc/sudoers.d/50-freesecdev-logfile
    regression_dropins: "{{ lifecycle_rules | map(attribute='parameters') | map(attribute='path') | list }}"
    regression_admin_dropin: /etc/sudoers.d/10-freesecdev-regression
    regression_link_target: /tmp/freesecdev-sudoers-target
    regression_visudo: /usr/sbin/visudo
    regression_visudo_copy: /tmp/freesecdev-visudo
    regression_items: >-
      {{ lifecycle_items | combine({'files': lifecycle_items.files
         + [{'path': '/usr/sbin/visudo'}, {'path': '/etc/sudoers.d/README'}]}) }}
    regression_rewritten: "{{ lifecycle_rewritten + ['/usr/sbin/visudo', '/etc/sudoers.d/README'] }}"

- name: Sudo refusals | Take the state of the whole instance before the refusals
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml
  vars:
    lifecycle_items: "{{ regression_items }}"
    lifecycle_rewritten: "{{ regression_rewritten }}"

- name: Sudo refusals | Remember the state of the whole instance before the refusals
  ansible.builtin.set_fact:
    regression_broad_before: "{{ lifecycle_broad_lines }}"

- name: Sudo refusals | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Sudo refusals | Read the mode of the directory of visudo, which Rocky Linux ships without write bits
  ansible.builtin.stat:
    path: /usr/sbin
    follow: false
  register: regression_sbin

- name: Sudo refusals | Swap visudo and set a timeout of the administrator, and put both back whatever happens
  block:
    - name: Sudo refusals | Set timestamp_timeout in a drop-in of the administrator
      ansible.builtin.copy:
        content: "Defaults timestamp_timeout=30\n"
        dest: "{{ regression_admin_dropin }}"
        mode: "0440"
        owner: root
        group: root

    - name: Sudo refusals | Let root write the directory of visudo, which it owns, as it cannot override modes here
      ansible.builtin.file:
        path: /usr/sbin
        state: directory
        mode: u+w

    - name: Sudo refusals | Make visudo refuse every file, keeping the real one aside
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: preserve
      loop:
        - src: "{{ regression_visudo }}"
          dest: "{{ regression_visudo_copy }}"
        - src: /usr/bin/false
          dest: "{{ regression_visudo }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Sudo refusals | Apply the topic with the administrator's setting and a visudo that refuses every file
      ansible.builtin.include_tasks:
        file: lifecycle_remediate.yml
      vars:
        lifecycle_check_mode: false
        lifecycle_family: sudo

    - name: Sudo refusals | Look for any drop-in of the topic and read the ledger after the refused apply
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ regression_dropins }}"
      register: regression_refused_dropins

    - name: Sudo refusals | Read the ledger after the refused apply
      freesecdev.linux_compliance.control_state:
        action: list
      register: regression_ledger_invalid

    - name: Sudo refusals | Check that the setting elsewhere and visudo refused every write and nothing was installed
      ansible.builtin.assert:
        that:
          - >-
            lifecycle_results | selectattr('rule_id', 'equalto', regression_timestamp) | map(attribute='status') | list
            == ['conflicting_setting']
          - >-
            lifecycle_results | selectattr('rule_id', 'equalto', regression_timestamp) | map(attribute='reason') | first
            is search(regression_admin_dropin)
          - >-
            lifecycle_results | rejectattr('rule_id', 'equalto', regression_timestamp) | map(attribute='status')
            | difference(['invalid_sudoers', 'compliant']) | list == []
          - >-
            lifecycle_results | selectattr('rule_id', 'equalto', regression_logfile) | map(attribute='status') | list
            == ['invalid_sudoers']
          - lifecycle_results | rejectattr('status', 'equalto', 'compliant') | selectattr('reason', 'none') | list == []
          - lifecycle_results | selectattr('changed') | list == []
          - regression_refused_dropins.results | map(attribute='stat') | selectattr('exists') | list == []
          - regression_ledger_invalid.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
        fail_msg: "{{ regression_label }}, apply with a refusing visudo: {{ lifecycle_results }}"
        quiet: true

  always:
    - name: Sudo refusals | Look for the copy of visudo
      ansible.builtin.stat:
        path: "{{ regression_visudo_copy }}"
        follow: false
      register: regression_visudo_kept

    - name: Sudo refusals | Put the real visudo back when it was kept aside
      ansible.builtin.copy:
        src: "{{ regression_visudo_copy }}"
        dest: "{{ regression_visudo }}"
        remote_src: true
        mode: preserve
      when: regression_visudo_kept.stat.exists

    - name: Sudo refusals | Give the directory of visudo its mode back
      ansible.builtin.file:
        path: /usr/sbin
        state: directory
        mode: "{{ regression_sbin.stat.mode }}"

    - name: Sudo refusals | Remove the copy of visudo and the administrator's drop-in
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ regression_visudo_copy }}"
        - "{{ regression_admin_dropin }}"

- name: Sudo refusals | Read the drop-in directory before it is replaced by a symbolic link
  ansible.builtin.stat:
    path: /etc/sudoers.d
    follow: false
  register: regression_directory

- name: Sudo refusals | List what the drop-in directory holds before it is replaced
  ansible.builtin.find:
    paths: /etc/sudoers.d
    file_type: any
    hidden: true
  register: regression_directory_entries

- name: Sudo refusals | Read the files of the drop-in directory before it is replaced
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ regression_directory_entries.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: regression_directory_files

- name: Sudo refusals | Check that the directory holds only regular files to put back
  ansible.builtin.assert:
    that:
      - regression_directory.stat.isdir
      - regression_directory_entries.files | rejectattr('isreg') | list == []
      - regression_directory_entries.files | map(attribute='path') | difference(['/etc/sudoers.d/README']) | list == []
    fail_msg: "{{ regression_label }}: unexpected entries {{ regression_directory_entries.files }}"
    quiet: true

- name: Sudo refusals | Replace the drop-in directory by a symbolic link, and put it back whatever happens
  block:
    - name: Sudo refusals | Replace the drop-in directory by a symbolic link to an empty directory
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: "{{ item.state }}"
        src: "{{ item.src | default(omit) }}"
        mode: "{{ item.mode | default(omit) }}"
      loop:
        - path: /etc/sudoers.d
          state: absent
        - path: "{{ regression_link_target }}"
          state: directory
          mode: "0750"
        - path: /etc/sudoers.d
          state: link
          src: "{{ regression_link_target }}"
      loop_control:
        label: "{{ item.path }} {{ item.state }}"

    - name: Sudo refusals | Apply the topic through the symbolic link
      ansible.builtin.include_tasks:
        file: lifecycle_remediate.yml
      vars:
        lifecycle_check_mode: false
        lifecycle_family: sudo

    - name: Sudo refusals | Look for anything written through the symbolic link
      ansible.builtin.find:
        paths: "{{ regression_link_target }}"
        file_type: any
        hidden: true
      register: regression_through_link

    - name: Sudo refusals | Check that every rule refused the symbolic link and wrote nothing through it
      ansible.builtin.assert:
        that:
          - lifecycle_results | map(attribute='status') | unique | list == ['not_directory']
          - lifecycle_results | selectattr('reason', 'none') | list == []
          - lifecycle_results | selectattr('changed') | list == []
          - regression_through_link.files == []
        fail_msg: "{{ regression_label }}, symbolic link: {{ lifecycle_results }}"
        quiet: true

  always:
    - name: Sudo refusals | Read what is at the path of the drop-in directory now
      ansible.builtin.stat:
        path: /etc/sudoers.d
        follow: false
      register: regression_directory_now

    - name: Sudo refusals | Remove the symbolic link and its target
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/sudoers.d
        - "{{ regression_link_target }}"
      when: regression_directory_now.stat.islnk | default(false)

    - name: Sudo refusals | Put the drop-in directory back with its mode and ownership
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        mode: "{{ regression_directory.stat.mode }}"
        owner: "{{ regression_directory.stat.pw_name }}"
        group: "{{ regression_directory.stat.gr_name }}"

    - name: Sudo refusals | Put the files of the drop-in directory back with their content, mode and ownership
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ item.item.path }}"
        mode: "{{ item.item.mode }}"
        owner: "{{ item.item.pw_name }}"
        group: "{{ item.item.gr_name }}"
      loop: "{{ regression_directory_files.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: not (regression_directory_now.stat.isdir | default(false))

- name: Sudo refusals | Give the profile of this platform back
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile }}"

- name: Sudo refusals | Read the ledger after the refusals
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_after

- name: Sudo refusals | Check that the ledger records no rule of the topic any more
  ansible.builtin.assert:
    that:
      - regression_ledger_after.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
    fail_msg: "{{ regression_label }}: the ledger still holds {{ regression_ledger_after.entries }}"
    quiet: true

- name: Sudo refusals | Assert that the whole instance is back to its state before the refusals
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: sudo refusals
    lifecycle_broad_step: the refusals
    lifecycle_broad_reference: "{{ regression_broad_before }}"
    lifecycle_items: "{{ regression_items }}"
    lifecycle_rewritten: "{{ regression_rewritten }}"

- name: Sudo refusals | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: "{{ lifecycle_regression_files_run + ['lifecycle_sudo_refusals.yml'] }}"
