---
- name: Running kernel regressions | Select three native IPv4 rules, which every regression needs
  ansible.builtin.set_fact:
    lifecycle_family: ipv4_parameters
    lifecycle_topic: >-
      {{ lookup('ansible.builtin.file', lifecycle_topics_directory ~ '/ipv4_parameters.yml') | from_yaml }}
    lifecycle_rules: >-
      {{ lifecycle_native_rules | selectattr('family', 'equalto', 'ipv4_parameters')
      | selectattr('rule_id', 'in', linux_compliance_discovered.rule_ids)
      | selectattr('rule_id', 'in', ['xccdf_org.ssgproject.content_rule_sysctl_net_ipv4_ip_forward',
                                     'xccdf_org.ssgproject.content_rule_sysctl_net_ipv4_conf_all_rp_filter',
                                     'xccdf_org.ssgproject.content_rule_sysctl_net_ipv4_conf_all_accept_redirects'])
      | sort(attribute='rule_id') }}
    lifecycle_allow_disruptive:
      - ipv4_parameters
    lifecycle_items: {}
    regression_label: running kernel regressions
    regression_forward: xccdf_org.ssgproject.content_rule_sysctl_net_ipv4_ip_forward
    regression_filter: xccdf_org.ssgproject.content_rule_sysctl_net_ipv4_conf_all_rp_filter
    regression_redirects: xccdf_org.ssgproject.content_rule_sysctl_net_ipv4_conf_all_accept_redirects
    regression_filter_dropin: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv4-conf-all-rp-filter.conf
    regression_parameters:
      - net.ipv4.ip_forward
      - net.ipv4.conf.*.forwarding
      - net.ipv4.conf.*.rp_filter
      - net.ipv4.conf.*.accept_redirects

- name: Running kernel regressions | Refuse to run anywhere but on a machine whose kernel the collection may set
  ansible.builtin.assert:
    that:
      - molecule_target.driver == 'libvirt'
      - lifecycle_sysctl_runtime | bool
    fail_msg: "{{ regression_label }} need the running kernel of a virtual machine (requires: [libvirt])."
    quiet: true

- name: Running kernel regressions | Keep the declared items of every platform and of this one
  ansible.builtin.set_fact:
    lifecycle_items: >-
      {{ lifecycle_items | combine({item: (lifecycle_declared_items | rejectattr('platforms', 'defined') | list)
      + (lifecycle_declared_items | selectattr('platforms', 'defined')
      | selectattr('platforms', 'contains', lifecycle_platform) | list)}) }}
  vars:
    lifecycle_declared_items: "{{ (lifecycle_topic.state | default({}, true))[item] | default([], true) }}"
  loop: "{{ lifecycle_state_keys.keys() | list }}"

- name: Running kernel regressions | Name the rule identifiers, toggles and the files whose content the topic rewrites
  ansible.builtin.set_fact:
    lifecycle_rule_ids: "{{ lifecycle_rules | map(attribute='rule_id') | list }}"
    regression_toggles: "{{ lifecycle_rules | map(attribute='toggle') | list }}"
    lifecycle_rewritten: >-
      {{ lifecycle_items.files | selectattr('rewritten', 'defined') | selectattr('rewritten')
      | map(attribute='path') | list }}

- name: Running kernel regressions | Refuse to run without the three rules that the regressions change
  ansible.builtin.assert:
    that:
      - lifecycle_rule_ids | length == 3
    fail_msg: >-
      {{ regression_label }} need the IPv4 rules ip_forward, rp_filter and accept_redirects of net.ipv4.conf.all in
      the profile; the runs are narrowed to them so that each regression stays short.
    quiet: true

- name: Running kernel regressions | Read the running values as built
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_built

- name: Running kernel regressions | Name the interfaces and an rp_filter value neither prior nor written
  ansible.builtin.set_fact:
    regression_interfaces: >-
      {{ regression_built.running.keys() | select('match', '^net\.ipv4\.conf\..*\.forwarding$')
         | reject('in', ['net.ipv4.conf.all.forwarding', 'net.ipv4.conf.default.forwarding']) | sort | list }}
    regression_filter_by_hand: "{{ '0' if regression_built.running['net.ipv4.conf.all.rp_filter'] == '2' else '2' }}"
    regression_devices: >-
      {{ regression_built.running.keys() | select('match', '^net\.ipv4\.conf\.[^.]+\.rp_filter$')
         | map('regex_replace', '^net\.ipv4\.conf\.', '') | map('regex_replace', '\.rp_filter$', '')
         | reject('in', ['all', 'default', 'lo']) | sort | list }}

- name: Running kernel regressions | Check that the machine has an interface besides the loopback
  ansible.builtin.assert:
    that:
      - "'net.ipv4.conf.lo.forwarding' in regression_interfaces"
      - regression_interfaces | length >= 2
    fail_msg: "{{ regression_label }}: the machine has the interfaces {{ regression_interfaces }}"
    quiet: true

- name: Running kernel regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Running kernel regressions | Remember the state of the whole instance before the regressions
  ansible.builtin.set_fact:
    regression_broad_before: "{{ lifecycle_broad_record }}"

- name: Running kernel regressions | Give every interface a looser rp_filter and accept_redirects, as a glob might
  freesecdev.linux_compliance.sysctl_runtime:
    set: >-
      {%- set items = [] -%}
      {%- for device in regression_devices -%}
      {%- set _ = items.append({'name': 'net.ipv4.conf.' ~ device ~ '.rp_filter', 'value': '2'}) -%}
      {%- set _ = items.append({'name': 'net.ipv4.conf.' ~ device ~ '.accept_redirects', 'value': '1'}) -%}
      {%- endfor -%}
      {{ items }}

- name: Running kernel regressions | Switch every rule of the topic on for the interface check
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Running kernel regressions | Apply the rules while every interface is looser
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Running kernel regressions | Read the running values after the apply over the looser interfaces
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_loose

- name: Running kernel regressions | Inspect the drop-in of rp_filter after the apply over the looser interfaces
  ansible.builtin.stat:
    path: "{{ regression_filter_dropin }}"
    follow: false
  register: regression_loose_dropin

- name: Running kernel regressions | Check that the stricter values were written and every looser interface is named
  vars:
    regression_judged: >-
      {{ lifecycle_results | selectattr('rule_id', 'in', [regression_filter, regression_redirects]) | list }}
  ansible.builtin.assert:
    that:
      - regression_judged | map(attribute='status') | unique | list == ['applied']
      - regression_judged | map(attribute='reason') | unique | list == ['interface_override']
      - regression_judged | rejectattr('changed') | list == []
      - >-
        regression_devices | map('regex_replace', '$', ' (') | reject('in', regression_judged
        | map(attribute='message') | first) | list == []
      - >-
        regression_devices | map('regex_replace', '$', ' (') | reject('in', regression_judged
        | map(attribute='message') | last) | list == []
      - regression_loose.running['net.ipv4.conf.all.rp_filter'] == '1'
      - regression_loose.running['net.ipv4.conf.all.accept_redirects'] == '0'
      - >-
        regression_devices | map('regex_replace', '^', 'net.ipv4.conf.') | map('regex_replace', '$', '.rp_filter')
        | map('extract', regression_loose.running) | unique | list == ['2']
      - >-
        regression_devices | map('regex_replace', '^', 'net.ipv4.conf.')
        | map('regex_replace', '$', '.accept_redirects')
        | map('extract', regression_loose.running) | unique | list == ['1']
      - regression_loose_dropin.stat.exists
    fail_msg: "{{ regression_label }}, looser interfaces {{ regression_devices }}: {{ lifecycle_results }}"
    quiet: true

- name: Running kernel regressions | Switch every rule of the topic off after the interface check
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Running kernel regressions | Clean up the rules applied over the looser interfaces
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Running kernel regressions | Read the running values after the cleanup of the interface check
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_loose_cleaned

- name: Running kernel regressions | Check that the cleanup set the values before the interface check again
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'in', [regression_filter, regression_redirects])
        | map(attribute='status') | unique | list == ['restored']
      - >-
        regression_loose_cleaned.running['net.ipv4.conf.all.rp_filter']
        == regression_built.running['net.ipv4.conf.all.rp_filter']
      - >-
        regression_loose_cleaned.running['net.ipv4.conf.all.accept_redirects']
        == regression_built.running['net.ipv4.conf.all.accept_redirects']
    fail_msg: "{{ regression_label }}, cleanup of the interface check: {{ lifecycle_results }}"
    quiet: true

- name: Running kernel regressions | Give every interface a compliant rp_filter and accept_redirects by hand
  freesecdev.linux_compliance.sysctl_runtime:
    set: >-
      {%- set items = [] -%}
      {%- for device in regression_devices -%}
      {%- set _ = items.append({'name': 'net.ipv4.conf.' ~ device ~ '.rp_filter', 'value': '1'}) -%}
      {%- set _ = items.append({'name': 'net.ipv4.conf.' ~ device ~ '.accept_redirects', 'value': '0'}) -%}
      {%- endfor -%}
      {{ items }}

- name: Running kernel regressions | Enable forwarding as a router would, with the loopback interface left out
  freesecdev.linux_compliance.sysctl_runtime:
    set:
      - name: net.ipv4.ip_forward
        value: "1"
      - name: net.ipv4.conf.lo.forwarding
        value: "0"
      - name: net.ipv4.conf.all.accept_redirects
        value: "1"

- name: Running kernel regressions | Read the forwarding flags of the router
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_router

- name: Running kernel regressions | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Running kernel regressions | Apply the rules on the router
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Running kernel regressions | Read the running values and the ledger after the apply
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_applied

- name: Running kernel regressions | Read the ledger after the apply on the router
  freesecdev.linux_compliance.control_state:
    action: get
    rule_id: "{{ regression_forward }}"
  register: regression_forward_entry

- name: Running kernel regressions | Check that forwarding is off everywhere and the ledger records every interface
  vars:
    regression_recorded: >-
      {{ regression_forward_entry.entry.prior_values | items2dict(key_name='name', value_name='value') }}
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['applied']
      - lifecycle_results | rejectattr('changed') | list == []
      - >-
        regression_applied.running | dict2items
        | selectattr('key', 'match', '^net\.ipv4\.(ip_forward|conf\..*\.forwarding)$')
        | map(attribute='value') | unique | list == ['0']
      - regression_recorded.runtime_prior == '1'
      - regression_recorded.runtime_written == '0'
      - regression_recorded['companion:net.ipv4.conf.lo.forwarding'] == '0'
      - regression_recorded['companion:net.ipv4.conf.all.accept_redirects'] == '1'
      - regression_applied.running['net.ipv4.conf.all.accept_redirects'] == '0'
      - >-
        regression_interfaces | reject('equalto', 'net.ipv4.conf.lo.forwarding')
        | map('regex_replace', '^', 'companion:') | map('extract', regression_recorded) | unique | list == ['1']
    fail_msg: "{{ regression_label }}, apply on the router: {{ lifecycle_results }} {{ regression_recorded }}"
    quiet: true

- name: Running kernel regressions | Accept redirects again by hand, as an administrator would
  freesecdev.linux_compliance.sysctl_runtime:
    set:
      - name: net.ipv4.conf.all.accept_redirects
        value: "1"

- name: Running kernel regressions | Apply the rules again over the running value changed by hand
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Running kernel regressions | Read the running values and the ledger entry after the second apply
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_reapplied

- name: Running kernel regressions | Read the ledger entry of accept_redirects after the second apply
  freesecdev.linux_compliance.control_state:
    action: get
    rule_id: "{{ regression_redirects }}"
  register: regression_redirects_entry

- name: Running kernel regressions | Check that only the changed running value was set again and its first record kept
  vars:
    regression_recorded: >-
      {{ regression_redirects_entry.entry.prior_values | items2dict(key_name='name', value_name='value') }}
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | items2dict(key_name='rule_id', value_name='status')
        == {regression_forward: 'compliant', regression_filter: 'compliant', regression_redirects: 'applied'}
      - lifecycle_results | selectattr('changed') | map(attribute='rule_id') | list == [regression_redirects]
      - regression_reapplied.running['net.ipv4.conf.all.accept_redirects'] == '0'
      - regression_recorded.runtime_prior == '1'
    fail_msg: "{{ regression_label }}, second apply: {{ lifecycle_results }} {{ regression_recorded }}"
    quiet: true

- name: Running kernel regressions | Set rp_filter by hand to neither the value before nor the value of the drop-in
  freesecdev.linux_compliance.sysctl_runtime:
    set:
      - name: net.ipv4.conf.all.rp_filter
        value: "{{ regression_filter_by_hand }}"

- name: Running kernel regressions | Switch every rule of the topic off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Running kernel regressions | Clean up with a running value changed by hand
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Running kernel regressions | Read the running values after the cleanup
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_cleaned

- name: Running kernel regressions | Inspect the drop-in of rp_filter after the refused cleanup
  ansible.builtin.stat:
    path: "{{ regression_filter_dropin }}"
    follow: false
  register: regression_filter_kept

- name: Running kernel regressions | Check that the router's flags are back and rp_filter was refused without a change
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | items2dict(key_name='rule_id', value_name='reason')
        == {regression_forward: none, regression_filter: 'modified_since_apply', regression_redirects: none}
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_filter) | map(attribute='message')
        | select('search', 'running value of net.ipv4.conf.all.rp_filter') | list | length == 1
      - lifecycle_results | selectattr('rule_id', 'equalto', regression_filter) | selectattr('changed') | list == []
      - >-
        regression_cleaned.running | dict2items
        | selectattr('key', 'match', '^net\.ipv4\.(ip_forward|conf\..*\.forwarding|conf\.all\.accept_redirects)$')
        | items2dict == regression_router.running | dict2items
        | selectattr('key', 'match', '^net\.ipv4\.(ip_forward|conf\..*\.forwarding|conf\.all\.accept_redirects)$')
        | items2dict
      - regression_cleaned.running['net.ipv4.conf.all.rp_filter'] == regression_filter_by_hand
      - regression_filter_kept.stat.exists
    fail_msg: "{{ regression_label }}, cleanup with a running value changed by hand: {{ lifecycle_results }}"
    quiet: true

- name: Running kernel regressions | Set rp_filter back to the value of the drop-in by hand
  freesecdev.linux_compliance.sysctl_runtime:
    set:
      - name: net.ipv4.conf.all.rp_filter
        value: "1"

- name: Running kernel regressions | Clean up rp_filter once its running value is the one the collection set
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: Running kernel regressions | Read rp_filter after the cleanup
  freesecdev.linux_compliance.sysctl_runtime:
    read:
      - net.ipv4.conf.all.rp_filter
  register: regression_filter_restored

- name: Running kernel regressions | Check that the cleanup set the running value before the apply again
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='rule_id') | list == [regression_filter]
      - lifecycle_results | map(attribute='status') | list == ['restored']
      - >-
        regression_filter_restored.running['net.ipv4.conf.all.rp_filter']
        == regression_built.running['net.ipv4.conf.all.rp_filter']
    fail_msg: "{{ regression_label }}, cleanup of rp_filter: {{ lifecycle_results }}"
    quiet: true

- name: Running kernel regressions | Give the machine back its running values as built, forwarding before the interfaces
  freesecdev.linux_compliance.sysctl_runtime:
    set: >-
      {%- set items = [{'name': 'net.ipv4.ip_forward', 'value': regression_built.running['net.ipv4.ip_forward']}] -%}
      {%- for name in ['net.ipv4.conf.all.forwarding', 'net.ipv4.conf.default.forwarding'] + regression_interfaces -%}
      {%- set _ = items.append({'name': name, 'value': regression_built.running[name]}) -%}
      {%- endfor -%}
      {%- set _ = items.append({'name': 'net.ipv4.conf.all.accept_redirects',
                                'value': regression_built.running['net.ipv4.conf.all.accept_redirects']}) -%}
      {%- for device in regression_devices -%}
      {%- for parameter in ['rp_filter', 'accept_redirects'] -%}
      {%- set name = 'net.ipv4.conf.' ~ device ~ '.' ~ parameter -%}
      {%- set _ = items.append({'name': name, 'value': regression_built.running[name]}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ items }}

- name: Running kernel regressions | Read the running values after they were given back
  freesecdev.linux_compliance.sysctl_runtime:
    read: "{{ regression_parameters }}"
  register: regression_given_back

- name: Running kernel regressions | Read the ledger after the regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_after

- name: Running kernel regressions | Check that the running values are as built and the ledger records no rule
  ansible.builtin.assert:
    that:
      - regression_given_back.running == regression_built.running
      - regression_ledger_after.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
    fail_msg: >-
      {{ regression_label }}: running values {{ regression_given_back.running }}, as built
      {{ regression_built.running }}, ledger {{ regression_ledger_after.entries }}
    quiet: true

- name: Running kernel regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: running kernel regressions
    lifecycle_broad_step: the regressions
    lifecycle_broad_reference: "{{ regression_broad_before }}"

- name: Running kernel regressions | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: >-
      {{ lifecycle_regression_files_run + ['lifecycle_sysctl_runtime_regressions.yml'] }}
