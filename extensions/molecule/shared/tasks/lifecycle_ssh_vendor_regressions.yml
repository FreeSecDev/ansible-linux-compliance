---
- name: SSH vendor regressions | Name the vendor file of this platform and the rules whose vendor line conflicts
  ansible.builtin.set_fact:
    lifecycle_family: ssh
    lifecycle_topic: "{{ lookup('ansible.builtin.file', lifecycle_topics_directory ~ '/ssh.yml') | from_yaml }}"
    lifecycle_allow_disruptive:
      - ssh
    lifecycle_items: {}
    vendor_label: ssh vendor regressions
    vendor_profile: "{{ linux_compliance_discovered }}"
    vendor_file: >-
      {{ '/etc/ssh/sshd_config' if lifecycle_platform == 'ubuntu' else '/etc/ssh/sshd_config.d/50-redhat.conf' }}
    vendor_x11: xccdf_org.ssgproject.content_rule_sshd_disable_x11_forwarding
    vendor_ids: >-
      {{ ['xccdf_org.ssgproject.content_rule_sshd_disable_x11_forwarding']
         + ([] if lifecycle_platform == 'ubuntu' else ['xccdf_org.ssgproject.content_rule_sshd_disable_gssapi_auth']) }}

- name: SSH vendor regressions | Keep the declared items of every platform and of this one
  ansible.builtin.set_fact:
    lifecycle_items: >-
      {{ lifecycle_items | combine({item: (lifecycle_declared_items | rejectattr('platforms', 'defined') | list)
      + (lifecycle_declared_items | selectattr('platforms', 'defined')
      | selectattr('platforms', 'contains', lifecycle_platform) | list)}) }}
  vars:
    lifecycle_declared_items: "{{ (lifecycle_topic.state | default({}, true))[item] | default([], true) }}"
  loop: "{{ lifecycle_state_keys.keys() | list }}"

- name: SSH vendor regressions | Select the rules, their toggles and the files whose content the topic rewrites
  ansible.builtin.set_fact:
    lifecycle_rules: >-
      {{ lifecycle_native_rules | selectattr('rule_id', 'in', vendor_ids) | sort(attribute='rule_id') }}
    lifecycle_rule_ids: "{{ vendor_ids | sort }}"
    vendor_toggles: >-
      {{ lifecycle_native_rules | selectattr('rule_id', 'in', vendor_ids) | map(attribute='toggle') | list }}
    lifecycle_rewritten: >-
      {{ lifecycle_items.files | selectattr('rewritten', 'defined') | selectattr('rewritten')
      | map(attribute='path') | list }}

- name: SSH vendor regressions | Refuse to run unless the vendor file is declared rewritten and every rule is native
  ansible.builtin.assert:
    that:
      - lifecycle_rules | length == vendor_ids | length
      - vendor_file in lifecycle_rewritten
      - linux_compliance_discovered.rule_ids | select('in', vendor_ids) | list == []
    fail_msg: >-
      {{ vendor_label }} need {{ vendor_ids }} native, {{ vendor_file }} declared rewritten in the ssh declaration,
      and a profile that does not select the rules already.
    quiet: true

- name: SSH vendor regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: SSH vendor regressions | Remember the state of the whole instance and the vendor file before the regressions
  ansible.builtin.set_fact:
    vendor_broad_before: "{{ lifecycle_broad_lines }}"

- name: SSH vendor regressions | Read the vendor file as built
  ansible.builtin.slurp:
    src: "{{ vendor_file }}"
  register: vendor_built

- name: SSH vendor regressions | Pretend a profile that also selects the rules whose vendor line conflicts
  ansible.builtin.set_fact:
    linux_compliance_discovered: >-
      {{ vendor_profile | combine({'rule_ids': vendor_profile.rule_ids + vendor_ids}) }}

- name: SSH vendor regressions | Switch the rules on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ vendor_toggles }}"

- name: SSH vendor regressions | Apply the rules over the conflicting vendor lines
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Read every file that sshd reads after the apply
  ansible.builtin.include_tasks:
    file: lifecycle_ssh_settings.yml

- name: SSH vendor regressions | Read the ledger after the apply
  freesecdev.linux_compliance.control_state:
    action: list
  register: vendor_ledger_applied

- name: SSH vendor regressions | Check that each rule was applied and that no occurrence that the check reads conflicts
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['applied']
      - >-
        lifecycle_results | map(attribute='message') | select('search', vendor_file) | list | length
        == vendor_ids | length
      - vendor_settings['x11forwarding'] | unique | list == ['no']
      - lifecycle_platform == 'ubuntu' or vendor_settings['gssapiauthentication'] | unique | list == ['no']
      - >-
        vendor_ledger_applied.entries | selectattr('rule_id', 'in', vendor_ids)
        | map(attribute='prior_values') | flatten | map(attribute='name')
        | select('equalto', 'vendor_line:' ~ vendor_file) | list | length == vendor_ids | length
    fail_msg: "{{ vendor_label }}, apply: {{ lifecycle_results }}; settings {{ vendor_settings }}"
    quiet: true

- name: SSH vendor regressions | Apply the rules again
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Check that the second apply found every rule compliant
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['compliant']
      - lifecycle_results | selectattr('changed') | list == []
    fail_msg: "{{ vendor_label }}, second apply: {{ lifecycle_results }}"
    quiet: true

- name: SSH vendor regressions | Switch the rules off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ vendor_toggles }}"

- name: SSH vendor regressions | Clean up the rules
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Read the vendor file after the cleanup
  ansible.builtin.slurp:
    src: "{{ vendor_file }}"
  register: vendor_cleaned

- name: SSH vendor regressions | Check that the cleanup wrote the original lines back, byte for byte
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['restored']
      - lifecycle_results | map(attribute='message') | select('search', 'written back') | list | length > 0
      - vendor_cleaned.content == vendor_built.content
    fail_msg: "{{ vendor_label }}, cleanup: {{ lifecycle_results }}"
    quiet: true

- name: SSH vendor regressions | Switch the rules on to test a change by hand
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ vendor_toggles }}"

- name: SSH vendor regressions | Apply the rules before the change by hand
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Change the X11Forwarding line of the vendor file by hand, as an administrator would
  ansible.builtin.lineinfile:
    path: "{{ vendor_file }}"
    regexp: "^X11Forwarding "
    line: "X11Forwarding no # site decision"

- name: SSH vendor regressions | Switch the rules off after the change by hand
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ vendor_toggles }}"

- name: SSH vendor regressions | Clean up after the change by hand
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Read the vendor file and the ledger after the refused cleanup
  ansible.builtin.slurp:
    src: "{{ vendor_file }}"
  register: vendor_admin

- name: SSH vendor regressions | Read the ledger after the cleanup that kept the change by hand
  freesecdev.linux_compliance.control_state:
    action: list
  register: vendor_ledger_admin

- name: SSH vendor regressions | Check that only the changed rule was refused and its change kept
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', vendor_x11) | map(attribute='reason') | list
        == ['modified_since_apply']
      - >-
        lifecycle_results | rejectattr('rule_id', 'equalto', vendor_x11) | map(attribute='status') | unique | list
        in [[], ['restored']]
      - >-
        vendor_admin.content | b64decode is search('(?m)^X11Forwarding no # site decision$')
      - >-
        vendor_ledger_admin.entries | selectattr('rule_id', 'in', vendor_ids) | map(attribute='rule_id') | list
        == [vendor_x11]
    fail_msg: "{{ vendor_label }}, cleanup after a change by hand: {{ lifecycle_results }}"
    quiet: true

- name: SSH vendor regressions | Restore the original X11Forwarding line by hand, with other spacing
  ansible.builtin.lineinfile:
    path: "{{ vendor_file }}"
    regexp: "^X11Forwarding "
    line: x11forwarding   yes

- name: SSH vendor regressions | Clean up where the vendor line already has its prior value
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Read the vendor file after the cleanup over the restored line
  ansible.builtin.slurp:
    src: "{{ vendor_file }}"
  register: vendor_prior

- name: SSH vendor regressions | Check that the rule was restored and the hand-restored line was left alone
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='rule_id') | list == [vendor_x11]
      - lifecycle_results | map(attribute='status') | list == ['restored']
      - vendor_prior.content | b64decode is search('(?m)^x11forwarding   yes$')
    fail_msg: "{{ vendor_label }}, cleanup over the restored line: {{ lifecycle_results }}"
    quiet: true

- name: SSH vendor regressions | Give the vendor file its content as built, before the Match test
  ansible.builtin.copy:
    content: "{{ vendor_built.content | b64decode }}"
    dest: "{{ vendor_file }}"
    mode: "{{ '0644' if lifecycle_platform == 'ubuntu' else '0600' }}"
    owner: root
    group: root

- name: SSH vendor regressions | Take the X11Forwarding line out of the global part of the vendor file
  ansible.builtin.lineinfile:
    path: "{{ vendor_file }}"
    regexp: "^X11Forwarding "
    state: absent

- name: SSH vendor regressions | Put it back inside a Match block at the end of the vendor file
  ansible.builtin.lineinfile:
    path: "{{ vendor_file }}"
    line: "{{ item }}"
    insertafter: EOF
  loop:
    - Match User freesecdev-nobody
    - X11Forwarding yes

- name: SSH vendor regressions | Switch the rules on with the X11Forwarding line inside a Match block
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ vendor_toggles }}"

- name: SSH vendor regressions | Apply the rules with the X11Forwarding line inside a Match block
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false

- name: SSH vendor regressions | Read the vendor file after the apply with the Match block
  ansible.builtin.slurp:
    src: "{{ vendor_file }}"
  register: vendor_match

- name: SSH vendor regressions | Check that the line inside the Match block was refused and not edited
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', vendor_x11) | map(attribute='status') | list
        == ['overridden']
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', vendor_x11) | map(attribute='reason')
        | select('search', 'Match block') | list | length == 1
      - lifecycle_results | selectattr('rule_id', 'equalto', vendor_x11) | selectattr('changed') | list == []
      - vendor_match.content | b64decode is search('(?m)^Match User freesecdev-nobody\nX11Forwarding yes$')
    fail_msg: "{{ vendor_label }}, Match block: {{ lifecycle_results }}"
    quiet: true

- name: SSH vendor regressions | Switch the rules off after the Match test
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ vendor_toggles }}"

- name: SSH vendor regressions | Clean up the rules that the Match test applied
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
  when: lifecycle_platform != 'ubuntu'

- name: SSH vendor regressions | Give the vendor file back its content as built
  ansible.builtin.copy:
    content: "{{ vendor_built.content | b64decode }}"
    dest: "{{ vendor_file }}"
    mode: "{{ '0644' if lifecycle_platform == 'ubuntu' else '0600' }}"
    owner: root
    group: root

- name: SSH vendor regressions | Give the profile of this platform back
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ vendor_profile }}"

- name: SSH vendor regressions | Read the ledger after the regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: vendor_ledger_after

- name: SSH vendor regressions | Check that the ledger records none of the rules any more
  ansible.builtin.assert:
    that:
      - vendor_ledger_after.entries | selectattr('rule_id', 'in', vendor_ids) | list == []
    fail_msg: "{{ vendor_label }}: the ledger still holds {{ vendor_ledger_after.entries }}"
    quiet: true

- name: SSH vendor regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: ssh vendor regressions
    lifecycle_broad_step: the vendor regressions
    lifecycle_broad_reference: "{{ vendor_broad_before }}"
