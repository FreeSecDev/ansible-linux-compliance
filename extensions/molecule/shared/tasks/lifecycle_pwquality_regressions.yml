---
- name: Pwquality regressions | Refuse to run unless the pwquality topic was the last topic of the lifecycle
  ansible.builtin.assert:
    that:
      - lifecycle_topic.family == 'pwquality'
      - lifecycle_rule_ids | length > 0
      - lifecycle_allow_disruptive == ['pwquality']
    fail_msg: >-
      The pwquality regressions reuse the facts of the pwquality lifecycle, which must be the last topic; the topic was
      {{ lifecycle_topic.family | default('none') }}.
    quiet: true

- name: Pwquality regressions | Name the method of this platform, the other benchmark and the rule that drifts
  ansible.builtin.set_fact:
    regression_label: pwquality regressions
    regression_profile: "{{ linux_compliance_discovered }}"
    regression_main_file: >-
      {{ linux_compliance_discovered.benchmark_id
         in (lifecycle_native_rules | selectattr('family', 'equalto', 'pwquality') | first)
            .parameters.main_file_benchmarks }}
    regression_other_benchmark: >-
      {{ 'xccdf_org.ssgproject.content_benchmark_RHEL-9'
         if linux_compliance_discovered.benchmark_id == 'xccdf_org.ssgproject.content_benchmark_UBUNTU_24-04'
         else 'xccdf_org.ssgproject.content_benchmark_UBUNTU_24-04' }}
    regression_minlen: xccdf_org.ssgproject.content_rule_accounts_password_pam_minlen
    regression_minlen_toggle: linux_compliance_rule_accounts_password_pam_minlen_enabled
    regression_dropin: /etc/security/pwquality.conf.d/50-freesecdev-minlen.conf
    regression_toggles: "{{ lifecycle_rules | map(attribute='toggle') | list }}"

- name: Pwquality regressions | Take the state of the whole instance before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad.yml

- name: Pwquality regressions | Remember the state of the whole instance before the regressions
  ansible.builtin.set_fact:
    regression_broad_before: "{{ lifecycle_broad_record }}"

- name: Pwquality regressions | Switch every rule of the topic on
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"

- name: Pwquality regressions | Apply the topic with the method of this platform
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: pwquality

- name: Pwquality regressions | Check that every rule was applied and recorded with the method of this platform
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['applied']
    fail_msg: "{{ regression_label }}, apply: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality regressions | Read the main file and the minlen drop-in after the apply
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - /etc/security/pwquality.conf
    - "{{ regression_dropin }}"
  register: regression_applied_files

- name: Pwquality regressions | Pretend the content of the other platform, so the other method is selected
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile | combine({'benchmark_id': regression_other_benchmark}) }}"

- name: Pwquality regressions | Apply over ledger entries that the other method recorded
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: pwquality

- name: Pwquality regressions | Check that the apply refused every rule and changed nothing
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['method_changed']
      - lifecycle_results | selectattr('changed') | list == []
    fail_msg: "{{ regression_label }}, apply after a change of method: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality regressions | Switch every rule of the topic off
  ansible.builtin.set_fact:
    "{{ item }}": false
  loop: "{{ regression_toggles }}"

- name: Pwquality regressions | Clean up ledger entries that the other method recorded
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: pwquality

- name: Pwquality regressions | Read the ledger after the refused cleanup
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_refused

- name: Pwquality regressions | Check that the cleanup refused every rule, kept every entry and changed nothing
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['cleanup_incomplete']
      - lifecycle_results | map(attribute='reason') | unique | list == ['method_changed']
      - lifecycle_results | selectattr('changed') | list == []
      - >-
        regression_ledger_refused.entries | selectattr('rule_id', 'in', lifecycle_rule_ids)
        | map(attribute='rule_id') | sort == lifecycle_rule_ids | sort
    fail_msg: "{{ regression_label }}, cleanup after a change of method: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality regressions | Read the main file and the minlen drop-in after the refused runs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - /etc/security/pwquality.conf
    - "{{ regression_dropin }}"
  register: regression_refused_files

- name: Pwquality regressions | Check that neither refused run touched the files
  ansible.builtin.assert:
    that:
      - >-
        regression_refused_files.results | map(attribute='stat') | map(attribute='checksum', default='')
        | list == regression_applied_files.results | map(attribute='stat') | map(attribute='checksum', default='')
        | list
    quiet: true

- name: Pwquality regressions | Give the profile of this platform back
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile }}"

- name: Pwquality regressions | Change the minlen setting by hand, as an administrator would
  ansible.builtin.lineinfile:
    path: "{{ '/etc/security/pwquality.conf' if regression_main_file else regression_dropin }}"
    regexp: "^minlen = "
    line: minlen = 20

- name: Pwquality regressions | Clean up the topic after the administrator's change
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: pwquality

- name: Pwquality regressions | Read the file the administrator changed
  ansible.builtin.slurp:
    src: "{{ '/etc/security/pwquality.conf' if regression_main_file else regression_dropin }}"
  register: regression_admin_file

- name: Pwquality regressions | Check that only minlen was refused, the change kept and the others restored
  ansible.builtin.assert:
    that:
      - >-
        lifecycle_results | selectattr('rule_id', 'equalto', regression_minlen) | map(attribute='reason') | list
        == ['modified_since_apply']
      - >-
        lifecycle_results | rejectattr('rule_id', 'equalto', regression_minlen) | map(attribute='status') | unique
        | list == ['restored']
      - regression_admin_file.content | b64decode is search('(?m)^minlen = 20$')
    fail_msg: "{{ regression_label }}, cleanup after a change by hand: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality regressions | Put back the line that the collection wrote
  ansible.builtin.lineinfile:
    path: "{{ '/etc/security/pwquality.conf' if regression_main_file else regression_dropin }}"
    regexp: "^minlen = "
    line: minlen = 14

- name: Pwquality regressions | Clean up minlen now that it is what the collection wrote
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: pwquality

- name: Pwquality regressions | Check that minlen was restored
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='rule_id') | list == [regression_minlen]
      - lifecycle_results | map(attribute='status') | list == ['restored']
    fail_msg: "{{ regression_label }}, cleanup after the line was put back: {{ lifecycle_results }}"
    quiet: true

- name: Pwquality regressions | Prepare a symbolic link in place of the drop-in directory where it is missing
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    src: /tmp
    state: link
  when: regression_main_file

- name: Pwquality regressions | Switch every rule of the topic on again
  ansible.builtin.set_fact:
    "{{ item }}": true
  loop: "{{ regression_toggles }}"
  when: regression_main_file

- name: Pwquality regressions | Pretend the drop-in content with the symbolic link in place
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile | combine({'benchmark_id': regression_other_benchmark}) }}"
  when: regression_main_file

- name: Pwquality regressions | Apply the drop-in method through the symbolic link
  ansible.builtin.include_tasks:
    file: lifecycle_remediate.yml
  vars:
    lifecycle_check_mode: false
    lifecycle_family: pwquality
  when: regression_main_file

- name: Pwquality regressions | Look for anything written through the symbolic link
  ansible.builtin.find:
    paths: /tmp
    patterns:
      - "50-freesecdev-*"
      - ".freesecdev-created"
    hidden: true
  register: regression_through_link
  when: regression_main_file

- name: Pwquality regressions | Check that the drop-in method refused the symbolic link and wrote nothing
  ansible.builtin.assert:
    that:
      - lifecycle_results | map(attribute='status') | unique | list == ['not_directory']
      - lifecycle_results | selectattr('changed') | list == []
      - regression_through_link.files == []
    fail_msg: "{{ regression_label }}, symbolic link: {{ lifecycle_results }}"
    quiet: true
  when: regression_main_file

- name: Pwquality regressions | Remove the symbolic link and give the profile back
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: absent
  when: regression_main_file

- name: Pwquality regressions | Give the profile of this platform back and switch every rule on
  ansible.builtin.set_fact:
    linux_compliance_discovered: "{{ regression_profile }}"

- name: Pwquality regressions | Read the ledger after the regressions
  freesecdev.linux_compliance.control_state:
    action: list
  register: regression_ledger_after

- name: Pwquality regressions | Check that the ledger records no rule of the topic any more
  ansible.builtin.assert:
    that:
      - regression_ledger_after.entries | selectattr('rule_id', 'in', lifecycle_rule_ids) | list == []
    fail_msg: "{{ regression_label }}: the ledger still holds {{ regression_ledger_after.entries }}"
    quiet: true

- name: Pwquality regressions | Assert that the whole instance is back to its state before the regressions
  ansible.builtin.include_tasks:
    file: lifecycle_broad_compare.yml
  vars:
    lifecycle_label: pwquality regressions
    lifecycle_broad_step: the regressions
    lifecycle_broad_reference: "{{ regression_broad_before }}"

- name: Pwquality regressions | Record that this regression file ran to its end
  ansible.builtin.set_fact:
    lifecycle_regression_files_run: "{{ lifecycle_regression_files_run + ['lifecycle_pwquality_regressions.yml'] }}"
