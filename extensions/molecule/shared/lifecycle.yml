---
- name: Guard the scenario targets
  ansible.builtin.import_playbook: guard.yml

- name: Prove that every native topic applies, stays idempotent and cleans up to the state before it
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/versions.yml
    - vars/target.yml
    - vars/contract.yml
    - vars/lifecycle.yml
  vars:
    snapshot_volatile_directories:
      - "{{ molecule_evidence_directory }}"
  tasks:
    - name: Discover the pinned datastream and the profile of this platform
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.discover

    - name: Load the rule catalogue and the topic declarations
      ansible.builtin.set_fact:
        lifecycle_catalogue: "{{ lookup('ansible.builtin.file', lifecycle_catalogue_path) | from_yaml }}"
        lifecycle_declared_families: >-
          {{ lookup('ansible.builtin.fileglob', lifecycle_topics_directory ~ '/*.yml', wantlist=True)
          | map('basename') | map('regex_replace', '\.yml$', '') | sort }}

    - name: Derive the native topics from the catalogue, non-disruptive ones first
      ansible.builtin.set_fact:
        lifecycle_native_rules: "{{ lifecycle_native_rules_found }}"
        lifecycle_native_families: >-
          {{ ((lifecycle_registry | rejectattr('disruptive') | list)
          + (lifecycle_registry | selectattr('disruptive') | list))
          | selectattr('name', 'in', lifecycle_native_rules_found | map(attribute='family') | list)
          | map(attribute='name') | list }}
      vars:
        lifecycle_registry: "{{ lifecycle_catalogue.__linux_compliance_remediate_families }}"
        lifecycle_native_rules_found: >-
          {{ lifecycle_catalogue.__linux_compliance_remediate_rules
          | rejectattr('revert_strategy', 'equalto', 'audit_only') | list }}

    - name: Refuse a native topic without a declaration and a declaration without a native topic
      ansible.builtin.assert:
        that:
          - lifecycle_native_families | length > 0
          - lifecycle_native_families | difference(lifecycle_declared_families) | length == 0
          - lifecycle_declared_families | difference(lifecycle_native_families) | length == 0
        fail_msg: >-
          Every topic with a native rule in roles/remediate/vars/rules.yml needs a lifecycle declaration in
          extensions/molecule/shared/vars/topics/<topic>.yml, and every declaration needs a native topic (see
          docs/molecule.md, toggle lifecycle). Native topics {{ lifecycle_native_families }}, declarations
          {{ lifecycle_declared_families }}.
        quiet: true

    - name: Select the topics and toggle modes of this run, all of them unless a CI leg names one
      ansible.builtin.set_fact:
        lifecycle_selected_topic: "{{ lookup('ansible.builtin.env', 'MOLECULE_LIFECYCLE_TOPIC') }}"
        lifecycle_selected_mode: "{{ lookup('ansible.builtin.env', 'MOLECULE_LIFECYCLE_MODE') }}"

    - name: Refuse a selection that names no native topic or no toggle mode
      ansible.builtin.assert:
        that:
          - (lifecycle_selected_topic | length > 0) is sameas (lifecycle_selected_mode | length > 0)
          - lifecycle_selected_topic | length == 0 or lifecycle_selected_topic in lifecycle_native_families
          - >-
            lifecycle_selected_mode | length == 0 or lifecycle_selected_mode in lifecycle_toggle_modes
            or lifecycle_selected_mode is match(lifecycle_regression_mode_pattern)
        fail_msg: >-
          MOLECULE_LIFECYCLE_TOPIC and MOLECULE_LIFECYCLE_MODE must be set together, to a native topic
          ({{ lifecycle_native_families }}) and a toggle mode ({{ lifecycle_toggle_modes }}) or a regression group
          (regressions-<group> of the topic's declaration), or both left empty to run every topic in every mode and
          every regression group. Got '{{ lifecycle_selected_topic }}' and '{{ lifecycle_selected_mode }}'.
        quiet: true

    - name: Name the topics and modes that this run proves
      ansible.builtin.set_fact:
        lifecycle_run_families: >-
          {{ [lifecycle_selected_topic] if lifecycle_selected_topic | length > 0 else lifecycle_native_families }}
        lifecycle_run_modes: >-
          {{ [] if lifecycle_selected_mode is match(lifecycle_regression_mode_pattern)
             else [lifecycle_selected_mode] if lifecycle_selected_mode | length > 0 else lifecycle_toggle_modes }}
        lifecycle_run_regressions: >-
          {{ [lifecycle_selected_mode | regex_replace(lifecycle_regression_mode_pattern, '')]
             if lifecycle_selected_mode is match(lifecycle_regression_mode_pattern)
             else none if lifecycle_selected_mode | length == 0 else [] }}
        lifecycle_regressions_run: []
        lifecycle_regression_files_run: []
        lifecycle_proven_families: []

    - name: Scan once before any state is recorded, so that the first write of the scanner happens before the reference
      ansible.builtin.include_tasks:
        file: tasks/audit.yml
      vars:
        audit_check_mode: false

    - name: Check that the state comparison finds missing controls, stray changes and leftovers
      ansible.builtin.include_tasks:
        file: tasks/lifecycle_selfcheck.yml
      loop: "{{ lifecycle_selfcheck_cases }}"
      loop_control:
        loop_var: lifecycle_selfcheck_case
        label: "{{ lifecycle_selfcheck_case.name }}"
      when: molecule_target.driver in lifecycle_unrestricted_drivers

    - name: Check that the whole-instance comparison refuses leftovers and allows only the listed differences
      ansible.builtin.include_tasks:
        file: tasks/lifecycle_broad_selfcheck.yml
      loop: "{{ lifecycle_broad_selfcheck_cases }}"
      loop_control:
        loop_var: lifecycle_broad_selfcheck_case
        label: "{{ lifecycle_broad_selfcheck_case.name }}"
      when: >-
        molecule_target.driver in lifecycle_broad_selfcheck_case.drivers | default(lifecycle_unrestricted_drivers)

    - name: Run the toggle lifecycle of every selected native topic
      ansible.builtin.include_tasks:
        file: tasks/lifecycle_topic.yml
      loop: "{{ lifecycle_run_families }}"
      loop_control:
        loop_var: lifecycle_family

    - name: Refuse a regression leg whose group did not run
      ansible.builtin.assert:
        that:
          - >-
            lifecycle_run_regressions is none or lifecycle_run_regressions | length == 0
            or (lifecycle_selected_topic ~ ':' ~ lifecycle_run_regressions[0]) in lifecycle_regressions_run
        fail_msg: >-
          The leg selects the regression group {{ lifecycle_run_regressions }} of {{ lifecycle_selected_topic }},
          but it did not run on {{ molecule_target.instance }}: the declaration does not name the group, or limits it
          to other platforms. make molecule-matrix plans a regression leg only for a declared group and platform.
        quiet: true

    - name: Refuse a regression leg in which a file of its group did not run to its end
      ansible.builtin.assert:
        that:
          - >-
            lifecycle_run_regressions is none or lifecycle_run_regressions | length == 0
            or (lifecycle_topic.regressions | default([])
                | selectattr('name', 'equalto', lifecycle_run_regressions[0])
                | map(attribute='files') | first | default([])
                | difference(lifecycle_regression_files_run) | length == 0)
        fail_msg: >-
          The regression group {{ lifecycle_run_regressions }} of {{ lifecycle_selected_topic }} declares files that
          did not run to their end on {{ molecule_target.instance }}; ran {{ lifecycle_regression_files_run }}. Every
          file of a group must be included by shared/tasks/lifecycle_regressions.yml and end by recording that it ran.
        quiet: true

    - name: Refuse a CI leg whose topic runs no cycle with this driver on this platform
      ansible.builtin.assert:
        that:
          - lifecycle_selected_topic | length == 0 or lifecycle_selected_topic in lifecycle_proven_families
        fail_msg: >-
          The leg selects {{ lifecycle_selected_topic }}, but none of its cycles runs with the {{ molecule_target.driver
          }} driver on {{ molecule_target.instance }}, so the leg would prove nothing. make molecule-matrix plans a leg
          only for a driver and platform that run a cycle of the topic.
        quiet: true

    - name: Report the topics whose lifecycle was proven
      ansible.builtin.debug:
        msg: >-
          Toggle lifecycle proven on {{ molecule_target.instance }} ({{ molecule_target.driver }}) for
          {{ lifecycle_proven_families | join(', ') }} with the {{ lifecycle_run_modes | join(' and ') }} toggles from
          every pre-state of this driver: idempotence, check mode and cleanup.
