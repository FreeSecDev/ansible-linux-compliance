---
lifecycle_catalogue_path: "{{ molecule_repository }}/roles/remediate/vars/rules.yml"
lifecycle_topics_directory: "{{ playbook_dir }}/vars/topics"
lifecycle_platform: "{{ molecule_target.image }}"
lifecycle_state_keys:
  files: path
  packages: name
  services: name
  sysctl: name
  users: name
  groups: name
lifecycle_applied_outcomes:
  - pass
  - fixed
lifecycle_recorded_strategies:
  - recorded_value
  - recorded_state
lifecycle_known_drivers:
  - docker
  - libvirt
lifecycle_unrestricted_drivers:
  - docker
lifecycle_regression_mode_pattern: '^regressions-'
lifecycle_toggle_modes:
  - topic
  - rule
lifecycle_marker_variable: FREESECDEV_MOLECULE_MARKER
lifecycle_broad_paths:
  - /etc
  - /usr
  - /root
  - /home
  - /opt
  - /srv
  - /var/spool
  - /var/log
  - /var/lib
lifecycle_pre_state_reading_keys:
  - name
  - audit
  - modes
  - unchanged
  - applied
  - requires
lifecycle_pre_state_writing_keys:
  - files
lifecycle_watched_directories: >-
  {{ lifecycle_items.files | default([]) | map(attribute='path') | map('dirname') | unique | list }}
lifecycle_broad_ignored_paths:
  - /var/lib/freesecdev
  - /var/lib/freesecdev/linux_compliance
  - /var/lib/freesecdev/linux_compliance/state.json
lifecycle_broad_ignored_trees:
  - /var/lib/freesecdev/linux_compliance/evidence
lifecycle_broad_volatile_sysctl:
  - /proc/sys/fs/aio-nr
  - /proc/sys/fs/dentry-state
  - /proc/sys/fs/file-nr
  - /proc/sys/fs/inode-nr
  - /proc/sys/fs/inode-state
  - /proc/sys/kernel/hung_task_detect_count
  - /proc/sys/kernel/ns_last_pid
  - /proc/sys/kernel/pty/nr
  - /proc/sys/kernel/random/entropy_avail
  - /proc/sys/kernel/random/uuid
lifecycle_broad_volatile_sysctl_trees:
  - /proc/sys/fs/quota
lifecycle_broad_selfcheck_file:
  path: /etc/selfcheck
  isreg: true
  isdir: false
  islnk: false
  mode: "0644"
  uid: 0
  gid: 0
  size: 10
  inode: 100
  mtime: 1.0
  ctime: 1.0
  checksum: a
lifecycle_broad_selfcheck_crontab: >-
  {{ lifecycle_broad_selfcheck_file | combine({'path': '/etc/crontab', 'inode': 101}) }}
lifecycle_broad_selfcheck_ledger: >-
  {{ lifecycle_broad_selfcheck_file
  | combine({'path': '/var/lib/freesecdev/linux_compliance/state.json', 'inode': 104}) }}
lifecycle_broad_selfcheck_syslog: >-
  {{ lifecycle_broad_selfcheck_file | combine({'path': '/var/log/syslog', 'inode': 105, 'mode': '0640'}) }}
lifecycle_broad_selfcheck_with_syslog:
  files:
    - "{{ lifecycle_broad_selfcheck_file }}"
    - "{{ lifecycle_broad_selfcheck_crontab }}"
    - "{{ lifecycle_broad_selfcheck_ledger }}"
    - "{{ lifecycle_broad_selfcheck_syslog }}"
lifecycle_broad_selfcheck_declared:
  - /etc/crontab
  - /usr/lib/fsd-declared
lifecycle_broad_selfcheck_sources:
  walk: "{{ lifecycle_broad_selfcheck_state.files }}"
  walk_excluded: "^$"
  extra: []
  metadata: "{{ lifecycle_broad_selfcheck_state.metadata | default([]) }}"
  checksums: "{{ lifecycle_broad_selfcheck_state.checksums | default({}) }}"
  sysctl: "{{ lifecycle_broad_selfcheck_state.sysctl }}"
  packages: "{{ lifecycle_broad_selfcheck_state.packages }}"
  users: "{{ lifecycle_broad_selfcheck_state.users }}"
  groups: "{{ lifecycle_broad_selfcheck_state.groups }}"
  services: "{{ lifecycle_broad_selfcheck_state.services }}"
lifecycle_broad_selfcheck_static: >-
  {{ lifecycle_broad_selfcheck_file | combine({'path': '/usr/lib/fsd-static', 'inode': 106}) | dict2items
     | rejectattr('key', 'equalto', 'checksum') | items2dict }}
lifecycle_broad_selfcheck_usr_declared: >-
  {{ lifecycle_broad_selfcheck_file | combine({'path': '/usr/lib/fsd-declared', 'inode': 107}) }}
lifecycle_broad_selfcheck_raw:
  files:
    - "{{ lifecycle_broad_selfcheck_file }}"
    - "{{ lifecycle_broad_selfcheck_crontab }}"
    - "{{ lifecycle_broad_selfcheck_ledger }}"
  metadata:
    - "{{ lifecycle_broad_selfcheck_static }}"
    - "{{ lifecycle_broad_selfcheck_usr_declared }}"
  sysctl:
    - path: /proc/sys/kernel/dmesg_restrict
      checksum: a
    - path: /proc/sys/fs/file-nr
      checksum: a
  packages:
    cron:
      - version: "1.0"
  users:
    root:
      - x
      - "0"
  groups:
    root:
      - x
      - "0"
  services:
lifecycle_broad_selfcheck_cases:
  - name: unchanged instance
    after: {}
    refused: false
  - name: contents of a system log, which only a virtual machine may change
    before: "{{ lifecycle_broad_selfcheck_with_syslog }}"
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
        - "{{ lifecycle_broad_selfcheck_syslog | combine({'size': 20, 'mtime': 2.0, 'ctime': 2.0, 'checksum': 'b'}) }}"
    refused: "{{ molecule_target.driver != 'libvirt' }}"
    drivers: "{{ lifecycle_known_drivers }}"
  - name: mode of a system log
    before: "{{ lifecycle_broad_selfcheck_with_syslog }}"
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
        - "{{ lifecycle_broad_selfcheck_syslog | combine({'mode': '0644'}) }}"
    refused: true
    drivers: "{{ lifecycle_known_drivers }}"
  - name: ctime of a declared file
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab | combine({'ctime': 2.0}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: false
  - name: mtime of a declared file that its topic does not rewrite
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab | combine({'mtime': 2.0, 'ctime': 2.0}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: true
  - name: ledger rewritten and new evidence written
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger | combine({'checksum': 'b'}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger | combine({'path': lifecycle_broad_ignored_trees[0] ~ '/run/x.xml'}) }}"
    refused: false
  - name: usage counter of the kernel
    after:
      sysctl:
        - path: /proc/sys/kernel/dmesg_restrict
          checksum: a
        - path: /proc/sys/fs/file-nr
          checksum: b
    refused: false
  - name: undeclared file left behind
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
        - "{{ lifecycle_broad_selfcheck_file | combine({'path': '/etc/fsd-stray', 'inode': 102}) }}"
    refused: true
  - name: undeclared file left modified
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file | combine({'checksum': 'b'}) }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: true
  - name: undeclared file only touched
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file | combine({'mtime': 2.0}) }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: true
  - name: declared file rewritten by its topic, with another inode
    rewritten:
      - /etc/crontab
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab | combine({'inode': 103, 'mtime': 2.0}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: false
  - name: rewritten declared file left with other content
    rewritten:
      - /etc/crontab
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab | combine({'inode': 103, 'checksum': 'b'}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: true
  - name: declared file in /etc left with other content of the same size
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab | combine({'checksum': 'b'}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: true
  - name: static file in /usr changed in place, which only its ctime shows
    after:
      metadata:
        - "{{ lifecycle_broad_selfcheck_static | combine({'ctime': 2.0}) }}"
        - "{{ lifecycle_broad_selfcheck_usr_declared }}"
    refused: true
  - name: declared file in /usr left with other content of the same size and its times put back
    after:
      metadata:
        - "{{ lifecycle_broad_selfcheck_static }}"
        - "{{ lifecycle_broad_selfcheck_usr_declared | combine({'checksum': 'b', 'ctime': 2.0}) }}"
    refused: true
  - name: declared file in /usr only given another mode or owner
    after:
      metadata:
        - "{{ lifecycle_broad_selfcheck_static }}"
        - "{{ lifecycle_broad_selfcheck_usr_declared | combine({'ctime': 2.0}) }}"
    refused: false
  - name: declared file replaced by another inode
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab | combine({'inode': 103}) }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
    refused: true
  - name: stray file next to the ledger
    after:
      files:
        - "{{ lifecycle_broad_selfcheck_file }}"
        - "{{ lifecycle_broad_selfcheck_crontab }}"
        - "{{ lifecycle_broad_selfcheck_ledger }}"
        - "{{ lifecycle_broad_selfcheck_ledger | combine({'path': '/var/lib/freesecdev/linux_compliance/backup'}) }}"
    refused: true
  - name: kernel parameter left changed
    after:
      sysctl:
        - path: /proc/sys/kernel/dmesg_restrict
          checksum: b
        - path: /proc/sys/fs/file-nr
          checksum: a
    refused: true
  - name: undeclared package added
    after:
      packages:
        cron:
          - version: "1.0"
        aide:
          - version: "0.18"
    refused: true
  - name: undeclared user added
    after:
      users:
        root:
          - x
          - "0"
        fsd-stray:
          - x
          - "1001"
    refused: true
  - name: undeclared group added
    after:
      groups:
        root:
          - x
          - "0"
        fsd-stray:
          - x
          - "1001"
    refused: true
  - name: service appeared
    after:
      services:
        stray.service:
          state: running
          status: enabled
    refused: true
lifecycle_record_selfcheck_declared:
  - /etc/fsd-record-selfcheck
  - /usr/local/fsd-record-selfcheck
lifecycle_record_selfcheck_items:
  files:
    - path: "{{ lifecycle_record_selfcheck_declared[0] }}"
    - path: "{{ lifecycle_record_selfcheck_declared[1] }}"
lifecycle_record_selfcheck_stray: /etc/fsd-record-selfcheck-stray
lifecycle_record_selfcheck_before: "same size, first content\n"
lifecycle_record_selfcheck_after: "same size, other content\n"
lifecycle_selfcheck_file:
  exists: true
  type: file
  mode: "0644"
  owner: root
  group: root
  checksum: a
lifecycle_selfcheck_cases:
  - name: unchanged state
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    expected: {}
    mismatch: ""
  - name: change that nothing declares
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'mode': '0600'}) }}"
    expected: {}
    mismatch: "files /etc/selfcheck: mode changed from 0644 to 0600;"
  - name: declared control in place
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'mode': '0600'}) }}"
    expected:
      files:
        - path: /etc/selfcheck
          mode: "0600"
    mismatch: ""
  - name: declared control missing
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    expected:
      files:
        - path: /etc/selfcheck
          mode: "0600"
    mismatch: "files /etc/selfcheck: mode is 0644, expected 0600;"
  - name: file absent before and left behind by the cleanup
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'exists': false}) }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    expected: {}
    mismatch: "files /etc/selfcheck: exists changed from False to True;"
  - name: file present before and removed by the cleanup
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'exists': false}) }}"
    expected: {}
    mismatch: "files /etc/selfcheck: exists changed from True to False;"
  - name: rewritten file restored with another inode and time
    rewritten:
      - /etc/selfcheck
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'inode': 1, 'mtime': 1.0}) }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'inode': 2, 'mtime': 2.0}) }}"
    expected: {}
    mismatch: ""
  - name: rewritten file restored with other content
    rewritten:
      - /etc/selfcheck
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'inode': 1}) }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'inode': 2, 'checksum': 'b'}) }}"
    expected: {}
    mismatch: "files /etc/selfcheck: checksum changed from a to b;"
  - name: file that is not rewritten restored with another inode
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'inode': 1}) }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file | combine({'inode': 2}) }}"
    expected: {}
    mismatch: "files /etc/selfcheck: inode changed from 1 to 2;"
  - name: declared change that did not happen
    before:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    after:
      files:
        /etc/selfcheck: "{{ lifecycle_selfcheck_file }}"
    expected:
      files:
        - path: /etc/selfcheck
          changes:
            - checksum
    mismatch: "files /etc/selfcheck: checksum stayed a, expected a change;"
  - name: package installed by a step that declares nothing
    before:
      packages:
        selfcheck:
          installed: false
          versions: []
    after:
      packages:
        selfcheck:
          installed: true
          versions:
            - "1.0"
    expected: {}
    mismatch: "packages selfcheck: installed changed from False to True;"
