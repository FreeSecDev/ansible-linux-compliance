---
guard_libvirt_sim_pool_path: /var/lib/libvirt/freesecdev-molecule/fsd-mol-libvirt-sim-abcd1234
guard_libvirt_simulation:
  scenario: libvirt-sim
  instances:
    - instance: probe
      address: 10.210.5.10
      user: root
      port: 22
      identity_file: /simulated/ephemeral/libvirt/id_ed25519
      connection: ssh
      driver: libvirt
      scenario: libvirt-sim
      run_id: abcd1234
      image: ubuntu
      marker: simulatedmarkersimulatedmarker00
      domain: fsd-mol-libvirt-sim-abcd1234-probe
      network: fsd-mol-libvirt-sim-abcd1234
      bridge: fsdmabcd1234
      gateway: 10.210.5.1
      pool: fsd-mol-libvirt-sim-abcd1234
      pool_path: /var/lib/libvirt/freesecdev-molecule/fsd-mol-libvirt-sim-abcd1234
      disk: fsd-mol-libvirt-sim-abcd1234-probe.qcow2
      seed: fsd-mol-libvirt-sim-abcd1234-probe-seed.iso
      mac: 52:54:00:aa:bb:cc
      known_hosts: /simulated/ephemeral/libvirt/known_hosts
      uuid: 0c6b2e5e-1d2f-4c3b-9a8e-7f6d5c4b3a21
      capabilities_add: []
  good_connection_vars:
    ansible_host: 10.210.5.10
    ansible_connection: ssh
    ansible_user: root
    ansible_port: 22
    ansible_private_key_file: /simulated/ephemeral/libvirt/id_ed25519
    ansible_ssh_common_args: >-
      -F /dev/null -o UserKnownHostsFile=/simulated/ephemeral/libvirt/known_hosts -o StrictHostKeyChecking=yes
      -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no -o ForwardX11=no
      -o LogLevel=ERROR
  good_ssh_settings:
    host_key_checking: true
    plugin_host_key_checking: true
    ssh_args: -C -o ControlMaster=auto -o ControlPersist=60s
    ssh_extra_args: ""
    scp_extra_args: ""
    sftp_extra_args: ""
    ssh_executable: ssh
    control_path: ""
    control_path_dir: ~/.ansible/cp
  good_identity:
    serial: "simulatedmarkersimulatedmarker00\n"
    product_uuid: "0C6B2E5E-1D2F-4C3B-9A8E-7F6D5C4B3A21\n"
    boot_id: "1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9\n"
    machine_id: "00112233445566778899aabbccddeeff\n"
    controller_boot_id: "9e8d7c6b-5a49-4382-9170-6f5e4d3c2b1a"
    controller_machine_id: ffeeddccbbaa99887766554433221100
  good_domain_xml: |
    <domain type='kvm' id='1'>
      <name>fsd-mol-libvirt-sim-abcd1234-probe</name>
      <uuid>0c6b2e5e-1d2f-4c3b-9a8e-7f6d5c4b3a21</uuid>
      <metadata>
        <fsd:molecule xmlns:fsd="https://github.com/FreeSecDev/ansible-linux-compliance/molecule">
          <fsd:scenario>libvirt-sim</fsd:scenario>
          <fsd:run>abcd1234</fsd:run>
          <fsd:instance>probe</fsd:instance>
        </fsd:molecule>
      </metadata>
      <memory unit='KiB'>4194304</memory>
      <currentMemory unit='KiB'>4194304</currentMemory>
      <vcpu placement='static'>2</vcpu>
      <resource>
        <partition>/machine</partition>
      </resource>
      <sysinfo type='smbios'>
        <system>
          <entry name='manufacturer'>FreeSecDev</entry>
          <entry name='product'>molecule</entry>
          <entry name='serial'>simulatedmarkersimulatedmarker00</entry>
        </system>
      </sysinfo>
      <os>
        <type arch='x86_64' machine='pc-q35-noble'>hvm</type>
        <boot dev='hd'/>
        <smbios mode='sysinfo'/>
      </os>
      <features>
        <acpi/>
        <apic/>
      </features>
      <cpu mode='host-passthrough' check='none' migratable='on'/>
      <clock offset='utc'/>
      <on_poweroff>destroy</on_poweroff>
      <on_reboot>restart</on_reboot>
      <on_crash>destroy</on_crash>
      <devices>
        <emulator>/usr/bin/qemu-system-x86_64</emulator>
        <disk type='file' device='disk'>
          <driver name='qemu' type='qcow2'/>
          <source file='{{ guard_libvirt_sim_pool_path }}/fsd-mol-libvirt-sim-abcd1234-probe.qcow2' index='2'/>
          <backingStore/>
          <target dev='vda' bus='virtio'/>
          <alias name='virtio-disk0'/>
        </disk>
        <disk type='file' device='cdrom'>
          <driver name='qemu' type='raw'/>
          <source file='{{ guard_libvirt_sim_pool_path }}/fsd-mol-libvirt-sim-abcd1234-probe-seed.iso' index='1'/>
          <backingStore/>
          <target dev='sda' bus='sata'/>
          <readonly/>
        </disk>
        <controller type='usb' index='0' model='qemu-xhci'>
          <alias name='usb'/>
        </controller>
        <controller type='pci' index='1' model='pcie-root-port'>
          <model name='pcie-root-port'/>
          <target chassis='1' port='0x10'/>
        </controller>
        <interface type='network'>
          <mac address='52:54:00:aa:bb:cc'/>
          <source network='fsd-mol-libvirt-sim-abcd1234' portid='65fb5fdb-7592-4f9f' bridge='fsdmabcd1234'/>
          <target dev='vnet3'/>
          <model type='virtio'/>
        </interface>
        <serial type='pty'>
          <source path='/dev/pts/1'/>
          <target type='isa-serial' port='0'>
            <model name='isa-serial'/>
          </target>
        </serial>
        <console type='pty' tty='/dev/pts/1'>
          <source path='/dev/pts/1'/>
          <target type='serial' port='0'/>
        </console>
        <input type='mouse' bus='ps2'>
          <alias name='input0'/>
        </input>
        <input type='keyboard' bus='ps2'>
          <alias name='input1'/>
        </input>
        <audio id='1' type='none'/>
        <video>
          <model type='vga' vram='16384' heads='1' primary='yes'/>
        </video>
        <watchdog model='itco' action='reset'>
          <alias name='watchdog0'/>
        </watchdog>
        <memballoon model='virtio'>
          <alias name='balloon0'/>
        </memballoon>
        <rng model='virtio'>
          <backend model='random'>/dev/urandom</backend>
          <alias name='rng0'/>
        </rng>
      </devices>
      <seclabel type='dynamic' model='dac' relabel='yes'>
        <label>+64055:+993</label>
        <imagelabel>+64055:+993</imagelabel>
      </seclabel>
    </domain>
  good_network_xml: |
    <network connections='1'>
      <name>fsd-mol-libvirt-sim-abcd1234</name>
      <metadata>
        <fsd:molecule xmlns:fsd="https://github.com/FreeSecDev/ansible-linux-compliance/molecule">
          <fsd:scenario>libvirt-sim</fsd:scenario>
          <fsd:run>abcd1234</fsd:run>
        </fsd:molecule>
      </metadata>
      <bridge name='fsdmabcd1234' stp='on' delay='0'/>
      <dns enable='no'/>
      <ip address='10.210.5.1' netmask='255.255.255.0'>
      </ip>
    </network>
  pool_owner: 1000
  good_pool_xml: |
    <pool type='dir'>
      <name>fsd-mol-libvirt-sim-abcd1234</name>
      <target>
        <path>/var/lib/libvirt/freesecdev-molecule/fsd-mol-libvirt-sim-abcd1234</path>
        <permissions>
          <mode>0711</mode>
          <owner>1000</owner>
          <group>118</group>
        </permissions>
      </target>
    </pool>

guard_libvirt_cases:
  - name: disposable virtual machine over SSH
    refused: false
  - name: virtual machine without a video adapter
    domain_edits:
      - ["<model type='vga' vram='16384' heads='1' primary='yes'/>", ""]
      - ["<video>", ""]
      - ["</video>", ""]
    refused: false
  - name: virtual machine under AppArmor with its dynamic AppArmor label
    apparmor: true
    domain_edits:
      - - "</domain>"
        - "<seclabel type='dynamic' model='apparmor' relabel='yes'>\
          <label>libvirt-0c6b2e5e-1d2f-4c3b-9a8e-7f6d5c4b3a21</label>\
          <imagelabel>libvirt-0c6b2e5e-1d2f-4c3b-9a8e-7f6d5c4b3a21</imagelabel></seclabel></domain>"
    refused: false
  - name: virtual machine under SELinux with its dynamic SELinux label
    domain_edits:
      - - "</domain>"
        - "<seclabel type='dynamic' model='selinux' relabel='yes'><label>system_u:system_r:svirt_t:s0:c12,c345</label>\
          <imagelabel>system_u:object_r:svirt_image_t:s0:c12,c345</imagelabel></seclabel></domain>"
    refused: false
  - name: localhost over a local connection
    hostname: localhost
    connection_vars:
      ansible_host: localhost
      ansible_connection: local
    refused: true
  - name: loopback address over SSH
    connection_vars:
      ansible_host: 127.0.0.1
    refused: true
  - name: unrecorded address on the run's network
    connection_vars:
      ansible_host: 10.210.5.11
    refused: true
  - name: address of the controller on another network
    connection_vars:
      ansible_host: 192.168.1.10
    refused: true
  - name: Docker connection to a libvirt target
    connection_vars:
      ansible_connection: community.docker.docker
    refused: true
  - name: proxy command in the SSH arguments
    connection_vars:
      ansible_ssh_common_args: -o ProxyCommand=nc 192.0.2.1 22
    refused: true
  - name: host key checking switched off in the SSH arguments
    connection_vars:
      ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    refused: true
  - name: extra SSH arguments
    connection_vars:
      ansible_ssh_extra_args: -J jump.example.invalid
    refused: true
  - name: another SSH executable
    connection_vars:
      ansible_ssh_executable: /opt/attacker/ssh
    refused: true
  - name: another SSH port
    connection_vars:
      ansible_port: 2222
    refused: true
  - name: another remote user
    connection_vars:
      ansible_user: ubuntu
    refused: true
  - name: another private key
    connection_vars:
      ansible_private_key_file: /home/developer/.ssh/id_ed25519
    refused: true
  - name: a password instead of the run's key
    connection_vars:
      ansible_password: simulated
    refused: true
  - name: host key checking switched off by a variable
    connection_vars:
      ansible_host_key_checking: false
    refused: true
  - name: privilege escalation through another method
    connection_vars:
      ansible_become_method: su
    refused: true
  - name: host key checking switched off in the configuration
    ssh_settings:
      host_key_checking: false
    refused: true
  - name: host key checking switched off for the SSH plugin
    ssh_settings:
      plugin_host_key_checking: false
    refused: true
  - name: SSH arguments of the configuration that disable host key checking
    ssh_settings:
      ssh_args: -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
    refused: true
  - name: extra SSH arguments in the configuration
    ssh_settings:
      ssh_extra_args: -o ProxyJump=jump.example.invalid
    refused: true
  - name: copy arguments in the configuration
    ssh_settings:
      scp_extra_args: -o ProxyJump=jump.example.invalid
    refused: true
  - name: another SSH executable in the configuration
    ssh_settings:
      ssh_executable: /opt/attacker/ssh
    refused: true
  - name: control socket chosen by a variable
    connection_vars:
      ansible_control_path: /tmp/shared-%h
    refused: true
  - name: control socket directory chosen by a variable
    connection_vars:
      ansible_control_path_dir: /tmp/shared
    refused: true
  - name: control socket chosen in the configuration
    ssh_settings:
      control_path: /tmp/shared-%h
    refused: true
  - name: control socket that Molecule configures per host, port and user
    ssh_settings:
      control_path: "%(directory)s/%%h-%%p-%%r"
    refused: false
  - name: control socket directory chosen in the configuration
    ssh_settings:
      control_path_dir: /tmp/shared
    refused: true
  - name: security labels switched off
