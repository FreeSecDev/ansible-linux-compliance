      - ["</rng>", "</rng><rng model='virtio'><backend model='random'>/dev/urandom</backend></rng>"]
    refused: true
  - name: another emulator binary
    domain_edits:
      - ["<emulator>/usr/bin/qemu-system-x86_64</emulator>", "<emulator>/opt/attacker/qemu</emulator>"]
    refused: true
  - name: emulator of the RHEL family
    domain_edits:
      - ["<emulator>/usr/bin/qemu-system-x86_64</emulator>", "<emulator>/usr/libexec/qemu-kvm</emulator>"]
    refused: false
  - name: audio on the host sound server
    domain_edits:
      - ["<audio id='1' type='none'/>", "<audio id='1' type='pulseaudio'/>"]
