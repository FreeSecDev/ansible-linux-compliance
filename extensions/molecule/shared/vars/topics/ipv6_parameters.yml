---
family: ipv6_parameters
disruptive: true
containment: >-
  ipv6_parameters writes one drop-in per rule below /etc/sysctl.d and, on the virtual machines, sets the running
  value. Router advertisements, autoconfiguration and forwarding can cut an IPv6 host or router off. The containers
  have no network and a read-only /proc/sys, so only files change there, and the harness connects with docker exec.
  The virtual machines are reached over IPv4 only, on the run's isolated network with a static address, so switching
  off router advertisements and autoconfiguration cannot cut the harness off; the guard's connection test after
  every remediate run proves that it still reaches the same machine. The allow-list names ipv6_parameters only for
  the runs of this topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    ComplianceAsCode limits the IPv6 rules to system_with_kernel, which excludes containers, and the RHEL 9
    datastream does not recognise Rocky Linux, so the container audits and every Rocky Linux audit report them
    notapplicable. On the Ubuntu virtual machine every rule must pass. A rule passes as well when IPv6 is disabled;
    the collection never disables IPv6 (tests/unit/tools/test_content_golden_sysctl.py).
state:
  files:
    - path: /etc/sysctl.d
      rewritten: true
    - path: /etc/sysctl.d/.freesecdev-created
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-all-accept-ra.conf
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-all-accept-redirects.conf
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-all-accept-source-route.conf
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-all-forwarding.conf
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-default-accept-ra.conf
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-default-accept-redirects.conf
      rewritten: true
    - path: /etc/sysctl.d/999-freesecdev-sysctl-net-ipv6-conf-default-accept-source-route.conf
      rewritten: true
  sysctl:
    - name: net.ipv6.conf.all.accept_ra
    - name: net.ipv6.conf.all.accept_redirects
    - name: net.ipv6.conf.all.accept_source_route
    - name: net.ipv6.conf.all.forwarding
    - name: net.ipv6.conf.default.accept_ra
    - name: net.ipv6.conf.default.accept_redirects
    - name: net.ipv6.conf.default.accept_source_route
