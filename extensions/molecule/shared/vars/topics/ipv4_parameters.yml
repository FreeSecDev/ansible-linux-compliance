---
family: ipv4_parameters
disruptive: true
containment: >-
  ipv4_parameters writes one drop-in per rule below /etc/sysctl.d and, on the virtual machines, sets the running
  value; on Ubuntu it also sets the compliant value on the rp_filter lines of the vendor file
  10-network-security.conf and, where ufw is installed (the virtual machine), on the log_martians and tcp_syncookies
  lines of /etc/ufw/sysctl.conf, each recorded and written back on cleanup. Forwarding, redirects, source routing
  and reverse-path filtering can cut a router or a multi-homed host off. The containers have no network
  (network_mode none) and a read-only /proc/sys, so only files change there, and the harness connects with docker
  exec. The virtual machines have one interface on the run's isolated network, with a static address, and are
  reached over SSH from the host's address on that bridge, which strict reverse-path filtering, disabled forwarding
  and refused redirects do not affect; the guard's connection test after every remediate run proves that the harness
  still reaches the same machine. The allow-list names ipv4_parameters only for the runs of this topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    The RHEL 9 datastream does not recognise Rocky Linux, so every rule is notapplicable there. On Ubuntu the IPv4
    rules have no platform restriction, so the container audits evaluate the network namespace of the container,
    whose running values the collection cannot set (/proc/sys is read-only); the container pre-state therefore runs
    no scan. On the Ubuntu virtual machine every rule must pass. Both pinned datastreams read the same files as for
    the sysctl topic and check the running value (tests/unit/tools/test_content_golden_sysctl.py).
