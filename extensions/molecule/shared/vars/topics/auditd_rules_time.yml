---
family: auditd_rules_time
disruptive: true
containment: >-
  auditd_rules_time only writes its own drop-ins below /etc/audit/rules.d and loads the rule set where auditd runs,
  after refusing a set that holds a rule twice. The containers run no auditd and load nothing; in the virtual machines
  the rules only record time changes, and the failure mode of the images (-f 1) logs a lost event instead of stopping
  the kernel. The harness connects with docker exec through the Docker API, or over SSH as root to a disposable virtual
  machine, neither of which an audit rule can block, and the guard's connection test after every remediate run proves
  that it still reaches the same instance. The allow-list names auditd_rules_time only for the runs of this topic.
profiles:
  - platform: ubuntu
    profile: cis_level2_server
    reason: >-
      cis_level1_server selects no audit rule; the Level 2 server profile selects the five time rules.
  - platform: rhel_compatible
    profile: e8
    reason: >-
      cis_server_l1 selects no audit rule; the Essential Eight profile selects the five time rules (pci-dss, which
      also does, has a hyphen that the roles refuse as a profile identifier).
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    The RHEL 9 datastream's platform checks do not recognise Rocky Linux, so every rule of the profile is notapplicable
    there; the drop-ins with their checksums, mode and ownership under applied are the evidence. On Ubuntu 24.04 the
    rules apply to a container with auditd installed, and the audit after apply must report them pass or fixed.
state:
  files:
    - path: /etc/audit/rules.d
      rewritten: true
    - path: /etc/audit/audit.rules
      rewritten: true
    - path: /etc/audit/audit.rules.prev
      rewritten: true
    - path: /etc/audit/rules.d/40-site.rules
    - path: /etc/audit/rules.d/50-freesecdev-audit-rules-time-adjtimex.rules
      rewritten: true
    - path: /etc/audit/rules.d/50-freesecdev-audit-rules-time-clock-settime.rules
      rewritten: true
    - path: /etc/audit/rules.d/50-freesecdev-audit-rules-time-settimeofday.rules
      rewritten: true
    - path: /etc/audit/rules.d/50-freesecdev-audit-rules-time-stime.rules
      rewritten: true
    - path: /etc/audit/rules.d/50-freesecdev-audit-rules-time-watch-localtime.rules
      rewritten: true
  packages:
    - name: auditd
      platforms:
        - ubuntu
    - name: audit
      platforms:
        - rhel_compatible
  users:
    - name: root
  groups:
    - name: root
  audit_rules:
    - line: '-a always,exit -F arch=b32 -S adjtimex -k time-change'
      drivers:
        - libvirt
    - line: '-a always,exit -F arch=b64 -S adjtimex -k time-change'
      drivers:
        - libvirt
    - line: '-a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change'
      drivers:
        - libvirt
    - line: '-a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change'
      drivers:
        - libvirt
    - line: '-a always,exit -F arch=b32 -S settimeofday -k time-change'
      drivers:
        - libvirt
    - line: '-a always,exit -F arch=b64 -S settimeofday -k time-change'
      drivers:
        - libvirt
    - line: '-a always,exit -F arch=b32 -S stime -k time-change'
      drivers:
        - libvirt
      platforms:
        - rhel_compatible
    - line: '-a always,exit -F arch=b32 -F path=/etc/localtime -F perm=wa -k time-change'
      drivers:
        - libvirt
      platforms:
        - rhel_compatible
    - line: '-a always,exit -F arch=b64 -F path=/etc/localtime -F perm=wa -k time-change'
      drivers:
        - libvirt
      platforms:
        - rhel_compatible
    - line: '-w /etc/localtime -p wa -k time-change'
      drivers:
        - libvirt
      platforms:
        - ubuntu
