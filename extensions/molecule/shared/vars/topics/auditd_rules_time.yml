pre_states:
  - name: as built
    audit: true
  - name: auditd running in a virtual machine
    audit: false
    requires:
      - libvirt
    applied:
      files:
        - path: /etc/audit/audit.rules
          changes:
            - checksum
regressions:
  - name: changes
    files:
      - lifecycle_auditd_rules_regressions.yml
