---
family: wireless_modules
disruptive: true
containment: >-
  wireless_modules writes one drop-in per rule below /etc/modprobe.d and nothing else: it never runs modprobe, never
  unloads a module and never rebuilds an initramfs, so the drop-ins only decide what a later modprobe would do.
  The containers drop every capability, CAP_SYS_MODULE included, and run no service manager, so nothing in them
  can load or unload a kernel module and the host kernel is never touched. The harness connects with docker exec
  through the Docker API, without sshd, PAM, sudo or a login shell, and the guard's connection test after every
  remediate run proves that it still reaches the same unprivileged container. The allow-list names wireless_modules
  only for the runs of this topic.
profiles:
  - platform: rhel_compatible
    profile: bsi
    reason: >-
      cis_server_l1 selects none of the wireless module rules; the BSI profile selects all five.
unselected_platforms:
  - platform: ubuntu
    reason: >-
      The Ubuntu 24.04 datastream has no wireless or Bluetooth kernel module rule, so no profile of the platform
      selects a rule of the topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    ComplianceAsCode limits every wireless module rule to the system_with_kernel platform, which excludes
    containers, and the RHEL 9 datastream does not recognise Rocky Linux, so a container audit reports them
    notapplicable; the drop-ins with their checksums under applied are the evidence
    (tests/unit/tools/test_content_golden_kernel_modules.py checks what the OVAL reads).
state:
  files:
    - path: /etc/modprobe.d
      rewritten: true
    - path: /etc/modprobe.d/freesecdev-bluetooth.conf
