---
family: filesystem_modules
disruptive: true
containment: >-
  filesystem_modules writes one drop-in per rule below /etc/modprobe.d and nothing else: it never runs modprobe, never
  unloads a module and never rebuilds an initramfs, so the drop-ins only decide what a later modprobe would do.
  The containers drop every capability, CAP_SYS_MODULE included, and run no service manager, so nothing in them
  can load or unload a kernel module and the host kernel is never touched. The harness connects with docker exec
  through the Docker API, without sshd, PAM, sudo or a login shell, and the guard's connection test after every
  remediate run proves that it still reaches the same unprivileged container. The allow-list names filesystem_modules
  only for the runs of this topic.
profiles:
  - platform: ubuntu
    profile: cis_level2_server
    reason: >-
      cis_level1_server selects six of the nine rules; the Level 2 server profile also selects overlayfs and udf,
      so the cycles cover eight. No Ubuntu 24.04 profile selects squashfs; it runs on Rocky Linux.
  - platform: rhel_compatible
    profile: cis
    reason: >-
      cis_server_l1 selects six of the nine rules; the Level 2 server profile also selects squashfs and udf. The
      RHEL 9 datastream has no overlayfs rule.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    ComplianceAsCode limits every file system module rule to the system_with_kernel platform, which excludes
    containers, and the RHEL 9 datastream does not recognise Rocky Linux, so a container audit reports them
    notapplicable; the drop-ins with their checksums under applied are the evidence. Both pinned datastreams
    require an install line and a blacklist line in a .conf file below the modprobe directories
    (tests/unit/tools/test_content_golden_kernel_modules.py checks this against the OVAL of both datastreams).
