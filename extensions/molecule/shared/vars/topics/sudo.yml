---
family: sudo
disruptive: true
containment: >-
  sudo only writes drop-ins below /etc/sudoers.d, each checked by visudo before it is moved into place, and restricts
  the mode, owner and group of /etc/sudoers and /etc/sudoers.d; it never edits /etc/sudoers or another drop-in, so a
  wrong setting can at most change how sudo prompts, logs or times out. The harness never uses sudo: it connects with
  docker exec through the Docker API as root, without sshd, PAM, sudo or a login shell, so a sudo setting cannot cut it
  off, and the guard's connection test after every remediate run proves that it still reaches the same unprivileged
  container. The allow-list names sudo only for the runs of this topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    The RHEL 9 datastream's platform checks do not recognise Rocky Linux, so every rule of the profile is notapplicable
    there; the drop-ins with their checksums, mode and ownership under applied are the evidence. On Ubuntu 24.04 the
    rules apply to a container with sudo installed, and the audit after apply must report them pass or fixed.
state:
  files:
    - path: /etc/sudoers
    - path: /etc/sudoers.d
      rewritten: true
    - path: /etc/sudoers.d/50-freesecdev-use_pty
      rewritten: true
    - path: /etc/sudoers.d/50-freesecdev-logfile
      rewritten: true
    - path: /etc/sudoers.d/50-freesecdev-timestamp_timeout
      rewritten: true
  packages:
    - name: sudo
  users:
    - name: root
  groups:
    - name: root
applied:
