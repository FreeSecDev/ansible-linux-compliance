---
family: protocol_modules
disruptive: true
containment: >-
  protocol_modules writes one drop-in per rule below /etc/modprobe.d and nothing else: it never runs modprobe, never
  unloads a module and never rebuilds an initramfs, so the drop-ins only decide what a later modprobe would do.
  The containers drop every capability, CAP_SYS_MODULE included, and run no service manager, so nothing in them
  can load or unload a kernel module and the host kernel is never touched. The harness connects with docker exec
  through the Docker API, without sshd, PAM, sudo or a login shell, and the guard's connection test after every
  remediate run proves that it still reaches the same unprivileged container. The allow-list names protocol_modules
  only for the runs of this topic.
profiles:
  - platform: ubuntu
    profile: cis_level2_server
    reason: >-
      cis_level1_server selects none of the protocol module rules; the Level 2 server profile selects dccp, rds,
      sctp and tipc.
  - platform: rhel_compatible
    profile: stig
    reason: >-
      cis_server_l1 selects none of the protocol module rules; the STIG profile selects atm, can, firewire-core,
      sctp and tipc, and dccp and rds run on Ubuntu.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    ComplianceAsCode limits the protocol module rules to the system_with_kernel platform through their group
    network-uncommon, which excludes containers, and the RHEL 9 datastream does not recognise Rocky Linux, so a
    container audit reports them notapplicable; the drop-ins with their checksums under applied are the evidence
    (tests/unit/tools/test_content_golden_kernel_modules.py checks what the OVAL of both datastreams reads).
