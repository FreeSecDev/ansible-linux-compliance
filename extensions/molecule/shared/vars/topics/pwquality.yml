    - path: /etc/security/pwquality.conf.d/50-freesecdev-dictcheck.conf
      rewritten: true
    - path: /etc/security/pwquality.conf.d/50-freesecdev-difok.conf
      rewritten: true
    - path: /etc/security/pwquality.conf.d/50-freesecdev-enforce-root.conf
