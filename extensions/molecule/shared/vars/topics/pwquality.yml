---
family: pwquality
disruptive: true
containment: >-
  pwquality only writes drop-ins below /etc/security/pwquality.conf.d, which libpwquality reads when a password is
  changed through pam_pwquality; on Ubuntu it also creates that directory with a marker and removes both again. The
  harness never changes a password: it connects with docker exec through the Docker API as root, without sshd, PAM,
  sudo or a login shell, so a password quality setting cannot cut it off, and the guard's connection test after every
  remediate run proves that it still reaches the same unprivileged container. The PAM stack (topic pam) is never
  touched, and the allow-list names pwquality only for the runs of this topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    ComplianceAsCode limits every pwquality rule to the system_with_kernel platform, which excludes containers, so a
    container audit reports them notapplicable whatever the configuration says. The drop-ins and their checksums under
    applied are the evidence. On Ubuntu 24.04 the content checks only /etc/security/pwquality.conf, not the drop-in
    directory that libpwquality also reads, so a host audit there reports the rules as failing even when the drop-ins
    are in force (docs/native-remediation-guide.md, pwquality).
