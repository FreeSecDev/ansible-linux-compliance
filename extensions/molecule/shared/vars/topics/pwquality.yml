---
family: pwquality
disruptive: true
containment: >-
  pwquality only changes what libpwquality reads when a password is changed through pam_pwquality, where the pinned
  content of the platform checks it: one line per setting in /etc/security/pwquality.conf on Ubuntu, one drop-in per
  setting below /etc/security/pwquality.conf.d on Rocky Linux. The harness never changes a password: it connects with
  docker exec through the Docker API as root, without sshd, PAM, sudo or a login shell, so a password quality setting
  cannot cut it off, and the guard's connection test after every remediate run proves that it still reaches the same
  unprivileged container. The PAM stack (topic pam) is never touched, and the allow-list names pwquality only for the
  runs of this topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    ComplianceAsCode limits every pwquality rule to the system_with_kernel platform, which excludes containers, so a
    container audit reports them notapplicable whatever the configuration says. The main file and the drop-ins with
    their checksums under applied are the evidence. Each platform writes where its pinned content checks: the Ubuntu
    24.04 checks read only /etc/security/pwquality.conf, the RHEL 9 checks also every
    /etc/security/pwquality.conf.d/*.conf (tests/unit/tools/test_content_golden_native.py checks this against the OVAL
    of both datastreams).
state:
  files:
    - path: /etc/security/pwquality.conf
      rewritten: true
    - path: /etc/security/pwquality.conf.d
      rewritten: true
    - path: /etc/security/pwquality.conf.d/.freesecdev-created
