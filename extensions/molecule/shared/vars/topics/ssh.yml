---
family: ssh
disruptive: true
containment: >-
  ssh writes one drop-in per rule below /etc/ssh/sshd_config.d, which sshd reads first, and validates every
  change with sshd -t before it writes it. The harness never uses sshd: it connects with docker exec through the
  Docker API as root, without sshd, PAM or a login shell, so PermitRootLogin, MaxAuthTries or a cipher list
  cannot cut it off, and the guard's connection test after every remediate run proves that it still reaches the
  same unprivileged container. No sshd runs in the containers (no service manager), so nothing is reloaded; the
  images ship openssh-server with host keys so that sshd -t can test the configuration. The allow-list names ssh
  only for the runs of this topic.
audit:
  applied_outcomes:
    - notapplicable
  reason: >-
    The RHEL 9 datastream does not recognise Rocky Linux, so every rule is notapplicable there; on Ubuntu 24.04
    the sshd rules have no platform restriction and must pass. The drop-ins with their checksums under applied
    are the evidence on both platforms. Both pinned datastreams read /etc/ssh/sshd_config and every
    /etc/ssh/sshd_config.d/*.conf and require every occurrence to comply
    (tests/unit/tools/test_content_golden_ssh.py checks this against the OVAL of both datastreams).
