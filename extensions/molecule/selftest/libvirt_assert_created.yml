---
- name: Assert that create persisted one run and labelled its virtual machine, network and pool with it
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../shared/vars/libvirt.yml
  vars:
    selftest_scenario: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}"
    selftest_instances: "{{ lookup('ansible.builtin.file', molecule_instance_config) | from_yaml }}"
    selftest_record: "{{ selftest_instances | first }}"
    selftest_labels: >-
      xmlns:fsd="{{ molecule_libvirt_metadata_namespace | regex_escape }}">\s*<fsd:scenario>{{
      selftest_scenario | regex_escape }}</fsd:scenario>\s*<fsd:run>{{ selftest_record.run_id }}</fsd:run>
  tasks:
    - name: List every domain
      community.libvirt.virt:
        uri: qemu:///system
        command: list_vms
      register: selftest_domains

    - name: List every network
      community.libvirt.virt_net:
        uri: qemu:///system
        command: list_nets
      register: selftest_networks

    - name: List every pool
      community.libvirt.virt_pool:
        uri: qemu:///system
        command: list_pools
      register: selftest_pools

    - name: Read the definition of the recorded domain
      community.libvirt.virt:
        uri: qemu:///system
        name: "{{ selftest_record.domain }}"
        command: get_xml
      register: selftest_domain

    - name: Read the definition of the recorded network
      community.libvirt.virt_net:
        uri: qemu:///system
        name: "{{ selftest_record.network }}"
        command: get_xml
      register: selftest_network

    - name: Check that one run's domain, network and pool exist, carry its labels and match the instance config
      ansible.builtin.assert:
        that:
          - selftest_instances | length == 1
          - selftest_instances | map(attribute='driver') | unique | list == ['libvirt']
          - selftest_record.domain == 'fsd-mol-' ~ selftest_scenario ~ '-' ~ selftest_record.run_id ~ '-probe'
          - selftest_domains.list_vms | select('match', selftest_prefix) | list == [selftest_record.domain]
          - selftest_networks.list_nets | select('match', selftest_prefix) | list == [selftest_record.network]
          - selftest_pools.list_pools | select('match', selftest_prefix) | list == [selftest_record.pool]
          - selftest_domain.get_xml is search(selftest_labels)
          - selftest_network.get_xml is search(selftest_labels)
        fail_msg: >-
          A repeated create did not reuse one run, or its objects do not carry its labels: instance config
          {{ selftest_instances }}, domains {{ selftest_domains.list_vms | select('match', selftest_prefix) | list }},
          networks {{ selftest_networks.list_nets | select('match', selftest_prefix) | list }}, pools
          {{ selftest_pools.list_pools | select('match', selftest_prefix) | list }}.
        quiet: true
      vars:
        selftest_prefix: "^fsd-mol-{{ selftest_scenario | regex_escape }}-"
