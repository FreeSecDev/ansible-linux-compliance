---
- name: Prepare real bypass attempts against the guard
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    selftest_scenario: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}"
    selftest_instances: "{{ lookup('ansible.builtin.file', molecule_instance_config) | from_yaml }}"
    selftest_probe: "{{ selftest_instances | selectattr('instance', 'equalto', 'probe') | first }}"
    selftest_mounted_address: "fsd-mol-{{ selftest_scenario }}-{{ selftest_probe.run_id }}-mounted"
    selftest_docker: community.docker.docker
    selftest_inventories:
      good:
        probe:
          ansible_host: "{{ selftest_probe.address }}"
          ansible_connection: "{{ selftest_docker }}"
      docker_host:
        probe:
          ansible_host: "{{ selftest_probe.address }}"
          ansible_connection: "{{ selftest_docker }}"
          ansible_docker_host: "{{ selftest_mounted_address }}"
      extra_args:
        probe:
          ansible_host: "{{ selftest_probe.address }}"
          ansible_connection: "{{ selftest_docker }}"
          ansible_docker_extra_args: "--host tcp://192.0.2.1:2375"
      privileged:
        probe:
          ansible_host: "{{ selftest_probe.address }}"
          ansible_connection: "{{ selftest_docker }}"
          ansible_docker_privileged: true
      local:
        probe:
          ansible_host: localhost
          ansible_connection: local
      localhost:
        localhost:
          ansible_connection: "{{ selftest_docker }}"
      loopback:
        probe:
          ansible_host: 127.0.0.1
          ansible_connection: "{{ selftest_docker }}"
      unknown:
        probe:
          ansible_host: "fsd-mol-{{ selftest_scenario }}-{{ selftest_probe.run_id }}-stranger"
          ansible_connection: "{{ selftest_docker }}"
      mounted:
        mounted:
          ansible_host: "{{ selftest_mounted_address }}"
          ansible_connection: "{{ selftest_docker }}"
  tasks:
    - name: Inspect the probe instance that the create step started
      community.docker.docker_container_info:
        name: "{{ selftest_probe.address }}"
      register: selftest_probe_info

    - name: Start a container of this run that has a host bind mount
      community.docker.docker_container:
        name: "{{ selftest_mounted_address }}"
        image: "{{ selftest_probe_info.container.Config.Image }}"
        pull: never
        state: started
        entrypoint:
          - sleep
          - infinity
        init: true
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        network_mode: none
        volumes:
          - "{{ molecule_selftest_dir }}/host-directory:/host:ro"
        labels: "{{ selftest_probe_info.container.Config.Labels }}"
        env:
          FREESECDEV_MOLECULE_MARKER: "{{ selftest_probe.marker }}"

    - name: Write the instance config that records the mounted container
      ansible.builtin.copy:
        content: >-
          {{ (selftest_instances + [selftest_probe | combine({'instance': 'mounted',
          'address': selftest_mounted_address})]) | to_nice_yaml }}
        dest: "{{ molecule_selftest_dir }}/instance_config_mounted.yml"
        mode: "0600"

    - name: Write one inventory per bypass attempt
      ansible.builtin.copy:
        content: "{{ {'all': {'hosts': item.value}} | to_nice_yaml }}"
        dest: "{{ molecule_selftest_dir }}/{{ item.key }}.yml"
        mode: "0600"
      loop: "{{ selftest_inventories | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
