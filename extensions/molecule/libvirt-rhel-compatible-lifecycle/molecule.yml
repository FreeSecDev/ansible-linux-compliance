---
ansible:
  cfg:
    defaults:
      host_key_checking: true
      remote_tmp: /tmp/.ansible-molecule
      stdout_callback: ansible.builtin.default
      result_format: yaml
      fact_caching: memory
    ssh_connection:
      pipelining: true
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --extra-vars=ansible_become=false
  playbooks:
    create: ../shared/create_libvirt.yml
    prepare: ../shared/prepare.yml
    side_effect: ../shared/lifecycle.yml
    destroy: ../shared/destroy_libvirt.yml

driver:
  name: default
  options:
    managed: true
  ssh_connection_options:
    - -F /dev/null
    - -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/libvirt/known_hosts
    - -o StrictHostKeyChecking=yes
    - -o IdentitiesOnly=yes
    - -o ControlMaster=auto
    - -o ControlPersist=60s
    - -o ForwardAgent=no
    - -o ForwardX11=no
    - -o LogLevel=ERROR

platforms:
  - name: rhel9-compatible
    image: rhel_compatible
    memory_mib: 4096
    vcpus: 2
    disk_gib: 12

scenario:
  name: libvirt-rhel-compatible-lifecycle
  test_sequence:
    - create
    - prepare
    - side_effect
    - destroy
