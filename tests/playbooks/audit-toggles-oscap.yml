---
- name: Audit role with oscap | A whole topic and one rule are switched off in the real scan
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    audit_toggles_profile: cis_level2_server
    audit_toggles_rule: xccdf_org.ssgproject.content_rule_file_permissions_crontab
    audit_toggles_rule_toggle: linux_compliance_rule_file_permissions_crontab_enabled
    audit_toggles_topic_toggle: linux_compliance_auditd_enabled
    audit_toggles_catalogue: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/remediate/vars/rules.yml')
         | ansible.builtin.from_yaml }}
    audit_toggles_auditd_families: >-
      {{ ['auditd'] + (audit_toggles_catalogue.__linux_compliance_remediate_families
                       | selectattr('umbrella', 'defined') | selectattr('umbrella', 'equalto', 'auditd')
                       | map(attribute='name') | list) }}
    audit_toggles_require: "{{ lookup('ansible.builtin.env', 'FREESECDEV_REQUIRE_OSCAP') == '1' }}"
    audit_toggles_manifest: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../content/manifest.yml') | ansible.builtin.from_yaml }}
    audit_toggles_stream: >-
      {{ audit_toggles_manifest.datastreams | selectattr('name', 'equalto', 'ubuntu2404') | first }}
    audit_toggles_file_name: "{{ audit_toggles_stream.path | basename }}"
    audit_toggles_source: "{{ playbook_dir }}/../../build/content/{{ audit_toggles_file_name }}"
    linux_compliance_auditd_enabled: false
    linux_compliance_rule_file_permissions_crontab_enabled: false
  tasks:
    - name: Look for the pinned oscap binary
      ansible.builtin.stat:
        path: /usr/bin/oscap
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: audit_toggles_oscap

    - name: Fail when oscap is required but missing
      ansible.builtin.assert:
        that:
          - audit_toggles_oscap.stat.exists or not audit_toggles_require
        fail_msg: /usr/bin/oscap is missing but FREESECDEV_REQUIRE_OSCAP=1.
        quiet: true

    - name: Skip the real audit when oscap is not installed
      ansible.builtin.meta: end_play
      when: not audit_toggles_oscap.stat.exists

    - name: Look for the fetched pinned datastream
      ansible.builtin.stat:
        path: "{{ audit_toggles_source }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: audit_toggles_source_stat

    - name: Fail when the pinned datastream was not fetched
      ansible.builtin.assert:
        that:
          - audit_toggles_source_stat.stat.isreg | default(false)
        fail_msg: "{{ audit_toggles_source }} is missing; run make test-oscap-integration."
        quiet: true

    - name: Audit a root-owned copy of the pinned content with the topic toggle off
      block:
        - name: Create a root-owned working directory
          ansible.builtin.tempfile:
            state: directory
            prefix: freesecdev-audit-toggles-
          become: true
          register: audit_toggles_dir

        - name: Make the working directory and the content directory root-owned and traversable
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true
          loop:
            - "{{ audit_toggles_dir.path }}"
            - "{{ audit_toggles_dir.path }}/content"

        - name: Copy the pinned datastream into the content directory
          ansible.builtin.copy:
            src: "{{ audit_toggles_source }}"
            dest: "{{ audit_toggles_dir.path }}/content/{{ audit_toggles_file_name }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          become: true

        - name: Discover the pinned content
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.discover
          vars:
            linux_compliance_discover_profile: "{{ audit_toggles_profile }}"
            linux_compliance_discover_content_path: "{{ audit_toggles_dir.path }}/content/{{ audit_toggles_file_name }}"
            linux_compliance_discover_content_sha256: "{{ audit_toggles_stream.sha256 }}"

        - name: Run the audit role with the auditd topic and the crontab rule off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
          vars:
            linux_compliance_audit_profile: "{{ audit_toggles_profile }}"
            linux_compliance_audit_output_dir: "{{ audit_toggles_dir.path }}/evidence"

        - name: Check that every auditd rule of the profile and the crontab rule came back disabled
          vars:
            audit_toggles_auditd: >-
              {{ ((audit_toggles_auditd_families
                   | map('extract', audit_toggles_catalogue.__linux_compliance_remediate_audit_only)
                   | map('default', []) | ansible.builtin.flatten)
                  + (audit_toggles_catalogue.__linux_compliance_remediate_rules
                     | selectattr('family', 'in', audit_toggles_auditd_families)
                     | map(attribute='rule_id') | list))
                 | select('in', linux_compliance_discovered.rule_ids) | sort }}
            audit_toggles_auditd_findings: >-
              {{ linux_compliance_audited.scan_run.findings
                 | selectattr('rule_id', 'in', audit_toggles_auditd) | list }}
            audit_toggles_rule_findings: >-
              {{ linux_compliance_audited.scan_run.findings
                 | selectattr('rule_id', 'equalto', audit_toggles_rule) | list }}
            audit_toggles_by_topic: >-
              {{ linux_compliance_audited.disabled_rules
                 | selectattr('disabled_by', 'equalto', audit_toggles_topic_toggle) | list }}
          ansible.builtin.assert:
            that:
              - audit_toggles_rule in linux_compliance_discovered.rule_ids
              - linux_compliance_audited.run_status == 'completed'
              - audit_toggles_auditd | length > 0
              - audit_toggles_auditd_findings | length == audit_toggles_auditd | length
              - audit_toggles_auditd_findings | map(attribute='outcome') | unique | list == ['disabled']
              - >-
                audit_toggles_auditd_findings | map(attribute='disabled_by') | unique | list
                == [audit_toggles_topic_toggle]
              - audit_toggles_topic_toggle in audit_toggles_auditd_findings[0].message
              - audit_toggles_rule_findings | length == 1
              - audit_toggles_rule_findings[0].outcome == 'disabled'
              - audit_toggles_rule_findings[0].disabled_by == audit_toggles_rule_toggle
              - >-
                linux_compliance_audited.disabled_rules | map(attribute='rule_id') | sort
                == (audit_toggles_auditd + [audit_toggles_rule]) | sort
              - audit_toggles_by_topic | map(attribute='rule_id') | sort == audit_toggles_auditd
              - >-
                linux_compliance_audited.disabled_rules
                | selectattr('rule_id', 'equalto', audit_toggles_rule) | map(attribute='disabled_by') | list
                == [audit_toggles_rule_toggle]
              - linux_compliance_audited.summary.disabled == audit_toggles_auditd | length + 1
              - >-
                linux_compliance_audited.scan_run.findings
                | selectattr('outcome', 'equalto', 'disabled') | list | length
                == audit_toggles_auditd | length + 1
            quiet: true

        - name: Report the number of auditd rules that the topic toggle disabled
          ansible.builtin.debug:
            msg: >-
              {{ linux_compliance_audited.scan_run.findings
                 | selectattr('disabled_by', 'equalto', audit_toggles_topic_toggle) | list | length }}
              auditd rule(s) of {{ audit_toggles_profile }} disabled by {{ audit_toggles_topic_toggle }}

        - name: Report the finding of the disabled rule
          ansible.builtin.debug:
            msg: >-
              {{ linux_compliance_audited.scan_run.findings
                 | selectattr('rule_id', 'equalto', audit_toggles_rule) | first }}
      always:
        - name: Remove the working directory with the content copy and the evidence
          ansible.builtin.file:
            path: "{{ audit_toggles_dir.path }}"
            state: absent
          become: true
          when: audit_toggles_dir.path is defined
