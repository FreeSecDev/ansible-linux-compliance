---
- name: Remediate role in check mode | Nothing happens without the opt-in
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Inspect the crontab before the role runs
      ansible.builtin.stat:
        path: /etc/crontab
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: crontab_before

    - name: Run the remediate role with its defaults
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate

    - name: Inspect the crontab after the role ran
      ansible.builtin.stat:
        path: /etc/crontab
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: crontab_after

    - name: Check that every rule was skipped and nothing was touched
      ansible.builtin.assert:
        that:
          - linux_compliance_remediated.enabled is false
          - linux_compliance_remediated.check_mode is true
          - linux_compliance_remediated.results == []
          - linux_compliance_remediated.rules | map(attribute='action') | unique == ['skip']
          - linux_compliance_remediated.rules | map(attribute='reason') | unique == ['remediation_disabled']
          - linux_compliance_remediated.summary.apply == 0
          - linux_compliance_remediated.summary.cleanup == 0
          - __linux_compliance_remediate_ledger is skipped
          - __linux_compliance_remediate_discover_check is skipped
          - crontab_after.stat.exists == crontab_before.stat.exists
          - crontab_after.stat.mode | default('') == crontab_before.stat.mode | default('')
          - crontab_after.stat.ctime | default(0) == crontab_before.stat.ctime | default(0)
        quiet: true

- name: Remediate role in check mode | The reference rule is planned and nothing changes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Inspect the crontab before the role runs
      ansible.builtin.stat:
        path: /etc/crontab
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: crontab_before

    - name: Run the remediate role with the opt-in
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate

    - name: Inspect the crontab after the role ran
      ansible.builtin.stat:
        path: /etc/crontab
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: crontab_after

    - name: Check the plan, the reported result and that the host is unchanged
      vars:
        crontab_result: "{{ linux_compliance_remediated.results | first }}"
        applied: "{{ linux_compliance_remediated.rules | selectattr('action', 'equalto', 'apply') | list }}"
        crontab_rule: xccdf_org.ssgproject.content_rule_file_permissions_crontab
      ansible.builtin.assert:
        that:
          - linux_compliance_remediated.enabled is true
          - linux_compliance_remediated.rules | length > 1000
          - applied | map(attribute='rule_id') | list == [crontab_rule]
          - linux_compliance_remediated.summary.not_implemented == 0
          - >-
            linux_compliance_remediated.rules | rejectattr('action', 'equalto', 'apply')
            | map(attribute='reason') | unique | list == ['not_in_profile']
          - linux_compliance_remediated.results | length == 1
          - crontab_result.action == 'apply'
          - crontab_result.status in ['applied', 'compliant', 'notapplicable', 'not_regular_file']
          - crontab_result.changed == (crontab_result.status == 'applied')
          - crontab_after.stat.exists == crontab_before.stat.exists
          - crontab_after.stat.mode | default('') == crontab_before.stat.mode | default('')
          - crontab_after.stat.ctime | default(0) == crontab_before.stat.ctime | default(0)
        quiet: true

- name: Toggles in check mode | One rule switched off is not applied and the audit disables it
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_rule_file_permissions_crontab_enabled: false
    crontab_rule: xccdf_org.ssgproject.content_rule_file_permissions_crontab
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
        - xccdf_org.ssgproject.content_rule_site_custom_check
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Run the remediate role with the rule toggle off
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate

    - name: Resolve the disabled rules with the audit role
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.audit
        tasks_from: toggles.yml

    - name: Check that the rule toggle controls both roles
      vars:
        planned: "{{ linux_compliance_remediated.rules | selectattr('rule_id', 'equalto', crontab_rule) | first }}"
        expected:
          - rule_id: "{{ crontab_rule }}"
            disabled_by: linux_compliance_rule_file_permissions_crontab_enabled
      ansible.builtin.assert:
        that:
          - planned.action in ['none', 'cleanup']
          - planned.reason == 'disabled_by_toggle'
          - planned.disabled_by == 'linux_compliance_rule_file_permissions_crontab_enabled'
          - linux_compliance_remediated.results | selectattr('action', 'equalto', 'apply') | list == []
          - linux_compliance_remediated.disabled_rules == expected
          - __linux_compliance_audit_toggles.errors == []
          - __linux_compliance_audit_toggles.disabled_rules == expected
        quiet: true

- name: Toggles in check mode | A whole topic switched off turns off its rules in both roles
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_file_permissions_enabled: false
    crontab_rule: xccdf_org.ssgproject.content_rule_file_permissions_crontab
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
        - xccdf_org.ssgproject.content_rule_site_custom_check
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Run the remediate role with the topic toggle off and the generated rule default
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate

    - name: Resolve the disabled rules with the audit role, which has no toggle defaults
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.audit
        tasks_from: toggles.yml

    - name: Check that the topic toggle controls both roles and is named as the cause
      vars:
        planned: "{{ linux_compliance_remediated.rules | selectattr('rule_id', 'equalto', crontab_rule) | first }}"
        expected:
          - rule_id: "{{ crontab_rule }}"
            disabled_by: linux_compliance_file_permissions_enabled
      ansible.builtin.assert:
        that:
          - planned.action in ['none', 'cleanup']
          - planned.reason == 'disabled_by_toggle'
          - planned.disabled_by == 'linux_compliance_file_permissions_enabled'
          - linux_compliance_remediated.results | selectattr('action', 'equalto', 'apply') | list == []
          - linux_compliance_remediated.disabled_rules == expected
          - __linux_compliance_audit_toggles.disabled_rules == expected
        quiet: true

    - name: Switch the rule back on inside the disabled topic
      vars:
        linux_compliance_rule_file_permissions_crontab_enabled: true
      block:
        - name: Run the remediate role with the rule toggle on
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Resolve the disabled rules with the audit role again
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Check that the rule toggle wins over the topic toggle in both roles
          vars:
            planned: "{{ linux_compliance_remediated.rules | selectattr('rule_id', 'equalto', crontab_rule) | first }}"
          ansible.builtin.assert:
            that:
              - planned.action == 'apply'
              - planned.disabled_by is none
              - linux_compliance_remediated.disabled_rules == []
              - __linux_compliance_audit_toggles.disabled_rules == []
            quiet: true

- name: Toggles in check mode | The audit fails closed on invalid toggles and keeps explicit entries
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
        - xccdf_org.ssgproject.content_rule_site_custom_check
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Combine an explicit entry for an uncatalogued rule with a topic toggle
      vars:
        linux_compliance_file_permissions_enabled: false
        linux_compliance_audit_disabled_rules:
          - rule_id: xccdf_org.ssgproject.content_rule_site_custom_check
      block:
        - name: Resolve the disabled rules with the audit role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Check that both rules are disabled, the explicit one as given
          ansible.builtin.assert:
            that:
              - >-
                __linux_compliance_audit_toggles.disabled_rules == [
                  {'rule_id': 'xccdf_org.ssgproject.content_rule_file_permissions_crontab',
                   'disabled_by': 'linux_compliance_file_permissions_enabled'},
                  {'rule_id': 'xccdf_org.ssgproject.content_rule_site_custom_check'}]
            quiet: true

    - name: Try the likely typo linux_compliance_audit_enabled for the auditd topic
      vars:
        linux_compliance_audit_enabled: false
      block:
        - name: Resolve the disabled rules with the typo
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Fail because the typo was accepted
          ansible.builtin.fail:
            msg: The audit role accepted linux_compliance_audit_enabled.
      rescue:
        - name: Check that the typo was refused before any scan
          ansible.builtin.assert:
            that:
              - "'linux_compliance_audit_enabled' in ansible_failed_result.msg"
              - "'nothing was scanned' in ansible_failed_result.msg"
            quiet: true

    - name: Try a toggle that is a string instead of a boolean
      vars:
        linux_compliance_file_permissions_enabled: "false"
      block:
        - name: Resolve the disabled rules with a string toggle
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Fail because the string toggle was accepted
          ansible.builtin.fail:
            msg: The audit role accepted a string toggle.
      rescue:
        - name: Check that the string toggle was refused
          ansible.builtin.assert:
            that:
              - "'linux_compliance_file_permissions_enabled must be a boolean' in ansible_failed_result.msg"
            quiet: true

    - name: Try to disable a catalogued rule through the explicit audit list
      vars:
        linux_compliance_audit_disabled_rules:
          - rule_id: xccdf_org.ssgproject.content_rule_file_permissions_crontab
      block:
        - name: Resolve the disabled rules with a catalogued explicit entry
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Fail because the catalogued explicit entry was accepted
          ansible.builtin.fail:
            msg: The audit role skipped a catalogued rule that remediation would still apply.
      rescue:
        - name: Check that the toggle was named instead
          ansible.builtin.assert:
            that:
              - "'linux_compliance_rule_file_permissions_crontab_enabled' in ansible_failed_result.msg"
            quiet: true

- name: Toggles in check mode | Both roles agree on copied defaults and warn about empty topics
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    crontab_rule: xccdf_org.ssgproject.content_rule_file_permissions_crontab
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
        - xccdf_org.ssgproject.content_rule_site_custom_check
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Copy the generated rule default into the inventory without the family toggle
      vars:
        linux_compliance_rule_file_permissions_crontab_enabled: "{{ linux_compliance_file_permissions_enabled }}"
      block:
        - name: Resolve the disabled rules with the audit role, which carries the same defaults
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Run the remediate role with the copied default
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Check that both roles resolve the copied default from the family default
          vars:
            planned: "{{ linux_compliance_remediated.rules | selectattr('rule_id', 'equalto', crontab_rule) | first }}"
          ansible.builtin.assert:
            that:
              - __linux_compliance_audit_toggles.errors == []
              - __linux_compliance_audit_toggles.disabled_rules == []
              - planned.action == 'apply'
              - linux_compliance_remediated.disabled_rules == []
            quiet: true

    - name: Switch off a topic that has no catalogued rule in the profile
      vars:
        linux_compliance_auditd_enabled: false
      block:
        - name: Resolve the disabled rules with the audit role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Run the remediate role with the empty topic switched off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Check that both roles warn that the topic toggle excludes nothing
          vars:
            warning_prefix: "WARNING: linux_compliance_auditd_enabled is false"
            remediate_warnings: >-
              {{ linux_compliance_remediated.notices | select('match', warning_prefix) | list }}
          ansible.builtin.assert:
            that:
              - __linux_compliance_audit_toggles.disabled_rules == []
              - __linux_compliance_audit_toggles.warnings | length == 1
              - __linux_compliance_audit_toggles.warnings[0] is match(warning_prefix)
              - "'so it excludes nothing' in __linux_compliance_audit_toggles.warnings[0]"
              - remediate_warnings | length == 1
            quiet: true

    - name: Switch off a topic that does exclude a rule
      vars:
        linux_compliance_file_permissions_enabled: false
      block:
        - name: Resolve the disabled rules with the audit role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml

        - name: Check that no warning is printed for an effective topic toggle
          ansible.builtin.assert:
            that:
              - __linux_compliance_audit_toggles.warnings == []
              - __linux_compliance_audit_toggles.disabled_rules | length == 1
            quiet: true

- name: Remediate role in check mode | Invalid toggles and allow-list entries fail closed
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Try an unknown rule toggle
      vars:
        linux_compliance_rule_typo_enabled: false
      block:
        - name: Run the remediate role with an unknown rule toggle
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the unknown toggle was accepted
          ansible.builtin.fail:
            msg: An unknown rule toggle was accepted.
      rescue:
        - name: Check that the unknown rule toggle was named
          ansible.builtin.assert:
            that:
              - "'linux_compliance_rule_typo_enabled' in ansible_failed_result.msg"
              - "'is not the toggle of a catalogued rule' in ansible_failed_result.msg"
            quiet: true

    - name: Try an unknown family toggle
      vars:
        linux_compliance_sshd_enabled: false
      block:
        - name: Run the remediate role with an unknown family toggle
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the unknown toggle was accepted
          ansible.builtin.fail:
            msg: An unknown family toggle was accepted.
      rescue:
        - name: Check that the unknown family toggle was named
          ansible.builtin.assert:
            that:
              - "'linux_compliance_sshd_enabled' in ansible_failed_result.msg"
              - "'is not the toggle of a catalogued family' in ansible_failed_result.msg"
            quiet: true

    - name: Try a toggle that is a string instead of a boolean
      vars:
        linux_compliance_file_permissions_enabled: "false"
      block:
        - name: Run the remediate role with a string toggle
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the string toggle was accepted
          ansible.builtin.fail:
            msg: A string toggle was accepted.
      rescue:
        - name: Check that the string toggle was refused
          ansible.builtin.assert:
            that:
              - "'linux_compliance_file_permissions_enabled must be a boolean' in ansible_failed_result.msg"
            quiet: true

    - name: Try an allow-list entry that is not a disruptive family
      vars:
        linux_compliance_remediate_allow_disruptive:
          - file_permissions
      block:
        - name: Run the remediate role with an invalid allow-list
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the invalid allow-list was accepted
          ansible.builtin.fail:
            msg: An invalid allow-list entry was accepted.
      rescue:
        - name: Check that the argument specification refused the entry
          ansible.builtin.assert:
            that:
              - "'linux_compliance_remediate_allow_disruptive' in ansible_failed_result.msg"
              - "'file_permissions' in ansible_failed_result.msg"
            quiet: true

    - name: Try a discovered profile that selects no rule
      vars:
        linux_compliance_discovered:
          profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
          rule_ids: []
      block:
        - name: Run the remediate role with an empty profile
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the empty profile was accepted
          ansible.builtin.fail:
            msg: An empty profile was accepted, which would clean up every applied rule.
      rescue:
        - name: Check that the empty profile was refused
          ansible.builtin.assert:
            that:
              - "'Run the freesecdev.linux_compliance.discover role first' in ansible_failed_result.msg"
            quiet: true

    - name: Try a profile that differs from the discovered one
      vars:
        linux_compliance_discovered:
          profile_id: xccdf_org.ssgproject.content_profile_cis_level2_server
          rule_ids:
            - xccdf_org.ssgproject.content_rule_file_permissions_crontab
      block:
        - name: Run the remediate role for another profile than the discovered one
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the profile mismatch was accepted
          ansible.builtin.fail:
            msg: A profile mismatch was accepted.
      rescue:
        - name: Check that the profile mismatch was refused
          ansible.builtin.assert:
            that:
              - "'Run the freesecdev.linux_compliance.discover role first' in ansible_failed_result.msg"
            quiet: true

- name: Full catalogue in check mode | One topic toggle switches off every rule of the topic in both roles
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_auditd_enabled: false
    auditd_toggle: linux_compliance_auditd_enabled
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Load the generated catalogue
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/remediate/vars/rules.yml"
        name: full_catalogue

    - name: Describe a discovered profile that selects every catalogued rule, without a fact
      ansible.builtin.set_fact:
        auditd_rules: "{{ full_catalogue.__linux_compliance_remediate_audit_only.auditd }}"
        full_profile:
          profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
          rule_ids: >-
            {{ (full_catalogue.__linux_compliance_remediate_rules | map(attribute='rule_id') | list)
               + (full_catalogue.__linux_compliance_remediate_audit_only | ansible.builtin.dict2items
                  | map(attribute='value') | ansible.builtin.flatten) }}

    - name: Run the remediate role with the auditd topic off
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate
      vars:
        linux_compliance_discovered: "{{ full_profile }}"

    - name: Resolve the disabled rules with the audit role
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.audit
        tasks_from: toggles.yml
      vars:
        linux_compliance_discovered: "{{ full_profile }}"

    - name: Check that every auditd rule is off in both roles and names the topic toggle
      vars:
        planned_auditd: >-
          {{ linux_compliance_remediated.rules | selectattr('family', 'equalto', 'auditd') | list }}
        audit_disabled: "{{ __linux_compliance_audit_toggles.disabled_rules }}"
      ansible.builtin.assert:
        that:
          - auditd_rules | length > 100
          - planned_auditd | length == auditd_rules | length
          - planned_auditd | map(attribute='action') | unique | list == ['none']
          - planned_auditd | map(attribute='reason') | unique | list == ['disabled_by_toggle']
          - planned_auditd | map(attribute='disabled_by') | unique | list == [auditd_toggle]
          - audit_disabled | map(attribute='rule_id') | sort == auditd_rules | sort
          - audit_disabled | map(attribute='disabled_by') | unique | list == [auditd_toggle]
          - linux_compliance_remediated.disabled_rules == audit_disabled
          - __linux_compliance_audit_toggles.warnings == []
          - linux_compliance_remediated.notices | select('match', 'WARNING:') | list == []
          - >-
            linux_compliance_remediated.results | selectattr('family', 'equalto', 'auditd') | list == []
        quiet: true

- name: Full catalogue in check mode | An umbrella toggle switches off every family it groups in both roles
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_remediate_allow_disruptive:
      - services
    umbrella_toggle: linux_compliance_services_enabled
    sssd_toggle: linux_compliance_sssd_enabled
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Load the generated catalogue
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/remediate/vars/rules.yml"
        name: full_catalogue

    - name: Describe the services umbrella and a discovered profile that selects every catalogued rule
      ansible.builtin.set_fact:
        services_families: >-
          {{ full_catalogue.__linux_compliance_remediate_families | selectattr('umbrella', 'defined')
             | selectattr('umbrella', 'equalto', 'services') | map(attribute='name') | list }}
        full_profile:
          profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
          rule_ids: >-
            {{ (full_catalogue.__linux_compliance_remediate_rules | map(attribute='rule_id') | list)
               + (full_catalogue.__linux_compliance_remediate_audit_only | ansible.builtin.dict2items
                  | map(attribute='value') | ansible.builtin.flatten) }}

    - name: Collect the rules of the services umbrella and of the sssd family, and the rules tagged with them
      ansible.builtin.set_fact:
        services_rules: >-
          {{ services_families | map('extract', full_catalogue.__linux_compliance_remediate_audit_only)
             | ansible.builtin.flatten }}
        services_tagged: >-
          {{ services_families | select('in', full_catalogue.__linux_compliance_remediate_tags)
             | map('extract', full_catalogue.__linux_compliance_remediate_tags) | ansible.builtin.flatten
             | ansible.builtin.unique }}
        sssd_rules: "{{ full_catalogue.__linux_compliance_remediate_audit_only.sssd }}"
        sssd_tagged: "{{ full_catalogue.__linux_compliance_remediate_tags.sssd }}"

    - name: Switch the umbrella off and try to switch the sssd family back on
      vars:
        linux_compliance_services_enabled: false
        linux_compliance_sssd_enabled: true
      block:
        - name: Run the remediate role with the services umbrella off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Resolve the disabled rules with the audit role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Check that every rule of the umbrella and every rule tagged with its families is off and names it
          vars:
            planned: >-
              {{ linux_compliance_remediated.rules | selectattr('rule_id', 'in', services_rules + services_tagged)
                 | list }}
            audit_disabled: "{{ __linux_compliance_audit_toggles.disabled_rules }}"
          ansible.builtin.assert:
            that:
              - >-
                services_families | sort
                == ['cron', 'fapolicyd', 'mail', 'network_services', 'nfs', 'sssd', 'time_sync', 'usbguard']
              - services_rules | length == 119
              - services_tagged | length == 36
              - services_tagged | ansible.builtin.intersect(services_rules) | length == 0
              - "'xccdf_org.ssgproject.content_rule_file_permissions_crontab' in services_tagged"
              - planned | length == 155
              - planned | map(attribute='action') | unique | list == ['none']
              - planned | map(attribute='reason') | unique | list == ['disabled_by_toggle']
              - planned | map(attribute='disabled_by') | unique | list == [umbrella_toggle]
              - audit_disabled | map(attribute='rule_id') | sort == (services_rules + services_tagged) | sort
              - audit_disabled | map(attribute='disabled_by') | unique | list == [umbrella_toggle]
              - linux_compliance_remediated.disabled_rules == audit_disabled
              - __linux_compliance_audit_toggles.warnings == []
              - linux_compliance_remediated.notices | select('match', 'WARNING:') | list == []
            quiet: true

    - name: Keep the umbrella on and switch only the sssd family off
      vars:
        linux_compliance_services_enabled: true
        linux_compliance_sssd_enabled: false
      block:
        - name: Run the remediate role with only the sssd family off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Resolve the disabled rules with the audit role again
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Check that the family toggle narrows the umbrella to exactly the sssd rules and the sssd log files
          vars:
            audit_disabled: "{{ __linux_compliance_audit_toggles.disabled_rules }}"
          ansible.builtin.assert:
            that:
              - sssd_rules | length > 10
              - >-
                sssd_tagged | sort == ['xccdf_org.ssgproject.content_rule_file_groupownerships_var_log_sssd',
                'xccdf_org.ssgproject.content_rule_file_ownerships_var_log_sssd',
                'xccdf_org.ssgproject.content_rule_file_permissions_var_log_sssd']
              - audit_disabled | map(attribute='rule_id') | sort == (sssd_rules + sssd_tagged) | sort
              - audit_disabled | map(attribute='disabled_by') | unique | list == [sssd_toggle]
              - linux_compliance_remediated.disabled_rules == audit_disabled
            quiet: true

    - name: Switch cron and time synchronisation off, and with them their file permission rules
      vars:
        linux_compliance_cron_enabled: false
        linux_compliance_time_sync_enabled: false
      block:
        - name: Run the remediate role with cron and time_sync off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Resolve the disabled rules with the audit role with cron and time_sync off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Check that the native crontab rule, cron.deny, at.deny and the chrony keys follow their subsystem
          vars:
            audit_disabled: >-
              {{ __linux_compliance_audit_toggles.disabled_rules
                 | ansible.builtin.items2dict(key_name='rule_id', value_name='disabled_by') }}
            crontab: >-
              {{ linux_compliance_remediated.rules
                 | selectattr('rule_id', 'equalto', 'xccdf_org.ssgproject.content_rule_file_permissions_crontab')
                 | first }}
          ansible.builtin.assert:
            that:
              - crontab.family == 'file_permissions'
              - crontab.action == 'none'
              - crontab.reason == 'disabled_by_toggle'
              - crontab.disabled_by == 'linux_compliance_cron_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_file_permissions_crontab']
                == 'linux_compliance_cron_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_file_owner_cron_deny']
                == 'linux_compliance_cron_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_file_groupowner_at_deny']
                == 'linux_compliance_cron_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_file_permissions_etc_chrony_keys']
                == 'linux_compliance_time_sync_enabled'
              - "'xccdf_org.ssgproject.content_rule_audit_rules_etc_cron_d' not in audit_disabled"
              - "'xccdf_org.ssgproject.content_rule_aide_periodic_cron_checking' not in audit_disabled"
              - audit_disabled | length == 7 + 30 + 19 + 3
              - >-
                linux_compliance_remediated.disabled_rules
                | ansible.builtin.items2dict(key_name='rule_id', value_name='disabled_by')
                == audit_disabled
            quiet: true

    - name: Switch smart cards, AppArmor and SELinux off
      vars:
        linux_compliance_smartcard_enabled: false
        linux_compliance_apparmor_enabled: false
        linux_compliance_selinux_enabled: false
        linux_compliance_pwhistory_enabled: false
      block:
        - name: Run the remediate role with smartcard, apparmor, selinux and pwhistory off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Resolve the disabled rules with the audit role with smartcard, apparmor, selinux and pwhistory off
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.audit
            tasks_from: toggles.yml
          vars:
            linux_compliance_discovered: "{{ full_profile }}"

        - name: Check the smart card rules of SSSD and GNOME, pam_unix remember and the audit watches on MAC
          vars:
            audit_disabled: >-
              {{ __linux_compliance_audit_toggles.disabled_rules
                 | ansible.builtin.items2dict(key_name='rule_id', value_name='disabled_by') }}
          ansible.builtin.assert:
            that:
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_sssd_enable_smartcards']
                == 'linux_compliance_smartcard_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_dconf_gnome_lock_screen_on_smartcard_removal']
                == 'linux_compliance_smartcard_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_accounts_password_pam_unix_remember']
                == 'linux_compliance_pwhistory_enabled'
              - >-
                audit_disabled['xccdf_org.ssgproject.content_rule_accounts_password_pam_unix_no_remember']
                == 'linux_compliance_pwhistory_enabled'
              - "'xccdf_org.ssgproject.content_rule_audit_rules_mac_modification' not in audit_disabled"
              - "'xccdf_org.ssgproject.content_rule_audit_rules_mac_modification_etc_apparmor' not in audit_disabled"
              - "'xccdf_org.ssgproject.content_rule_audit_rules_mac_modification_etc_apparmor_d' not in audit_disabled"
              - >-
                linux_compliance_remediated.disabled_rules
                | ansible.builtin.items2dict(key_name='rule_id', value_name='disabled_by')
                == audit_disabled
            quiet: true

- name: Full catalogue in check mode | Rules without a native remediation are reported, never remediated
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_remediate_allow_disruptive:
      - ssh
    crontab_rule: xccdf_org.ssgproject.content_rule_file_permissions_crontab
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Load the generated catalogue
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/remediate/vars/rules.yml"
        name: full_catalogue

    - name: Describe a discovered profile that selects every catalogued rule, without a fact
      ansible.builtin.set_fact:
        audit_only_rules: >-
          {{ full_catalogue.__linux_compliance_remediate_audit_only | ansible.builtin.dict2items
             | map(attribute='value') | ansible.builtin.flatten }}
        full_profile:
          profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
          rule_ids: >-
            {{ (full_catalogue.__linux_compliance_remediate_rules | map(attribute='rule_id') | list)
               + (full_catalogue.__linux_compliance_remediate_audit_only | ansible.builtin.dict2items
                  | map(attribute='value') | ansible.builtin.flatten) }}

    - name: Run the remediate role with an allow-listed family that has only audit_only rules
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate
      vars:
        linux_compliance_discovered: "{{ full_profile }}"

    - name: Check that every audit_only rule is not_implemented and nothing claims a remediation
      vars:
        not_implemented: >-
          {{ linux_compliance_remediated.results | selectattr('status', 'equalto', 'not_implemented') | list }}
        native_results: >-
          {{ linux_compliance_remediated.results | rejectattr('status', 'equalto', 'not_implemented') | list }}
      ansible.builtin.assert:
        that:
          - audit_only_rules | length > 1000
          - linux_compliance_remediated.summary.not_implemented == audit_only_rules | length
          - linux_compliance_remediated.summary.apply == 1
          - not_implemented | map(attribute='rule_id') | sort == audit_only_rules | sort
          - not_implemented | map(attribute='action') | unique | list == ['not_implemented']
          - not_implemented | map(attribute='changed') | unique | list == [false]
          - native_results | map(attribute='rule_id') | list == [crontab_rule]
          - __linux_compliance_remediate_plan.families | map(attribute='name') | list == ['file_permissions']
          - >-
            linux_compliance_remediated.rules | selectattr('family', 'equalto', 'ssh')
            | map(attribute='action') | unique | list == ['not_implemented']
          - >-
            linux_compliance_remediated.notices
            | select('search', 'have no native remediation in this collection version') | list | length == 1
        quiet: true

- name: Remediate role in check mode | A catalogue that the play sets is refused before any change
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
        - xccdf_org.ssgproject.content_rule_sshd_disable_root_login
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Add a synthetic disruptive rule whose family has no task file
      ansible.builtin.set_fact:
        __linux_compliance_remediate_rules:
          - rule_id: xccdf_org.ssgproject.content_rule_file_permissions_crontab
            family: file_permissions
            disruptive: false
            reversible: true
            revert_strategy: recorded_value
            toggle: linux_compliance_rule_file_permissions_crontab_enabled
            runbook: null
            parameters:
              path: /etc/crontab
              max_mode: "0600"
          - rule_id: xccdf_org.ssgproject.content_rule_sshd_disable_root_login
            family: ssh
            disruptive: true
            reversible: true
            revert_strategy: owned_dropin
            toggle: linux_compliance_rule_sshd_disable_root_login_enabled
            runbook: null
            parameters: {}

    - name: Run the remediate role with the catalogue of the play
      block:
        - name: Run the remediate role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the catalogue of the play replaced the catalogue of the role
          ansible.builtin.fail:
            msg: REMEDIATE-PLAY-CATALOGUE-NOT-REFUSED
      rescue:
        - name: Check that the guard refused the catalogue before the ledger was read
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name is search('Refuse internal variables supplied from outside the role')
              - "'__linux_compliance_remediate_rules' in ansible_failed_result.assertion"
              - __linux_compliance_remediate_ledger == '__linux_compliance_unset__'
              - __linux_compliance_remediate_plan == '__linux_compliance_unset__'
            quiet: true

- name: Remediate role in check mode | The file_permissions helpers keep the ledger contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    fixtures: "{{ playbook_dir }}/fixtures/remediate"
    base_rule:
      rule_id: xccdf_org.ssgproject.content_rule_file_permissions_crontab
      family: file_permissions
      disruptive: false
      reversible: true
      revert_strategy: recorded_value
      toggle: linux_compliance_rule_file_permissions_crontab_enabled
      runbook: null
      parameters:
        path: "{{ playbook_dir }}/fixtures/remediate/target-file"
        max_mode: "0000"
      action: apply
      reason: enabled
      disabled_by: null
      ledger_entry: null
    recorded:
      rule_id: xccdf_org.ssgproject.content_rule_file_permissions_crontab
      family: file_permissions
      revert_strategy: recorded_value
      prior_values:
        - name: mode
          value: "0600"
          sensitive: false
          redacted: false
      collection_version: "0.1.0"
      applied_at: "2026-10-26T00:00:00Z"
    cases:
      - name: apply without a ledger entry records the prior mode first
        helper: apply
        rule: {}
        expect: {status: applied, ledger_skipped: false, change_skipped: false}
      - name: apply with a ledger entry never re-records
        helper: apply
        rule: {ledger_entry: "{{ recorded }}"}
        expect: {status: applied, ledger_skipped: true, change_skipped: false}
      - name: apply leaves a symbolic link alone
        helper: apply
        rule: {parameters: {path: "{{ fixtures }}/link-to-target"}}
        expect: {status: not_regular_file, ledger_skipped: true, change_skipped: true}
      - name: apply on an absent target changes nothing
        helper: apply
        rule: {parameters: {path: "{{ fixtures }}/absent"}}
        expect: {status: notapplicable, ledger_skipped: true, change_skipped: true}
      - name: cleanup restores a valid recorded mode and forgets the rule
        helper: cleanup
        rule: {action: cleanup, ledger_entry: "{{ recorded }}"}
        expect: {status: restored, ledger_skipped: false, change_skipped: false}
      - name: cleanup refuses a recorded mode that is not octal
        helper: cleanup
        rule:
          action: cleanup
          ledger_entry: "{{ recorded | combine({'prior_values': [{'name': 'mode', 'value': 'abc'}]}) }}"
        expect: {status: cleanup_incomplete, reason: invalid_record, ledger_skipped: true, change_skipped: true}
      - name: cleanup refuses a recorded mode with five digits
        helper: cleanup
        rule:
          action: cleanup
          ledger_entry: "{{ recorded | combine({'prior_values': [{'name': 'mode', 'value': '06440'}]}) }}"
        expect: {status: cleanup_incomplete, reason: invalid_record, ledger_skipped: true, change_skipped: true}
      - name: cleanup refuses a recorded mode with a trailing newline
        helper: cleanup
        rule:
          action: cleanup
          ledger_entry: "{{ recorded | combine({'prior_values': [{'name': 'mode', 'value': '0644\n'}]}) }}"
        expect: {status: cleanup_incomplete, reason: invalid_record, ledger_skipped: true, change_skipped: true}
      - name: cleanup refuses a record without a mode
        helper: cleanup
        rule:
          action: cleanup
          ledger_entry: "{{ recorded | combine({'prior_values': [{'name': 'owner', 'value': 'root'}]}) }}"
        expect: {status: cleanup_incomplete, reason: invalid_record, ledger_skipped: true, change_skipped: true}
      - name: cleanup never follows a symbolic link and keeps the entry
        helper: cleanup
        rule: {action: cleanup, ledger_entry: "{{ recorded }}", parameters: {path: "{{ fixtures }}/link-to-target"}}
        expect: {status: cleanup_incomplete, reason: not_regular_file, ledger_skipped: true, change_skipped: true}
      - name: cleanup of an absent target keeps the entry
        helper: cleanup
        rule: {action: cleanup, ledger_entry: "{{ recorded }}", parameters: {path: "{{ fixtures }}/absent"}}
        expect: {status: cleanup_incomplete, reason: target_absent, ledger_skipped: true, change_skipped: true}
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Check that the fixtures are a regular file and a symbolic link
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop:
        - "{{ fixtures }}/target-file"
        - "{{ fixtures }}/link-to-target"
      register: fixture_stats

    - name: Stop when the fixtures were not checked out as expected
      ansible.builtin.assert:
        that:
          - fixture_stats.results[0].stat.isreg
          - fixture_stats.results[0].stat.mode != '0000'
          - fixture_stats.results[1].stat.islnk
        quiet: true

    - name: Run every family case
      ansible.builtin.include_tasks:
        file: tasks/remediate-family-case.yml
      vars:
        case_rule: "{{ base_rule | combine(case.rule, recursive=True) }}"
        case_family:
          name: file_permissions
          disruptive: false
          apply: "{{ [case_rule] if case.helper == 'apply' else [] }}"
          cleanup: "{{ [case_rule] if case.helper == 'cleanup' else [] }}"
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Plan the base rule as the dispatcher would
      ansible.builtin.set_fact:
        __linux_compliance_remediate_plan:
          enabled: true
          families:
            - name: file_permissions
              disruptive: false
              apply: ["{{ base_rule }}"]
              cleanup: []

    - name: Try a helper without the opt-in
      block:
        - name: Run the apply helper with remediation disabled
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
            tasks_from: file_permissions_apply.yml
          vars:
            linux_compliance_remediate_enabled: false
            __linux_compliance_remediate_rule: "{{ base_rule }}"
            __linux_compliance_remediate_family: "{{ __linux_compliance_remediate_plan.families[0] }}"

        - name: Fail because the helper ran without the opt-in
          ansible.builtin.fail:
            msg: The apply helper ran without the opt-in.
      rescue:
        - name: Check that the helper refused to run
          ansible.builtin.assert:
            that:
              - "'runs only for a rule that the remediate dispatcher planned' in ansible_failed_result.msg"
            quiet: true

    - name: Try the family entry file without the opt-in
      block:
        - name: Run the family entry file with remediation disabled
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
            tasks_from: file_permissions.yml
          vars:
            linux_compliance_remediate_enabled: false
            __linux_compliance_remediate_family: "{{ __linux_compliance_remediate_plan.families[0] }}"

        - name: Fail because the family file ran without the opt-in
          ansible.builtin.fail:
            msg: The family file ran without the opt-in.
      rescue:
        - name: Check that the family file refused to run
          ansible.builtin.assert:
            that:
              - "'runs only from the remediate dispatcher' in ansible_failed_result.msg"
            quiet: true

    - name: Plan nothing for the family, as a dispatcher run would that has no work for it
      ansible.builtin.set_fact:
        __linux_compliance_remediate_plan:
          enabled: true
          families:
            - name: file_permissions
              disruptive: false
              apply: []
              cleanup: []

    - name: Try a helper whose caller claims a rule that the dispatcher did not plan
      block:
        - name: Run the apply helper with a family context that lists the unplanned rule
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
            tasks_from: file_permissions_apply.yml
          vars:
            __linux_compliance_remediate_rule: "{{ base_rule }}"
            __linux_compliance_remediate_family:
              name: file_permissions
              disruptive: false
              apply: ["{{ base_rule }}"]
              cleanup: []

        - name: Fail because the helper trusted the caller instead of the plan
          ansible.builtin.fail:
            msg: The apply helper ran for a rule that only the caller, not the dispatcher, planned.
      rescue:
        - name: Check that the helper refused the rule the plan does not hold
          ansible.builtin.assert:
            that:
              - "'runs only for a rule that the remediate dispatcher planned' in ansible_failed_result.msg"
            quiet: true

    - name: Try the family entry file with a family context that differs from the plan
      block:
        - name: Run the family entry file with a forged family context
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate
            tasks_from: file_permissions.yml
          vars:
            __linux_compliance_remediate_family:
              name: file_permissions
              disruptive: false
              apply: ["{{ base_rule }}"]
              cleanup: []

        - name: Fail because the family file trusted the forged context
          ansible.builtin.fail:
            msg: The family file ran for a family context that the dispatcher did not plan.
      rescue:
        - name: Check that the family file refused the forged context
          ansible.builtin.assert:
            that:
              - "'runs only from the remediate dispatcher' in ansible_failed_result.msg"
            quiet: true

- name: Remediate role in check mode | A family registry that the play sets is refused before any change
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
  tasks:
    - name: Refuse to run outside check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: This test playbook only runs with --check; it must never change the host.
        quiet: true

    - name: Register a family whose name walks out of the role
      ansible.builtin.set_fact:
        __linux_compliance_remediate_families:
          - name: file_permissions
            disruptive: false
          - name: ../../../../tmp/forged
            disruptive: false

    - name: Run the role with the family registry of the play
      block:
        - name: Run the remediate role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.remediate

        - name: Fail because the family registry of the play was used
          ansible.builtin.fail:
            msg: REMEDIATE-PLAY-REGISTRY-NOT-REFUSED
      rescue:
        - name: Check that the guard refused the family registry before the ledger was read
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name is search('Refuse internal variables supplied from outside the role')
              - "'__linux_compliance_remediate_families' in ansible_failed_result.assertion"
              - __linux_compliance_remediate_ledger == '__linux_compliance_unset__'
            quiet: true
