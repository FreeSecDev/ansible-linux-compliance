---
- name: Internal variables | A role parameter cannot replace the plan of the remediate role
  hosts: forged_plan
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
  roles:
    - role: freesecdev.linux_compliance.remediate
      __linux_compliance_remediate_plan:
        enabled: true
        errors: []
        families:
          - name: ../../../../tmp/forged
            disruptive: false
            apply: []
            cleanup: []
        summary: {}
        report: []
        disabled_rules: []
        orphaned: []
        notices: []

- name: Internal variables | A role parameter cannot replace the family of the remediate role
  hosts: forged_family
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
  roles:
    - role: freesecdev.linux_compliance.remediate
      __linux_compliance_remediate_family:
        name: ../../../../tmp/forged
        disruptive: false
        apply: []
        cleanup: []

- name: Internal variables | Role variables of a roles entry lose to the plan that the role computes
  hosts: forged_vars
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    linux_compliance_remediate_enabled: true
    linux_compliance_discovered:
      profile_id: xccdf_org.ssgproject.content_profile_cis_level1_server
      rule_ids:
        - xccdf_org.ssgproject.content_rule_file_permissions_crontab
  roles:
    - role: freesecdev.linux_compliance.remediate
      vars:
        __linux_compliance_remediate_plan:
          enabled: true
          errors: []
          families:
            - name: ../../../../tmp/forged
              disruptive: false
              apply: []
              cleanup: []
