---
- name: Gate routes | No variable defers the result gates of the main and evaluate.yml entry points
  hosts: web01:db01
  gather_facts: false
  vars_files:
    - vars/audit-exceptions.yml
    - vars/evidence.yml
  vars:
    linux_compliance_audit_fail_on_noncompliant: true
  tasks:
    - name: Require the output directory and the route from the Makefile
      ansible.builtin.assert:
        that:
          - evidence_test_dir is defined
          - evidence_test_dir is match('/')
          - gate_route in ['baseline', 'include', 'import']
        fail_msg: Run this playbook through make test-evidence.
        quiet: true

    - name: Build a failing run on web01 and a run that did not complete on db01
      ansible.builtin.include_tasks: tasks/evidence-fixture.yml
      vars:
        evidence_fixture_run_id: "routes-{{ gate_route }}-{{ inventory_hostname }}"
        evidence_fixture_failed: "{{ inventory_hostname == 'db01' }}"

    - name: Drop the gate record of the fixture, so only the audit role records one
      ansible.builtin.set_fact:
        linux_compliance_audited: "{{ linux_compliance_audited | ansible.builtin.dict2items
          | rejectattr('key', 'equalto', 'gate') | ansible.builtin.items2dict }}"

    - name: Apply the gates with the evaluate.yml entry point and no deferral variable
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.audit
        tasks_from: evaluate.yml
      when: gate_route == 'baseline'

    - name: Apply the gates with deferral variables as include parameters
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.audit
        tasks_from: evaluate.yml
      vars:
        linux_compliance_audit_defer_gate: true
        __linux_compliance_audit_gate_deferred: true
      when: gate_route == 'include'

    - name: Apply the gates with deferral variables as parameters of a static role import
      ansible.builtin.import_role:
        name: freesecdev.linux_compliance.audit
        tasks_from: evaluate.yml
      vars:
        linux_compliance_audit_defer_gate: true
        __linux_compliance_audit_gate_deferred: true
      when: gate_route == 'import'

    - name: Mark a host whose gate did not fail
      ansible.builtin.debug:
        msg: "GATE-ROUTE-PASSED {{ inventory_hostname }}"
