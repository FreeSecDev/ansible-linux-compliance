---
- name: Verify | A baseline or a marker fixed by an extra variable is refused
  hosts: web01
  gather_facts: false
  vars_files:
    - vars/audit-exceptions.yml
    - vars/verify.yml
  tasks:
    - name: Refuse to run without the extra variables of the Makefile
      ansible.builtin.assert:
        that:
          - verify_expected_task is defined
        fail_msg: >-
          Run this playbook through make test-verify, which passes linux_compliance_baseline or
          ansible_facts with -e, and verify_expected_task.
        quiet: true

    - name: Record a baseline while an extra variable holds another baseline or marker
      block:
        - name: Build a synthetic audit
          ansible.builtin.include_tasks: tasks/verify-synthetic.yml
          vars:
            verify_run_id: verify-baseline
            verify_outcomes: "{{ verify_outcomes_baseline }}"

        - name: Record the baseline with the verify role
          ansible.builtin.include_role:
            name: freesecdev.linux_compliance.verify
            tasks_from: baseline.yml

        - name: Fail because the extra variable was kept silently
          ansible.builtin.fail:
            msg: VERIFY-BASELINE-OVERRIDE-NOT-REFUSED
      rescue:
        - name: Check that the baseline entry point refused the extra variable
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name is search(verify_expected_task)
              - ansible_failed_result.msg is search('extra variable')
            quiet: true
