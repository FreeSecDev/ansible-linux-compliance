---
- name: Faillock and pwhistory direct use | faillock.yml refuses to run without the opt-in
  block:
    - name: Faillock and pwhistory direct use | Run faillock.yml with remediation disabled
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate
        tasks_from: faillock.yml
      vars:
        linux_compliance_remediate_enabled: false

    - name: Faillock and pwhistory direct use | Fail because faillock.yml ran without the opt-in
      ansible.builtin.fail:
        msg: faillock.yml ran without the opt-in.
  rescue:
    - name: Faillock and pwhistory direct use | Check that faillock.yml refused to run before anything else
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name is search('Refuse')
          - "'linux_compliance_remediate_enabled true' in ansible_failed_result.msg"
          - "'No change was made to the host' in ansible_failed_result.msg"
        fail_msg: "faillock.yml: {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"
        quiet: true

