---
- name: Login defaults case | Describe the profile with the login_defs rules it selects
  ansible.builtin.set_fact:
    login_defs_rule_ids: "{{ login_defs_case.rules | map('regex_replace', '^', login_defs_prefix) | list }}"
    login_defs_profile:
      profile_id: "xccdf_org.ssgproject.content_profile_{{ login_defs_case.profile }}"
      benchmark_id: "{{ login_defs_case.benchmark }}"
      content_sha256: >-
        {{ login_defs_manifest.datastreams | selectattr('name', 'equalto', login_defs_case.datastream)
           | map(attribute='sha256') | first }}
      rule_ids: "{{ login_defs_case.rules | map('regex_replace', '^', login_defs_prefix) | list }}"

- name: Login defaults case | Inspect login.defs and its drop-in directory before the role runs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop:
    - /etc/login.defs
    - /etc/login.defs.d
  register: login_defs_before

- name: Login defaults case | Run the remediate role in check mode with the profile
  ansible.builtin.include_role:
    name: freesecdev.linux_compliance.remediate
  vars:
    linux_compliance_discovered: "{{ login_defs_profile }}"
    linux_compliance_remediate_profile: "{{ login_defs_case.profile }}"

- name: Login defaults case | Inspect login.defs and its drop-in directory after the role ran
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop:
    - /etc/login.defs
    - /etc/login.defs.d
  register: login_defs_after

- name: Login defaults case | Check that every rule was reported once, with a reason for a refusal, and nothing changed
  vars:
    login_defs_results: >-
      {{ linux_compliance_remediated.results | selectattr('family', 'equalto', 'login_defs') | list }}
  ansible.builtin.assert:
    that:
      - linux_compliance_remediated.check_mode is true
      - __linux_compliance_remediate_plan.families | map(attribute='name') | list == ['login_defs']
      - login_defs_results | map(attribute='rule_id') | sort == login_defs_rule_ids | sort
      - login_defs_results | map(attribute='action') | unique | list == ['apply']
      - login_defs_results | map(attribute='status') | difference(login_defs_statuses) | list == []
      - login_defs_results | selectattr('status', 'equalto', 'applied') | rejectattr('changed') | list == []
      - login_defs_results | rejectattr('status', 'equalto', 'applied') | selectattr('changed') | list == []
      - >-
        login_defs_results | rejectattr('status', 'in', ['applied', 'compliant'])
        | selectattr('reason', 'none') | list == []
      - >-
        login_defs_before.results | map(attribute='stat') | map('ansible.builtin.dict2items')
        | map('rejectattr', 'key', 'in', ['atime']) | map('items2dict') | list
        == login_defs_after.results | map(attribute='stat') | map('ansible.builtin.dict2items')
        | map('rejectattr', 'key', 'in', ['atime']) | map('items2dict') | list
    fail_msg: "{{ login_defs_case.name }}: {{ login_defs_results | to_json }}"
    quiet: true
