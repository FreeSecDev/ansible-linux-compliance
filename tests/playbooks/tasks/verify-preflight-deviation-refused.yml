---
- name: Run the preflight with the audit deviation gate {{ verify_deviation_gate }}
  block:
    - name: Run the preflight
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.verify
        tasks_from: preflight.yml
      vars:
        linux_compliance_audit_fail_on_deviation: "{{ verify_deviation_gate }}"

    - name: Fail because the audit deviation gate was accepted
      ansible.builtin.fail:
        msg: VERIFY-PREFLIGHT-DEVIATION-NOT-REFUSED
  rescue:
    - name: Check that the preflight refused the audit deviation gate
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name is search('Refuse the audit deviation gate')
          - ansible_failed_result.msg is search('Nothing was audited or remediated')
        quiet: true
