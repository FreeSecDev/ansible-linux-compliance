---
- name: Login defaults direct use | login_defs.yml refuses to run without the opt-in
  block:
    - name: Login defaults direct use | Run login_defs.yml with remediation disabled
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate
        tasks_from: login_defs.yml
      vars:
        linux_compliance_remediate_enabled: false

    - name: Login defaults direct use | Fail because login_defs.yml ran without the opt-in
      ansible.builtin.fail:
        msg: login_defs.yml ran without the opt-in.
  rescue:
    - name: Login defaults direct use | Check that login_defs.yml refused to run before anything else
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name is search('Refuse')
          - "'linux_compliance_remediate_enabled true' in ansible_failed_result.msg"
          - "'No change was made to the host' in ansible_failed_result.msg"
        fail_msg: "login_defs.yml: {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"
        quiet: true

