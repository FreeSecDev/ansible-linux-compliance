---
- name: Native direct use | banners.yml refuses to run without the opt-in
  block:
    - name: Native direct use | Run banners.yml with remediation disabled
      ansible.builtin.include_role:
        name: freesecdev.linux_compliance.remediate
        tasks_from: banners.yml
      vars:
        linux_compliance_remediate_enabled: false

    - name: Native direct use | Fail because banners.yml ran without the opt-in
      ansible.builtin.fail:
        msg: banners.yml ran without the opt-in.
  rescue:
    - name: Native direct use | Check that banners.yml refused to run before anything else
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name is search('Refuse')
          - "'linux_compliance_remediate_enabled true' in ansible_failed_result.msg"
          - "'No change was made to the host' in ansible_failed_result.msg"
        fail_msg: "banners.yml: {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"
        quiet: true

