---
trivial:
  - >-
    Test tooling: the Molecule scenarios libvirt-ubuntu and libvirt-rhel-compatible boot pinned Ubuntu 24.04 and
    Rocky Linux 9.8 cloud images, verified against the vendors' signed checksum files, in KVM virtual machines on an
    isolated libvirt network of their own, install the pinned scanner packages without a mirror, and run the same
    converge, verify and toggle lifecycle as the Docker scenarios. The guard checks a libvirt target's inventory
    settings, its domain, network and pool definitions and its SMBIOS identity, and refuses the controller itself;
    make test-molecule-libvirt-selftest tests it against real libvirt objects. A lifecycle declaration or pre-state may
    require a driver (requires: [libvirt]), and make lint-lifecycle requires that a scenario of that driver runs it.
    community.libvirt 2.4.0 and community.crypto 3.5.0 are pinned for the scenarios.
