---
minor_changes:
  - >-
    verify role - implement the role (it was a skeleton). It compares ``linux_compliance_audited`` after remediation
    with ``linux_compliance_baseline``, publishes ``linux_compliance_verified`` and classifies every rule as improved,
    regressed, unchanged, newly applicable, newly not applicable, error or not comparable. Regressions are always
    printed; the host fails on regressions unless ``linux_compliance_verify_fail_on_regression`` is ``false``, and
    always fails when a scan did not complete. A waived or disabled result and an error that becomes a pass are never
    counted as improvements.
  - >-
    verify role - add ``linux_compliance_verify_mode`` (``raw`` by default, or ``waived``) and accept the shared
    ``linux_compliance_exceptions_file``. Waived mode compares the waived results only when both audits applied the same
    exceptions file (same SHA-256). Audits of another host, benchmark, content, profile or scanner are refused.
  - >-
    verify role - add the ``baseline.yml`` entry point, which records ``linux_compliance_audited`` as
    ``linux_compliance_baseline`` and refuses a baseline fixed by an extra variable.
  - >-
    playbooks - ``remediate.yml`` now audits, records the baseline, remediates, audits again through ``verify.yml`` and
    verifies, and exits 0 when both scans completed and no rule regressed. ``verify.yml`` audits again before it
    compares and no longer uses ``become`` for the verify role.
  - >-
    Add the controller filter ``freesecdev.linux_compliance.compare_scans``, which compares two audit results of the
    same host.
