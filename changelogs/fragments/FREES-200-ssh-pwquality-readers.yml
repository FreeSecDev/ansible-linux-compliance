---
bugfixes:
  - >-
    remediate - the ``ssh`` topic decides from sshd itself whether a drop-in takes effect (FREES-200, ADR 0023). A
    drop-in in place is ``compliant`` only when ``sshd -T`` prints its value, and a drop-in written is kept only when
    ``sshd -T`` prints its value afterwards; otherwise the rule is rolled back and reported ``overridden`` with the
    value that sshd reads, for example behind an earlier ``DSAAuthentication no``, the alias of
    ``PubkeyAuthentication``. Settings, ``Match`` blocks and ``Include`` lines are found as sshd's lexer finds them,
    with a reproduction of sshd's ``strdelim`` checked against ``sshd -T -C`` in both Molecule images, so a looser
    value in a ``Match`` block such as ``Permit"RootLogin" yes``, ``=PermitRootLogin yes`` or
    ``PermitRootLogin<CR>yes`` is
    ``overridden`` and no longer reported applied, and an ``Include`` after the drop-ins of a file the family does not
    read makes every rule ``overridden``, also when it is another argument of the ``Include`` line that names the
    drop-ins: arguments before the drop-in glob count as an earlier ``Include`` and arguments after it as a later
    one. Keywords are lowered in ASCII only and a line that is only a form feed is an error, as in sshd. Vendor lines
    are set, written back and rolled back by writing the whole file from the exact text read, so files with CRLF
    line ends or a lone CR are restored byte for byte. Each vendor file is read again right before it is written:
    one that changed in between is not written, and the rule is ``modified_since_read`` (apply) or keeps its ledger
    entry with that reason (cleanup); a vendor file that does not hold what was written back keeps the entry with
    the reason ``write_mismatch``. A drop-in that existed before the run and that the run rewrote for a changed
    value keeps the new value when sshd does not use it.
  - >-
    remediate - the ``pwquality`` topic decides every rule as libpwquality reads the files and as the arguments of
    ``pam_pwquality`` in every PAM file override them (FREES-200, ADR 0021). A rule is no longer reported compliant
    or applied when a later line sets the setting in another case or without ``=``, when a line or a drop-in that
    libpwquality cannot read stops the configuration before the setting, when a dot file or a symbolic link in
    ``pwquality.conf.d`` is read, or when a ``pam_pwquality`` argument sets another value; such rules are
    ``overridden``, ``duplicate_setting``, ``unreadable_file`` or ``unreadable_value`` with a reason and nothing
    written. The main file is written and restored whole from the exact text read, so CRs are restored byte for
    byte. ``tests/fixtures/pwquality_readers/verdicts.json``, produced by the real library of both Molecule images
    with ``tools/lint/pwquality_readers.sh``, checks the reader and every decision. ``enforcing`` at 0 in the files
    or in a ``pam_pwquality`` argument, in any form that the library reads as 0 (``enforcing=00``, ``=+00``,
    ``=-0``), makes every other rule ``overridden``, and so does a PAM line that includes a path with a ``/``
    (``@include /etc/x``, ``include ../security/x``), which Linux-PAM opens outside the PAM files read. The main
    file is read again right before it is written: one that changed in between is ``modified_since_read`` with
    nothing written, and a main file that does not hold what was written back keeps the ledger entry with the
    reason ``write_mismatch``.
minor_changes:
  - >-
    sshd_validate - new options ``effective`` and ``client``: with ``effective: true`` the module runs the
    extended test mode ``sshd -T -f /etc/ssh/sshd_config``, optionally with ``-C user=,host=,addr=``, and returns the
    values of the native keywords in ``effective``; it also returns ``check_mode``. The audited process helper allows
    ``-T`` with the same ``-o`` pairs and at most one ``-C`` (amendment of ADR 0004).
