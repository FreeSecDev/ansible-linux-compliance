---
minor_changes:
  - >-
    remediate - the ``auditd`` umbrella gains its first fine-grained topics (FREES-110, ADR 0030). ``auditd_rules_time``
    makes the five time change rules native: each writes one drop-in ``/etc/audit/rules.d/50-freesecdev-<rule>.rules``
    with the collection's own ``b32`` and ``b64`` lines (or the watch form that each benchmark checks), refuses a rule
    that another file already holds in part (``duplicate_rule``) or could delete (``conflicting_rule``), and is
    ``compliant`` when another file holds it in full only if the running auditd lists it and ``augenrules --check``
    finds the files unchanged. Where auditd runs, the rule set is checked for repeated rules, loaded with
    ``augenrules --load`` and verified with ``auditctl -l``; a failed load is rolled back; locked rules give
    ``locked_until_reboot``. ``auditd_conf`` (disruptive) makes 20 settings of ``/etc/audit/auditd.conf`` native with
    the profile's values, one line per setting with its prior line recorded. What the file sets is decided by a model of
    auditd's parser that unit tests check against a verdict table of the real auditd of each Molecule image
    (``make auditd-conf-verdicts``); a file that auditd would refuse after the run, or that the model cannot tell, is
    refused (``invalid_config``). The file is written as a whole, never line by line, only while its SHA-256 is that of
    the bytes read and checked again afterwards, and a running auditd is asked to reload (``reload_not_confirmed``,
    ``restart_required`` for ``local_events``). Switching a rule or topic off reverts exactly what it changed.
  - >-
    audit_control - new module that reads the audit status, the loaded rules and the rule files, loads the rules of
    ``/etc/audit/rules.d`` with ``augenrules --load`` after checking them for repeated rules, and reloads auditd,
    through the audited process helper, whose allow-list gains ``auditctl`` (``-s``, ``-l``, ``--signal reload``) and
    ``augenrules`` (``--load``, ``--check``) in these exact forms only; on a timeout ``augenrules`` gets ``SIGTERM``
    and a grace before ``SIGKILL``, so that its trap removes its temporary file.
