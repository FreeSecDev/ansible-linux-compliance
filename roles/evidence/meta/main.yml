---
galaxy_info:
  role_name: evidence
  namespace: freesecdev
  author: FreeSecDev contributors
  description: >-
    Collect the evidence of an audit run into a versioned, checksummed bundle on the controller.
    The platforms below are intended targets of the audit; the role itself only fetches files.
    No Molecule scenario runs it yet (FREES-60).
  license: Apache-2.0
  min_ansible_version: "2.20"
  platforms:
    - name: Ubuntu
      versions:
        - noble
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - compliance
    - security
    - evidence
dependencies: []
