---
- name: Evidence | Validate inputs
  ansible.builtin.assert:
    that:
      - linux_compliance_evidence_output_dir is string
      - linux_compliance_evidence_output_dir | length > 0
      - linux_compliance_evidence_include_host_facts is boolean
    fail_msg: The evidence role received an invalid input; see meta/argument_specs.yml.
    quiet: true

- name: Evidence | Stop because the role is not implemented yet
  ansible.builtin.fail:
    msg: The evidence role is not implemented yet (tracked in FREES-51). No change was made to the host.
