      - __linux_compliance_evidence_plan == '__linux_compliance_unset__'
      - __linux_compliance_evidence_root == '__linux_compliance_unset__'
      - __linux_compliance_evidence_uid == '__linux_compliance_unset__'
      - __linux_compliance_evidence_written == '__linux_compliance_unset__'
      - __linux_compliance_evidence_collected == '__linux_compliance_unset__'
      - __linux_compliance_evidence_host_observed == '__linux_compliance_unset__'
      - __linux_compliance_evidence_no_audit == '__linux_compliance_unset__'
      - __linux_compliance_evidence_no_evidence == '__linux_compliance_unset__'
      - __linux_compliance_evidence_observed == '__linux_compliance_unset__'
