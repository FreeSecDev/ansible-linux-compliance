        == (lookup('ansible.builtin.file', role_path ~ '/vars/main.yml') |
        ansible.builtin.from_yaml)['__linux_compliance_evidence_collection_version']
    fail_msg: >-
      An internal variable of the evidence role (__linux_compliance_evidence_*) is set from outside the role: by a role
