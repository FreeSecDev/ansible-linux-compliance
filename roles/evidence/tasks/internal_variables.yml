      - __linux_compliance_evidence_summary == '__linux_compliance_unset__'
      - __linux_compliance_evidence_targets == '__linux_compliance_unset__'
      - __linux_compliance_evidence_unsafe == '__linux_compliance_unset__'
      - >-
        __linux_compliance_evidence_collection_version is not defined or __linux_compliance_evidence_collection_version
        == (lookup('ansible.builtin.file', role_path ~ '/vars/main.yml') |
        ansible.builtin.from_yaml)['__linux_compliance_evidence_collection_version']
    fail_msg: >-
      An internal variable of the evidence role (__linux_compliance_evidence_*) is set from outside the role: by a role
      parameter, an include parameter (vars of include_role or include_tasks) or an extra variable (-e), which outrank
      every fact the role sets. The failed assertion names it. Remove it and pass only the documented linux_compliance_*
      variables. Nothing was scanned, changed or compared.
    quiet: true
  vars:
    __linux_compliance_evidence_collected: __linux_compliance_unset__
    __linux_compliance_evidence_host_observed: __linux_compliance_unset__
    __linux_compliance_evidence_no_audit: __linux_compliance_unset__
    __linux_compliance_evidence_no_evidence: __linux_compliance_unset__
    __linux_compliance_evidence_observed: __linux_compliance_unset__
    __linux_compliance_evidence_preview: __linux_compliance_unset__
    __linux_compliance_evidence_summary: __linux_compliance_unset__
    __linux_compliance_evidence_targets: __linux_compliance_unset__
    __linux_compliance_evidence_unsafe: __linux_compliance_unset__
  tags:
    - always

