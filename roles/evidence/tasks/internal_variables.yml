    __linux_compliance_evidence_written: __linux_compliance_unset__
  tags:
    - always

- name: Evidence | Refuse internal variables supplied from outside the role
  ansible.builtin.assert:
    that:
      - __linux_compliance_evidence_dir == '__linux_compliance_unset__'
      - __linux_compliance_evidence_directories == '__linux_compliance_unset__'
      - __linux_compliance_evidence_documents == '__linux_compliance_unset__'
