    __linux_compliance_evidence_root: __linux_compliance_unset__
    __linux_compliance_evidence_summary_existing: __linux_compliance_unset__
    __linux_compliance_evidence_summary_written: __linux_compliance_unset__
    __linux_compliance_evidence_uid: __linux_compliance_unset__
    __linux_compliance_evidence_written: __linux_compliance_unset__
  tags:
    - always

