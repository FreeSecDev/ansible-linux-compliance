---
- name: Login defaults | Refuse to set a setting that the dispatcher did not plan
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'login_defs'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'login_defs'
      - >-
        __linux_compliance_remediate_rule.parameters.setting
        is match(__linux_compliance_remediate_login_defs_setting_pattern)
      - __linux_compliance_remediate_rule.parameters.comparison in __linux_compliance_remediate_ld_value_patterns
      - __linux_compliance_remediate_ld_values[__linux_compliance_remediate_rule.rule_id] is string
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'login_defs') | list | first | default({}))).apply | default([])
    fail_msg: >-
      login_defs_apply.yml runs only for a rule that the remediate dispatcher planned to apply, with
      linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Login defaults | Read the method and the values that the ledger entry of the rule records
  vars:
    __linux_compliance_remediate_ld_recorded: >-
      {{ (__linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
          | items2dict(key_name='name', value_name='value'))
         if __linux_compliance_remediate_rule.ledger_entry is mapping else {} }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_entry: "{{ __linux_compliance_remediate_ld_recorded }}"
    __linux_compliance_remediate_ld_entry_method: >-
      {{ none if __linux_compliance_remediate_rule.ledger_entry is not mapping
         else __linux_compliance_remediate_ld_recorded.method | default('unknown') }}
  tags:
    - always

- name: Login defaults | Inspect login.defs with its SHA-256 before changing it, without following a link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_login_defs }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_ld_stat
  tags:
    - always

- name: Login defaults | Read login.defs
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_login_defs }}"
  register: __linux_compliance_remediate_ld_current
  when: __linux_compliance_remediate_ld_stat.stat.isreg | default(false)
  tags:
    - always

- name: Login defaults | Decide from the text of login.defs and its drop-ins, as their readers read them
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/login_defs_decide.yml"
    apply:
      tags:
        - always
  tags:
    - always

- name: Login defaults | Record the prior line of the setting, the line written and the state of login.defs
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values:
      - name: method
        value: line
      - name: setting_line
        value: "{{ __linux_compliance_remediate_ld_found | first | default(none) }}"
      - name: written_line
        value: "{{ __linux_compliance_remediate_ld_line }}"
      - name: mode
        value: "{{ __linux_compliance_remediate_ld_stat.stat.mode }}"
      - name: owner
        value: "{{ __linux_compliance_remediate_ld_stat.stat.uid | string }}"
      - name: group
        value: "{{ __linux_compliance_remediate_ld_stat.stat.gid | string }}"
      - name: sha256
        value: "{{ __linux_compliance_remediate_ld_stat.stat.checksum }}"
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
  register: __linux_compliance_remediate_ld_record
  when:
    - __linux_compliance_remediate_ld_status == 'applied'
    - __linux_compliance_remediate_rule.ledger_entry is none
  tags:
    - always

- name: Login defaults | Write the setting with the value that the content's check accepts, every other byte unchanged
  ansible.builtin.copy:
    content: "{{ __linux_compliance_remediate_ld_new_text }}"
    dest: "{{ __linux_compliance_remediate_login_defs }}"
    follow: false
    force: true
    mode: "{{ __linux_compliance_remediate_ld_stat.stat.mode }}"
  register: __linux_compliance_remediate_ld_write
  when: __linux_compliance_remediate_ld_status == 'applied'
  tags:
    - always

- name: Login defaults | Keep the recorded prior state and record the line written again, after the write
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values: >-
      {{ __linux_compliance_remediate_ld_entry | combine({'written_line': __linux_compliance_remediate_ld_line})
         | dict2items(key_name='name', value_name='value') }}
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
    replace: true
  register: __linux_compliance_remediate_ld_rerecord
  when:
    - __linux_compliance_remediate_ld_status == 'applied'
    - __linux_compliance_remediate_ld_entry_method == 'line'
    - __linux_compliance_remediate_ld_entry.written_line | default(none) != __linux_compliance_remediate_ld_line
  tags:
    - always

- name: Login defaults | Add the result of the rule
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'apply',
           'status': __linux_compliance_remediate_ld_status,
           'reason': {
             'method_changed': 'the ledger entry was recorded by the '
                               ~ __linux_compliance_remediate_ld_entry_method ~ ' method; clean it up first',
             'notapplicable': __linux_compliance_remediate_login_defs
                              ~ ' does not exist, so shadow-utils is not installed',
             'not_regular_file': __linux_compliance_remediate_login_defs
                                 ~ ' is a symbolic link or not a regular file; nothing is written through it',
             'not_directory': __linux_compliance_remediate_login_defs_directory
                              ~ ' is a symbolic link or not a directory, so its drop-ins cannot be read',
             'overridden': 'the drop-ins ' ~ (__linux_compliance_remediate_ld_overriding | join(', '))
                           ~ ' set ' ~ __linux_compliance_remediate_rule.parameters.setting
                           ~ ' as well; the collection does not change files it does not own',
             'long_line': __linux_compliance_remediate_login_defs ~ ' has a line of 1023 bytes or more, which'
                          ~ ' shadow-utils reads in pieces that can each set a setting; nothing was written',
             'unreadable_file': 'libeconf, through which util-linux reads '
                                ~ __linux_compliance_remediate_rule.parameters.setting ~ ', does not read '
                                ~ (__linux_compliance_remediate_ld_econf_blockers | join(', '))
                                ~ ' as one configuration (a line that starts a section, or a drop-in that is a'
                                ~ ' symbolic link to no regular file), so a written value would not take effect;'
                                ~ ' nothing was written',
             'duplicate_setting': __linux_compliance_remediate_login_defs ~ ' sets '
                                  ~ __linux_compliance_remediate_rule.parameters.setting ~ ' on '
                                  ~ ([__linux_compliance_remediate_ld_found | length,
                                      __linux_compliance_remediate_ld_keys | length] | max) ~ ' lines',
             'unreadable_value': 'the line '
                                 ~ ((__linux_compliance_remediate_ld_found + __linux_compliance_remediate_ld_keys)
                                    | first | default('') | to_json)
                                 ~ ' of ' ~ __linux_compliance_remediate_login_defs
                                 ~ ((' holds a control character other than a tab or a carriage return, which the'
                                     ~ ' state ledger does not record, so the line could not be restored exactly;'
                                     ~ ' nothing was written')
                                    if __linux_compliance_remediate_ld_unrecordable
                                       and not __linux_compliance_remediate_ld_nul
                                    else (' has the value ' ~ (__linux_compliance_remediate_ld_token | to_json)
                                          ~ ', which shadow-utils, libeconf or pam_umask may read in a form that the'
                                          ~ ' collection cannot compare, so a written value could be looser;'
                                          ~ ' nothing was written'))
           }[__linux_compliance_remediate_ld_status] | default(none),
           'changed': (__linux_compliance_remediate_ld_write is changed)
                      or (__linux_compliance_remediate_ld_rerecord is changed),
           'message': __linux_compliance_remediate_login_defs ~ ' '
                      ~ __linux_compliance_remediate_rule.parameters.setting ~ ': '
                      ~ __linux_compliance_remediate_ld_status
         }] }}
  tags:
    - always
