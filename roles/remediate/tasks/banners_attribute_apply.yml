---
- name: Banners | Refuse to change a banner file attribute that the dispatcher did not plan
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'banners'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'banners'
      - __linux_compliance_remediate_rule.parameters.attribute in ['mode', 'owner', 'group']
      - __linux_compliance_remediate_bn_created is mapping
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'banners') | list | first | default({}))).apply | default([])
    fail_msg: >-
      banners_attribute_apply.yml runs only for a rule that the remediate dispatcher planned to apply,
      with linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Banners | Inspect the banner file without following a symbolic link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_bn_stat
  tags:
    - always

- name: Banners | Take the current attributes, or those of a file that this run creates
  ansible.builtin.set_fact:
    __linux_compliance_remediate_bn_attr: "{{ __linux_compliance_remediate_rule.parameters.attribute }}"
    __linux_compliance_remediate_bn_planned: >-
      {{ not __linux_compliance_remediate_bn_stat.stat.exists
         and __linux_compliance_remediate_rule.parameters.path in __linux_compliance_remediate_bn_created }}
    __linux_compliance_remediate_bn_current_attributes: >-
      {{ {'mode': '0644', 'owner': '0', 'group': '0'}
         if not __linux_compliance_remediate_bn_stat.stat.exists
         else {'mode': __linux_compliance_remediate_bn_stat.stat.mode,
               'owner': __linux_compliance_remediate_bn_stat.stat.uid | string,
               'group': __linux_compliance_remediate_bn_stat.stat.gid | string}
         if __linux_compliance_remediate_bn_stat.stat.isreg
         else {} }}
  tags:
    - always

- name: Banners | Compute the attribute that the rule requires
  ansible.builtin.set_fact:
    __linux_compliance_remediate_bn_current_value: >-
      {{ __linux_compliance_remediate_bn_current_attributes[__linux_compliance_remediate_bn_attr]
         | default(none) }}
    __linux_compliance_remediate_bn_wanted: >-
      {{ (__linux_compliance_remediate_bn_current_attributes.mode
          | freesecdev.linux_compliance.restricted_mode(__linux_compliance_remediate_rule.parameters.max_mode))
         if __linux_compliance_remediate_bn_attr == 'mode'
            and __linux_compliance_remediate_bn_current_attributes.mode is defined
         else __linux_compliance_remediate_rule.parameters.id | default('') | string }}
  tags:
    - always

- name: Banners | Decide whether the attribute must change
  ansible.builtin.set_fact:
    __linux_compliance_remediate_bn_status: >-
      {{ 'compliant' if __linux_compliance_remediate_bn_planned
         else 'notapplicable' if not __linux_compliance_remediate_bn_stat.stat.exists
         else 'not_regular_file' if not __linux_compliance_remediate_bn_stat.stat.isreg
         else 'compliant' if __linux_compliance_remediate_bn_current_value == __linux_compliance_remediate_bn_wanted
         else 'applied' }}
  tags:
    - always

- name: Banners | Record the prior attribute in the state ledger before changing it
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values:
      - name: "{{ __linux_compliance_remediate_bn_attr }}"
        value: "{{ __linux_compliance_remediate_bn_current_value }}"
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
  register: __linux_compliance_remediate_bn_record
  when:
    - __linux_compliance_remediate_bn_status == 'applied'
    - __linux_compliance_remediate_rule.ledger_entry is none
  tags:
    - always

- name: Banners | Apply the attribute
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    state: file
    follow: false
    mode: "{{ __linux_compliance_remediate_bn_wanted if __linux_compliance_remediate_bn_attr == 'mode' else omit }}"
    owner: "{{ __linux_compliance_remediate_bn_wanted if __linux_compliance_remediate_bn_attr == 'owner' else omit }}"
    group: "{{ __linux_compliance_remediate_bn_wanted if __linux_compliance_remediate_bn_attr == 'group' else omit }}"
  register: __linux_compliance_remediate_bn_change
  when: __linux_compliance_remediate_bn_status == 'applied'
  tags:
    - always

- name: Banners | Add the result of the rule
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'apply',
           'status': __linux_compliance_remediate_bn_status,
           'reason': none,
           'changed': __linux_compliance_remediate_bn_change is changed,
           'message': __linux_compliance_remediate_rule.parameters.path ~ ' ' ~ __linux_compliance_remediate_bn_attr
                      ~ ': ' ~ __linux_compliance_remediate_bn_status
         }] }}
  tags:
    - always
