- name: Remediate | Record a random nonce in the facts of this host
  ansible.builtin.set_fact:
    __linux_compliance_remediate_host_nonce: "{{ 1000000000000 | ansible.builtin.random }}"
  tags:
    - always

- name: Remediate | Refuse an inventory_hostname that names another host
  ansible.builtin.assert:
    that:
      - >-
        (hostvars[inventory_hostname] | default({}))['__linux_compliance_remediate_host_nonce'] | default(none) ==
        __linux_compliance_remediate_host_nonce
    fail_msg: >-
      inventory_hostname is {{ inventory_hostname }}, but the nonce that the previous task recorded in the facts of this
      host is not __linux_compliance_remediate_host_nonce of hostvars[inventory_hostname]: a role parameter, an include
      parameter or an extra variable named inventory_hostname points the remediate role at another host. Remove it.
      Nothing was scanned, changed or compared.
    quiet: true
  tags:
    - always

