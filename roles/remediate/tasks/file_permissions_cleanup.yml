---
- name: File permissions | Inspect the target before restoring it
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_fp_stat

- name: File permissions | Read the recorded prior mode
  ansible.builtin.set_fact:
    __linux_compliance_remediate_fp_prior: >-
      {{ __linux_compliance_remediate_rule.ledger_entry.prior_values
         | selectattr('name', 'equalto', 'mode')
         | map(attribute='value') | first | default(none) }}
    __linux_compliance_remediate_fp_target: "{{ __linux_compliance_remediate_fp_stat.stat.isreg | default(false) }}"
    __linux_compliance_remediate_fp_absent: "{{ not __linux_compliance_remediate_fp_stat.stat.exists }}"

- name: File permissions | Decide whether the prior mode can be restored
  ansible.builtin.set_fact:
    __linux_compliance_remediate_fp_restorable: >-
      {{ __linux_compliance_remediate_fp_target
         and __linux_compliance_remediate_fp_prior is string
         and __linux_compliance_remediate_fp_prior is match('^[0-7]{4}$') }}

- name: File permissions | Restore the recorded prior mode
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    mode: "{{ __linux_compliance_remediate_fp_prior }}"
    state: file
    follow: false
  register: __linux_compliance_remediate_fp_restore
  when: __linux_compliance_remediate_fp_restorable

- name: File permissions | Forget the rule in the state ledger after the restore
  freesecdev.linux_compliance.control_state:
    action: remove
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
  register: __linux_compliance_remediate_fp_forget
  when: __linux_compliance_remediate_fp_restorable or __linux_compliance_remediate_fp_absent

- name: File permissions | Add the result of the cleanup
  vars:
    __linux_compliance_remediate_fp_status: >-
      {{ 'restored' if __linux_compliance_remediate_fp_restorable
         else 'target_absent' if __linux_compliance_remediate_fp_absent
         else 'cleanup_incomplete' }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'cleanup',
           'status': __linux_compliance_remediate_fp_status,
           'changed': (__linux_compliance_remediate_fp_restore is changed)
                      or (__linux_compliance_remediate_fp_forget is changed),
           'message': __linux_compliance_remediate_rule.rule_id ~ ': ' ~ __linux_compliance_remediate_fp_status
                      ~ (' (' ~ __linux_compliance_remediate_rule.parameters.path
                         ~ ' is not a regular file or the recorded mode is missing; the ledger entry is kept)'
                         if __linux_compliance_remediate_fp_status == 'cleanup_incomplete' else '')
         }] }}
