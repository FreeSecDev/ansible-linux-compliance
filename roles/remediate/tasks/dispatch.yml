---
- name: Remediate | Dispatch the file_permissions family when the plan gives it work
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/file_permissions.yml"
    apply:
      tags:
        - always
  loop: "{{ __linux_compliance_remediate_plan.families }}"
  loop_control:
    loop_var: __linux_compliance_remediate_family
    label: "{{ __linux_compliance_remediate_family.name }}"
  when: __linux_compliance_remediate_family.name == 'file_permissions'
  tags:
    - always
