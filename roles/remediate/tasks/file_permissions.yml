---
- name: File permissions | Refuse to run outside the dispatcher or without the opt-in
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is defined
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'file_permissions'
    fail_msg: >-
      The file_permissions family file runs only from the remediate dispatcher with
      linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: File permissions | Restore the recorded mode of rules that are no longer effective
  ansible.builtin.include_tasks:
    file: file_permissions_cleanup.yml
    apply:
      tags:
        - always
  loop: "{{ __linux_compliance_remediate_family.cleanup }}"
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always

- name: File permissions | Apply the effective rules
  ansible.builtin.include_tasks:
    file: file_permissions_apply.yml
    apply:
      tags:
        - always
  loop: "{{ __linux_compliance_remediate_family.apply }}"
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always
