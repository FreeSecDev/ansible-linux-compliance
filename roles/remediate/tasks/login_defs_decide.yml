---
- name: Login defaults | Keep the text of login.defs and whether its other readers apply to the setting
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_text: >-
      {{ (__linux_compliance_remediate_ld_current.content | b64decode)
         if __linux_compliance_remediate_ld_current is not skipped else '' }}
    __linux_compliance_remediate_ld_libeconf: "{{ __linux_compliance_remediate_rule.parameters.libeconf is defined }}"
    __linux_compliance_remediate_ld_econf_reader: >-
      {{ __linux_compliance_remediate_login_defs_libeconf_readers[__linux_compliance_remediate_rule.parameters.libeconf]
         if __linux_compliance_remediate_rule.parameters.libeconf is defined else {} }}
    __linux_compliance_remediate_ld_reads_dropins: >-
      {{ (__linux_compliance_remediate_rule.parameters.reads_dropins | default(false))
         or __linux_compliance_remediate_rule.parameters.libeconf is defined }}
  tags:
    - always

- name: Login defaults | Find the lines that set the setting in any case, and the drop-ins that set it as well
  vars:
    __linux_compliance_remediate_ld_setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_regexp: >-
      {{ '(?i)^[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '(?:[ \t]|$)' }}
    __linux_compliance_remediate_ld_found: >-
      {{ __linux_compliance_remediate_ld_text
         | regex_findall('(?im)^[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '(?:[ \t].*)?$') }}
    __linux_compliance_remediate_ld_keys: >-
      {{ __linux_compliance_remediate_ld_text
         | regex_findall('(?im)^'
                         ~ ('[ \t\r\v\f]*' ~ __linux_compliance_remediate_ld_setting ~ '(?:[ \t\r\v\f=\x00].*)?'
                            if __linux_compliance_remediate_ld_libeconf
                               or __linux_compliance_remediate_rule.parameters.comparison == 'umask'
                            else '[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '(?:[ \t].*)?') ~ '$') }}
    __linux_compliance_remediate_ld_long_line: >-
      {{ __linux_compliance_remediate_ld_text.split(__linux_compliance_remediate_newline) | map('b64encode')
         | select('match', __linux_compliance_remediate_login_defs_long_line_pattern) | list | length > 0 }}
    __linux_compliance_remediate_ld_overriding: >-
      {{ (__linux_compliance_remediate_ld_dropin_texts | dict2items
          | selectattr('value', 'search', '(?i)' ~ __linux_compliance_remediate_ld_setting)
          | map(attribute='key') | list)
         if __linux_compliance_remediate_ld_reads_dropins else [] }}
    __linux_compliance_remediate_ld_econf_blockers: >-
      {{ ((([__linux_compliance_remediate_login_defs]
            if __linux_compliance_remediate_ld_text is search(__linux_compliance_remediate_login_defs_section_pattern)
            else [])
           + (__linux_compliance_remediate_ld_dropin_texts | dict2items
              | selectattr('value', 'search', __linux_compliance_remediate_login_defs_section_pattern)
              | map(attribute='key') | list)
           + __linux_compliance_remediate_ld_dropin_links_unread) | sort)
         if __linux_compliance_remediate_ld_libeconf else [] }}
    __linux_compliance_remediate_ld_strict: >-
      {{ '^[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '[ \t]+('
         ~ ('0|[1-9][0-9]{0,5}' if __linux_compliance_remediate_rule.parameters.comparison in ['at_most', 'at_least']
            else '0[0-7]{2}' if __linux_compliance_remediate_rule.parameters.comparison == 'umask'
            else __linux_compliance_remediate_ld_values[__linux_compliance_remediate_rule.rule_id])
         ~ ')[ \t\r\v\f]*$' }}
    __linux_compliance_remediate_ld_token_pattern: >-
      {{ '(?i)^[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '[ \t][ \t\r\v\f]*([^ \t\r\v\f#]+)' }}
  tags:
    - always

- name: Login defaults | Read the value of the one line in the strict form and its first word as an administrator set it
  vars:
    __linux_compliance_remediate_ld_one: >-
      {{ __linux_compliance_remediate_ld_found | first
         if __linux_compliance_remediate_ld_found | length == 1 else '' }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_set: >-
      {{ __linux_compliance_remediate_ld_one | regex_replace(__linux_compliance_remediate_ld_strict, '\1')
         if __linux_compliance_remediate_ld_one is match(__linux_compliance_remediate_ld_strict) else none }}
    __linux_compliance_remediate_ld_token: >-
      {{ __linux_compliance_remediate_ld_one
         | regex_replace(__linux_compliance_remediate_ld_token_pattern ~ '.*$', '\1')
         if __linux_compliance_remediate_ld_one is match(__linux_compliance_remediate_ld_token_pattern) else '' }}
    __linux_compliance_remediate_ld_quoted: "{{ __linux_compliance_remediate_ld_one is search('\"') }}"
    __linux_compliance_remediate_ld_nul: "{{ __linux_compliance_remediate_ld_one is search('\\x00') }}"
    __linux_compliance_remediate_ld_unrecordable: >-
      {{ __linux_compliance_remediate_ld_one is search(__linux_compliance_remediate_login_defs_unrecordable_pattern) }}
    __linux_compliance_remediate_ld_inner_control: >-
      {{ __linux_compliance_remediate_ld_one
         | regex_replace('(?i)^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting ~ '[ \t][ \t\r\v\f]*', '')
         | regex_replace('[ \t\r\v\f]+$', '') is search('[\r\v\f]') }}
    __linux_compliance_remediate_ld_getdef: >-
      {{ __linux_compliance_remediate_ld_one
         | regex_replace('(?i)^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting
                         ~ '[ \t]+[ \t"]*[ \t\r\v\f]*([^ \t\r\v\f#"]*).*$', '\1')
         if __linux_compliance_remediate_ld_one
            is match('(?i)^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting ~ '[ \t]+')
         else '' }}
    __linux_compliance_remediate_ld_econf_separated: >-
      {{ __linux_compliance_remediate_ld_one | regex_replace('#.*$', '')
         is match('^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting ~ '[ \t].*[ \t=]') }}
    __linux_compliance_remediate_ld_econf_null: >-
      {{ (__linux_compliance_remediate_ld_econf_reader.numbers | default(false))
         and __linux_compliance_remediate_ld_one | regex_replace('#.*$', '')
             is match('^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting ~ '[ \t]?$') }}
    __linux_compliance_remediate_ld_econf_value: >-
      {{ __linux_compliance_remediate_ld_one | regex_replace('#.*$', '')
         | regex_replace('^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting
                         ~ '[ \t][ \t\r\v\f]*(?:=[ \t\r\v\f]*)?', '')
         | regex_replace('[ \t\r\v\f]+$', '') | regex_replace('^"(.+)"$', '\1')
         if __linux_compliance_remediate_ld_one
            is match('^[ \t]*' ~ __linux_compliance_remediate_rule.parameters.setting ~ '[ \t]')
         else '' }}
  tags:
    - always

- name: Login defaults | Decide whether the setting satisfies the content's check and the value to write, never looser
  vars:
    __linux_compliance_remediate_ld_comparison: "{{ __linux_compliance_remediate_rule.parameters.comparison }}"
    __linux_compliance_remediate_ld_required: >-
      {{ __linux_compliance_remediate_ld_values[__linux_compliance_remediate_rule.rule_id] }}
    __linux_compliance_remediate_ld_readings: >-
      {%- set token = __linux_compliance_remediate_ld_token -%}
      {%- set readings = [] -%}
      {%- if token is match('^[0-9]{1,6}$') -%}
      {%- set _ = readings.append(token | int) -%}
      {%- endif -%}
      {%- if token is match('^0[0-7]{1,6}$') -%}
      {%- set _ = readings.append(token | int(base=8)) -%}
      {%- endif -%}
      {%- if token is match('^0[xX][0-9a-fA-F]{1,4}$') -%}
      {%- set _ = readings.append(token[2:] | int(base=16)) -%}
      {%- endif -%}
      {%- if (__linux_compliance_remediate_ld_econf_reader.numbers | default(false))
            and __linux_compliance_remediate_ld_econf_value
                is match(__linux_compliance_remediate_login_defs_econf_number_pattern) -%}
      {%- set _ = readings.append(__linux_compliance_remediate_ld_econf_value
            | regex_replace(__linux_compliance_remediate_login_defs_econf_number_pattern ~ '.*$', '\\1') | int) -%}
      {%- endif -%}
      {{ readings }}
    __linux_compliance_remediate_ld_defaults: >-
      {{ [__linux_compliance_remediate_ld_econf_reader.default]
         if (__linux_compliance_remediate_ld_econf_reader.numbers | default(false))
            and (__linux_compliance_remediate_ld_found | length == 0
                 or not __linux_compliance_remediate_ld_econf_separated)
         else [] }}
    __linux_compliance_remediate_ld_bits: >-
      {%- set required = __linux_compliance_remediate_ld_required | int(base=8) -%}
      {%- set actual = (__linux_compliance_remediate_ld_token
            if __linux_compliance_remediate_ld_token
               is match(__linux_compliance_remediate_login_defs_umask_read_pattern)
            else '0') | int(base=8) -%}
      {%- set state = namespace(missing=0, union=0) -%}
      {%- for bit in [256, 128, 64, 32, 16, 8, 4, 2, 1] -%}
      {%- if (required // bit) % 2 == 1 and (actual // bit) % 2 == 0 -%}
      {%- set state.missing = state.missing + 1 -%}
      {%- endif -%}
      {%- if (required // bit) % 2 == 1 or (actual // bit) % 2 == 1 -%}
      {%- set state.union = state.union + bit -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'missing': state.missing, 'union': '%03o' | format(state.union)} }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_satisfied: >-
      {{ __linux_compliance_remediate_ld_set is not none
         and ((__linux_compliance_remediate_ld_comparison == 'at_most'
               and __linux_compliance_remediate_ld_set | int <= __linux_compliance_remediate_ld_required | int)
              or (__linux_compliance_remediate_ld_comparison == 'at_least'
                  and __linux_compliance_remediate_ld_set | int >= __linux_compliance_remediate_ld_required | int)
              or (__linux_compliance_remediate_ld_comparison == 'umask'
                  and __linux_compliance_remediate_ld_bits.missing == 0)
              or __linux_compliance_remediate_ld_comparison == 'equal')
         and (__linux_compliance_remediate_ld_econf_separated
              or not (__linux_compliance_remediate_ld_econf_reader.glues | default(false))) }}
    __linux_compliance_remediate_ld_unreadable: >-
      {{ __linux_compliance_remediate_ld_nul or __linux_compliance_remediate_ld_unrecordable
         or __linux_compliance_remediate_ld_econf_null
         or (__linux_compliance_remediate_ld_found | length == 0 and __linux_compliance_remediate_ld_keys | length > 0)
         or (__linux_compliance_remediate_ld_comparison != 'equal' and __linux_compliance_remediate_ld_inner_control)
         or ((__linux_compliance_remediate_ld_econf_reader.numbers | default(false))
             and __linux_compliance_remediate_ld_econf_value
                 is match(__linux_compliance_remediate_login_defs_econf_unread_pattern))
         or (__linux_compliance_remediate_ld_token | length > 0
         and ((__linux_compliance_remediate_ld_comparison == 'umask'
               and __linux_compliance_remediate_ld_token
                   is not match(__linux_compliance_remediate_login_defs_umask_read_pattern))
              or (__linux_compliance_remediate_ld_comparison in ['at_most', 'at_least']
                  and __linux_compliance_remediate_ld_readings | length == 0
                  and __linux_compliance_remediate_ld_token
                      is match(__linux_compliance_remediate_login_defs_base0_pattern)
                  and __linux_compliance_remediate_ld_token is not match('^"?-')
                  and not (__linux_compliance_remediate_ld_comparison == 'at_most'
                           and __linux_compliance_remediate_ld_token is match('^[1-9][0-9]{6,}$')))
              or (__linux_compliance_remediate_ld_comparison in ['at_most', 'at_least']
                  and __linux_compliance_remediate_ld_readings | length == 0
                  and __linux_compliance_remediate_ld_quoted
                  and __linux_compliance_remediate_ld_getdef
                      is match(__linux_compliance_remediate_login_defs_getdef_number_pattern)))) }}
    __linux_compliance_remediate_ld_line: >-
      {{ __linux_compliance_remediate_rule.parameters.setting
         ~ ('  ' if __linux_compliance_remediate_ld_econf_reader.glues | default(false) else ' ')
         ~ (__linux_compliance_remediate_ld_bits.union if __linux_compliance_remediate_ld_comparison == 'umask'
            else ([__linux_compliance_remediate_ld_required | int] + __linux_compliance_remediate_ld_readings) | min
            if __linux_compliance_remediate_ld_comparison == 'at_most'
            else ([__linux_compliance_remediate_ld_required | int] + __linux_compliance_remediate_ld_readings
                  + __linux_compliance_remediate_ld_defaults) | max
            if __linux_compliance_remediate_ld_comparison == 'at_least'
            else __linux_compliance_remediate_ld_required) | string }}
  tags:
    - always

- name: Login defaults | Decide whether the setting must be written
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_status: >-
      {{ 'method_changed' if __linux_compliance_remediate_ld_entry_method not in [none, 'line']
         else 'notapplicable' if not __linux_compliance_remediate_ld_stat.stat.exists
         else 'not_regular_file' if not __linux_compliance_remediate_ld_stat.stat.isreg
         else 'not_directory' if __linux_compliance_remediate_ld_not_directory
              and __linux_compliance_remediate_ld_reads_dropins
         else 'long_line' if __linux_compliance_remediate_ld_long_line
         else 'overridden' if __linux_compliance_remediate_ld_overriding | length > 0
         else 'unreadable_file' if __linux_compliance_remediate_ld_econf_blockers | length > 0
         else 'duplicate_setting' if __linux_compliance_remediate_ld_found | length > 1
              or __linux_compliance_remediate_ld_keys | length > 1
         else 'compliant' if __linux_compliance_remediate_ld_satisfied
         else 'unreadable_value' if __linux_compliance_remediate_ld_unreadable
         else 'applied' }}
  tags:
    - always

- name: Login defaults | Compose login.defs with the line of the setting in its place, every other byte unchanged
  vars:
    __linux_compliance_remediate_ld_index: >-
      {{ __linux_compliance_remediate_ld_text.split(__linux_compliance_remediate_newline)
         .index(__linux_compliance_remediate_ld_found | first)
         if __linux_compliance_remediate_ld_found | length == 1 else -1 }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_new_text: >-
      {{ (__linux_compliance_remediate_ld_text.split(__linux_compliance_remediate_newline)
          [:__linux_compliance_remediate_ld_index | int]
          + [__linux_compliance_remediate_ld_line]
          + __linux_compliance_remediate_ld_text.split(__linux_compliance_remediate_newline)
            [__linux_compliance_remediate_ld_index | int + 1:])
         | join(__linux_compliance_remediate_newline)
         if __linux_compliance_remediate_ld_index | int >= 0
         else __linux_compliance_remediate_ld_text ~ __linux_compliance_remediate_ld_line
              ~ __linux_compliance_remediate_newline
         if __linux_compliance_remediate_ld_text[-1:] in ['', __linux_compliance_remediate_newline]
         else __linux_compliance_remediate_ld_text ~ __linux_compliance_remediate_newline
              ~ __linux_compliance_remediate_ld_line }}
  when: __linux_compliance_remediate_ld_status == 'applied'
  tags:
    - always
