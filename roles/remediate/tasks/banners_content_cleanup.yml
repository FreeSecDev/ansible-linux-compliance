---
- name: Banners | Refuse to restore a banner that the dispatcher did not plan to clean up
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'banners'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'banners'
      - __linux_compliance_remediate_rule.parameters.attribute == 'content'
      - __linux_compliance_remediate_rule.ledger_entry is mapping
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'banners') | list | first | default({}))).cleanup | default([])
    fail_msg: >-
      banners_content_cleanup.yml runs only for a rule that the remediate dispatcher planned to clean
      up from its ledger entry, with linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Banners | Inspect the banner file before restoring it
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_bn_stat
  tags:
    - always

- name: Banners | Read the recorded prior content
  vars:
    __linux_compliance_remediate_bn_records: >-
      {{ __linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
         | selectattr('name', 'equalto', 'content_base64') | list }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_bn_recorded: "{{ __linux_compliance_remediate_bn_records | length == 1 }}"
    __linux_compliance_remediate_bn_prior: >-
      {{ (__linux_compliance_remediate_bn_records | first).value
         if __linux_compliance_remediate_bn_records | length == 1 else none }}
    __linux_compliance_remediate_bn_exists: "{{ __linux_compliance_remediate_bn_stat.stat.exists }}"
    __linux_compliance_remediate_bn_regular: "{{ __linux_compliance_remediate_bn_stat.stat.isreg | default(false) }}"
  tags:
    - always

- name: Banners | Name the reason a restore is impossible
  ansible.builtin.set_fact:
    __linux_compliance_remediate_bn_reason: >-
      {{ 'invalid_record' if not __linux_compliance_remediate_bn_recorded
         or (__linux_compliance_remediate_bn_prior is not none
             and not (__linux_compliance_remediate_bn_prior is string
                      and __linux_compliance_remediate_bn_prior | length % 4 == 0
                      and __linux_compliance_remediate_bn_prior is match('^[A-Za-z0-9+/]*={0,2}$')))
         else 'not_regular_file' if __linux_compliance_remediate_bn_exists
              and not __linux_compliance_remediate_bn_regular
         else 'target_absent' if __linux_compliance_remediate_bn_prior is not none
              and not __linux_compliance_remediate_bn_exists
         else none }}
  tags:
    - always

- name: Banners | Decide how the prior state is restored
  ansible.builtin.set_fact:
    __linux_compliance_remediate_bn_restorable: "{{ __linux_compliance_remediate_bn_reason is none }}"
    __linux_compliance_remediate_bn_remove: >-
      {{ __linux_compliance_remediate_bn_reason is none and __linux_compliance_remediate_bn_prior is none
         and __linux_compliance_remediate_bn_exists }}
    __linux_compliance_remediate_bn_rewrite: >-
      {{ __linux_compliance_remediate_bn_reason is none and __linux_compliance_remediate_bn_prior is not none }}
  tags:
    - always

- name: Banners | Remove the banner file that did not exist before the collection wrote it
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    state: absent
  register: __linux_compliance_remediate_bn_removed
  when: __linux_compliance_remediate_bn_remove
  tags:
    - always

- name: Banners | Restore the recorded prior content, keeping the current mode and owner
  ansible.builtin.copy:
    content: "{{ __linux_compliance_remediate_bn_prior | b64decode }}"
    dest: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    force: true
    mode: "{{ __linux_compliance_remediate_bn_stat.stat.mode }}"
  register: __linux_compliance_remediate_bn_restored
  when: __linux_compliance_remediate_bn_rewrite
  tags:
    - always

- name: Banners | Forget the rule in the state ledger after the restore
  freesecdev.linux_compliance.control_state:
    action: remove
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
  register: __linux_compliance_remediate_bn_forget
  when: __linux_compliance_remediate_bn_restorable
  tags:
    - always

- name: Banners | Add the result of the cleanup
  vars:
    __linux_compliance_remediate_bn_cleanup_status: >-
      {{ 'restored' if __linux_compliance_remediate_bn_restorable else 'cleanup_incomplete' }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'cleanup',
           'status': __linux_compliance_remediate_bn_cleanup_status,
           'reason': __linux_compliance_remediate_bn_reason,
           'changed': (__linux_compliance_remediate_bn_removed is changed)
                      or (__linux_compliance_remediate_bn_restored is changed)
                      or (__linux_compliance_remediate_bn_forget is changed),
           'message': __linux_compliance_remediate_rule.rule_id ~ ': ' ~ __linux_compliance_remediate_bn_cleanup_status
                      ~ ((' (' ~ __linux_compliance_remediate_bn_reason ~ ': '
                          ~ __linux_compliance_remediate_rule.parameters.path
                          ~ '; the ledger entry is kept and the cleanup is retried on the next run)')
                         if __linux_compliance_remediate_bn_reason else '')
         }] }}
  tags:
    - always
