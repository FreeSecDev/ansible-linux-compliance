---
- name: Account lock-out | Refuse to run outside the dispatcher or without the opt-in
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - __linux_compliance_remediate_family is defined
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'faillock'
      - >-
        __linux_compliance_remediate_family ==
        (__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'faillock') | list | first | default({}))
    fail_msg: >-
      The faillock family file runs only from the remediate dispatcher with
      linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Account lock-out | Name the file that pam_faillock reads and the module lines that override it
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc:
      family: faillock
      path: "{{ __linux_compliance_remediate_faillock_conf }}"
      module: pam_faillock
      type: auth
  tags:
    - always

- name: Account lock-out | Validate the rules, resolve the profile values and read the PAM stack
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pam_conf_prepare.yml"
    apply:
      tags:
        - always
  tags:
    - always

- name: Account lock-out | Restore the settings of rules no longer effective
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pam_conf_cleanup.yml"
    apply:
      tags:
        - always
  loop: "{{ __linux_compliance_remediate_family.cleanup }}"
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always

- name: Account lock-out | Set the settings of the effective rules
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pam_conf_apply.yml"
    apply:
      tags:
        - always
  loop: "{{ __linux_compliance_remediate_family.apply }}"
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always
