---
- name: Password quality | Refuse to restore a main file setting that the dispatcher did not plan to clean up
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'pwquality'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'pwquality'
      - >-
        __linux_compliance_remediate_pwq_benchmark
        in __linux_compliance_remediate_rule.parameters.main_file_benchmarks
      - __linux_compliance_remediate_rule.ledger_entry is mapping
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'pwquality') | list | first | default({}))).cleanup | default([])
    fail_msg: >-
      pwquality_main_cleanup.yml runs only for a rule that the remediate dispatcher planned to clean up from its
      ledger entry, for content whose check reads only the main file, with linux_compliance_remediate_enabled true.
      No change was made to the host.
    quiet: true
  tags:
    - always

- name: Password quality | Inspect the main file before restoring the setting
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_pwquality_main }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_pwq_stat
  tags:
    - always

- name: Password quality | Read the main file to check that the setting is still the line the collection wrote
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_pwquality_main }}"
  register: __linux_compliance_remediate_pwq_current
  when: __linux_compliance_remediate_pwq_stat.stat.isreg | default(false)
  tags:
    - always

- name: Password quality | Read the recorded prior state of the setting and of the main file
  vars:
    __linux_compliance_remediate_pwq_records: >-
      {{ __linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
         | items2dict(key_name='name', value_name='value') }}
    __linux_compliance_remediate_pwq_setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_prior: "{{ __linux_compliance_remediate_pwq_records }}"
    __linux_compliance_remediate_pwq_entry_method: >-
      {{ __linux_compliance_remediate_pwq_records.method | default('unknown') }}
    __linux_compliance_remediate_pwq_regexp: >-
      {{ '^[ \t]*' ~ __linux_compliance_remediate_pwq_setting
         ~ ('[ \t]*$' if __linux_compliance_remediate_rule.parameters.value_id is not defined else '[ \t]*=') }}
    __linux_compliance_remediate_pwq_found: >-
      {{ ((__linux_compliance_remediate_pwq_current.content | b64decode)
          | regex_findall('(?m)^[ \t]*' ~ __linux_compliance_remediate_pwq_setting
                          ~ ('[ \t]*$' if __linux_compliance_remediate_rule.parameters.value_id is not defined
                             else '[ \t]*=.*$')))
         if __linux_compliance_remediate_pwq_current is not skipped else [] }}
  tags:
    - always

- name: Password quality | Name the reason the prior state cannot be restored
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_reason: >-
      {{ 'method_changed' if __linux_compliance_remediate_pwq_entry_method != 'main_file'
         else 'target_absent' if not __linux_compliance_remediate_pwq_stat.stat.exists
         else 'not_regular_file' if not __linux_compliance_remediate_pwq_stat.stat.isreg
         else 'invalid_record' if not (
              'setting_line' in __linux_compliance_remediate_pwq_prior
              and (__linux_compliance_remediate_pwq_prior.setting_line is none
                   or (__linux_compliance_remediate_pwq_prior.setting_line is string
                       and __linux_compliance_remediate_newline
                           not in __linux_compliance_remediate_pwq_prior.setting_line
                       and __linux_compliance_remediate_pwq_prior.setting_line
                           is search(__linux_compliance_remediate_pwq_regexp)))
              and __linux_compliance_remediate_pwq_prior.written_line | default(none) is string
              and __linux_compliance_remediate_pwq_prior.written_line
                  is search(__linux_compliance_remediate_pwq_regexp)
              and __linux_compliance_remediate_pwq_prior.mode | default('') is match('^[0-7]{4}$')
              and __linux_compliance_remediate_pwq_prior.owner | default('') is match('^[0-9]{1,10}$')
              and __linux_compliance_remediate_pwq_prior.group | default('') is match('^[0-9]{1,10}$'))
         else 'modified_since_apply' if
              __linux_compliance_remediate_pwq_found != [__linux_compliance_remediate_pwq_prior.written_line]
              or __linux_compliance_remediate_pwq_stat.stat.mode != __linux_compliance_remediate_pwq_prior.mode
              or (__linux_compliance_remediate_pwq_stat.stat.uid | string)
                 != __linux_compliance_remediate_pwq_prior.owner
              or (__linux_compliance_remediate_pwq_stat.stat.gid | string)
                 != __linux_compliance_remediate_pwq_prior.group
         else none }}
  tags:
    - always

- name: Password quality | Remove the setting that the main file did not have before
  ansible.builtin.lineinfile:
    path: "{{ __linux_compliance_remediate_pwquality_main }}"
    regexp: "{{ __linux_compliance_remediate_pwq_regexp }}"
    state: absent
  register: __linux_compliance_remediate_pwq_removal
  when:
    - __linux_compliance_remediate_pwq_reason is none
    - __linux_compliance_remediate_pwq_prior.setting_line is none
  tags:
    - always

- name: Password quality | Write back the line that the main file had before
  ansible.builtin.lineinfile:
    path: "{{ __linux_compliance_remediate_pwquality_main }}"
    regexp: "{{ __linux_compliance_remediate_pwq_regexp }}"
    line: "{{ __linux_compliance_remediate_pwq_prior.setting_line }}"
    state: present
    create: false
  register: __linux_compliance_remediate_pwq_restored
  when:
    - __linux_compliance_remediate_pwq_reason is none
    - __linux_compliance_remediate_pwq_prior.setting_line is not none
  tags:
    - always

- name: Password quality | Forget the rule in the state ledger after the restore
  freesecdev.linux_compliance.control_state:
    action: remove
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
  register: __linux_compliance_remediate_pwq_forget
  when: __linux_compliance_remediate_pwq_reason is none
  tags:
    - always

- name: Password quality | Add the result of the cleanup
  vars:
    __linux_compliance_remediate_pwq_cleanup_status: >-
      {{ 'restored' if __linux_compliance_remediate_pwq_reason is none else 'cleanup_incomplete' }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'cleanup',
           'status': __linux_compliance_remediate_pwq_cleanup_status,
           'reason': __linux_compliance_remediate_pwq_reason,
           'changed': (__linux_compliance_remediate_pwq_removal is changed)
                      or (__linux_compliance_remediate_pwq_restored is changed)
                      or (__linux_compliance_remediate_pwq_forget is changed),
           'message': __linux_compliance_remediate_rule.rule_id ~ ': ' ~ __linux_compliance_remediate_pwq_cleanup_status
                      ~ ((' (' ~ __linux_compliance_remediate_pwq_reason ~ ': '
                          ~ __linux_compliance_remediate_pwquality_main
                          ~ '; nothing was changed, the ledger entry is kept and the cleanup is retried on the'
                          ~ ' next run)')
                         if __linux_compliance_remediate_pwq_reason else '')
         }] }}
  tags:
    - always
