---
- name: SSH server | Refuse to run outside the dispatcher or without the opt-in
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - __linux_compliance_remediate_family is defined
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'ssh'
      - >-
        __linux_compliance_remediate_family ==
        (__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'ssh') | list | first | default({}))
    fail_msg: >-
      The ssh family file runs only from the remediate dispatcher with
      linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: SSH server | Inspect the main configuration file and the drop-in directory
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_ssh_path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ __linux_compliance_remediate_sshd_main }}"
    - "{{ __linux_compliance_remediate_sshd_directory }}"
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_path
  register: __linux_compliance_remediate_ssh_inspected
  tags:
    - always

- name: SSH server | Name what the inspection found and the drop-ins that the collection owns
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_main_stat: "{{ __linux_compliance_remediate_ssh_inspected.results[0].stat }}"
    __linux_compliance_remediate_ssh_directory_stat: "{{ __linux_compliance_remediate_ssh_inspected.results[1].stat }}"
    __linux_compliance_remediate_ssh_owned: >-
      {{ __linux_compliance_remediate_rules | selectattr('family', 'equalto', 'ssh')
         | map(attribute='parameters') | map(attribute='path') | list }}
    __linux_compliance_remediate_ssh_benchmark: "{{ linux_compliance_discovered.benchmark_id }}"
    __linux_compliance_remediate_ssh_removed: []
    __linux_compliance_remediate_ssh_written: []
  tags:
    - always

- name: SSH server | Resolve the value that the content or the profile requires for every rule to apply
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_values: >-
      {%- set values = {} -%}
      {%- for rule in __linux_compliance_remediate_family.apply -%}
      {%- if rule.parameters.value_id is defined -%}
      {%- set found = rule.parameters.profile_values | default([])
            | selectattr('content_sha256', 'equalto', linux_compliance_discovered.content_sha256)
            | selectattr('profiles', 'contains', linux_compliance_remediate_profile)
            | map(attribute='value') | map('join', '') | list -%}
      {%- set _ = values.update({rule.rule_id: found | first | default(none)}) -%}
      {%- elif rule.parameters.value is string -%}
      {%- set _ = values.update({rule.rule_id: rule.parameters.value}) -%}
      {%- else -%}
      {%- set _ = values.update({rule.rule_id: rule.parameters.value | default([]) | join('')}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ values }}
  tags:
    - always

- name: SSH server | Refuse a rule without a usable keyword, value or drop-in path before anything changes
  ansible.builtin.assert:
    that:
      - __linux_compliance_remediate_ssh_values[__linux_compliance_remediate_ssh_rule.rule_id] is string
      - >-
        __linux_compliance_remediate_ssh_values[__linux_compliance_remediate_ssh_rule.rule_id]
        is match('^[A-Za-z0-9@.,:/_+][A-Za-z0-9@.,:/_+-]{0,1023}$')
      - __linux_compliance_remediate_ssh_rule.parameters.keyword is match('^[A-Za-z0-9]{1,40}$')
      - >-
        __linux_compliance_remediate_ssh_rule.parameters.path
        is match('^/etc/ssh/sshd_config\.d/00-freesecdev-[a-z0-9-]{1,64}\.conf$')
      - >-
        (__linux_compliance_remediate_family.apply
         | map(attribute='parameters.keyword') | map('lower')
         | select('equalto', __linux_compliance_remediate_ssh_rule.parameters.keyword | lower) | list | length) == 1
    fail_msg: >-
      {{ __linux_compliance_remediate_ssh_rule.rule_id }} needs the keyword
      {{ __linux_compliance_remediate_ssh_rule.parameters.keyword | default('') }} with one value of letters, digits
      and @.,:/_+- ({{ __linux_compliance_remediate_ssh_rule.parameters.value_id | default('a fixed value') }} for the
      profile {{ linux_compliance_remediate_profile }} in the content {{ linux_compliance_discovered.content_sha256 }}),
      a drop-in below /etc/ssh/sshd_config.d named 00-freesecdev-*.conf, and no other rule of this run may set the same
      keyword; the catalogue holds
      {{ __linux_compliance_remediate_ssh_values[__linux_compliance_remediate_ssh_rule.rule_id] }}. The values are
      generated from the pinned content (ADR 0023); no sshd setting was changed.
    quiet: true
  loop: "{{ __linux_compliance_remediate_family.apply }}"
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_rule
    label: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  tags:
    - always

- name: SSH server | Compose the drop-in of every rule to apply and read the prior state of every rule to clean up
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_lines: >-
      {{ dict(__linux_compliance_remediate_family.apply | map(attribute='rule_id')
              | zip(__linux_compliance_remediate_family.apply | map(attribute='parameters.keyword')
                    | zip(__linux_compliance_remediate_family.apply | map(attribute='rule_id')
                          | map('extract', __linux_compliance_remediate_ssh_values))
                    | map('join', ' '))) }}
    __linux_compliance_remediate_ssh_records: >-
      {%- set records = {} -%}
      {%- for rule in __linux_compliance_remediate_family.apply + __linux_compliance_remediate_family.cleanup -%}
      {%- set _ = records.update({rule.rule_id: (rule.ledger_entry.prior_values | default([])
            | items2dict(key_name='name', value_name='value')) if rule.ledger_entry is mapping else none}) -%}
      {%- endfor -%}
      {{ records }}
  tags:
    - always

- name: SSH server | Compose the content and the SHA-256 of every drop-in to apply
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_contents: >-
      {%- set contents = {} -%}
      {%- for rule in __linux_compliance_remediate_family.apply -%}
      {%- set _ = contents.update({rule.rule_id:
            '# Managed by freesecdev.linux_compliance for ' ~ rule.rule_id ~ '.' ~ __linux_compliance_remediate_newline
            ~ '# Switching the rule or the ssh topic off removes this file.' ~ __linux_compliance_remediate_newline
            ~ __linux_compliance_remediate_ssh_lines[rule.rule_id] ~ __linux_compliance_remediate_newline}) -%}
      {%- endfor -%}
      {{ contents }}
  tags:
    - always

- name: SSH server | Name the SHA-256 that the collection expects of each drop-in that it applies or cleans up
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_known: >-
      {%- set known = {} -%}
      {%- for rule in __linux_compliance_remediate_family.cleanup -%}
      {%- set _ = known.update({rule.parameters.path:
            (__linux_compliance_remediate_ssh_records[rule.rule_id] | default({}, true)).dropin_sha256
            | default('')}) -%}
      {%- endfor -%}
      {%- for rule in __linux_compliance_remediate_family.apply -%}
      {%- set _ = known.update({rule.parameters.path:
            __linux_compliance_remediate_ssh_contents[rule.rule_id] | hash('sha256')}) -%}
      {%- endfor -%}
      {{ known }}
  tags:
    - always

- name: SSH server | List every entry of the drop-in directory without following a symbolic link
  ansible.builtin.find:
    paths: "{{ __linux_compliance_remediate_sshd_directory }}"
    file_type: any
    follow: false
    hidden: true
    recurse: false
    get_checksum: true
    checksum_algorithm: sha256
  register: __linux_compliance_remediate_ssh_found
  when: __linux_compliance_remediate_ssh_directory_stat.isdir | default(false)
  tags:
    - always

- name: SSH server | Name the entries of the drop-in directory and the drop-ins that sshd reads
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_entries: >-
      {{ dict(__linux_compliance_remediate_ssh_found.files | default([]) | map(attribute='path')
              | zip(__linux_compliance_remediate_ssh_found.files | default([]))) }}
    __linux_compliance_remediate_ssh_dropins: >-
      {{ __linux_compliance_remediate_ssh_found.files | default([]) | map(attribute='path')
         | select('match', '^' ~ (__linux_compliance_remediate_sshd_directory | regex_escape) ~ '/[^./][^/]*\.conf$')
         | sort | list }}
  tags:
    - always

- name: SSH server | Read the main file and every drop-in whose content the collection does not know
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_ssh_source }}"
  loop: >-
    {{ ([__linux_compliance_remediate_sshd_main]
        if (__linux_compliance_remediate_ssh_main_stat.isreg | default(false))
           and __linux_compliance_remediate_family.apply | length > 0 else [])
       + (__linux_compliance_remediate_ssh_dropins
          | select('in', __linux_compliance_remediate_ssh_entries
                         | dict2items | selectattr('value.isreg') | map(attribute='key') | list)
          | select('in', __linux_compliance_remediate_ssh_dropins
                         if __linux_compliance_remediate_family.apply | length > 0
                         else __linux_compliance_remediate_ssh_owned)
          | list) }}
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_source
  register: __linux_compliance_remediate_ssh_read
  when: >-
    __linux_compliance_remediate_ssh_source == __linux_compliance_remediate_sshd_main
    or __linux_compliance_remediate_ssh_source not in __linux_compliance_remediate_ssh_known
    or __linux_compliance_remediate_ssh_entries[__linux_compliance_remediate_ssh_source].checksum | default('')
       != __linux_compliance_remediate_ssh_known[__linux_compliance_remediate_ssh_source]
  tags:
    - always

- name: SSH server | Keep the text of the files that were read
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_texts: >-
      {{ dict(__linux_compliance_remediate_ssh_read.results | default([]) | rejectattr('skipped', 'defined')
              | map(attribute='__linux_compliance_remediate_ssh_source')
              | zip(__linux_compliance_remediate_ssh_read.results | default([]) | rejectattr('skipped', 'defined')
                    | map(attribute='content') | map('b64decode'))) }}
  tags:
    - always

- name: SSH server | Name the reason each drop-in of a rule that is no longer effective cannot be removed
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_cleanup_reasons: >-
      {%- set reasons = {} -%}
      {%- for rule in __linux_compliance_remediate_family.cleanup -%}
      {%- set prior = __linux_compliance_remediate_ssh_records[rule.rule_id] | default({}, true) -%}
      {%- set entry = __linux_compliance_remediate_ssh_entries[rule.parameters.path] | default(none) -%}
      {%- set text = __linux_compliance_remediate_ssh_texts[rule.parameters.path] | default('') -%}
      {%- set header = '# Managed by freesecdev.linux_compliance for ' ~ rule.rule_id ~ '.' -%}
      {%- set sha = prior.dropin_sha256 | default(none) -%}
      {%- set valid_sha = sha is string and sha is match('^[0-9a-f]{64}$') -%}
      {%- set reason =
            'method_changed' if prior.method | default('unknown') != 'dropin'
            else 'not_directory' if (__linux_compliance_remediate_ssh_directory_stat.exists | default(false))
                 and not (__linux_compliance_remediate_ssh_directory_stat.isdir | default(false))
            else 'not_regular_file' if entry is not none and not entry.isreg
            else 'not_owned' if entry is not none and entry.checksum | default('') != sha
                 and not text.startswith(header)
            else 'invalid_record' if not valid_sha
            else 'modified_since_apply' if entry is not none and entry.checksum | default('') != sha
            else none -%}
      {%- set _ = reasons.update({rule.rule_id: reason}) -%}
      {%- endfor -%}
      {{ reasons }}
  tags:
    - always

- name: SSH server | Remove the drop-ins that the collection wrote for rules that are no longer effective
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_ssh_rule.parameters.path }}"
    state: absent
  loop: >-
    {{ __linux_compliance_remediate_family.cleanup
       | selectattr('rule_id', 'in', __linux_compliance_remediate_ssh_cleanup_reasons | dict2items
                                     | rejectattr('value') | map(attribute='key') | list)
       | selectattr('parameters.path', 'in', __linux_compliance_remediate_ssh_entries.keys() | list) | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_rule
    label: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  register: __linux_compliance_remediate_ssh_removal
  tags:
    - always

- name: SSH server | Forget the rules in the state ledger whose drop-in is gone
  freesecdev.linux_compliance.control_state:
    action: remove
    rule_id: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  loop: >-
    {{ __linux_compliance_remediate_family.cleanup
       | selectattr('rule_id', 'in', __linux_compliance_remediate_ssh_cleanup_reasons | dict2items
                                     | rejectattr('value') | map(attribute='key') | list) | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_rule
    label: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  register: __linux_compliance_remediate_ssh_forget
  tags:
    - always

- name: SSH server | Add the result of every cleanup and remember the drop-ins that this run removes
  vars:
    __linux_compliance_remediate_ssh_removed_ids: >-
      {{ __linux_compliance_remediate_ssh_removal.results | default([]) | selectattr('changed')
         | map(attribute='__linux_compliance_remediate_ssh_rule.rule_id') | list }}
    __linux_compliance_remediate_ssh_forgotten_ids: >-
      {{ __linux_compliance_remediate_ssh_forget.results | default([]) | selectattr('changed')
         | map(attribute='__linux_compliance_remediate_ssh_rule.rule_id') | list }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_removed: >-
      {{ __linux_compliance_remediate_family.cleanup
         | selectattr('rule_id', 'in', __linux_compliance_remediate_ssh_cleanup_reasons | dict2items
                                       | rejectattr('value') | map(attribute='key') | list)
         | map(attribute='parameters.path') | list }}
    __linux_compliance_remediate_results: >-
      {%- set results = [] -%}
      {%- for rule in __linux_compliance_remediate_family.cleanup -%}
      {%- set reason = __linux_compliance_remediate_ssh_cleanup_reasons[rule.rule_id] -%}
      {%- set present = rule.parameters.path in __linux_compliance_remediate_ssh_entries -%}
      {%- set _ = results.append({
            'rule_id': rule.rule_id,
            'family': rule.family,
            'action': 'cleanup',
            'status': 'restored' if reason is none else 'cleanup_incomplete',
            'reason': reason,
            'changed': rule.rule_id in __linux_compliance_remediate_ssh_removed_ids
                       or rule.rule_id in __linux_compliance_remediate_ssh_forgotten_ids,
            'message': rule.parameters.path ~ ': '
                       ~ (('restored (the drop-in was removed)' if present
                           else 'restored (the drop-in no longer existed, which is the recorded prior state;'
                                ~ ' nothing was written)') if reason is none
                          else 'cleanup_incomplete (' ~ reason
                               ~ '; nothing was changed, the ledger entry is kept and the cleanup is retried on the'
                               ~ ' next run)')}) -%}
      {%- endfor -%}
      {{ __linux_compliance_remediate_results + results }}
  tags:
    - always

- name: SSH server | Find where the main file includes the drop-ins and what it sets before and after them
  vars:
    __linux_compliance_remediate_ssh_main_lines: >-
      {{ (__linux_compliance_remediate_ssh_texts[__linux_compliance_remediate_sshd_main] | default(''))
         .split(__linux_compliance_remediate_newline) }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_layout: >-
      {%- set ns = namespace(include=-1, match=-1) -%}
      {%- for line in __linux_compliance_remediate_ssh_main_lines -%}
      {%- if ns.match < 0 and line is match('(?i)[ \t]*match[ \t]') -%}
      {%- set ns.match = loop.index0 -%}
      {%- endif -%}
      {%- if ns.include < 0 and line is match('(?i)[ \t]*include[ \t]')
            and line.split()[1:] | select('in', [__linux_compliance_remediate_sshd_directory ~ '/*.conf',
                                                 'sshd_config.d/*.conf']) | list | length > 0 -%}
      {%- set ns.include = loop.index0 -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'included': ns.include >= 0 and (ns.match < 0 or ns.include < ns.match),
          'before': (__linux_compliance_remediate_ssh_main_lines[:ns.include]
                     | join(__linux_compliance_remediate_newline)) if ns.include >= 0 else '',
          'after': (__linux_compliance_remediate_ssh_main_lines[ns.include + 1:]
                    | join(__linux_compliance_remediate_newline)) if ns.include >= 0 else ''} }}
  tags:
    - always

- name: SSH server | Decide for every rule to apply whether its drop-in can be written and would take effect
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_plan: >-
      {%- set plan = {} -%}
      {%- set layout = __linux_compliance_remediate_ssh_layout -%}
      {%- set remaining = __linux_compliance_remediate_ssh_dropins
            | reject('in', __linux_compliance_remediate_ssh_removed) | list -%}
      {%- for rule in __linux_compliance_remediate_family.apply -%}
      {%- set path = rule.parameters.path -%}
      {%- set name = path | basename -%}
      {%- set setting = '(?im)^[ \t]*' ~ rule.parameters.keyword ~ '([ \t]*=|[ \t]+)' -%}
      {%- set prior = __linux_compliance_remediate_ssh_records[rule.rule_id] -%}
      {%- set entry = __linux_compliance_remediate_ssh_entries[path] | default(none) -%}
      {%- set text = __linux_compliance_remediate_ssh_texts[path] | default('') -%}
      {%- set header = '# Managed by freesecdev.linux_compliance for ' ~ rule.rule_id ~ '.' -%}
      {%- set sha = __linux_compliance_remediate_ssh_contents[rule.rule_id] | hash('sha256') -%}
      {%- set earlier = [] -%}
      {%- set later = [] -%}
      {%- if layout.before is search(setting) -%}
      {%- set _ = earlier.append(__linux_compliance_remediate_sshd_main) -%}
      {%- endif -%}
      {%- for other in remaining if other != path -%}
      {%- set known = __linux_compliance_remediate_ssh_texts[other]
            | default(__linux_compliance_remediate_ssh_contents[(__linux_compliance_remediate_family.apply
                      | selectattr('parameters.path', 'equalto', other) | map(attribute='rule_id') | first
                      | default(''))] | default(none)) -%}
      {%- set sets = known is none or known is search(setting)
            or ((other | basename) < name and known is search('(?im)^[ \t]*include([ \t]*=|[ \t]+)')) -%}
      {%- if sets and (other | basename) < name -%}
      {%- set _ = earlier.append(other) -%}
      {%- elif sets -%}
      {%- set _ = later.append(other) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if layout.after is search(setting) -%}
      {%- set _ = later.append(__linux_compliance_remediate_sshd_main) -%}
      {%- endif -%}
      {%- set status =
            'method_changed' if prior is mapping and prior.method | default('unknown') != 'dropin'
            else 'notapplicable' if not (__linux_compliance_remediate_ssh_main_stat.exists | default(false))
            else 'not_regular_file' if not (__linux_compliance_remediate_ssh_main_stat.isreg | default(false))
            else 'crypto_policy' if __linux_compliance_remediate_ssh_benchmark
                 in rule.parameters.crypto_policy_benchmarks | default([])
            else 'not_directory' if (__linux_compliance_remediate_ssh_directory_stat.exists | default(false))
                 and not (__linux_compliance_remediate_ssh_directory_stat.isdir | default(false))
            else 'not_included' if not layout.included
            else 'not_regular_file' if entry is not none and not entry.isreg
            else 'not_owned' if entry is not none and entry.checksum | default('') != sha
                 and not text.startswith(header)
            else 'overridden' if earlier | length > 0
            else 'compliant' if entry is not none and entry.checksum | default('') == sha
            else 'applied' -%}
      {%- set reason =
            ('the ledger entry was recorded by the ' ~ prior.method | default('unknown')
             ~ ' method; clean it up first') if status == 'method_changed'
            else (__linux_compliance_remediate_sshd_main ~ ' does not exist; sshd is not installed')
                 if status == 'notapplicable'
            else (__linux_compliance_remediate_sshd_main ~ ' is not a regular file')
                 if status == 'not_regular_file'
                    and not (__linux_compliance_remediate_ssh_main_stat.isreg | default(false))
            else (rule.parameters.keyword ~ ' is governed by the system-wide crypto policy on this platform'
                  ~ ' (rule sshd_include_crypto_policy, topic crypto_policy)') if status == 'crypto_policy'
            else (__linux_compliance_remediate_sshd_directory ~ ' is not a directory') if status == 'not_directory'
            else (__linux_compliance_remediate_sshd_main ~ ' does not include '
                  ~ __linux_compliance_remediate_sshd_directory ~ '/*.conf before its first Match block')
                 if status == 'not_included'
            else (path ~ ' is not a regular file') if status == 'not_regular_file'
            else (path ~ ' does not carry the header of the collection') if status == 'not_owned'
            else ('set first by ' ~ earlier | join(', ')) if status == 'overridden'
            else none -%}
      {%- set _ = plan.update({rule.rule_id: {'status': status, 'reason': reason, 'later': later}}) -%}
      {%- endfor -%}
      {{ plan }}
  tags:
    - always

- name: SSH server | Name the rules whose drop-in must be written and the settings that sshd must accept
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_to_write: >-
      {{ __linux_compliance_remediate_family.apply
         | selectattr('rule_id', 'in', __linux_compliance_remediate_ssh_plan | dict2items
                                       | selectattr('value.status', 'equalto', 'applied')
                                       | map(attribute='key') | list) | list }}
    __linux_compliance_remediate_ssh_settings: >-
      {%- set settings = [] -%}
      {%- for rule in __linux_compliance_remediate_family.apply
            if __linux_compliance_remediate_ssh_plan[rule.rule_id].status == 'applied' -%}
      {%- set _ = settings.append({'keyword': rule.parameters.keyword,
                                   'value': __linux_compliance_remediate_ssh_values[rule.rule_id]}) -%}
      {%- endfor -%}
      {{ settings }}
  tags:
    - always

- name: SSH server | Validate the effective configuration with every drop-in to write, before writing any
  freesecdev.linux_compliance.sshd_validate:
    settings: "{{ __linux_compliance_remediate_ssh_settings }}"
  register: __linux_compliance_remediate_ssh_validation
  when: __linux_compliance_remediate_ssh_to_write | length > 0
  tags:
    - always

- name: SSH server | Refuse every drop-in when sshd is missing or would not accept the configuration
  vars:
    __linux_compliance_remediate_ssh_refusal: >-
      {{ {'status': 'notapplicable', 'reason': 'sshd is not installed: '
                                               ~ __linux_compliance_remediate_ssh_validation.message,
          'later': []}
         if not __linux_compliance_remediate_ssh_validation.available
         else {'status': 'invalid_config',
               'reason': 'sshd -t refuses the configuration with these settings: '
                         ~ __linux_compliance_remediate_ssh_validation.message,
               'later': []} }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_plan: >-
      {{ __linux_compliance_remediate_ssh_plan
         | combine(dict(__linux_compliance_remediate_ssh_to_write | map(attribute='rule_id')
                        | zip([__linux_compliance_remediate_ssh_refusal]
                              * __linux_compliance_remediate_ssh_to_write | length))) }}
    __linux_compliance_remediate_ssh_to_write: []
  when:
    - __linux_compliance_remediate_ssh_validation is not skipped
    - not __linux_compliance_remediate_ssh_validation.valid
  tags:
    - always

- name: SSH server | Name whether the drop-in directory must be created
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_directory_missing: >-
      {{ not (__linux_compliance_remediate_ssh_directory_stat.exists | default(false)) }}
  tags:
    - always

- name: SSH server | Create the drop-in directory that the main file includes but that does not exist
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_sshd_directory }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  register: __linux_compliance_remediate_ssh_directory_created
  when:
    - __linux_compliance_remediate_ssh_to_write | length > 0
    - __linux_compliance_remediate_ssh_directory_missing
  tags:
    - always

- name: SSH server | Mark the directory as created by the collection, so cleanup can remove it
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_sshd_marker }}"
    state: touch
    mode: "0600"
    owner: root
    group: root
    access_time: preserve
    modification_time: preserve
  when:
    - __linux_compliance_remediate_ssh_to_write | length > 0
    - __linux_compliance_remediate_ssh_directory_missing
  tags:
    - always

- name: SSH server | Record that each drop-in did not exist, and what the collection writes, before writing it
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_ssh_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_ssh_rule.revert_strategy }}"
    prior_values:
      - name: method
        value: dropin
      - name: dropin
        value: null
      - name: dropin_sha256
        value: >-
          {{ __linux_compliance_remediate_ssh_contents[__linux_compliance_remediate_ssh_rule.rule_id]
             | hash('sha256') }}
      - name: written_line
        value: "{{ __linux_compliance_remediate_ssh_lines[__linux_compliance_remediate_ssh_rule.rule_id] }}"
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
  loop: "{{ __linux_compliance_remediate_ssh_to_write | selectattr('ledger_entry', 'none') | list }}"
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_rule
    label: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  register: __linux_compliance_remediate_ssh_record
  tags:
    - always

- name: SSH server | Keep the recorded prior state and record the new content when the value changed
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_ssh_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_ssh_rule.revert_strategy }}"
    prior_values: >-
      {{ __linux_compliance_remediate_ssh_records[__linux_compliance_remediate_ssh_rule.rule_id]
         | combine({'dropin_sha256': __linux_compliance_remediate_ssh_contents[
                      __linux_compliance_remediate_ssh_rule.rule_id] | hash('sha256'),
                    'written_line': __linux_compliance_remediate_ssh_lines[
                      __linux_compliance_remediate_ssh_rule.rule_id]})
         | dict2items(key_name='name', value_name='value') }}
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
    replace: true
  loop: >-
    {{ __linux_compliance_remediate_family.apply
       | selectattr('rule_id', 'in', __linux_compliance_remediate_ssh_plan | dict2items
                                     | selectattr('value.status', 'in', ['applied', 'compliant'])
                                     | map(attribute='key') | list)
       | rejectattr('ledger_entry', 'none') | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_rule
    label: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  register: __linux_compliance_remediate_ssh_rerecord
  when:
    - >-
      (__linux_compliance_remediate_ssh_records[__linux_compliance_remediate_ssh_rule.rule_id] | default({}, true))
      .method | default('') == 'dropin'
    - >-
      (__linux_compliance_remediate_ssh_records[__linux_compliance_remediate_ssh_rule.rule_id] | default({}, true))
      .dropin_sha256 | default('')
      != __linux_compliance_remediate_ssh_contents[__linux_compliance_remediate_ssh_rule.rule_id] | hash('sha256')
      or (__linux_compliance_remediate_ssh_records[__linux_compliance_remediate_ssh_rule.rule_id]
          | default({}, true)).written_line | default('')
         != __linux_compliance_remediate_ssh_lines[__linux_compliance_remediate_ssh_rule.rule_id]
  tags:
    - always

- name: SSH server | Write the drop-in of every rule, which sshd reads before the other files
  ansible.builtin.copy:
    content: "{{ __linux_compliance_remediate_ssh_contents[__linux_compliance_remediate_ssh_rule.rule_id] }}"
    dest: "{{ __linux_compliance_remediate_ssh_rule.parameters.path }}"
    follow: false
    force: true
    mode: "0600"
    owner: root
    group: root
  loop: "{{ __linux_compliance_remediate_ssh_to_write }}"
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_rule
    label: "{{ __linux_compliance_remediate_ssh_rule.rule_id }}"
  register: __linux_compliance_remediate_ssh_write
  when: not (ansible_check_mode and __linux_compliance_remediate_ssh_directory_missing)
  tags:
    - always

- name: SSH server | Add the result of every rule to apply and remember the drop-ins that this run writes
  vars:
    __linux_compliance_remediate_ssh_changed_ids: >-
      {{ (__linux_compliance_remediate_ssh_write.results | default([]) | selectattr('changed')
          | map(attribute='__linux_compliance_remediate_ssh_rule.rule_id') | list)
         + (__linux_compliance_remediate_ssh_rerecord.results | default([]) | selectattr('changed')
            | map(attribute='__linux_compliance_remediate_ssh_rule.rule_id') | list)
         + ((__linux_compliance_remediate_ssh_to_write | map(attribute='rule_id') | list)
            if __linux_compliance_remediate_ssh_directory_created is changed else []) }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_written: >-
      {{ __linux_compliance_remediate_ssh_to_write | map(attribute='parameters.path') | list }}
    __linux_compliance_remediate_results: >-
      {%- set results = [] -%}
      {%- for rule in __linux_compliance_remediate_family.apply -%}
      {%- set planned = __linux_compliance_remediate_ssh_plan[rule.rule_id] -%}
      {%- set _ = results.append({
            'rule_id': rule.rule_id,
            'family': rule.family,
            'action': 'apply',
            'status': planned.status,
            'reason': planned.reason,
            'changed': rule.rule_id in __linux_compliance_remediate_ssh_changed_ids,
            'message': rule.parameters.path ~ ': ' ~ planned.status
                       ~ ((' (' ~ planned.reason ~ '; nothing was changed)') if planned.reason else '')
                       ~ ((' (' ~ rule.parameters.keyword ~ ' is also set by ' ~ planned.later | join(', ')
                           ~ ', which sshd reads later and ignores for this keyword; the content check reads every'
                           ~ ' occurrence)') if planned.status in ['applied', 'compliant']
                                                and planned.later | length > 0 else '')}) -%}
      {%- endfor -%}
      {{ __linux_compliance_remediate_results + results }}
  tags:
    - always

- name: SSH server | List what is left in the drop-in directory
  ansible.builtin.find:
    paths: "{{ __linux_compliance_remediate_sshd_directory }}"
    file_type: any
    follow: false
    hidden: true
    recurse: false
  register: __linux_compliance_remediate_ssh_left
  when: __linux_compliance_remediate_sshd_marker in __linux_compliance_remediate_ssh_entries
  tags:
    - always

- name: SSH server | Inspect the directory and the marker again without following a symbolic link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_ssh_tidy_check }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ __linux_compliance_remediate_sshd_directory }}"
    - "{{ __linux_compliance_remediate_sshd_marker }}"
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_tidy_check
  register: __linux_compliance_remediate_ssh_tidy_stats
  when: __linux_compliance_remediate_sshd_marker in __linux_compliance_remediate_ssh_entries
  tags:
    - always

- name: SSH server | Decide whether the directory holds nothing but the marker of the collection
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_tidy: >-
      {{ __linux_compliance_remediate_ssh_tidy_stats is not skipped
         and (__linux_compliance_remediate_ssh_tidy_stats.results[0].stat.isdir | default(false))
         and (__linux_compliance_remediate_ssh_tidy_stats.results[1].stat.isreg | default(false))
         and (__linux_compliance_remediate_ssh_left.files | default([]) | map(attribute='path') | list
              | difference(__linux_compliance_remediate_ssh_removed)
              | union(__linux_compliance_remediate_ssh_written) | sort)
             == [__linux_compliance_remediate_sshd_marker] }}
  tags:
    - always

- name: SSH server | Remove the drop-in directory that the collection created, once it holds no drop-in
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_ssh_tidy_path }}"
    state: absent
  loop:
    - "{{ __linux_compliance_remediate_sshd_marker }}"
    - "{{ __linux_compliance_remediate_sshd_directory }}"
  loop_control:
    loop_var: __linux_compliance_remediate_ssh_tidy_path
  register: __linux_compliance_remediate_ssh_tidy_removal
  when: __linux_compliance_remediate_ssh_tidy
  tags:
    - always

- name: SSH server | Name whether this run changed what sshd reads
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_reload: >-
      {{ not ansible_check_mode
         and (__linux_compliance_remediate_ssh_write is changed
              or __linux_compliance_remediate_ssh_removal is changed
              or __linux_compliance_remediate_ssh_tidy_removal is changed) }}
  tags:
    - always

- name: SSH server | Read the services, to reload sshd only where it runs
  ansible.builtin.service_facts:
  register: __linux_compliance_remediate_ssh_services
  when: __linux_compliance_remediate_ssh_reload
  tags:
    - always

- name: SSH server | Name the sshd service and whether it runs
  vars:
    __linux_compliance_remediate_ssh_known_services: >-
      {{ (__linux_compliance_remediate_ssh_services.ansible_facts | default({})).services | default({}) }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ssh_service: >-
      {{ 'ssh' if 'ssh.service' in __linux_compliance_remediate_ssh_known_services else 'sshd' }}
    __linux_compliance_remediate_ssh_running: >-
      {{ __linux_compliance_remediate_ssh_reload
         and ((__linux_compliance_remediate_ssh_known_services['ssh.service']
               | default(__linux_compliance_remediate_ssh_known_services['sshd.service'] | default({})))
              .state | default('') == 'running') }}
  tags:
    - always

- name: SSH server | Validate the whole effective configuration once more before sshd reloads it
  freesecdev.linux_compliance.sshd_validate:
  register: __linux_compliance_remediate_ssh_final
  when: __linux_compliance_remediate_ssh_running
  tags:
    - always

- name: SSH server | Refuse to reload sshd with a configuration that it would not accept
  ansible.builtin.assert:
    that:
      - __linux_compliance_remediate_ssh_final.valid
    fail_msg: >-
      sshd -t refuses the configuration after this run, so sshd was not reloaded and keeps its running
      configuration: {{ __linux_compliance_remediate_ssh_final.message }}. The changes of this run are in place and
      recorded in the ledger; fix the configuration or switch the rules off before the next restart of sshd.
    quiet: true
  when: __linux_compliance_remediate_ssh_running
  tags:
    - always

- name: SSH server | Reload sshd, which keeps every open session, so new sessions use the validated configuration
  ansible.builtin.service:
    name: "{{ __linux_compliance_remediate_ssh_service }}"
    state: reloaded
  when: __linux_compliance_remediate_ssh_running
  tags:
    - always
