---
- name: Password quality | Refuse to set a main file setting that the dispatcher did not plan
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'pwquality'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'pwquality'
      - >-
        __linux_compliance_remediate_pwq_benchmark
        in __linux_compliance_remediate_rule.parameters.main_file_benchmarks
      - __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id] is string
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'pwquality') | list | first | default({}))).apply | default([])
    fail_msg: >-
      pwquality_main_apply.yml runs only for a rule that the remediate dispatcher planned to apply, for content
      whose check reads only the main file, with linux_compliance_remediate_enabled true. No change was made to the
      host.
    quiet: true
  tags:
    - always

- name: Password quality | Read the method and the values that the ledger entry of the rule records
  vars:
    __linux_compliance_remediate_pwq_recorded: >-
      {{ (__linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
          | items2dict(key_name='name', value_name='value'))
         if __linux_compliance_remediate_rule.ledger_entry is mapping else {} }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_entry: "{{ __linux_compliance_remediate_pwq_recorded }}"
    __linux_compliance_remediate_pwq_entry_method: >-
      {{ none if __linux_compliance_remediate_rule.ledger_entry is not mapping
         else __linux_compliance_remediate_pwq_recorded.method | default('unknown') }}
  tags:
    - always

- name: Password quality | Inspect the main file with its SHA-256 before changing it
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_pwquality_main }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_pwq_stat
  tags:
    - always

- name: Password quality | Read the main file
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_pwquality_main }}"
  register: __linux_compliance_remediate_pwq_current
  when: __linux_compliance_remediate_pwq_stat.stat.isreg | default(false)
  tags:
    - always

- name: Password quality | Compose the setting line and find the lines that set it now
  vars:
    __linux_compliance_remediate_pwq_setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_line: >-
      {{ __linux_compliance_remediate_pwq_setting
         if __linux_compliance_remediate_rule.parameters.value_id is not defined
         else __linux_compliance_remediate_pwq_setting ~ ' = '
              ~ __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id] }}
    __linux_compliance_remediate_pwq_regexp: >-
      {{ '^[ \t]*' ~ __linux_compliance_remediate_pwq_setting
         ~ ('[ \t]*$' if __linux_compliance_remediate_rule.parameters.value_id is not defined else '[ \t]*=') }}
    __linux_compliance_remediate_pwq_found: >-
      {{ ((__linux_compliance_remediate_pwq_current.content | b64decode)
          | regex_findall('(?m)^[ \t]*' ~ __linux_compliance_remediate_pwq_setting
                          ~ ('[ \t]*$' if __linux_compliance_remediate_rule.parameters.value_id is not defined
                             else '[ \t]*=.*$')))
         if __linux_compliance_remediate_pwq_current is not skipped else [] }}
  tags:
    - always

- name: Password quality | Decide whether the setting must be written
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_status: >-
      {{ 'method_changed' if __linux_compliance_remediate_pwq_entry_method not in [none, 'main_file']
         else 'notapplicable' if not __linux_compliance_remediate_pwq_stat.stat.exists
         else 'not_regular_file' if not __linux_compliance_remediate_pwq_stat.stat.isreg
         else 'duplicate_setting' if __linux_compliance_remediate_pwq_found | length > 1
         else 'compliant' if __linux_compliance_remediate_pwq_found == [__linux_compliance_remediate_pwq_line]
         else 'applied' }}
  tags:
    - always

- name: Password quality | Record the prior line of the setting, the line written and the state of the main file
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values:
      - name: method
        value: main_file
      - name: setting_line
        value: "{{ __linux_compliance_remediate_pwq_found | first | default(none) }}"
      - name: written_line
        value: "{{ __linux_compliance_remediate_pwq_line }}"
      - name: mode
        value: "{{ __linux_compliance_remediate_pwq_stat.stat.mode }}"
      - name: owner
        value: "{{ __linux_compliance_remediate_pwq_stat.stat.uid | string }}"
      - name: group
        value: "{{ __linux_compliance_remediate_pwq_stat.stat.gid | string }}"
      - name: sha256
        value: "{{ __linux_compliance_remediate_pwq_stat.stat.checksum }}"
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
  register: __linux_compliance_remediate_pwq_record
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_rule.ledger_entry is none
  tags:
    - always

- name: Password quality | Keep the recorded prior state and record the new line when the profile value changed
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values: >-
      {{ __linux_compliance_remediate_pwq_entry | combine({'written_line': __linux_compliance_remediate_pwq_line})
         | dict2items(key_name='name', value_name='value') }}
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
    replace: true
  register: __linux_compliance_remediate_pwq_rerecord
  when:
    - __linux_compliance_remediate_pwq_status in ['applied', 'compliant']
    - __linux_compliance_remediate_pwq_entry_method == 'main_file'
    - __linux_compliance_remediate_pwq_entry.written_line | default(none) != __linux_compliance_remediate_pwq_line
  tags:
    - always

- name: Password quality | Write the setting with the value that the profile requires into the main file
  ansible.builtin.lineinfile:
    path: "{{ __linux_compliance_remediate_pwquality_main }}"
    regexp: "{{ __linux_compliance_remediate_pwq_regexp }}"
    line: "{{ __linux_compliance_remediate_pwq_line }}"
    state: present
    create: false
  register: __linux_compliance_remediate_pwq_write
  when: __linux_compliance_remediate_pwq_status == 'applied'
  tags:
    - always

- name: Password quality | Add the result of the rule
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'apply',
           'status': __linux_compliance_remediate_pwq_status,
           'reason': ('the main file sets ' ~ __linux_compliance_remediate_rule.parameters.setting ~ ' '
                      ~ __linux_compliance_remediate_pwq_found | length ~ ' times')
                     if __linux_compliance_remediate_pwq_status == 'duplicate_setting'
                     else ('the ledger entry was recorded by the ' ~ __linux_compliance_remediate_pwq_entry_method
                           ~ ' method; clean it up first')
                     if __linux_compliance_remediate_pwq_status == 'method_changed' else none,
           'changed': (__linux_compliance_remediate_pwq_write is changed)
                      or (__linux_compliance_remediate_pwq_rerecord is changed),
           'message': __linux_compliance_remediate_pwquality_main ~ ' '
                      ~ __linux_compliance_remediate_rule.parameters.setting ~ ': '
                      ~ __linux_compliance_remediate_pwq_status
         }] }}
  tags:
    - always
