---
- name: Password quality | Refuse to write a drop-in that the dispatcher did not plan
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'pwquality'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'pwquality'
      - __linux_compliance_remediate_rule.parameters.path in __linux_compliance_remediate_pwq_owned
      - __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id] is string
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'pwquality') | list | first | default({}))).apply | default([])
    fail_msg: >-
      pwquality_apply.yml runs only for a rule that the remediate dispatcher planned to apply,
      with linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Password quality | Inspect the drop-in without following a symbolic link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_pwq_stat
  tags:
    - always

- name: Password quality | Read the drop-in when it exists
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_rule.parameters.path }}"
  register: __linux_compliance_remediate_pwq_current
  when: __linux_compliance_remediate_pwq_stat.stat.isreg | default(false)
  tags:
    - always

- name: Password quality | Compose the drop-in and find the files that libpwquality reads after it
  vars:
    __linux_compliance_remediate_pwq_setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
    __linux_compliance_remediate_pwq_name: "{{ __linux_compliance_remediate_rule.parameters.path | basename }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_header: >-
      {{ '# Managed by freesecdev.linux_compliance for ' ~ __linux_compliance_remediate_rule.rule_id ~ '.' }}
    __linux_compliance_remediate_pwq_content: >-
      {{ '# Managed by freesecdev.linux_compliance for ' ~ __linux_compliance_remediate_rule.rule_id ~ '.'
         ~ __linux_compliance_remediate_newline
         ~ '# Switching the rule or the pwquality topic off removes this file.' ~ __linux_compliance_remediate_newline
         ~ (__linux_compliance_remediate_pwq_setting
            if __linux_compliance_remediate_rule.parameters.value_id is not defined
            else __linux_compliance_remediate_pwq_setting ~ ' = '
                 ~ __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id])
         ~ __linux_compliance_remediate_newline }}
    __linux_compliance_remediate_pwq_overriding: >-
      {{ __linux_compliance_remediate_pwq_sources | dict2items
         | selectattr('key', 'ne', __linux_compliance_remediate_rule.parameters.path)
         | selectattr('value', 'search', '(?m)^[ \t]*' ~ __linux_compliance_remediate_pwq_setting ~ '[ \t]*(=|$)')
         | map(attribute='key')
         | select('in', [__linux_compliance_remediate_pwquality_main]
                        + (__linux_compliance_remediate_pwq_sources.keys()
                           | reject('equalto', __linux_compliance_remediate_pwquality_main)
                           | select('gt', __linux_compliance_remediate_pwquality_directory ~ '/'
                                    ~ __linux_compliance_remediate_pwq_name) | list))
         | list }}
  tags:
    - always

- name: Password quality | Decide whether the drop-in must be written
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_directory_missing: >-
      {{ not (__linux_compliance_remediate_pwq_directory_stat.isdir | default(false)) }}
    __linux_compliance_remediate_pwq_status: >-
      {{ 'notapplicable' if not (__linux_compliance_remediate_pwq_main_stat.isreg | default(false))
         else 'not_regular_file' if __linux_compliance_remediate_pwq_stat.stat.exists
              and not __linux_compliance_remediate_pwq_stat.stat.isreg
         else 'overridden' if __linux_compliance_remediate_pwq_overriding | length > 0
         else 'compliant' if __linux_compliance_remediate_pwq_current is not skipped
              and (__linux_compliance_remediate_pwq_current.content | b64decode)
                  == __linux_compliance_remediate_pwq_content
         else 'not_owned' if __linux_compliance_remediate_pwq_current is not skipped
              and __linux_compliance_remediate_rule.ledger_entry is none
              and not (__linux_compliance_remediate_pwq_current.content | b64decode)
                      .startswith(__linux_compliance_remediate_pwq_header)
         else 'applied' }}
  tags:
    - always

- name: Password quality | Create the drop-in directory that libpwquality reads but the package does not ship
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_pwquality_directory }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  register: __linux_compliance_remediate_pwq_directory
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_pwq_directory_missing
  tags:
    - always

- name: Password quality | Mark the directory as created by the collection, so cleanup can remove it
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_pwquality_marker }}"
    state: touch
    mode: "0644"
    owner: root
    group: root
    access_time: preserve
    modification_time: preserve
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_pwq_directory_missing
  tags:
    - always

- name: Password quality | Record that the collection owns the drop-in before writing it
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
  register: __linux_compliance_remediate_pwq_record
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_rule.ledger_entry is none
  tags:
    - always

- name: Password quality | Write the drop-in with the value that the profile requires
  ansible.builtin.copy:
    content: "{{ __linux_compliance_remediate_pwq_content }}"
    dest: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    force: true
    mode: "0644"
    owner: root
    group: root
  register: __linux_compliance_remediate_pwq_write
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - not (ansible_check_mode and __linux_compliance_remediate_pwq_directory_missing)
  tags:
    - always

- name: Password quality | Remember the drop-in that this run writes
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_written: >-
      {{ __linux_compliance_remediate_pwq_written + [__linux_compliance_remediate_rule.parameters.path] }}
  when: __linux_compliance_remediate_pwq_status == 'applied'
  tags:
    - always

- name: Password quality | Add the result of the rule
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'apply',
           'status': __linux_compliance_remediate_pwq_status,
           'reason': (__linux_compliance_remediate_pwq_overriding | join(', '))
                     if __linux_compliance_remediate_pwq_status == 'overridden' else none,
           'changed': (__linux_compliance_remediate_pwq_write is changed)
                      or (__linux_compliance_remediate_pwq_directory is changed),
           'message': __linux_compliance_remediate_rule.parameters.path ~ ': ' ~ __linux_compliance_remediate_pwq_status
                      ~ ((' (set later by ' ~ (__linux_compliance_remediate_pwq_overriding | join(', '))
                          ~ ', which libpwquality reads after the drop-in; nothing was changed)')
                         if __linux_compliance_remediate_pwq_status == 'overridden' else '')
         }] }}
  tags:
    - always
