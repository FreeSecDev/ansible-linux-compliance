---
- name: Protocol modules | Refuse to run outside the dispatcher or without the opt-in
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - __linux_compliance_remediate_family is defined
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'protocol_modules'
      - >-
        __linux_compliance_remediate_family ==
        (__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'protocol_modules') | list | first | default({}))
    fail_msg: >-
      The protocol_modules family file runs only from the remediate dispatcher with
      linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Protocol modules | Inspect the modprobe configuration, then clean up and apply the drop-ins of the family
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/kernel_modules_family.yml"
    apply:
      tags:
        - always
  tags:
    - always
