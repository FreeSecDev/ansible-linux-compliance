---
- name: PAM configuration line | Refuse to restore a setting that the dispatcher did not plan to clean up
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name in ['faillock', 'pwhistory']
      - __linux_compliance_remediate_sc is mapping
      - __linux_compliance_remediate_sc.family == __linux_compliance_remediate_family.name
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == __linux_compliance_remediate_family.name
      - >-
        __linux_compliance_remediate_rule.parameters.setting
        is match(__linux_compliance_remediate_security_conf_setting_pattern)
      - __linux_compliance_remediate_rule.ledger_entry is mapping
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', __linux_compliance_remediate_family.name) | list | first
         | default({}))).cleanup | default([])
    fail_msg: >-
      pam_conf_cleanup.yml runs only for a rule that the remediate dispatcher planned to clean up from its ledger
      entry, with linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: PAM configuration line | Inspect the configuration file with its SHA-256 before restoring the setting
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_sc.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_sc_stat
  tags:
    - always

- name: PAM configuration line | Read the configuration file to check that the setting is the line written
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_sc.path }}"
  register: __linux_compliance_remediate_sc_current
  when: __linux_compliance_remediate_sc_stat.stat.isreg | default(false)
  tags:
    - always

- name: PAM configuration line | Read the recorded prior state of the setting and of the file
  vars:
    __linux_compliance_remediate_sc_records: >-
      {{ __linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
         | items2dict(key_name='name', value_name='value') }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc_prior: "{{ __linux_compliance_remediate_sc_records }}"
    __linux_compliance_remediate_sc_entry_method: >-
      {{ __linux_compliance_remediate_sc_records.method | default('unknown') }}
  tags:
    - always

- name: PAM configuration line | Compute the exact text that restores the recorded line, every other byte unchanged
  vars:
    __linux_compliance_remediate_sc_text: >-
      {{ __linux_compliance_remediate_sc_pending_text
         if ansible_check_mode and __linux_compliance_remediate_sc_pending_text is not none
         else __linux_compliance_remediate_sc_current.content | b64decode }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc_restore: >-
      {{ __linux_compliance_remediate_sc_text
         | freesecdev.linux_compliance.pam_conf_restore(
             __linux_compliance_remediate_rule.parameters.setting,
             __linux_compliance_remediate_sc_prior.setting_line | default(none),
             __linux_compliance_remediate_sc_prior.written_line | default(none)) }}
  when:
    - __linux_compliance_remediate_sc_current is not skipped
    - __linux_compliance_remediate_sc_entry_method == 'line'
    - "'setting_line' in __linux_compliance_remediate_sc_prior"
  tags:
    - always

- name: PAM configuration line | Name the SHA-256 that the file must have when the family's last rule is restored
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc_last: >-
      {{ __linux_compliance_remediate_sc_entries
         | difference([__linux_compliance_remediate_rule.rule_id]) | length == 0 }}
    __linux_compliance_remediate_sc_expected: >-
      {{ __linux_compliance_remediate_sc_prior.baseline_sha256
         | default(__linux_compliance_remediate_sc_prior.sha256 | default('')) }}
  tags:
    - always

- name: PAM configuration line | Name the reason the prior state cannot be restored, or that it is already as before
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc_reason: >-
      {{ 'method_changed' if __linux_compliance_remediate_sc_entry_method != 'line'
         else 'target_absent' if not __linux_compliance_remediate_sc_stat.stat.exists
         else 'not_regular_file' if not __linux_compliance_remediate_sc_stat.stat.isreg
         else 'invalid_record' if not (
              'setting_line' in __linux_compliance_remediate_sc_prior
              and __linux_compliance_remediate_sc_restore.reason | default('invalid_record') != 'invalid_record'
              and __linux_compliance_remediate_sc_prior.mode | default('') is match('^[0-7]{4}$')
              and __linux_compliance_remediate_sc_prior.owner | default('') is match('^[0-9]{1,10}$')
              and __linux_compliance_remediate_sc_prior.group | default('') is match('^[0-9]{1,10}$')
              and __linux_compliance_remediate_sc_expected is match('^[0-9a-f]{64}$'))
         else __linux_compliance_remediate_sc_restore.reason
              if __linux_compliance_remediate_sc_restore.reason is not none
         else 'modified_since_apply' if not __linux_compliance_remediate_sc_restore.already
              and (__linux_compliance_remediate_sc_stat.stat.mode != __linux_compliance_remediate_sc_prior.mode
                   or (__linux_compliance_remediate_sc_stat.stat.uid | string)
                      != __linux_compliance_remediate_sc_prior.owner
                   or (__linux_compliance_remediate_sc_stat.stat.gid | string)
                      != __linux_compliance_remediate_sc_prior.group)
         else 'restore_mismatch' if __linux_compliance_remediate_sc_last
              and (__linux_compliance_remediate_sc_restore.new_text | hash('sha256'))
                  != __linux_compliance_remediate_sc_expected
         else none }}
    __linux_compliance_remediate_sc_already: >-
      {{ __linux_compliance_remediate_sc_restore.already | default(false) }}
  tags:
    - always

- name: PAM configuration line | Inspect the configuration file again just before the restore, without a link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_sc.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_sc_recheck
  when:
    - __linux_compliance_remediate_sc_reason is none
    - not __linux_compliance_remediate_sc_already
  tags:
    - always

- name: PAM configuration line | Refuse the restore when the file changed since it was read
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc_reason: >-
      {{ 'changed_during_run'
         if __linux_compliance_remediate_sc_recheck is not skipped
            and not (__linux_compliance_remediate_sc_recheck.stat.isreg | default(false)
                     and __linux_compliance_remediate_sc_recheck.stat.checksum
                         == __linux_compliance_remediate_sc_stat.stat.checksum)
         else __linux_compliance_remediate_sc_reason }}
  tags:
    - always

- name: PAM configuration line | Write back the exact text that the file had for the setting before
  ansible.builtin.copy:
    content: "{{ __linux_compliance_remediate_sc_restore.new_text }}"
    dest: "{{ __linux_compliance_remediate_sc.path }}"
    follow: false
    force: true
    mode: "{{ __linux_compliance_remediate_sc_prior.mode }}"
    owner: "{{ __linux_compliance_remediate_sc_prior.owner }}"
    group: "{{ __linux_compliance_remediate_sc_prior.group }}"
  register: __linux_compliance_remediate_sc_restored
  when:
    - __linux_compliance_remediate_sc_reason is none
    - not __linux_compliance_remediate_sc_already
  tags:
    - always

- name: PAM configuration line | Forget the rule in the state ledger after the restore
  freesecdev.linux_compliance.control_state:
    action: remove
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
  register: __linux_compliance_remediate_sc_forget
  when: __linux_compliance_remediate_sc_reason is none
  tags:
    - always

- name: PAM configuration line | Remember that the rule no longer holds the file, and forget the SHA-256 after the last
  ansible.builtin.set_fact:
    __linux_compliance_remediate_sc_entries: >-
      {{ __linux_compliance_remediate_sc_entries | difference([__linux_compliance_remediate_rule.rule_id]) }}
    __linux_compliance_remediate_sc_baseline: >-
      {{ none if __linux_compliance_remediate_sc_last else __linux_compliance_remediate_sc_baseline }}
    __linux_compliance_remediate_sc_pending_text: "{{ __linux_compliance_remediate_sc_restore.new_text }}"
  when: __linux_compliance_remediate_sc_reason is none
  tags:
    - always

- name: PAM configuration line | Add the result of the cleanup
  vars:
    __linux_compliance_remediate_sc_cleanup_status: >-
      {{ 'restored' if __linux_compliance_remediate_sc_reason is none else 'cleanup_incomplete' }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'cleanup',
           'status': __linux_compliance_remediate_sc_cleanup_status,
           'reason': __linux_compliance_remediate_sc_reason,
           'changed': (__linux_compliance_remediate_sc_restored is changed)
                      or (__linux_compliance_remediate_sc_forget is changed),
           'message': __linux_compliance_remediate_rule.rule_id ~ ': ' ~ __linux_compliance_remediate_sc_cleanup_status
                      ~ ((' (' ~ __linux_compliance_remediate_sc_reason ~ ': '
                          ~ __linux_compliance_remediate_sc.path
                          ~ '; nothing was changed, the ledger entry is kept and the cleanup is retried on the'
                          ~ ' next run)')
                         if __linux_compliance_remediate_sc_reason
                         else ' (the setting was already as before; only the ledger entry was removed)'
                         if __linux_compliance_remediate_sc_already else '')
         }] }}
  tags:
    - always
