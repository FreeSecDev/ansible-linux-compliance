---
- name: Password quality | Refuse to run outside the dispatcher or without the opt-in
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - __linux_compliance_remediate_family is defined
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'pwquality'
      - >-
        __linux_compliance_remediate_family ==
        (__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'pwquality') | list | first | default({}))
    fail_msg: >-
      The pwquality family file runs only from the remediate dispatcher with
      linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Password quality | Inspect the main configuration file and the drop-in directory
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_pwq_path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ __linux_compliance_remediate_pwquality_main }}"
    - "{{ __linux_compliance_remediate_pwquality_directory }}"
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_path
  register: __linux_compliance_remediate_pwq_inspected
  tags:
    - always

- name: Password quality | Name what the inspection found and the drop-ins that the collection owns
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_main_stat: "{{ __linux_compliance_remediate_pwq_inspected.results[0].stat }}"
    __linux_compliance_remediate_pwq_directory_stat: "{{ __linux_compliance_remediate_pwq_inspected.results[1].stat }}"
    __linux_compliance_remediate_pwq_owned: >-
      {{ __linux_compliance_remediate_rules | selectattr('family', 'equalto', 'pwquality')
         | map(attribute='parameters') | map(attribute='path') | list }}
    __linux_compliance_remediate_pwq_removed: []
    __linux_compliance_remediate_pwq_written: []
    __linux_compliance_remediate_pwq_benchmark: "{{ linux_compliance_discovered.benchmark_id }}"
  tags:
    - always

- name: Password quality | List every entry of the drop-in directory, as libpwquality lists it, without following links
  ansible.builtin.find:
    paths: "{{ __linux_compliance_remediate_pwquality_directory }}"
    file_type: any
    follow: false
    hidden: true
    recurse: false
  register: __linux_compliance_remediate_pwq_dropins
  when: __linux_compliance_remediate_pwq_directory_stat.isdir | default(false)
  tags:
    - always

- name: Password quality | Name the entries that libpwquality reads, whose name holds .conf only at its end
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_entries: >-
      {{ __linux_compliance_remediate_pwq_dropins.files | default([])
         | selectattr('path', 'match', '^.*/(?:(?!\.conf)[^/])*\.conf$') | list }}
  tags:
    - always

- name: Password quality | Read the main file
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_pwquality_main }}"
  register: __linux_compliance_remediate_pwq_main_read
  when: __linux_compliance_remediate_pwq_main_stat.isreg | default(false)
  tags:
    - always

- name: Password quality | Read every regular drop-in that libpwquality reads
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_pwq_source }}"
  loop: >-
    {{ __linux_compliance_remediate_pwq_entries | selectattr('isreg') | map(attribute='path') | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_source
  register: __linux_compliance_remediate_pwq_read
  tags:
    - always

- name: Password quality | Inspect the PAM directories
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_pwq_path }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ __linux_compliance_remediate_pwquality_pam_directories }}"
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_path
  register: __linux_compliance_remediate_pwq_pam_directories
  when: __linux_compliance_remediate_family.apply | length > 0
  tags:
    - always

- name: Password quality | List the PAM files, through symbolic links, whose pam_pwquality arguments override the files
  ansible.builtin.find:
    paths: >-
      {{ __linux_compliance_remediate_pwq_pam_directories.results | selectattr('stat', 'defined')
         | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir')
         | map(attribute='__linux_compliance_remediate_pwq_path') | list }}
    file_type: file
    follow: true
    hidden: true
    recurse: false
  register: __linux_compliance_remediate_pwq_pam_found
  when:
    - __linux_compliance_remediate_family.apply | length > 0
    - >-
      __linux_compliance_remediate_pwq_pam_directories.results | selectattr('stat', 'defined')
      | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list | length > 0
  tags:
    - always

- name: Password quality | Read every PAM file
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_pwq_source }}"
  loop: >-
    {{ __linux_compliance_remediate_pwq_pam_found.files | default([]) | map(attribute='path') | sort | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_source
  register: __linux_compliance_remediate_pwq_pam_read
  tags:
    - always

- name: Password quality | Keep every drop-in entry with its type and text, and the text of every PAM file
  vars:
    __linux_compliance_remediate_pwq_texts: >-
      {{ dict(__linux_compliance_remediate_pwq_read.results | default([])
              | map(attribute='__linux_compliance_remediate_pwq_source')
              | zip(__linux_compliance_remediate_pwq_read.results | default([]) | map(attribute='content')
                    | map('b64decode'))) }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_directory_kind: >-
      {{ 'missing' if not (__linux_compliance_remediate_pwq_directory_stat.exists | default(false))
         else 'directory' if __linux_compliance_remediate_pwq_directory_stat.isdir | default(false)
         else 'link' if __linux_compliance_remediate_pwq_directory_stat.islnk | default(false)
         else 'other' }}
    __linux_compliance_remediate_pwq_main_text: >-
      {{ (__linux_compliance_remediate_pwq_main_read.content | b64decode)
         if __linux_compliance_remediate_pwq_main_read is not skipped else none }}
    __linux_compliance_remediate_pwq_state: >-
      {%- set entries = [] -%}
      {%- for entry in __linux_compliance_remediate_pwq_entries -%}
      {%- set _ = entries.append({'path': entry.path,
            'type': 'file' if entry.isreg else 'directory' if entry.isdir
                    else 'link' if entry.islnk else 'other',
            'content': __linux_compliance_remediate_pwq_texts[entry.path] | default(none)}) -%}
      {%- endfor -%}
      {{ entries }}
    __linux_compliance_remediate_pwq_pam: >-
      {%- set files = [] -%}
      {%- for item in __linux_compliance_remediate_pwq_pam_read.results | default([]) -%}
      {%- set _ = files.append({'path': item.__linux_compliance_remediate_pwq_source,
                                'content': item.content | b64decode}) -%}
      {%- endfor -%}
      {{ files }}
  tags:
    - always

- name: Password quality | Resolve the value that the profile requires for every rule to apply
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_values: >-
      {%- set values = {} -%}
      {%- for rule in __linux_compliance_remediate_family.apply -%}
      {%- set found = rule.parameters.profile_values | default([])
            | selectattr('content_sha256', 'equalto', linux_compliance_discovered.content_sha256)
            | selectattr('profiles', 'contains', linux_compliance_remediate_profile)
            | map(attribute='value') | map('join', '') | list -%}
      {%- set _ = values.update({rule.rule_id: (found | first | default(none))
            if rule.parameters.value_id is defined else ''}) -%}
      {%- endfor -%}
      {{ values }}
  tags:
    - always

- name: Password quality | Refuse a rule without its profile value before anything changes
  ansible.builtin.assert:
    that:
      - __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_pwq_rule.rule_id] is string
      - >-
        __linux_compliance_remediate_pwq_rule.parameters.value_id is not defined
        or __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_pwq_rule.rule_id]
           is match('^-?[0-9]{1,6}$')
      - __linux_compliance_remediate_pwq_rule.parameters.setting is match('^[a-z_]{1,32}$')
    fail_msg: >-
      {{ __linux_compliance_remediate_pwq_rule.rule_id }} needs the value
      {{ __linux_compliance_remediate_pwq_rule.parameters.value_id | default('') }} that the profile
      {{ linux_compliance_remediate_profile }} gives it in the content {{ linux_compliance_discovered.content_sha256 }},
      as an integer, but the catalogue holds
      {{ __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_pwq_rule.rule_id] }}. The values are
      generated from the pinned content (ADR 0021); no password quality setting was changed.
    quiet: true
  loop: "{{ __linux_compliance_remediate_family.apply }}"
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_rule
    label: "{{ __linux_compliance_remediate_pwq_rule.rule_id }}"
  tags:
    - always

- name: Password quality | Restore the main file settings of rules no longer effective (content checks the main file)
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pwquality_main_cleanup.yml"
    apply:
      tags:
        - always
  loop: >-
    {{ __linux_compliance_remediate_family.cleanup
       | selectattr('parameters.main_file_benchmarks', 'contains', __linux_compliance_remediate_pwq_benchmark) | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always

- name: Password quality | Remove the drop-ins of rules no longer effective (content checks the drop-ins)
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pwquality_dropin_cleanup.yml"
    apply:
      tags:
        - always
  loop: >-
    {{ __linux_compliance_remediate_family.cleanup
       | rejectattr('parameters.main_file_benchmarks', 'contains', __linux_compliance_remediate_pwq_benchmark) | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always

- name: Password quality | Set the main file settings of the effective rules (content checks the main file)
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pwquality_main_apply.yml"
    apply:
      tags:
        - always
  loop: >-
    {{ __linux_compliance_remediate_family.apply
       | selectattr('parameters.main_file_benchmarks', 'contains', __linux_compliance_remediate_pwq_benchmark) | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always

- name: Password quality | Write the drop-ins of the effective rules (content checks the drop-ins)
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/pwquality_dropin_apply.yml"
    apply:
      tags:
        - always
  loop: >-
    {{ __linux_compliance_remediate_family.apply
       | rejectattr('parameters.main_file_benchmarks', 'contains', __linux_compliance_remediate_pwq_benchmark) | list }}
  loop_control:
    loop_var: __linux_compliance_remediate_rule
    label: "{{ __linux_compliance_remediate_rule.rule_id }}"
  tags:
    - always

- name: Password quality | List what is left in the drop-in directory
  ansible.builtin.find:
    paths: "{{ __linux_compliance_remediate_pwquality_directory }}"
    file_type: any
    follow: false
    hidden: true
    recurse: false
  register: __linux_compliance_remediate_pwq_left
  when: __linux_compliance_remediate_pwq_directory_stat.isdir | default(false)
  tags:
    - always

- name: Password quality | Inspect the directory and the marker again without following a symbolic link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_pwq_tidy_check }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ __linux_compliance_remediate_pwquality_directory }}"
    - "{{ __linux_compliance_remediate_pwquality_marker }}"
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_tidy_check
  register: __linux_compliance_remediate_pwq_tidy_stats
  when: __linux_compliance_remediate_pwq_directory_stat.isdir | default(false)
  tags:
    - always

- name: Password quality | Decide whether the directory holds nothing but the marker of the collection
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_tidy: >-
      {{ __linux_compliance_remediate_pwq_tidy_stats is not skipped
         and (__linux_compliance_remediate_pwq_tidy_stats.results[0].stat.isdir | default(false))
         and (__linux_compliance_remediate_pwq_tidy_stats.results[1].stat.isreg | default(false))
         and (__linux_compliance_remediate_pwq_left.files | default([]) | map(attribute='path') | list
              | difference(__linux_compliance_remediate_pwq_removed)
              | union(__linux_compliance_remediate_pwq_written) | sort)
             == [__linux_compliance_remediate_pwquality_marker] }}
  tags:
    - always

- name: Password quality | Remove the drop-in directory that the collection created, once it holds no drop-in
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_pwq_tidy_path }}"
    state: absent
  loop:
    - "{{ __linux_compliance_remediate_pwquality_marker }}"
    - "{{ __linux_compliance_remediate_pwquality_directory }}"
  loop_control:
    loop_var: __linux_compliance_remediate_pwq_tidy_path
  when: __linux_compliance_remediate_pwq_tidy
  tags:
    - always
