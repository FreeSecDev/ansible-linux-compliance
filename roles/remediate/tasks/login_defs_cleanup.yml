---
- name: Login defaults | Refuse to restore a setting that the dispatcher did not plan to clean up
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'login_defs'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'login_defs'
      - >-
        __linux_compliance_remediate_rule.parameters.setting
        is match(__linux_compliance_remediate_login_defs_setting_pattern)
      - __linux_compliance_remediate_rule.ledger_entry is mapping
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'login_defs') | list | first | default({}))).cleanup | default([])
    fail_msg: >-
      login_defs_cleanup.yml runs only for a rule that the remediate dispatcher planned to clean up from its ledger
      entry, with linux_compliance_remediate_enabled true. No change was made to the host.
    quiet: true
  tags:
    - always

- name: Login defaults | Inspect login.defs before restoring the setting, without following a link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_login_defs }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_ld_stat
  tags:
    - always

- name: Login defaults | Read login.defs to check that the setting is still the line the collection wrote
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_login_defs }}"
  register: __linux_compliance_remediate_ld_current
  when: __linux_compliance_remediate_ld_stat.stat.isreg | default(false)
  tags:
    - always

- name: Login defaults | Read the recorded prior state of the setting and of login.defs
  vars:
    __linux_compliance_remediate_ld_records: >-
      {{ __linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
         | items2dict(key_name='name', value_name='value') }}
    __linux_compliance_remediate_ld_setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_prior: "{{ __linux_compliance_remediate_ld_records }}"
    __linux_compliance_remediate_ld_entry_method: >-
      {{ __linux_compliance_remediate_ld_records.method | default('unknown') }}
    __linux_compliance_remediate_ld_regexp: >-
      {{ '(?i)^[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '(?:[ \t]|$)' }}
    __linux_compliance_remediate_ld_found: >-
      {{ ((__linux_compliance_remediate_ld_current.content | b64decode)
          | regex_findall('(?im)^[ \t]*' ~ __linux_compliance_remediate_ld_setting ~ '(?:[ \t].*)?$'))
         if __linux_compliance_remediate_ld_current is not skipped else [] }}
  tags:
    - always

- name: Login defaults | Name the reason the prior state cannot be restored, or that it is already as before
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_reason: >-
      {{ 'method_changed' if __linux_compliance_remediate_ld_entry_method != 'line'
         else 'target_absent' if not __linux_compliance_remediate_ld_stat.stat.exists
         else 'not_regular_file' if not __linux_compliance_remediate_ld_stat.stat.isreg
         else 'invalid_record' if not (
              'setting_line' in __linux_compliance_remediate_ld_prior
              and (__linux_compliance_remediate_ld_prior.setting_line is none
                   or (__linux_compliance_remediate_ld_prior.setting_line is string
                       and __linux_compliance_remediate_newline
                           not in __linux_compliance_remediate_ld_prior.setting_line
                       and __linux_compliance_remediate_ld_prior.setting_line
                           is search(__linux_compliance_remediate_ld_regexp)))
              and __linux_compliance_remediate_ld_prior.written_line | default(none) is string
              and __linux_compliance_remediate_newline
                  not in __linux_compliance_remediate_ld_prior.written_line | default('')
              and __linux_compliance_remediate_ld_prior.written_line | default('')
                  is search(__linux_compliance_remediate_ld_regexp)
              and __linux_compliance_remediate_ld_prior.mode | default('') is match('^[0-7]{4}$')
              and __linux_compliance_remediate_ld_prior.owner | default('') is match('^[0-9]{1,10}$')
              and __linux_compliance_remediate_ld_prior.group | default('') is match('^[0-9]{1,10}$'))
         else none if __linux_compliance_remediate_ld_found
              == ([] if __linux_compliance_remediate_ld_prior.setting_line is none
                  else [__linux_compliance_remediate_ld_prior.setting_line])
         else 'modified_since_apply' if
              __linux_compliance_remediate_ld_found != [__linux_compliance_remediate_ld_prior.written_line]
              or __linux_compliance_remediate_ld_stat.stat.mode != __linux_compliance_remediate_ld_prior.mode
              or (__linux_compliance_remediate_ld_stat.stat.uid | string)
                 != __linux_compliance_remediate_ld_prior.owner
              or (__linux_compliance_remediate_ld_stat.stat.gid | string)
                 != __linux_compliance_remediate_ld_prior.group
         else none }}
  tags:
    - always

- name: Login defaults | Note whether the setting already is as it was before the collection changed it
  ansible.builtin.set_fact:
    __linux_compliance_remediate_ld_already: >-
      {{ __linux_compliance_remediate_ld_reason is none
         and __linux_compliance_remediate_ld_found
             == ([] if __linux_compliance_remediate_ld_prior.setting_line is none
                 else [__linux_compliance_remediate_ld_prior.setting_line]) }}
  tags:
    - always

- name: Login defaults | Write back the line that login.defs had before in its place, or remove the line written
  vars:
    __linux_compliance_remediate_ld_lines: >-
      {{ (__linux_compliance_remediate_ld_current.content | b64decode).split(__linux_compliance_remediate_newline) }}
    __linux_compliance_remediate_ld_index: >-
      {{ __linux_compliance_remediate_ld_lines.index(__linux_compliance_remediate_ld_prior.written_line) }}
  ansible.builtin.copy:
    content: >-
      {{ (__linux_compliance_remediate_ld_lines[:__linux_compliance_remediate_ld_index | int]
          + ([] if __linux_compliance_remediate_ld_prior.setting_line is none
             else [__linux_compliance_remediate_ld_prior.setting_line])
          + __linux_compliance_remediate_ld_lines[__linux_compliance_remediate_ld_index | int + 1:])
         | join(__linux_compliance_remediate_newline) }}
    dest: "{{ __linux_compliance_remediate_login_defs }}"
    follow: false
    force: true
    mode: "{{ __linux_compliance_remediate_ld_stat.stat.mode }}"
  register: __linux_compliance_remediate_ld_restored
  when:
    - __linux_compliance_remediate_ld_reason is none
    - not __linux_compliance_remediate_ld_already
  tags:
    - always

- name: Login defaults | Forget the rule in the state ledger after the restore
  freesecdev.linux_compliance.control_state:
    action: remove
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
  register: __linux_compliance_remediate_ld_forget
  when: __linux_compliance_remediate_ld_reason is none
  tags:
    - always

- name: Login defaults | Add the result of the cleanup
  vars:
    __linux_compliance_remediate_ld_cleanup_status: >-
      {{ 'restored' if __linux_compliance_remediate_ld_reason is none else 'cleanup_incomplete' }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'cleanup',
           'status': __linux_compliance_remediate_ld_cleanup_status,
           'reason': __linux_compliance_remediate_ld_reason,
           'changed': (__linux_compliance_remediate_ld_restored is changed)
                      or (__linux_compliance_remediate_ld_forget is changed),
           'message': __linux_compliance_remediate_rule.rule_id ~ ': ' ~ __linux_compliance_remediate_ld_cleanup_status
                      ~ ((' (' ~ __linux_compliance_remediate_ld_reason ~ ': '
                          ~ __linux_compliance_remediate_login_defs
                          ~ '; nothing was changed, the ledger entry is kept and the cleanup is retried on the'
                          ~ ' next run)')
                         if __linux_compliance_remediate_ld_reason
                         else ' (the setting was already as before; only the ledger entry was removed)'
                         if __linux_compliance_remediate_ld_already else '')
         }] }}
  tags:
    - always
