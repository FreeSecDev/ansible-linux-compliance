---
- name: Password quality | Refuse to write a drop-in that the dispatcher did not plan
  ansible.builtin.assert:
    that:
      - linux_compliance_remediate_enabled is boolean
      - linux_compliance_remediate_enabled
      - __linux_compliance_remediate_family is mapping
      - __linux_compliance_remediate_family.name == 'pwquality'
      - __linux_compliance_remediate_rule is mapping
      - __linux_compliance_remediate_rule.family == 'pwquality'
      - __linux_compliance_remediate_rule.parameters.path in __linux_compliance_remediate_pwq_owned
      - >-
        __linux_compliance_remediate_pwq_benchmark
        not in __linux_compliance_remediate_rule.parameters.main_file_benchmarks
      - __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id] is string
      - __linux_compliance_remediate_plan is defined
      - __linux_compliance_remediate_plan is mapping
      - __linux_compliance_remediate_plan.enabled is true
      - >-
        __linux_compliance_remediate_rule in
        ((__linux_compliance_remediate_plan.families
         | selectattr('name', 'equalto', 'pwquality') | list | first | default({}))).apply | default([])
    fail_msg: >-
      pwquality_dropin_apply.yml runs only for a rule that the remediate dispatcher planned to apply,
      for content whose check reads the drop-ins, with linux_compliance_remediate_enabled true. No change was made
      to the host.
    quiet: true
  tags:
    - always

- name: Password quality | Read the method and the values that the ledger entry of the rule records
  vars:
    __linux_compliance_remediate_pwq_recorded: >-
      {{ (__linux_compliance_remediate_rule.ledger_entry.prior_values | default([])
          | items2dict(key_name='name', value_name='value'))
         if __linux_compliance_remediate_rule.ledger_entry is mapping else {} }}
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_entry: "{{ __linux_compliance_remediate_pwq_recorded }}"
    __linux_compliance_remediate_pwq_entry_method: >-
      {{ none if __linux_compliance_remediate_rule.ledger_entry is not mapping
         else __linux_compliance_remediate_pwq_recorded.method | default('unknown') }}
  tags:
    - always

- name: Password quality | Inspect the drop-in without following a symbolic link
  ansible.builtin.stat:
    path: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __linux_compliance_remediate_pwq_stat
  tags:
    - always

- name: Password quality | Read the drop-in when it exists
  ansible.builtin.slurp:
    src: "{{ __linux_compliance_remediate_rule.parameters.path }}"
  register: __linux_compliance_remediate_pwq_current
  when: __linux_compliance_remediate_pwq_stat.stat.isreg | default(false)
  tags:
    - always

- name: Password quality | Compose the drop-in
  vars:
    __linux_compliance_remediate_pwq_setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_header: >-
      {{ '# Managed by freesecdev.linux_compliance for ' ~ __linux_compliance_remediate_rule.rule_id ~ '.' }}
    __linux_compliance_remediate_pwq_content: >-
      {{ '# Managed by freesecdev.linux_compliance for ' ~ __linux_compliance_remediate_rule.rule_id ~ '.'
         ~ __linux_compliance_remediate_newline
         ~ '# Switching the rule or the pwquality topic off removes this file.' ~ __linux_compliance_remediate_newline
         ~ (__linux_compliance_remediate_pwq_setting
            if __linux_compliance_remediate_rule.parameters.value_id is not defined
            else __linux_compliance_remediate_pwq_setting ~ ' = '
                 ~ __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id])
         ~ __linux_compliance_remediate_newline }}
  tags:
    - always

- name: Password quality | Decide the drop-in from the files as libpwquality and pam_pwquality read them
  vars:
    __linux_compliance_remediate_pwq_rule_input:
      setting: "{{ __linux_compliance_remediate_rule.parameters.setting }}"
      value: >-
        {{ __linux_compliance_remediate_pwq_values[__linux_compliance_remediate_rule.rule_id]
           if __linux_compliance_remediate_rule.parameters.value_id is defined else '' }}
      method: dropin
      main: "{{ __linux_compliance_remediate_pwquality_main }}"
      dropin: "{{ __linux_compliance_remediate_rule.parameters.path }}"
      content: "{{ __linux_compliance_remediate_pwq_content }}"
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_decision: >-
      {{ __linux_compliance_remediate_pwq_rule_input
         | freesecdev.linux_compliance.pwquality_decide(
             __linux_compliance_remediate_pwq_state
             | rejectattr('path', 'equalto', __linux_compliance_remediate_rule.parameters.path) | list
             + ([{'path': __linux_compliance_remediate_rule.parameters.path, 'type': 'file',
                  'content': __linux_compliance_remediate_pwq_current.content | b64decode}]
                if __linux_compliance_remediate_pwq_current is not skipped else []),
             __linux_compliance_remediate_pwq_main_text,
             __linux_compliance_remediate_pwq_pam) }}
  tags:
    - always

- name: Password quality | Decide whether the drop-in must be written
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_directory_missing: >-
      {{ not (__linux_compliance_remediate_pwq_directory_stat.exists | default(false)) }}
    __linux_compliance_remediate_pwq_content_sha256: "{{ __linux_compliance_remediate_pwq_content | hash('sha256') }}"
    __linux_compliance_remediate_pwq_status: >-
      {{ 'method_changed' if __linux_compliance_remediate_pwq_entry_method not in [none, 'dropin']
         else 'notapplicable' if not (__linux_compliance_remediate_pwq_main_stat.isreg | default(false))
         else 'not_directory' if (__linux_compliance_remediate_pwq_directory_stat.exists | default(false))
              and not (__linux_compliance_remediate_pwq_directory_stat.isdir | default(false))
         else 'not_regular_file' if __linux_compliance_remediate_pwq_stat.stat.exists
              and not __linux_compliance_remediate_pwq_stat.stat.isreg
         else 'not_owned' if __linux_compliance_remediate_pwq_current is not skipped
              and not (__linux_compliance_remediate_pwq_current.content | b64decode)
                      .startswith(__linux_compliance_remediate_pwq_header)
         else __linux_compliance_remediate_pwq_decision.status }}
  tags:
    - always

- name: Password quality | Create the drop-in directory that libpwquality reads but the package does not ship
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_pwquality_directory }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  register: __linux_compliance_remediate_pwq_directory
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_pwq_directory_missing
  tags:
    - always

- name: Password quality | Mark the directory as created by the collection, so cleanup can remove it
  ansible.builtin.file:
    path: "{{ __linux_compliance_remediate_pwquality_marker }}"
    state: touch
    mode: "0644"
    owner: root
    group: root
    access_time: preserve
    modification_time: preserve
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_pwq_directory_missing
  tags:
    - always

- name: Password quality | Record that the drop-in did not exist before writing it
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values:
      - name: method
        value: dropin
      - name: dropin
        value: null
      - name: dropin_sha256
        value: "{{ __linux_compliance_remediate_pwq_content_sha256 }}"
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
  register: __linux_compliance_remediate_pwq_record
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - __linux_compliance_remediate_rule.ledger_entry is none
  tags:
    - always

- name: Password quality | Keep the recorded prior state and record the new content when the profile value changed
  freesecdev.linux_compliance.control_state:
    action: record
    rule_id: "{{ __linux_compliance_remediate_rule.rule_id }}"
    family: "{{ __linux_compliance_remediate_rule.family }}"
    revert_strategy: "{{ __linux_compliance_remediate_rule.revert_strategy }}"
    prior_values: >-
      {{ __linux_compliance_remediate_pwq_entry
         | combine({'dropin_sha256': __linux_compliance_remediate_pwq_content_sha256})
         | dict2items(key_name='name', value_name='value') }}
    collection_version: "{{ __linux_compliance_remediate_collection_version }}"
    replace: true
  register: __linux_compliance_remediate_pwq_rerecord
  when:
    - __linux_compliance_remediate_pwq_status in ['applied', 'compliant']
    - __linux_compliance_remediate_pwq_entry_method == 'dropin'
    - >-
      __linux_compliance_remediate_pwq_entry.dropin_sha256 | default(none)
      != __linux_compliance_remediate_pwq_content_sha256
  tags:
    - always

- name: Password quality | Write the drop-in with the value that the profile requires
  ansible.builtin.copy:
    content: "{{ __linux_compliance_remediate_pwq_content }}"
    dest: "{{ __linux_compliance_remediate_rule.parameters.path }}"
    follow: false
    force: true
    mode: "0644"
    owner: root
    group: root
  register: __linux_compliance_remediate_pwq_write
  when:
    - __linux_compliance_remediate_pwq_status == 'applied'
    - not (ansible_check_mode and __linux_compliance_remediate_pwq_directory_missing)
  tags:
    - always

- name: Password quality | Remember the drop-in that this run writes
  ansible.builtin.set_fact:
    __linux_compliance_remediate_pwq_written: >-
      {{ __linux_compliance_remediate_pwq_written + [__linux_compliance_remediate_rule.parameters.path] }}
  when: __linux_compliance_remediate_pwq_status == 'applied'
  tags:
    - always

- name: Password quality | Add the result of the rule
  ansible.builtin.set_fact:
    __linux_compliance_remediate_results: >-
      {{ __linux_compliance_remediate_results + [{
           'rule_id': __linux_compliance_remediate_rule.rule_id,
           'family': __linux_compliance_remediate_rule.family,
           'action': 'apply',
           'status': __linux_compliance_remediate_pwq_status,
           'reason': ('the ledger entry was recorded by the ' ~ __linux_compliance_remediate_pwq_entry_method
                      ~ ' method; clean it up first')
                     if __linux_compliance_remediate_pwq_status == 'method_changed'
                     else (__linux_compliance_remediate_pwquality_main ~ ' does not exist, so libpwquality is not'
                           ~ ' installed') if __linux_compliance_remediate_pwq_status == 'notapplicable'
                     else (__linux_compliance_remediate_pwquality_directory ~ ' is a symbolic link or not a'
                           ~ ' directory') if __linux_compliance_remediate_pwq_status == 'not_directory'
                     else (__linux_compliance_remediate_rule.parameters.path ~ ' is a symbolic link or not a'
                           ~ ' regular file') if __linux_compliance_remediate_pwq_status == 'not_regular_file'
                     else (__linux_compliance_remediate_rule.parameters.path ~ ' does not carry the header of the'
                           ~ ' collection') if __linux_compliance_remediate_pwq_status == 'not_owned'
                     else __linux_compliance_remediate_pwq_decision.reason,
           'changed': (__linux_compliance_remediate_pwq_write is changed)
                      or (__linux_compliance_remediate_pwq_directory is changed)
                      or (__linux_compliance_remediate_pwq_rerecord is changed),
           'message': __linux_compliance_remediate_rule.parameters.path ~ ': ' ~ __linux_compliance_remediate_pwq_status
                      ~ ((' (' ~ __linux_compliance_remediate_pwq_decision.reason ~ '; nothing was changed)')
                         if __linux_compliance_remediate_pwq_status in ['overridden', 'unreadable_file'] else '')
         }] }}
  tags:
    - always
