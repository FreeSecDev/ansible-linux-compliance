---
__linux_compliance_remediate_collection_version: "0.1.0"
__linux_compliance_remediate_toggle_pattern: "^linux_compliance_.+_enabled$"
__linux_compliance_remediate_banner_forbidden: '[\\\x00-\x08\x0b-\x1f\x7f]'
__linux_compliance_remediate_banner_max_length: 4096
__linux_compliance_remediate_prior_content_max_bytes: 3072
__linux_compliance_remediate_pwquality_main: /etc/security/pwquality.conf
__linux_compliance_remediate_pwquality_directory: /etc/security/pwquality.conf.d
__linux_compliance_remediate_pwquality_marker: /etc/security/pwquality.conf.d/.freesecdev-created
__linux_compliance_remediate_newline: "\n"
__linux_compliance_remediate_backslash: "\\"
__linux_compliance_remediate_sshd_main: /etc/ssh/sshd_config
__linux_compliance_remediate_sshd_directory: /etc/ssh/sshd_config.d
__linux_compliance_remediate_sshd_marker: /etc/ssh/sshd_config.d/.freesecdev-created
__linux_compliance_remediate_sshd_vendor_files:
  - /etc/ssh/sshd_config
  - /etc/ssh/sshd_config.d/50-redhat.conf
__linux_compliance_remediate_sudo_main: /etc/sudoers
__linux_compliance_remediate_sudo_directory: /etc/sudoers.d
__linux_compliance_remediate_sudo_validator: /usr/sbin/visudo
__linux_compliance_remediate_sudo_dropin_pattern: '^/etc/sudoers\.d/50-freesecdev-[a-z_]{1,32}$'
__linux_compliance_remediate_sudo_line_pattern: '^Defaults !?[a-z_]{1,32}(=\{value\})?$'
__linux_compliance_remediate_sudo_option_pattern: '^[a-z_]{1,32}$'
__linux_compliance_remediate_sudo_include_pattern: '(?m)^[ \t]*[@#]includedir[ \t]+/etc/sudoers\.d/?[ \t]*$'
__linux_compliance_remediate_sudo_backslash: '\'
__linux_compliance_remediate_sudo_read_name: '^[^.]*[^.~]$'
