---
__linux_compliance_remediate_collection_version: "0.1.0"
__linux_compliance_remediate_toggle_pattern: "^linux_compliance_.+_enabled$"
__linux_compliance_remediate_banner_forbidden: '[\\\x00-\x08\x0b-\x1f\x7f]'
__linux_compliance_remediate_banner_max_length: 4096
__linux_compliance_remediate_prior_content_max_bytes: 3072
__linux_compliance_remediate_pwquality_main: /etc/security/pwquality.conf
__linux_compliance_remediate_pwquality_directory: /etc/security/pwquality.conf.d
__linux_compliance_remediate_pwquality_marker: /etc/security/pwquality.conf.d/.freesecdev-created
__linux_compliance_remediate_pwquality_pam_directories:
  - /etc/pam.d
  - /usr/lib/pam.d
__linux_compliance_remediate_pwquality_line_start: '(?i)^[ \t\n\v\f\r]*'
__linux_compliance_remediate_login_defs: /etc/login.defs
__linux_compliance_remediate_login_defs_directory: /etc/login.defs.d
__linux_compliance_remediate_login_defs_setting_pattern: '^[A-Z][A-Z0-9_]{1,31}$'
__linux_compliance_remediate_login_defs_number_pattern: '^(0|[1-9][0-9]{0,5})$'
__linux_compliance_remediate_login_defs_umask_pattern: '^[0-7]{3}$'
__linux_compliance_remediate_login_defs_word_pattern: '^[a-z]{1,8}$'
__linux_compliance_remediate_login_defs_umask_read_pattern: '^(0[0-7]{0,2}|00[0-7]{2}|[0-7])$'
__linux_compliance_remediate_login_defs_base0_pattern: '^"?[+-]?(0[xX][0-9a-fA-F]+|0[0-7]*|[1-9][0-9]*)"?$'
__linux_compliance_remediate_login_defs_getdef_number_pattern: '^\+?(0[xX][0-9a-fA-F]+|0[0-7]*|[1-9][0-9]*)$'
__linux_compliance_remediate_newline: "\n"
__linux_compliance_remediate_backslash: "\\"
__linux_compliance_remediate_sshd_main: /etc/ssh/sshd_config
__linux_compliance_remediate_sshd_directory: /etc/ssh/sshd_config.d
__linux_compliance_remediate_sshd_marker: /etc/ssh/sshd_config.d/.freesecdev-created
__linux_compliance_remediate_sshd_vendor_files:
  - /etc/ssh/sshd_config
  - /etc/ssh/sshd_config.d/50-redhat.conf
__linux_compliance_remediate_sshd_known_includes:
  /etc/ssh/sshd_config.d/50-redhat.conf:
    - /etc/crypto-policies/back-ends/opensshserver.config
__linux_compliance_remediate_sudo_main: /etc/sudoers
__linux_compliance_remediate_sudo_directory: /etc/sudoers.d
__linux_compliance_remediate_sudo_validator: /usr/sbin/visudo
__linux_compliance_remediate_sudo_dropin_pattern: '^/etc/sudoers\.d/50-freesecdev-[a-z_]{1,32}$'
__linux_compliance_remediate_sudo_line_pattern: '^Defaults !?[a-z_]{1,32}(=\{value\})?$'
__linux_compliance_remediate_sudo_option_pattern: '^[a-z_]{1,32}$'
__linux_compliance_remediate_sudo_include_pattern: '(?m)^[ \t]*[@#]includedir[ \t]+/etc/sudoers\.d/?[ \t]*$'
__linux_compliance_remediate_sudo_backslash: '\'
__linux_compliance_remediate_sudo_read_name: '^[^.]*[^.~]$'
__linux_compliance_remediate_modprobe_families:
  - filesystem_modules
  - protocol_modules
  - wireless_modules
__linux_compliance_remediate_modprobe_directory: /etc/modprobe.d
__linux_compliance_remediate_modprobe_read_directories:
  xccdf_org.ssgproject.content_benchmark_UBUNTU_24-04:
    - /etc/modprobe.d
    - /run/modprobe.d
    - /usr/local/lib/modprobe.d
    - /usr/lib/modprobe.d
    - /lib/modprobe.d
  xccdf_org.ssgproject.content_benchmark_RHEL-9:
    - /etc/modprobe.d
    - /run/modprobe.d
    - /usr/lib/modprobe.d
    - /lib/modprobe.d
__linux_compliance_remediate_modprobe_checked_directories:
  - /etc/modprobe.d
  - /run/modprobe.d
  - /usr/lib/modprobe.d
__linux_compliance_remediate_modprobe_read_patterns:
  - "*.conf"
  - "*.alias"
__linux_compliance_remediate_modprobe_checked_name: '^.*\.conf$'
__linux_compliance_remediate_modprobe_module_pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
__linux_compliance_remediate_modprobe_disabling_commands:
  - /bin/false
  - /bin/true
__linux_compliance_remediate_modprobe_checked_install: '(?m)^\s*install\s+{module}\s+(/bin/false|/bin/true)$'
__linux_compliance_remediate_modprobe_checked_blacklist: '(?m)^blacklist\s+{module}$'
