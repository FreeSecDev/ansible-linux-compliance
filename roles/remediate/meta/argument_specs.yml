---
argument_specs:
  main:
    short_description: "Remediate a host with native modules (opt-in)"
    description:
      - "Dispatches the rules of the catalogue roles/remediate/vars/rules.yml to their family task files."
      - "Does nothing unless linux_compliance_remediate_enabled is true."
      - "Applies and cleans up disruptive families only when they are named in"
      - "linux_compliance_remediate_allow_disruptive."
      - "Resolves each rule from its rule toggle, its family toggle and the global opt-in (ADR 0011)."
      - "Cleans up rules that the state ledger records as applied and that are no longer effective."
      - "Unknown rule or family toggles and unknown allow-list entries fail the role before anything changes."
      - "Publishes the plan and the results as the fact linux_compliance_remediated."
      - "See docs/remediation.md."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_remediate_enabled:
        type: bool
        default: false
        description:
          - "Global opt-in for remediation."
          - "When false the role reads nothing from and changes nothing on the host."
          - "It only reports every rule as skipped."
          - "It gates cleanup too: a rule disabled while this is false is cleaned up by the next enabled run."
      linux_compliance_remediate_allow_disruptive:
        type: list
        default: []
        description:
          - "Disruptive control families that may be applied or cleaned up."
          - "A disruptive family runs only when it is named here, because it can lock operators out or stop the host."
          - "Rules of a disruptive family that is not named are skipped with the reason disruptive_not_allowed."
        elements: str
        choices:
          - accounts
          - auditd
          - bootloader
          - crypto_policy
          - desktop
          - firewall
          - kernel_modules
          - mandatory_access_control
          - mounts
          - network
          - packages
          - pam
          - services
          - ssh
          - sudo
      linux_compliance_remediate_profile:
        type: str
        default: "cis_level1_server"
        description:
          - "ComplianceAsCode profile short identifier, without the XCCDF prefix."
          - "When remediation is enabled it must equal the profile that the discover role verified."
          - "Only rules that this profile selects are applied; applied rules that it does not select are cleaned up."
          - "A profile is never substituted silently for another benchmark."
      linux_compliance_file_permissions_enabled:
        type: bool
        default: true
        description:
          - "Topic toggle of the file_permissions control family (ADR 0011)."
          - "When false, every rule of the family whose rule toggle is not set is off."
          - "Remediation cleans such a rule up when the state ledger records it as applied."
          - "The audit excludes it and reports it as disabled, naming this variable."
          - "Catalogued rules: 155, with a native remediation: 1."
          - "Rule toggles linux_compliance_rule_<id>_enabled are not declared here; see"
          - "docs/remediation-variables.md."
          - "Generated from roles/remediate/vars/rules.yml; see docs/remediation-variables.md."
      linux_compliance_sysctl_enabled:
        type: bool
        default: true
