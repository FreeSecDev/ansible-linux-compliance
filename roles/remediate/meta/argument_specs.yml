---
argument_specs:
  main:
    short_description: "Remediate a host with native modules (opt-in)"
    description:
      - "Dispatches the rules of the catalogue roles/remediate/vars/rules.yml to their family task files."
      - "Does nothing unless linux_compliance_remediate_enabled is true."
      - "Applies and cleans up disruptive families only when they are named in"
      - "linux_compliance_remediate_allow_disruptive."
      - "Resolves each rule from its rule toggle, its family toggle and the global opt-in (ADR 0011)."
      - "Cleans up rules that the state ledger records as applied and that are no longer effective."
      - "Unknown rule or family toggles and unknown allow-list entries fail the role before anything changes."
      - "Publishes the plan and the results as the fact linux_compliance_remediated."
      - "See docs/remediation.md."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_remediate_enabled:
        type: bool
        default: false
        description:
          - "Global opt-in for remediation."
          - "When false the role reads nothing from and changes nothing on the host."
          - "It only reports every rule as skipped."
          - "It gates cleanup too: a rule disabled while this is false is cleaned up by the next enabled run."
      linux_compliance_remediate_allow_disruptive:
        type: list
        default: []
        description:
          - "Disruptive control families that may be applied or cleaned up."
          - "A disruptive family runs only when it is named here, because it can lock operators out or stop the host."
          - "Rules of a disruptive family that is not named are skipped with the reason disruptive_not_allowed."
        elements: str
        choices:
          - accounts
          - apparmor
          - auditd
          - autofs
          - bootloader
          - console_access
          - cron
          - crypto_policy
          - desktop
          - faillock
          - fapolicyd
          - filesystem_modules
          - firewall
          - firewalld
          - ipsec
          - iptables
          - ipv4_parameters
          - ipv6_parameters
          - kernel_modules
          - login_defs
          - mail
          - mandatory_access_control
          - mount_options
          - mounts
          - network
          - network_services
          - network_settings
          - nfs
          - nftables
          - package_sources
          - package_updates
          - packages
          - pam
          - partitioning
          - password_aging
          - protocol_modules
          - pwhistory
          - pwquality
          - root_access
          - selinux
          - services
          - smartcard
          - ssh
          - sssd
          - sudo
          - system_packages
          - time_sync
          - ufw
          - umask
          - usbguard
          - user_accounts
          - user_sessions
          - wireless
          - wireless_modules
      linux_compliance_remediate_profile:
        type: str
        default: "cis_level1_server"
        description:
          - "ComplianceAsCode profile short identifier, without the XCCDF prefix."
          - "When remediation is enabled it must equal the profile that the discover role verified."
          - "Only rules that this profile selects are applied; applied rules that it does not select are cleaned up."
          - "A profile is never substituted silently for another benchmark."
      linux_compliance_remediate_banner_text:
        type: str
        default: "Authorized users only. All activity may be monitored and reported."
        description:
          - "Text of the login banners /etc/issue and /etc/issue.net and of the message of the day /etc/motd."
          - "The default is the default of the XCCDF value cis_banner_text of the pinned content."
          - "It must not be empty and must not contain a backslash or control characters other than newline and tab."
          - "When the profile requires a text through an XCCDF value, for example the DoD notice of the STIG profiles,"
          - "the text must match that value, or the banners family fails before it changes anything."
      linux_compliance_remediate_sysctl_runtime:
        type: bool
        default: true
        description:
          - "Whether the kernel parameter families (sysctl, ipv4_parameters, ipv6_parameters) set the running value."
          - "The persistent value is always written as a drop-in below /etc/sysctl.d, which the kernel loads at boot."
          - "With true, a rule whose running value the content's check rejects sets it as well and records the value"
          - "before, which cleanup sets again; where /proc/sys cannot be written, such a rule is refused as"
          - "runtime_unavailable and nothing is changed."
          - "With false, only the persistent value is written and the running kernel is neither read nor changed;"
          - "it takes the value at the next boot. Cleanup still sets back a running value that the ledger recorded."
          - "See ADR 0029."
      linux_compliance_file_permissions_enabled:
        type: bool
        default: true
        description:
          - "Topic toggle of the file_permissions family (ADR 0011); false switches its rules off."
          - "Rules: 155, native: 1. Generated; see docs/remediation-variables.md."
      linux_compliance_sysctl_enabled:
