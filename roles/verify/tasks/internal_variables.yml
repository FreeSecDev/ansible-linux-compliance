---
- name: Verify | Refuse internal variables supplied from outside the role as parameters
  ansible.builtin.assert:
    that:
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_verify_baseline_recorded$') == [] or
        '__linux_compliance_verify_baseline_recorded' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_verify_comparison$') == [] or
        '__linux_compliance_verify_comparison' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_verify_dispatched$') == [] or
        '__linux_compliance_verify_dispatched' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_verify_gate$') == [] or '__linux_compliance_verify_gate'
        in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_verify_host_nonce$') == [] or
        '__linux_compliance_verify_host_nonce' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_verify_marker$') == [] or
        '__linux_compliance_verify_marker' in (hostvars[inventory_hostname] | list)
    fail_msg: >-
      An internal variable of the verify role (__linux_compliance_verify_*) is set from outside the role as a parameter:
      a role parameter, a variable of a roles entry, an include parameter (vars of include_role, import_role,
      include_tasks or import_tasks) or a block or play variable. It is refused by its name, whatever its value, because
      a template could evaluate to the value that a later check expects. The failed assertion names it. Remove it and
      pass only the documented linux_compliance_* variables. Nothing was scanned, changed or compared.
    quiet: true
  tags:
    - always

- name: Verify | Record a random nonce in the facts of this host
  ansible.builtin.set_fact:
    __linux_compliance_verify_host_nonce: "{{ 1000000000000 | ansible.builtin.random }}"
  tags:
    - always

- name: Verify | Refuse an inventory_hostname that names another host
  ansible.builtin.assert:
    that:
      - >-
        (hostvars[inventory_hostname] | default({}))['__linux_compliance_verify_host_nonce'] | default(none) ==
        __linux_compliance_verify_host_nonce
    fail_msg: >-
      inventory_hostname is {{ inventory_hostname }}, but the nonce that the previous task recorded in the facts of this
      host is not __linux_compliance_verify_host_nonce of hostvars[inventory_hostname]: a role parameter, an include
      parameter or an extra variable named inventory_hostname points the verify role at another host. Remove it. Nothing
      was scanned, changed or compared.
    quiet: true
  tags:
    - always

- name: Verify | Reset the internal facts of the role
  ansible.builtin.set_fact:
    __linux_compliance_verify_baseline_recorded: __linux_compliance_unset__
    __linux_compliance_verify_comparison: __linux_compliance_unset__
    __linux_compliance_verify_dispatched: __linux_compliance_unset__
  tags:
    - always

- name: Verify | Refuse internal variables supplied from outside the role
  ansible.builtin.assert:
    that:
      - __linux_compliance_verify_baseline_recorded == '__linux_compliance_unset__'
      - __linux_compliance_verify_comparison == '__linux_compliance_unset__'
      - __linux_compliance_verify_dispatched == '__linux_compliance_unset__'
      - __linux_compliance_verify_gate == '__linux_compliance_unset__'
      - __linux_compliance_verify_marker == '__linux_compliance_unset__'
    fail_msg: >-
      An internal variable of the verify role (__linux_compliance_verify_*) is set from outside the role: by a role
      parameter, an include parameter (vars of include_role or include_tasks) or an extra variable (-e), which outrank
      every fact the role sets. The failed assertion names it. Remove it and pass only the documented linux_compliance_*
      variables. Nothing was scanned, changed or compared.
    quiet: true
  vars:
    __linux_compliance_verify_gate: __linux_compliance_unset__
    __linux_compliance_verify_marker: __linux_compliance_unset__
  tags:
    - always

- name: Verify | Reset the internal facts of the role to the second sentinel
  ansible.builtin.set_fact:
    __linux_compliance_verify_baseline_recorded: __linux_compliance_unset_again__
    __linux_compliance_verify_comparison: __linux_compliance_unset_again__
    __linux_compliance_verify_dispatched: __linux_compliance_unset_again__
  tags:
    - always

- name: Verify | Refuse internal variables supplied from outside the role as the first sentinel
  ansible.builtin.assert:
    that:
      - __linux_compliance_verify_baseline_recorded == '__linux_compliance_unset_again__'
      - __linux_compliance_verify_comparison == '__linux_compliance_unset_again__'
      - __linux_compliance_verify_dispatched == '__linux_compliance_unset_again__'
      - __linux_compliance_verify_gate == '__linux_compliance_unset_again__'
      - __linux_compliance_verify_marker == '__linux_compliance_unset_again__'
    fail_msg: >-
      An internal variable of the verify role (__linux_compliance_verify_*) is set from outside the role: by a role
      parameter, an include parameter (vars of include_role or include_tasks) or an extra variable (-e), which outrank
      every fact the role sets. The failed assertion names it. Remove it and pass only the documented linux_compliance_*
      variables. Nothing was scanned, changed or compared.
    quiet: true
  vars:
    __linux_compliance_verify_gate: __linux_compliance_unset_again__
    __linux_compliance_verify_marker: __linux_compliance_unset_again__
  tags:
    - always

- name: Verify | Reset the internal facts of the role to the first sentinel again
  ansible.builtin.set_fact:
    __linux_compliance_verify_baseline_recorded: __linux_compliance_unset__
    __linux_compliance_verify_comparison: __linux_compliance_unset__
    __linux_compliance_verify_dispatched: __linux_compliance_unset__
  tags:
    - always
