---
- name: Verify | Validate inputs
  ansible.builtin.assert:
    that:
      - linux_compliance_verify_profile is string
      - linux_compliance_verify_profile | length > 0
      - linux_compliance_verify_fail_on_regression is boolean
    fail_msg: >-
      The verify role received an invalid input; see meta/argument_specs.yml.
      Boolean variables must be real booleans on the command line, for example
      -e '{"linux_compliance_verify_fail_on_regression": true}';
      -e linux_compliance_verify_fail_on_regression=true passes a string.
    quiet: true
  tags:
    - always

- name: Verify | Stop because the role is not implemented yet
  ansible.builtin.fail:
    msg: The verify role is not implemented yet (tracked in FREES-54). No change was made to the host.
  tags:
    - always
