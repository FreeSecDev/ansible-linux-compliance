  evaluate.yml:
    short_description: "Apply the exceptions file and the failure gate to an existing audit result"
    description:
      - "Runs the second half of the main entry point on the fact linux_compliance_audited, without scanning."
      - "Validates linux_compliance_exceptions_file once on the controller and applies it to each host's scan run."
      - "Then fails when the scan did not complete and evaluates the failure gate."
      - "The raw scan_run and summary of linux_compliance_audited are never changed."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_audit_fail_on_noncompliant:
        type: bool
        default: false
        description:
          - "Fail the play when the gate counts at least one rule with outcome fail or error."
      linux_compliance_audit_fail_on_noncompliant_after_waivers:
        type: bool
        default: false
        description:
          - "Count the waived result instead of the raw result in the gate; error always counts."
      linux_compliance_exceptions_file:
        type: str
        default: null
        description:
          - "Absolute path, on the controller, of the exceptions file; null applies no exceptions."
  deferred.yml:
    short_description: "Audit a host like the main entry point, with the result gates deferred"
    description:
      - "Runs every task of the main entry point except the result gates, with the same inputs and validation."
      - "Records linux_compliance_audited.gate as deferred true and enforced false instead of a gate decision."
      - "A scan that did not complete or failed rules therefore do not fail the host in this play."
      - "The deferral comes only from choosing this entry point; no variable defers or skips a gate."
      - "playbooks/evidence.yml uses it and runs enforce.yml before it collects the evidence of each host."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_audit_fail_on_noncompliant:
        type: bool
        default: false
        description:
          - "Fail the play when the gate counts at least one rule with outcome fail or error."
      linux_compliance_audit_fail_on_noncompliant_after_waivers:
        type: bool
        default: false
        description:
          - "Count the waived result instead of the raw result in the gate; error always counts."
      linux_compliance_exceptions_file:
        type: str
        default: null
        description:
          - "Absolute path, on the controller, of the exceptions file; null applies no exceptions."
  evaluate_deferred.yml:
    short_description: "Apply the exceptions file to an existing audit result, with the result gates deferred"
    description:
      - "Runs evaluate.yml without its result gates and records the gate as deferred and not enforced."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_audit_fail_on_noncompliant:
        type: bool
        default: false
        description:
          - "Fail the play when the gate counts at least one rule with outcome fail or error."
      linux_compliance_audit_fail_on_noncompliant_after_waivers:
        type: bool
        default: false
        description:
          - "Count the waived result instead of the raw result in the gate; error always counts."
      linux_compliance_exceptions_file:
        type: str
        default: null
        description:
          - "Absolute path, on the controller, of the exceptions file; null applies no exceptions."
  enforce.yml:
    short_description: "Enforce the result gates that deferred.yml or evaluate_deferred.yml deferred"
    description:
      - "Requires linux_compliance_audited.gate to record a deferral."
      - "Records the gate decision with deferred true and enforced true."
      - "Then fails the host when the scan did not complete."
      - "With linux_compliance_audit_fail_on_noncompliant it also fails the host on failed or errored rules."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_audit_fail_on_noncompliant:
        type: bool
        default: false
        description:
          - "Fail the play when the gate counts at least one rule with outcome fail or error."
      linux_compliance_audit_fail_on_noncompliant_after_waivers:
        type: bool
        default: false
        description:
          - "Count the waived result instead of the raw result in the gate; error always counts."
  stale.yml:
    short_description: "Report the exceptions that matched no finding on any audited host"
    description:
      - "Aggregates the exceptions evaluations published on the given hosts and runs stale_exceptions once."
      - "Run it in a play after the audit play, as playbooks/audit.yml does, so every serial batch is included."
      - "Publishes the fact linux_compliance_audit_stale_exceptions on the hosts of the play that runs it."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_audit_stale_hosts:
        type: list
        elements: str
        required: true
        description:
          - "Inventory host names whose audit results are aggregated."
          - "Hosts without an audit result are ignored."
          - "Audited hosts without an evaluation are listed as not evaluated."
