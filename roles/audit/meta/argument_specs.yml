---
argument_specs:
  main:
    short_description: "Audit a host against a compliance profile (read-only)"
    description:
      - "Scans the host against the profile that the discover role verified and produces normalized findings."
      - "Runs the freesecdev.linux_compliance.compliance_scan module."
      - "Before the scan it resolves the control toggles of ADR 0011 with the catalogue of the remediate role."
      - "Rules that a toggle switches off are excluded and reported as disabled, naming the controlling variable."
      - "Publishes the result as the fact linux_compliance_audited."
      - "The role never changes the configuration of the managed host."
      - "It writes evidence files below linux_compliance_audit_output_dir."
      - "It fails when the scan did not complete."
      - "It fails on failed or errored rules when linux_compliance_audit_fail_on_noncompliant is true."
      - "With linux_compliance_exceptions_file set, it validates the file on the controller before any host is scanned."
      - "It then applies the file to the scan run of each host and publishes the waived result next to the raw one."
    author: "FreeSecDev contributors"
    options:
      linux_compliance_audit_profile:
        type: str
        default: "cis_level1_server"
        description:
          - "ComplianceAsCode profile short identifier, without the XCCDF prefix."
          - "It must equal the profile that the discover role verified (linux_compliance_discover_profile)."
          - "The initial implementation scope is the CIS Level 1 Server profile on Ubuntu 24.04 (ADR 0010)."
          - "A profile is never substituted silently for another benchmark."
      linux_compliance_audit_fail_on_noncompliant:
        type: bool
        default: false
        description:
          - "Fail the play when the audit reports at least one rule with outcome fail or error."
          - "The audit never changes the host either way, and a scan that did not complete always fails."
          - "By default the gate counts the raw result, so a waiver never passes it."
          - "See linux_compliance_audit_fail_on_noncompliant_after_waivers."
      linux_compliance_audit_fail_on_noncompliant_after_waivers:
        type: bool
        default: false
        description:
          - "Opt in to counting the waived result instead of the raw result in the failure gate."
          - "Only failures that an exception in effect covers are then not counted."
          - "Rules with outcome error always count, in both modes, because an error is never waived."
          - "Without an exceptions file, or when no waiver was applied, the gate counts the raw result."
          - "It has no effect unless linux_compliance_audit_fail_on_noncompliant is true."
      linux_compliance_exceptions_file:
        type: str
        default: null
        description:
          - "Absolute path, on the controller, of the version-controlled exceptions file (docs/exceptions.md)."
          - "Null, the default, applies no exceptions and leaves the role behaviour unchanged."
          - "It is read once per play batch with the ansible.builtin.file lookup and validated before any scan."
          - "An invalid file fails the play; a scan start too far after the controller time fails the host."
          - "Every host of the play must use the same value; set it in play or extra variables, not per host."
          - "The variable is shared by the audit and verify roles, so it has no role prefix."
      linux_compliance_audit_backend:
        type: str
        default: "openscap"
        choices:
          - openscap
          - scc
        description:
          - "Scanner backend: openscap scans the profile that the discover role verified."
          - "scc scans the DISA STIG benchmark that SCC installed, given by linux_compliance_audit_scc_content_path."
          - "With scc the role maps the toggles to the DISA rules through content/stig-mapping.json (ADR 0019)."
          - "SCC findings then carry the control family, topic and tags of their mapped rules."
      linux_compliance_audit_output_dir:
        type: str
        default: "/var/lib/freesecdev/linux_compliance/evidence"
        description:
          - "Absolute directory on the managed host below which each run gets its own directory."
          - "It must be owned by root and grant no permissions to group or others."
          - "Missing components are created with mode 0700."
          - "No component may be a symbolic link."
          - "An existing directory with other permissions is never repaired."
      linux_compliance_audit_scan_timeout:
        type: int
        default: 1800
        description:
          - "Wall-clock limit of the scan in seconds, from 1 to 3600."
          - "A scan that exceeds it is timed_out, never compliant."
      linux_compliance_audit_disabled_rules:
        type: list
        elements: dict
        default: []
        description:
          - "Rules of the profile outside the remediate rule catalogue to disable (ADR 0011)."
          - "Catalogued rules are disabled with their toggles instead; naming one here fails the role."
          - "The role adds the catalogued rules that the toggles switch off; see docs/remediation-variables.md."
          - "Each item is a mapping with rule_id and an optional disabled_by."
          - "rule_id is the full XCCDF rule identifier and must be selected by the profile."
          - "disabled_by names the controlling variable; it defaults to linux_compliance_rule_<short id>_enabled."
          - "Disabled rules are excluded through a generated tailoring file and reported as disabled."
          - "With linux_compliance_audit_backend scc an item may name a DISA rule of the SCC profile instead."
          - "It then needs disabled_by; SCC scans every rule and the role reports disabled rules afterwards."
          - "They are never counted as passing."
        options:
          rule_id:
            type: str
            required: true
            description:
              - "Full XCCDF rule identifier."
          disabled_by:
            type: str
            description:
              - "Name of the controlling toggle variable, linux_compliance_<name>_enabled."
      linux_compliance_audit_scc_content_path:
        type: str
        default: null
        description:
          - "Absolute path of the pinned DISA stream as SCC installed it, for linux_compliance_audit_backend scc."
          - "It lies below /opt/scc/Resources/Content/SCAP12_Content; the role never installs content."
          - "Required with scc and ignored with openscap."
      linux_compliance_audit_scc_content_sha256:
        type: str
        default: null
        description:
          - "Pinned SHA-256 of that stream, 64 hexadecimal characters; required with scc."
          - "The profile_info and compliance_scan modules refuse a stream with another digest."
      linux_compliance_audit_scc_profile_id:
        type: str
        default: "xccdf_mil.disa.stig_profile_MAC-1_Classified"
        description:
          - "Full XCCDF identifier of the DISA profile that SCC evaluates, for linux_compliance_audit_backend scc."
      linux_compliance_audit_allow_off_platform_benchmark:
        type: bool
        default: false
        description:
          - "Explicit opt-in to scan an Ubuntu 26.04 host with the Ubuntu 24.04 STIG benchmark (ADR 0019, FREES-161)."
          - "Only with linux_compliance_audit_backend scc; with openscap a true value fails the role."
          - "Every result is then labelled off-platform and kept out of every compliance figure."
      linux_compliance_file_permissions_enabled:
        type: bool
