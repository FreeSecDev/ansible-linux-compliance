---
linux_compliance_audit_profile: "cis_level1_server"
linux_compliance_audit_fail_on_noncompliant: false
linux_compliance_audit_backend: "openscap"
linux_compliance_audit_output_dir: "/var/lib/freesecdev/linux_compliance/evidence"
linux_compliance_audit_scan_timeout: 1800
linux_compliance_audit_disabled_rules: []
linux_compliance_audit_fail_on_noncompliant_after_waivers: false
linux_compliance_exceptions_file: null
linux_compliance_file_permissions_enabled: true
linux_compliance_sysctl_enabled: true
linux_compliance_auditd_enabled: true
linux_compliance_services_enabled: true
linux_compliance_network_enabled: true
linux_compliance_firewall_enabled: true
linux_compliance_ssh_enabled: true
linux_compliance_pam_enabled: true
linux_compliance_sudo_enabled: true
linux_compliance_crypto_policy_enabled: true
linux_compliance_mounts_enabled: true
linux_compliance_bootloader_enabled: true
linux_compliance_rule_file_permissions_crontab_enabled: "{{ linux_compliance_file_permissions_enabled }}"
