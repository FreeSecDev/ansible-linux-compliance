---
- name: Audit | Check that there is an audit result to gate
  ansible.builtin.assert:
    that:
      - linux_compliance_audited is defined
      - linux_compliance_audited is mapping
      - linux_compliance_audited.run_status is defined
      - linux_compliance_audited.exceptions is defined
      - linux_compliance_audit_fail_on_noncompliant is boolean
      - linux_compliance_audit_fail_on_noncompliant_after_waivers is boolean
    fail_msg: >-
      The gate needs the fact linux_compliance_audited from the main or evaluate.yml entry point of the
      audit role, and boolean gate variables.
    quiet: true
  tags:
    - always

- name: Audit | Stop when the scan did not complete
  ansible.builtin.assert:
    that:
      - linux_compliance_audited.run_status in ['completed', 'not_run']
    fail_msg: >-
      The scan did not complete (run_status {{ linux_compliance_audited.run_status }}). Every rule
      of the profile is reported as error and nothing is compliant. Evidence is in
      {{ linux_compliance_audited.evidence.directory | default('no directory') }}.
    quiet: true
  tags:
    - always

- name: Audit | Record which result the failure gate counts
  ansible.builtin.set_fact:
    linux_compliance_audited: >-
      {{ linux_compliance_audited | ansible.builtin.combine({'gate': __linux_compliance_audit_gate}) }}
  vars:
    __linux_compliance_audit_gate_basis: >-
      {{ 'waived' if linux_compliance_audit_fail_on_noncompliant_after_waivers
                     and linux_compliance_audited.exceptions.applied
         else 'raw' }}
    __linux_compliance_audit_gate_summary: >-
      {{ linux_compliance_audited.exceptions.summary if __linux_compliance_audit_gate_basis == 'waived'
         else linux_compliance_audited.summary }}
    __linux_compliance_audit_gate_counted: "{{ linux_compliance_audited.run_status == 'completed' }}"
    __linux_compliance_audit_gate:
      enabled: "{{ linux_compliance_audit_fail_on_noncompliant }}"
      after_waivers: "{{ linux_compliance_audit_fail_on_noncompliant_after_waivers }}"
      basis: "{{ __linux_compliance_audit_gate_basis }}"
      counted: "{{ __linux_compliance_audit_gate_counted }}"
      fail: "{{ __linux_compliance_audit_gate_summary.fail | int if __linux_compliance_audit_gate_counted else none }}"
      error: "{{ linux_compliance_audited.summary.error | int if __linux_compliance_audit_gate_counted else none }}"
      waived: >-
        {{ __linux_compliance_audit_gate_summary.waived | int if __linux_compliance_audit_gate_counted else none }}
  tags:
    - always

- name: Audit | Stop on failed or errored rules when requested
  ansible.builtin.assert:
    that:
      - (linux_compliance_audited.gate.fail | int) + (linux_compliance_audited.gate.error | int) == 0
    fail_msg: >-
      The audit reported {{ linux_compliance_audited.gate.fail }} failed and
      {{ linux_compliance_audited.gate.error }} errored rule(s), counted on the
      {{ linux_compliance_audited.gate.basis }} result. The host was not changed.
      {{ 'Waived failures (' ~ linux_compliance_audited.exceptions.summary.waived ~ ') do not pass this gate;'
         ~ ' set linux_compliance_audit_fail_on_noncompliant_after_waivers to count the waived result.'
         if linux_compliance_audited.gate.basis == 'raw' and linux_compliance_audited.exceptions.applied
         else 'Errors are never waived and always count.' }}
    quiet: true
  when:
    - linux_compliance_audit_fail_on_noncompliant
    - linux_compliance_audited.gate.counted
  tags:
    - always
