---
- name: Audit | Check that every host of the play resolves the same exceptions file
  ansible.builtin.assert:
    that:
      - __linux_compliance_audit_exceptions_paths | length == 1
    fail_msg: >-
      linux_compliance_exceptions_file must be the same for every host of the play, also across serial
      batches, because the file is read and validated once. The hosts of the play resolve it to
      {{ __linux_compliance_audit_exceptions_paths | map('ansible.builtin.string') | join(', ') }}.
      Set it in play variables or with -e, not in host_vars or group_vars.
    quiet: true
  vars:
    __linux_compliance_audit_exceptions_unset: __linux_compliance_exceptions_file_not_host_specific__
    __linux_compliance_audit_exceptions_paths: >-
      {{ (ansible_play_hosts_all | map('extract', hostvars)
          | map(attribute='linux_compliance_exceptions_file', default=__linux_compliance_audit_exceptions_unset)
          | reject('equalto', __linux_compliance_audit_exceptions_unset) | list
          + [linux_compliance_exceptions_file]) | unique }}
  run_once: true
  any_errors_fatal: true
  tags:
    - always

- name: Audit | Read the exceptions file once on the controller
  ansible.builtin.set_fact:
    __linux_compliance_audit_exceptions:
      file: "{{ linux_compliance_exceptions_file }}"
      reader: "{{ inventory_hostname }}"
      text: >-
        {{ lookup('ansible.builtin.file', linux_compliance_exceptions_file, rstrip=false)
           if linux_compliance_exceptions_file is not none else none }}
  run_once: true
  any_errors_fatal: true
  tags:
    - always

- name: Audit | Mark the host that ran the read
  ansible.builtin.set_fact:
    __linux_compliance_audit_exceptions_read_here: "{{ inventory_hostname }}"
  delegate_to: "{{ inventory_hostname }}"
  delegate_facts: true
  run_once: true
  when: linux_compliance_exceptions_file is not none
  tags:
    - always

- name: Audit | Validate the exceptions file before any host is evaluated
  ansible.builtin.set_fact:
    __linux_compliance_audit_exceptions_overview: >-
      {{ __linux_compliance_audit_exceptions.text | freesecdev.linux_compliance.validate_exceptions
         if __linux_compliance_audit_exceptions.text is not none else none }}
  run_once: true
  any_errors_fatal: true
  tags:
    - always

- name: Audit | Check that the file was read once for the batch
  ansible.builtin.assert:
    that:
      - __linux_compliance_audit_exceptions.reader == ansible_play_batch | first
      - >-
        __linux_compliance_audit_exceptions_read_here != inventory_hostname
        or inventory_hostname == ansible_play_batch | first
    fail_msg: >-
      The exceptions file was not read once for the batch by its first host: it was last read on
      {{ __linux_compliance_audit_exceptions.reader }}{{ ' and also on this host'
         if __linux_compliance_audit_exceptions_read_here == inventory_hostname else '' }},
      which happens with the free strategy. The audit role does not support the free
      strategy when linux_compliance_exceptions_file is set; use the linear strategy.
    quiet: true
  when: linux_compliance_exceptions_file is not none
  tags:
    - always

- name: Audit | Check that every host uses the exceptions file that was validated
  ansible.builtin.assert:
    that:
      - __linux_compliance_audit_exceptions.file == linux_compliance_exceptions_file
    fail_msg: >-
      linux_compliance_exceptions_file must be the same for every host of the play, because the file
      is read and validated once. This host uses {{ linux_compliance_exceptions_file }}, the play
      validated {{ __linux_compliance_audit_exceptions.file }}. Set it in play or extra variables.
    quiet: true
  tags:
    - always

- name: Audit | Warn about exceptions that name a framework but no profiles
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ __linux_compliance_audit_unprofiled | map(attribute='id') | join(', ') }} in
      {{ linux_compliance_exceptions_file }} set a framework
      ({{ __linux_compliance_audit_unprofiled | map(attribute='framework') | unique | join(', ') }})
      but no profiles. The framework does not restrict matching, so each of them applies to every
      profile scanned on the hosts in its scope. List the profiles of the framework in
      scope.profiles to limit it (docs/exceptions.md).
  vars:
    __linux_compliance_audit_unprofiled: "{{ __linux_compliance_audit_exceptions_overview.framework_without_profiles }}"
  when:
    - __linux_compliance_audit_exceptions_overview is not none
    - __linux_compliance_audit_exceptions_overview.framework_without_profiles | length > 0
  run_once: true
  tags:
    - always
