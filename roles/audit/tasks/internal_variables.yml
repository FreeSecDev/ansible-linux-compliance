      An internal variable of the audit role (__linux_compliance_audit_*) is set from outside the role as a parameter: a
      role parameter, a variable of a roles entry, an include parameter (vars of include_role, import_role,
      include_tasks or import_tasks) or a block or play variable. It is refused by its name, whatever its value, because
      a template could evaluate to the value that a later check expects. The failed assertion names it. Remove it and
      pass only the documented linux_compliance_* variables. Nothing was scanned, changed or compared.
    quiet: true
  tags:
    - always

- name: Audit | Record a random nonce in the facts of this host
  ansible.builtin.set_fact:
    __linux_compliance_audit_host_nonce: "{{ 1000000000000 | ansible.builtin.random }}"
  tags:
    - always

- name: Audit | Refuse an inventory_hostname that names another host
  ansible.builtin.assert:
    that:
      - >-
        (hostvars[inventory_hostname] | default({}))['__linux_compliance_audit_host_nonce'] | default(none) ==
        __linux_compliance_audit_host_nonce
    fail_msg: >-
      inventory_hostname is {{ inventory_hostname }}, but the nonce that the previous task recorded in the facts of this
      host is not __linux_compliance_audit_host_nonce of hostvars[inventory_hostname]: a role parameter, an include
      parameter or an extra variable named inventory_hostname points the audit role at another host. Remove it. Nothing
      was scanned, changed or compared.
    quiet: true
  tags:
    - always

