- name: Audit | Refuse internal variables supplied from outside the role as parameters
  ansible.builtin.assert:
    that:
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_audit_catalogue$') == [] or
        '__linux_compliance_audit_catalogue' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_audit_evaluation$') == [] or
        '__linux_compliance_audit_evaluation' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_audit_exceptions$') == [] or
        '__linux_compliance_audit_exceptions' in (hostvars[inventory_hostname] | list)
      - >-
        query('ansible.builtin.varnames', '^__linux_compliance_audit_exceptions_overview$') == [] or
        '__linux_compliance_audit_exceptions_overview' in (hostvars[inventory_hostname] | list)
      - >-
