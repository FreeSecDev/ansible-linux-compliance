---
- name: Audit | Record that the result gates of this host are deferred and not enforced yet
  ansible.builtin.set_fact:
    linux_compliance_audited: >-
      {{ linux_compliance_audited | ansible.builtin.combine({'gate': {'deferred': true, 'enforced': false}}) }}
  tags:
    - always

- name: Audit | Report that the result gates are deferred
  ansible.builtin.debug:
    msg: >-
      WARNING: the result gates of {{ inventory_hostname }} are deferred: neither a scan that did not complete
      nor failed rules fail the host yet, and linux_compliance_audited.gate records deferred true and enforced
      false. The playbook must run the enforce.yml entry point of the audit role on this host, as
      playbooks/evidence.yml does; an evidence bundle is never written for a gate that was not enforced.
  tags:
    - always
