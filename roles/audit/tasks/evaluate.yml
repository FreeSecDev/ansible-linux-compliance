---
- name: Audit | Refuse internal variables supplied from outside the role
  ansible.builtin.import_tasks: internal_variables.yml
  tags:
    - always

- name: Audit | Validate the audit result and apply the exceptions file
  ansible.builtin.import_tasks: evaluation.yml
  tags:
    - always

- name: Audit | Enforce the result gates
  ansible.builtin.import_tasks: gate.yml
  tags:
    - always
