---
- name: Audit | Validate inputs
  ansible.builtin.assert:
    that:
      - linux_compliance_audit_profile is string
      - linux_compliance_audit_profile is match('^[a-z0-9][a-z0-9_]{0,127}$')
      - linux_compliance_audit_fail_on_noncompliant is boolean
      - linux_compliance_audit_backend is string
      - linux_compliance_audit_backend in ['openscap']
      - linux_compliance_audit_output_dir is string
      - linux_compliance_audit_output_dir is match('^/.+')
      - linux_compliance_audit_scan_timeout is integer
      - linux_compliance_audit_scan_timeout is not boolean
      - linux_compliance_audit_scan_timeout >= 1
      - linux_compliance_audit_scan_timeout <= 3600
      - linux_compliance_audit_disabled_rules is sequence
      - linux_compliance_audit_disabled_rules is not string
      - linux_compliance_audit_disabled_rules is not mapping
      - linux_compliance_audit_disabled_rules | reject('mapping') | list | length == 0
      - linux_compliance_audit_disabled_rules | rejectattr('rule_id', 'defined') | list | length == 0
    fail_msg: >-
      The audit role received an invalid input; see meta/argument_specs.yml.
      Boolean variables must be real booleans on the command line, for example
      -e '{"linux_compliance_audit_fail_on_noncompliant": true}';
      -e linux_compliance_audit_fail_on_noncompliant=true passes a string.
    quiet: true
  tags:
    - always

- name: Audit | Check that the discover role verified the same profile
  ansible.builtin.assert:
    that:
      - linux_compliance_discovered is defined
      - linux_compliance_discovered is mapping
      - linux_compliance_discovered.content_path is string
      - linux_compliance_discovered.content_sha256 is match('^[0-9a-f]{64}$')
      - >-
        linux_compliance_discovered.profile_id ==
        'xccdf_org.ssgproject.content_profile_' ~ linux_compliance_audit_profile
      - linux_compliance_discovered.rule_ids | length > 0
    fail_msg: >-
      Run the freesecdev.linux_compliance.discover role first, for the same profile.
      The audit role only scans content whose SHA-256 the discover role verified, and it never
      substitutes another profile.
    quiet: true
  tags:
    - always

- name: Audit | Check that host facts were gathered
  ansible.builtin.assert:
    that:
      - ansible_facts['hostname'] is defined
      - ansible_facts['distribution'] is defined
      - ansible_facts['distribution_version'] is defined
      - ansible_facts['architecture'] is defined
    fail_msg: >-
      The audit role records the identity of the host in the scan run and needs gathered facts;
      run the play with gather_facts enabled.
    quiet: true
  tags:
    - always

- name: Audit | Scan the host without changing it
  freesecdev.linux_compliance.compliance_scan:
    backend: "{{ linux_compliance_audit_backend }}"
    content_path: "{{ linux_compliance_discovered.content_path }}"
    expected_sha256: "{{ linux_compliance_discovered.content_sha256 }}"
    profile_id: "{{ linux_compliance_discovered.profile_id }}"
    output_dir: "{{ linux_compliance_audit_output_dir }}"
    scan_timeout: "{{ linux_compliance_audit_scan_timeout }}"
    disabled_rules: "{{ linux_compliance_audit_disabled_rules }}"
    fail_on_incomplete: false
    host:
      hostname: "{{ ansible_facts['hostname'] }}"
      distribution_id: "{{ ansible_facts['distribution'] | lower }}"
      distribution_version: "{{ ansible_facts['distribution_version'] }}"
      architecture: "{{ ansible_facts['architecture'] | lower }}"
  become: true
  register: __linux_compliance_audit_scan
  tags:
    - always

- name: Audit | Publish the audit result for the evidence and verify roles
  ansible.builtin.set_fact:
    linux_compliance_audited:
      run_id: "{{ __linux_compliance_audit_scan.run_id }}"
      run_status: "{{ __linux_compliance_audit_scan.run_status }}"
      summary: "{{ __linux_compliance_audit_scan.summary }}"
      scan_run: "{{ __linux_compliance_audit_scan.scan_run }}"
      evidence: "{{ __linux_compliance_audit_scan.evidence }}"
      evidence_written: "{{ __linux_compliance_audit_scan.evidence_written }}"
      disabled_rules: "{{ __linux_compliance_audit_scan.disabled_rules }}"
      planned: "{{ __linux_compliance_audit_scan.planned }}"
  tags:
    - always

- name: Audit | Stop when the scan did not complete
  ansible.builtin.assert:
    that:
      - linux_compliance_audited.run_status in ['completed', 'not_run']
    fail_msg: >-
      The scan did not complete (run_status {{ linux_compliance_audited.run_status }}). Every rule
      of the profile is reported as error and nothing is compliant. Evidence is in
      {{ linux_compliance_audited.evidence.directory }}.
    quiet: true
  tags:
    - always

- name: Audit | Stop on failed or errored rules when requested
  ansible.builtin.assert:
    that:
      - (linux_compliance_audited.summary.fail | int) + (linux_compliance_audited.summary.error | int) == 0
    fail_msg: >-
      The audit reported {{ linux_compliance_audited.summary.fail }} failed and
      {{ linux_compliance_audited.summary.error }} errored rule(s). The host was not changed.
    quiet: true
  when:
    - linux_compliance_audit_fail_on_noncompliant
    - linux_compliance_audited.run_status == 'completed'
  tags:
    - always
