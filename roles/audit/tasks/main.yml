---
- name: Audit | Validate inputs
  ansible.builtin.assert:
    that:
      - linux_compliance_audit_profile is string
      - linux_compliance_audit_profile | length > 0
      - linux_compliance_audit_fail_on_noncompliant is boolean
    fail_msg: The audit role received an invalid input; see meta/argument_specs.yml.
    quiet: true

- name: Audit | Stop because the role is not implemented yet
  ansible.builtin.fail:
    msg: The audit role is not implemented yet (tracked in FREES-49). No change was made to the host.
