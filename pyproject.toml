[project]
name = "freesecdev-linux-compliance-dev"
version = "0.0.0"
description = "Developer tooling for the freesecdev.linux_compliance collection"
requires-python = ">=3.12"
dependencies = [
    "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "ansible-core==2.21.5",
    "ansible-lint==26.10.1",
    "antsibull-changelog==0.35.2",
    "bandit==1.9.4",
    "checkov==3.3.29",
    "coverage==7.16.2",
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pylint==4.1.3",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
    "types-defusedxml==0.7.0.20260504",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
    "yamllint==1.38.0",
    "zizmor==1.31.1",
]

[tool.uv]
package = false
override-dependencies = ["packaging>=26.3", "asteval>=1.0.10"]
constraint-dependencies = ["virtualenv>=21.14.13", "certifi>=2026.10.19"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tools", "tests", "plugins"]
extend-exclude = [".agents", ".claude", "build", "dist"]
per-file-target-version = { "plugins/**" = "py39" }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "ANN", "C4", "SIM", "PT", "RET",
    "ARG", "PL", "TRY", "ERA", "D", "A", "C90", "DTZ", "EM", "FA", "FBT", "G",
    "ICN", "INP", "ISC", "LOG", "PERF", "PGH", "PIE", "PTH", "Q", "RSE", "RUF",
    "SLF", "SLOT", "T20", "TC", "TID", "YTT", "FURB", "PYI", "FLY", "INT",
]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "ANN401", "SLF001", "FBT001", "INP001"]
"tools/**" = ["T201"]
"plugins/**" = ["INP001"]
"plugins/modules/**" = ["E402"]
"plugins/module_utils/compliance/process.py" = ["S404", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tools", "ansible_collections"]

[tool.freesecdev.lint-justifications]
"bandit B404 and B603 (plugins/module_utils/compliance/process.py)" = "Bandit has no per-file skip and inline nosec comments are banned, so make security runs Bandit twice: once on everything except the process helper with no skips, and once on the helper alone with only B404 and B603 skipped. A subprocess use anywhere else is still reported (ADR 0004)."
"sanity ignore pylint:ansible-bad-function (plugins/module_utils/compliance/process.py)" = "ansible-test sanity pylint forbids subprocess.Popen in favour of AnsibleModule.run_command, which has no timeout, no output bound and no process-group handling (ADR 0004). The exception is declared in tests/sanity/ignore-2.20.txt and ignore-2.21.txt and lists exactly this one entry; a unit test fails if either file changes. ansible-lint does not permit this ignore (sanity[cannot-ignore]), and its allowed list is not configurable, so .ansible-lint-ignore skips that rule for those two files only. This departs from the Ansible Automation Platform certification ignore policy, which this collection does not target."
"sanity ignore validate-modules:missing-gplv3-license (plugins/modules/benchmark_info.py, compliance_scan.py, control_state.py, profile_info.py)" = "ansible-test validate-modules requires a GPLv3 header in the first 20 lines of every module. The collection is licensed Apache-2.0 (LICENSE, galaxy.yml), and adding a GPL header would misstate the licence of the file. The exception is declared per module in tests/sanity/ignore-2.20.txt and ignore-2.21.txt, which a unit test pins exactly; each new module needs its own reviewed line (FREES-56, FREES-42, FREES-49)."
"ruff S404 and S603 (plugins/module_utils/compliance/process.py)" = "ADR 0004: this is the single audited process helper. It runs an argument list with shell=False, an absolute allow-listed executable, validated arguments and a timeout; a repository rule forbids subprocess everywhere else."
"uv override packaging>=26.3" = "Checkov 3.3.29 declares packaging<24.0, which forces virtualenv 21.14.5 (12 advisories, five HIGH). packaging is a pure version and specifier parser; Checkov only uses it for version comparison and works unchanged on 26.3, with identical results on infra/ and on a deliberately insecure sample. virtualenv 21.14.13 itself requires packaging>=26.3."
"uv override asteval>=1.0.10" = "Checkov pins asteval==1.0.6, which has two sandbox escape advisories (GHSA-89v8-rhwq-hf77, GHSA-9w56-46f6-3qhx) fixed in 1.0.9. Checkov results are identical on 1.0.10. A security fix is exempt from the seven-day release age rule."
"uv constraint virtualenv>=21.14.13" = "Versions 21.14.5 to 21.14.12 are affected by advisories (the lowest clean release is 21.14.13). A security fix is exempt from the seven-day release age rule."
"uv constraint certifi>=2026.10.19" = "certifi before 2026.10.19 trusts compromised emSign intermediates (GHSA-6q48-6c7w-9gw2, CRITICAL). A security fix is exempt from the seven-day release age rule."
"zizmor undocumented-permissions (.github/zizmor.yml)" = "The pedantic persona demands a comment next to every write permission, but YAML comments are banned repository-wide (ADR 0005). Only oidc-check.yml:20 (id-token: write) is ignored, by file and line; the audit stays on for every other workflow line. The permission is explained in docs/aws/bootstrap.md and ADR 0014."
"typings/ansible (local type stubs)" = "ansible-core ships no py.typed marker, so mypy and Pyright strict cannot type AnsibleModule and patch_module_args. typings/ansible holds minimal stubs for exactly the members that plugins/modules/control_state.py and its tests use; Pyright reads them as its default stubPath and mypy through mypy_path. The directory is not part of the collection (FREES-56)."
"ruff D203" = "Mutually exclusive with D211; D211 is enforced instead."
"ruff D213" = "Mutually exclusive with D212; D212 is enforced instead."
"ruff TRY003" = "Overlaps with EM101 and EM102; messages are built from named variables in one place, and long messages in custom exception types add no value."
"ruff S101 (tests/**)" = "pytest assertions are the test mechanism."
"ruff PLR2004 (tests/**)" = "Expected literal values in assertions are clearer than named constants."
"ruff D (tests/**)" = "Test function names carry the description; docstrings would duplicate them."
"ruff ANN401 (tests/**)" = "Fixture factories accept arbitrary values on purpose."
"ruff SLF001 (tests/**)" = "Unit tests exercise private scanner helpers directly."
"ruff FBT001 (tests/**)" = "Parametrized expectations are booleans passed by pytest, not a public API."
"ruff INP001 (tests/**)" = "Tests are collected in importlib mode and are not importable packages."
"ruff T201 (tools/**)" = "Command-line tools report to the terminal with print by design."
"ruff E402 (plugins/modules/**)" = "ansible-test sanity validate-modules requires imports below the DOCUMENTATION, EXAMPLES and RETURN blocks (import-before-documentation), which makes every module import follow module-level assignments. Only plugins/modules is relaxed (FREES-56)."
"ruff INP001 (plugins/**)" = "Collection plugin directories are implicit namespace packages; Ansible does not require __init__.py and a placeholder would only add files."
"ansible-lint var-naming[no-role-prefix]" = "Role variables use the collection-wide prefix linux_compliance_<role>_ required by ADR 0011 and the ansible-collection skill, for example linux_compliance_remediate_enabled; the rule would force the shorter <role>_ prefix. Only this sub-rule is skipped; every other var-naming check stays on (FREES-40)."

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tools", "tests"]
mypy_path = ".:build/collections:typings"
explicit_package_bases = true
warn_unreachable = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["tools", "tests", "plugins"]
extraPaths = ["build/collections"]
reportMissingModuleSource = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pylint.main]
py-version = "3.12"
jobs = 0
recursive = true
ignore-paths = ["^\\.venv/", "^\\.agents/", "^\\.claude/", "^build/", "^dist/"]
init-hook = "import sys; sys.path.insert(0, 'build/collections')"

[tool.pylint.format]
max-line-length = 100
max-module-lines = 1500

[tool.pylint."messages control"]
enable = ["useless-suppression"]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "redefined-outer-name",
    "missing-function-docstring",
    "missing-module-docstring",
    "use-implicit-booleaness-not-comparison",
    "too-many-instance-attributes",
]

[tool.freesecdev.pylint-justifications]
wrong-import-position = "Not disabled. ansible-test sanity validate-modules requires imports below the DOCUMENTATION, EXAMPLES and RETURN blocks, so make lint-pylint runs Pylint twice: over tools, tests and plugins with the rule enabled and plugins/modules ignored, and over plugins/modules alone with the rule disabled. A unit test fails if the rule enters the global disable list (FREES-56)."
max-module-lines = "The findings model is one module by design (ADR 0013); Ruff formatting expands every call over several lines, and the entities share private validators."
duplicate-code = "Two small standalone tools share the fence-marker constant; extracting a shared module would add coupling for a three-line constant."
too-few-public-methods = "Frozen slotted dataclasses are deliberate value objects."
missing-function-docstring = "Applies to test functions, whose names describe them; public tools code is enforced by Ruff D rules."
missing-module-docstring = "Applies to test modules; public tools code is enforced by Ruff D rules."
use-implicit-booleaness-not-comparison = "Tests assert an explicit empty list so that None or other falsy values fail."
too-many-instance-attributes = "Findings model entities are frozen value objects whose fields mirror the serialized schema; splitting them would diverge from the schema."
redefined-outer-name = "pytest fixtures are injected by parameter name and trigger it by design."

[tool.bandit]
exclude_dirs = [".venv", ".agents", ".claude", "tests", "build", "dist"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = [".", "build/collections"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tools", "plugins"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.xml]
output = "coverage.xml"
