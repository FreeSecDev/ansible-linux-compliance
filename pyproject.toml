[project]
name = "freesecdev-linux-compliance-dev"
version = "0.0.0"
description = "Developer tooling for the freesecdev.linux_compliance collection"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "ansible-core==2.21.5",
    "ansible-lint==26.10.1",
    "antsibull-changelog==0.35.2",
    "bandit==1.9.4",
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pylint==4.1.3",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
    "types-pyyaml==6.0.12.20260906",
    "yamllint==1.38.0",
    "zizmor==1.31.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tools", "tests", "plugins"]
extend-exclude = [".agents", ".claude", "build", "dist"]
per-file-target-version = { "plugins/**" = "py39" }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "ANN", "C4", "SIM", "PT", "RET",
    "ARG", "PL", "TRY", "ERA", "D", "A", "C90", "DTZ", "EM", "FA", "FBT", "G",
    "ICN", "INP", "ISC", "LOG", "PERF", "PGH", "PIE", "PTH", "Q", "RSE", "RUF",
    "SLF", "SLOT", "T20", "TC", "TID", "YTT", "FURB", "PYI", "FLY", "INT",
]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "ANN401", "SLF001", "FBT001", "INP001"]
"tools/**" = ["T201"]
"plugins/**" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tools", "ansible_collections"]

[tool.freesecdev.lint-justifications]
"ruff D203" = "Mutually exclusive with D211; D211 is enforced instead."
"ruff D213" = "Mutually exclusive with D212; D212 is enforced instead."
"ruff TRY003" = "Overlaps with EM101 and EM102; messages are built from named variables in one place, and long messages in custom exception types add no value."
"ruff S101 (tests/**)" = "pytest assertions are the test mechanism."
"ruff PLR2004 (tests/**)" = "Expected literal values in assertions are clearer than named constants."
"ruff D (tests/**)" = "Test function names carry the description; docstrings would duplicate them."
"ruff ANN401 (tests/**)" = "Fixture factories accept arbitrary values on purpose."
"ruff SLF001 (tests/**)" = "Unit tests exercise private scanner helpers directly."
"ruff FBT001 (tests/**)" = "Parametrized expectations are booleans passed by pytest, not a public API."
"ruff INP001 (tests/**)" = "Tests are collected in importlib mode and are not importable packages."
"ruff T201 (tools/**)" = "Command-line tools report to the terminal with print by design."
"ruff INP001 (plugins/**)" = "Collection plugin directories are implicit namespace packages; Ansible does not require __init__.py and a placeholder would only add files."

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tools", "tests"]
mypy_path = ".:build/collections"
explicit_package_bases = true
warn_unreachable = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["tools", "tests", "plugins"]
extraPaths = ["build/collections"]
reportMissingModuleSource = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pylint.main]
py-version = "3.12"
jobs = 0
recursive = true
ignore-paths = ["^\\.venv/", "^\\.agents/", "^\\.claude/", "^build/", "^dist/"]
init-hook = "import sys; sys.path.insert(0, 'build/collections')"

[tool.pylint.format]
max-line-length = 100
max-module-lines = 1500

[tool.pylint."messages control"]
enable = ["useless-suppression"]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "redefined-outer-name",
    "missing-function-docstring",
    "missing-module-docstring",
    "use-implicit-booleaness-not-comparison",
    "too-many-instance-attributes",
]

[tool.freesecdev.pylint-justifications]
max-module-lines = "The findings model is one module by design (ADR 0013); Ruff formatting expands every call over several lines, and the entities share private validators."
duplicate-code = "Two small standalone tools share the fence-marker constant; extracting a shared module would add coupling for a three-line constant."
too-few-public-methods = "Frozen slotted dataclasses are deliberate value objects."
missing-function-docstring = "Applies to test functions, whose names describe them; public tools code is enforced by Ruff D rules."
missing-module-docstring = "Applies to test modules; public tools code is enforced by Ruff D rules."
use-implicit-booleaness-not-comparison = "Tests assert an explicit empty list so that None or other falsy values fail."
too-many-instance-attributes = "Findings model entities are frozen value objects whose fields mirror the serialized schema; splitting them would diverge from the schema."
redefined-outer-name = "pytest fixtures are injected by parameter name and trigger it by design."

[tool.bandit]
exclude_dirs = [".venv", ".agents", ".claude", "tests", "build", "dist"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = [".", "build/collections"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tools", "plugins"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.xml]
output = "coverage.xml"
