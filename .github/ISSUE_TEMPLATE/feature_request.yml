---
name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like. Audit mode must never change a managed host.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Collection, roles and modules
        - Audit
        - Remediation
        - Reporting
        - Benchmarks and content
        - Molecule and testing
        - Packer images
        - CI and release
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am willing to help implement or test this.
          required: false
