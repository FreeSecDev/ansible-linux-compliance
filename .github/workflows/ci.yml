---
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    needs: molecule-collections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Download the verified Galaxy collections of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: molecule-collections
          path: build/molecule-collections
      - name: Run lint
        run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run typecheck
        run: make typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run test-coverage
        run: make test-coverage

  test-suites:
    name: test-suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run test-audit-exceptions
        run: make test-audit-exceptions
      - name: Run test-content-golden
        run: make test-content-golden
      - name: Run test-browser
        run: make test-browser

  test-playbooks:
    name: test-playbooks
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run test-evidence
        run: make test-evidence
      - name: Run test-remediate-check
        run: make test-remediate-check
      - name: Run test-role-guards
        run: make test-role-guards
      - name: Run test-verify
        run: make test-verify

  oscap-integration:
    name: oscap-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OPENSCAP_SCANNER_VERSION: 1.3.9+dfsg-1.1ubuntu2
      FREESECDEV_REQUIRE_OSCAP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install the pinned openscap-scanner from the Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "openscap-scanner=${OPENSCAP_SCANNER_VERSION}"
          test "$(dpkg-query -W -f='${Version}' openscap-scanner)" = "${OPENSCAP_SCANNER_VERSION}"
          oscap --version
      - name: Run test-oscap-integration
        run: make test-oscap-integration

  scc-changes:
    name: scc-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scc: ${{ steps.filter.outputs.scc }}
      expiry: ${{ steps.expiry.outputs.expiry }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide with the base revision's filter whether the SCC smoke test must run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          scc=true
          filter="$(mktemp)"
          if [[ "$EVENT_NAME" =~ ^(pull_request|merge_group)$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git show "$BASE_SHA:tools/scc/needs-smoke.sh" > "$filter"; then
            scc="$(bash "$filter" "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")" || scc=true
          fi
          rm -f "$filter"
          [[ "$scc" == false ]] || scc=true
          printf 'scc=%s\n' "$scc" >> "$GITHUB_OUTPUT"
      - name: Decide with the base revision's pins whether the pinned SCC is past its hard stop
        id: expiry
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          expiry=current
          state="$(mktemp)"
          pins="$(mktemp)"
          if [[ "$EVENT_NAME" =~ ^(pull_request|merge_group)$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git show "$BASE_SHA:tools/scc/expiry-state.sh" > "$state" \
            && git show "$BASE_SHA:extensions/ci/scc/scc.pins" > "$pins"; then
            expiry="$(bash "$state" "$pins" extensions/ci/scc/scc.pins)" || expiry=current
          fi
          rm -f "$state" "$pins"
          [[ "$expiry" == expired ]] || expiry=current
          printf 'expiry=%s\n' "$expiry" >> "$GITHUB_OUTPUT"

  scc-smoke:
    name: scc-smoke
    needs: [scc-changes]
    if: needs.scc-changes.outputs.scc != 'false' && needs.scc-changes.outputs.expiry != 'expired'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SCC_IMAGE: localhost/freesecdev-scc:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the verified SCC download, except in a pull request from a fork
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/scc/download
          key: scc-bundle-${{ hashFiles('extensions/ci/scc/scc.pins') }}
      - name: Build the SCC image locally and run the smoke test
        run: make scc-smoke
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run a real SCC scan through compliance_scan and the egress test
        run: make scc-integration
      - name: Check SCC's own expiry from the real scan against SCC_EXPIRES
        run: make scc-own-expiry-check
      - name: Remove the local SCC image
        if: always()
        run: make scc-image-clean

  name-sets:
    name: name-sets (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.9.25"
          - "3.10.21"
          - "3.11.16"
          - "3.12.14"
          - "3.13.15"
          - "3.14.6"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install the pinned Python release
        env:
          NAME_SET_PYTHON: ${{ matrix.python }}
        run: uv python install "$NAME_SET_PYTHON"
      - name: Run test-name-sets
        env:
          NAME_SET_PYTHON: ${{ matrix.python }}
        run: make test-name-sets

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run security
        env:
          GH_TOKEN: ${{ github.token }}
        run: make security

  collection:
    name: collection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run collection sanity, unit and package targets
        run: make test-sanity test-ansible-units package-check

  iac:
    name: iac
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install pinned OpenTofu with checksum verification
        run: tools/iac/install-tofu.sh
      - name: Run lint-iac
        run: make lint-iac

  molecule-collections:
    name: molecule-collections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the verified Galaxy collections, except in a pull request from a fork
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-collections
          key: galaxy-collections-${{ hashFiles('extensions/molecule/collections.pins') }}
      - name: Fetch what is missing from Galaxy with bounded retries and verify every collection by SHA-256
        run: make molecule-collections-fetch
      - name: Share the verified collections with the jobs of this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: molecule-collections
          path: build/molecule-collections
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  molecule-images:
    name: molecule-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Compute the tag of each instance image from its pinned inputs
        id: plan
        run: make -s molecule-images-plan >> "$GITHUB_OUTPUT"
      - name: Restore the Ubuntu instance image of these inputs and this week, except in a pull request from a fork
        id: cache-ubuntu
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-images/ubuntu
          key: molecule-image-ubuntu-${{ steps.plan.outputs.ubuntu }}-${{ steps.plan.outputs.week }}
      - name: Restore the Rocky Linux instance image of these inputs and this week, except in a pull request from a fork
        id: cache-rhel-compatible
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-images/rhel_compatible
          key: molecule-image-rhel_compatible-${{ steps.plan.outputs.rhel_compatible }}-${{ steps.plan.outputs.week }}
      - name: Build what the cache lacks with bounded retries and verify every image
        run: make molecule-images-build
      - name: Record the verified image IDs for the Molecule legs
        id: ids
        run: |
          ids="$(make -s molecule-images-ids)"
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - name: Share the verified images with the Molecule legs of this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: molecule-images
          path: |
            build/molecule-images/ubuntu
            build/molecule-images/rhel_compatible
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Save the verified Ubuntu instance image, except in a scheduled run
        if: >-
          steps.cache-ubuntu.outcome == 'success'
          && steps.cache-ubuntu.outputs.cache-hit != 'true' && github.event_name != 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-images/ubuntu
          key: molecule-image-ubuntu-${{ steps.plan.outputs.ubuntu }}-${{ steps.plan.outputs.week }}
      - name: Save the verified Rocky Linux instance image, except in a scheduled run
        if: >-
          steps.cache-rhel-compatible.outcome == 'success'
          && steps.cache-rhel-compatible.outputs.cache-hit != 'true' && github.event_name != 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-images/rhel_compatible
          key: molecule-image-rhel_compatible-${{ steps.plan.outputs.rhel_compatible }}-${{ steps.plan.outputs.week }}

  molecule-docker:
    name: molecule-docker (${{ matrix.scenario }})
    needs: [molecule-collections, molecule-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      MOLECULE_IMAGE_IDS: ${{ needs.molecule-images.outputs.ids }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [docker-ubuntu, docker-rhel-compatible, docker-selftest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Download the verified Galaxy collections of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: molecule-collections
          path: build/molecule-collections
      - name: Download the verified instance images of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: molecule-images
          path: build/molecule-images
      - name: Run Molecule scenario
        if: matrix.scenario != 'docker-selftest'
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: make test-molecule-docker MOLECULE_DOCKER_SCENARIOS="$MOLECULE_SCENARIO" MOLECULE_DOCKER_SELFTEST=false
      - name: Run the guard and destroy self-test
        if: matrix.scenario == 'docker-selftest'
        run: make test-molecule-docker-selftest

  molecule-plan:
    name: molecule-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      libvirt: ${{ steps.plan.outputs.libvirt }}
      scope: ${{ steps.plan.outputs.scope }}
      lifecycle_legs: ${{ steps.plan.outputs.lifecycle_legs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Plan the full matrix, one lifecycle leg per platform, native topic and toggle mode, and the libvirt legs
        run: |
          make -s molecule-matrix > "$RUNNER_TEMP/docker.json"
          make -s molecule-matrix MOLECULE_MATRIX_DRIVER=libvirt > "$RUNNER_TEMP/libvirt.json"
      - name: Keep only the legs of the affected topics, as the base revision's planner decides
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == merge_group ]]; then
            BASE_SHA="$(git merge-base HEAD "refs/remotes/origin/${BASE_REF#refs/heads/}" 2>/dev/null)" || BASE_SHA=""
          fi
          docker="$RUNNER_TEMP/docker.json"
          libvirt="$RUNNER_TEMP/libvirt.json"
          plan="$(jq -c -n --slurpfile d "$docker" --slurpfile l "$libvirt" \
            '{scope: "full", topics: [], reasons: ["the full matrix runs"], docker: $d[0], libvirt: $l[0]}')"
          planner="$(mktemp)"
          if [[ "$EVENT_NAME" =~ ^(pull_request|merge_group)$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git show "$BASE_SHA:tools/molecule/plan-lifecycle.sh" > "$planner" \
            && decided="$(bash "$planner" "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" "$docker" "$libvirt")" \
            && jq -e --slurpfile d "$docker" --slurpfile l "$libvirt" '. as $p
              | ($p.scope | IN("full", "affected")) and ($p.topics | type == "array")
              and ($p.reasons | type == "array")
              and ($p.docker.include | type == "array") and ($p.libvirt.include | type == "array")
              and all($p.docker.include[]; IN($d[0].include[])) and all($p.libvirt.include[]; IN($l[0].include[]))
              and all($d[0].include[] | select(.topic == ""); IN($p.docker.include[]))
              and all($l[0].include[] | select(.topic == ""); IN($p.libvirt.include[]))
              and ($p.scope == "affected" or ($p.docker == $d[0] and $p.libvirt == $l[0]))
            ' <<<"$decided" >/dev/null; then
            plan="$decided"
          fi
          rm -f "$planner"
          jq -r '"scope: \(.scope | tojson)", "topics: \(.topics | tojson)", (.reasons[] | "  \(tojson)")' <<<"$plan"
          jq -r '"matrix=\(.docker | tojson)", "libvirt=\(.libvirt | tojson)", "scope=\(.scope)",
            "lifecycle_legs=\(.docker.include | length)"' <<<"$plan" >> "$GITHUB_OUTPUT"

  molecule-lifecycle:
    name: molecule-lifecycle (${{ matrix.platform }}, ${{ matrix.topic }}, ${{ matrix.mode }})
    needs: [molecule-plan, molecule-collections, molecule-images]
    if: needs.molecule-plan.outputs.lifecycle_legs != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      MOLECULE_IMAGE_IDS: ${{ needs.molecule-images.outputs.ids }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.molecule-plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Download the verified Galaxy collections of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: molecule-collections
          path: build/molecule-collections
      - name: Download the verified instance images of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: molecule-images
          path: build/molecule-images
      - name: Run the toggle lifecycle of one topic and mode
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          LIFECYCLE_TOPIC: ${{ matrix.topic }}
          LIFECYCLE_MODE: ${{ matrix.mode }}
        run: >-
          make test-molecule-docker MOLECULE_DOCKER_SCENARIOS="$MOLECULE_SCENARIO" MOLECULE_DOCKER_SELFTEST=false
          MOLECULE_LIFECYCLE_TOPIC="$LIFECYCLE_TOPIC" MOLECULE_LIFECYCLE_MODE="$LIFECYCLE_MODE"

  molecule-libvirt:
    name: >-
      molecule-libvirt (${{ matrix.scenario }}${{ matrix.topic && format(', {0}, {1}', matrix.topic, matrix.mode)
      || '' }})
    needs: [molecule-plan, molecule-collections]
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.molecule-plan.outputs.libvirt) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Require KVM on the hosted runner
        run: |
          if [ ! -c /dev/kvm ]; then
            echo '::error::/dev/kvm is missing; the libvirt scenarios need KVM (docs/molecule-libvirt.md)'
            exit 1
          fi
          ls -l /dev/kvm
          grep -Ec '(vmx|svm)' /proc/cpuinfo
      - name: Give the runner access to /dev/kvm with the udev rule that GitHub documents
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm && test -w /dev/kvm
      - name: Restore the verified QEMU and libvirt packages, except in a pull request from a fork
        id: host-packages
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-libvirt/host-packages
          key: libvirt-host-packages-${{ hashFiles('tools/molecule/libvirt-host.pins') }}
      - name: Fetch what is missing from the fixed Ubuntu archive snapshot and verify every package
        run: make molecule-libvirt-host-fetch
      - name: Save the verified QEMU and libvirt packages
        if: steps.host-packages.outcome == 'success' && steps.host-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-libvirt/host-packages
          key: libvirt-host-packages-${{ hashFiles('tools/molecule/libvirt-host.pins') }}
      - name: Install the verified QEMU and libvirt packages
        run: |
          make molecule-libvirt-host-install
          sudo usermod --append --groups libvirt "${USER}"
          sudo systemctl is-active libvirtd
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Download the verified Galaxy collections of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: molecule-collections
          path: build/molecule-collections
      - name: Restore the verified cloud images and packages, except in a pull request from a fork
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/molecule-libvirt/cache
          key: libvirt-images-${{ matrix.platform }}-${{ hashFiles('extensions/molecule/shared/images/*.pins') }}
      - name: Run the libvirt scenario
        if: matrix.scenario != 'libvirt-selftest'
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          MOLECULE_PLATFORM: ${{ matrix.platform }}
          MOLECULE_LIFECYCLE_TOPIC: ${{ matrix.topic }}
          MOLECULE_LIFECYCLE_MODE: ${{ matrix.mode }}
        run: >-
          sg libvirt -c "make test-molecule-libvirt MOLECULE_LIBVIRT_SCENARIOS=$MOLECULE_SCENARIO
          MOLECULE_LIBVIRT_PLATFORMS=$MOLECULE_PLATFORM MOLECULE_LIBVIRT_SELFTEST=false
          MOLECULE_LIFECYCLE_TOPIC=$MOLECULE_LIFECYCLE_TOPIC MOLECULE_LIFECYCLE_MODE=$MOLECULE_LIFECYCLE_MODE"
      - name: Run the libvirt guard and destroy self-test
        if: matrix.scenario == 'libvirt-selftest'
        run: sg libvirt -c "make test-molecule-libvirt-selftest MOLECULE_LIBVIRT_PLATFORMS=ubuntu"
      - name: Show what libvirt holds after the run
        if: always()
        run: |
          if ! command -v virsh >/dev/null; then
            echo 'libvirt was not installed'
            exit 0
          fi
          sudo virsh -c qemu:///system list --all
          sudo virsh -c qemu:///system net-list --all
          sudo virsh -c qemu:///system pool-list --all

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - test-suites
      - test-playbooks
      - oscap-integration
      - scc-changes
      - scc-smoke
      - name-sets
      - security
      - collection
      - iac
      - molecule-collections
      - molecule-images
      - molecule-docker
      - molecule-plan
      - molecule-lifecycle
      - molecule-libvirt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require every needed job to succeed
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e --arg event "$EVENT_NAME" '
            (.["scc-changes"].result == "success")
            and (.["scc-changes"].outputs.scc | IN("true", "false"))
            and (.["scc-changes"].outputs.expiry | IN("current", "expired"))
            and all(to_entries[] | select(.key | IN("scc-smoke", "molecule-lifecycle") | not);
              .value.result == "success")
            and (.["scc-smoke"].result == "success"
              or (.["scc-smoke"].result == "skipped"
                and (.["scc-changes"].outputs.scc == "false" or .["scc-changes"].outputs.expiry == "expired")
                and ($event | IN("pull_request", "merge_group"))))
            and (.["molecule-plan"].outputs.scope == "full"
              or (.["molecule-plan"].outputs.scope == "affected" and ($event | IN("pull_request", "merge_group"))))
            and (.["molecule-plan"].outputs.lifecycle_legs | test("^(0|[1-9][0-9]*)$"))
            and (.["molecule-lifecycle"].result == "success"
              or (.["molecule-lifecycle"].result == "skipped"
                and .["molecule-plan"].outputs.lifecycle_legs == "0"
                and .["molecule-plan"].outputs.scope == "affected"
                and ($event | IN("pull_request", "merge_group"))))
          ' <<<"$NEEDS" >/dev/null
          jq -r '.["molecule-plan"].outputs | "molecule plan: \(.scope), \(.lifecycle_legs) lifecycle legs"' <<<"$NEEDS"
          if jq -e '.["scc-smoke"].result == "skipped" and .["scc-changes"].outputs.scc == "true"
            and .["scc-changes"].outputs.expiry == "expired"' <<<"$NEEDS" >/dev/null; then
            printf '::warning title=SCC not built or run::%s %s\n' \
              "scc-smoke was skipped, not passed: the pinned SCC is past its hard stop and no newer pin exists," \
              "so SCC was neither built nor run (ADR 0019, FREES-176)"
          fi
