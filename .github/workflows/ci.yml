---
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 5 * * *'

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run lint
        run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run typecheck
        run: make typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run test-coverage
        run: make test-coverage
      - name: Run test-audit-exceptions
        run: make test-audit-exceptions
      - name: Run test-content-golden
        run: make test-content-golden
      - name: Run test-browser
        run: make test-browser

  test-playbooks:
    name: test-playbooks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run test-evidence
        run: make test-evidence
      - name: Run test-remediate-check
        run: make test-remediate-check
      - name: Run test-role-guards
        run: make test-role-guards
      - name: Run test-verify
        run: make test-verify

  oscap-integration:
    name: oscap-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OPENSCAP_SCANNER_VERSION: 1.3.9+dfsg-1.1ubuntu2
      FREESECDEV_REQUIRE_OSCAP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install the pinned openscap-scanner from the Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "openscap-scanner=${OPENSCAP_SCANNER_VERSION}"
          test "$(dpkg-query -W -f='${Version}' openscap-scanner)" = "${OPENSCAP_SCANNER_VERSION}"
          oscap --version
      - name: Run test-oscap-integration
        run: make test-oscap-integration

  scc-changes:
    name: scc-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scc: ${{ steps.filter.outputs.scc }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide with the base revision's filter whether the SCC smoke test must run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          scc=true
          filter="$(mktemp)"
          if [[ "$EVENT_NAME" =~ ^(pull_request|merge_group)$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git show "$BASE_SHA:tools/scc/needs-smoke.sh" > "$filter"; then
            scc="$(bash "$filter" "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")" || scc=true
          fi
          rm -f "$filter"
          [[ "$scc" == false ]] || scc=true
          printf 'scc=%s\n' "$scc" >> "$GITHUB_OUTPUT"

  scc-smoke:
    name: scc-smoke
    needs: [scc-changes]
    if: needs.scc-changes.outputs.scc != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SCC_IMAGE: localhost/freesecdev-scc:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the verified SCC download, except in a pull request from a fork
        if: >-
          github.event_name != 'pull_request'
          || (!github.event.pull_request.head.repo.fork
          && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/scc/download
          key: scc-bundle-${{ hashFiles('extensions/ci/scc/scc.pins') }}
      - name: Build the SCC image locally and run the smoke test
        run: make scc-smoke
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run a real SCC scan through compliance_scan and the egress test
        run: make scc-integration
      - name: Remove the local SCC image
        if: always()
        run: make scc-image-clean

  name-sets:
    name: name-sets (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.9.25"
          - "3.10.21"
          - "3.11.16"
          - "3.12.14"
          - "3.13.15"
          - "3.14.6"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install the pinned Python release
        env:
          NAME_SET_PYTHON: ${{ matrix.python }}
        run: uv python install "$NAME_SET_PYTHON"
      - name: Run test-name-sets
        env:
          NAME_SET_PYTHON: ${{ matrix.python }}
        run: make test-name-sets

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run security
        env:
          GH_TOKEN: ${{ github.token }}
        run: make security

  collection:
    name: collection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run collection sanity, unit and package targets
        run: make test-sanity test-ansible-units package-check

  iac:
    name: iac
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Install pinned OpenTofu with checksum verification
        run: tools/iac/install-tofu.sh
      - name: Run lint-iac
        run: make lint-iac

  molecule-docker:
    name: molecule-docker (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [docker-ubuntu, docker-rhel-compatible, docker-selftest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run Molecule scenario
        if: matrix.scenario != 'docker-selftest'
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: make test-molecule-docker MOLECULE_DOCKER_SCENARIOS="$MOLECULE_SCENARIO" MOLECULE_DOCKER_SELFTEST=false
      - name: Run the guard and destroy self-test
        if: matrix.scenario == 'docker-selftest'
        run: make test-molecule-docker-selftest

  molecule-plan:
    name: molecule-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Plan one lifecycle leg per platform, native topic and toggle mode
        id: plan
        run: |
          matrix="$(make -s molecule-matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  molecule-lifecycle:
    name: molecule-lifecycle (${{ matrix.platform }}, ${{ matrix.topic }}, ${{ matrix.mode }})
    needs: molecule-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.molecule-plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      - name: Run the toggle lifecycle of one topic and mode
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          LIFECYCLE_TOPIC: ${{ matrix.topic }}
          LIFECYCLE_MODE: ${{ matrix.mode }}
        run: >-
          make test-molecule-docker MOLECULE_DOCKER_SCENARIOS="$MOLECULE_SCENARIO" MOLECULE_DOCKER_SELFTEST=false
          MOLECULE_LIFECYCLE_TOPIC="$LIFECYCLE_TOPIC" MOLECULE_LIFECYCLE_MODE="$LIFECYCLE_MODE"

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - test-playbooks
      - oscap-integration
      - scc-changes
      - scc-smoke
      - name-sets
      - security
      - collection
      - iac
      - molecule-docker
      - molecule-plan
      - molecule-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require every needed job to succeed
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e --arg event "$EVENT_NAME" '
            (.["scc-changes"].result == "success")
            and (.["scc-changes"].outputs.scc | IN("true", "false"))
            and all(to_entries[] | select(.key != "scc-smoke"); .value.result == "success")
            and (.["scc-smoke"].result == "success"
              or (.["scc-smoke"].result == "skipped"
                and .["scc-changes"].outputs.scc == "false"
                and ($event | IN("pull_request", "merge_group"))))
          ' <<<"$NEEDS" >/dev/null
