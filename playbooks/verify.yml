---
- name: Refuse internal variables and role outputs that exist before the run starts
  ansible.builtin.import_playbook: run_start.yml

- name: Refuse settings that would hide regressions before the hosts are audited again
  hosts: "{{ linux_compliance_target_hosts | default('linux_compliance') }}"
  gather_facts: false
  tasks:
    - name: Check the settings of the verification run
      ansible.builtin.import_role:
        name: freesecdev.linux_compliance.verify
        tasks_from: preflight.yml

- name: Audit hosts after remediation
  ansible.builtin.import_playbook: audit.yml
  vars:
    linux_compliance_run_start_checked: true

- name: Compare the audit after remediation with the baseline
  hosts: "{{ linux_compliance_target_hosts | default('linux_compliance') }}"
  gather_facts: false
  roles:
    - role: freesecdev.linux_compliance.verify
